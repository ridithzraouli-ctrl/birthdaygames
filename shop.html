<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-main: #f2f7fa;
            --bg-card: #fbfdff;
            --bg-soft: #e9f1f4;
            --text-main: #3f5260;
            --text-heading: #46637a;
            --text-secondary: #6b879a;
            --accent: #57788f;
            --accent-light: #82a8bd;
            --border: #d3e2ea;
            --border-light: #d9e3ea;
            --ornament: #799eb8;
            --decoration: #8bb3c7;
            --shadow: rgba(52, 75, 91, 0.05);
        }

        body[data-theme="pink"] {
            --bg-main: #faf3f7;
            --bg-card: #fffafd;
            --bg-soft: #f4e8ef;
            --text-main: #604652;
            --text-heading: #7a5265;
            --text-secondary: #9a7183;
            --accent: #9a647d;
            --accent-light: #c38fa6;
            --border: #ead5df;
            --border-light: #eadce3;
            --ornament: #b67f97;
            --decoration: #c996ac;
            --shadow: rgba(91, 52, 72, 0.05);
        }

        body[data-theme="green"] {
            --bg-main: #f2f8f3;
            --bg-card: #fbfffc;
            --bg-soft: #e5f0e7;
            --text-main: #405647;
            --text-heading: #4f725b;
            --text-secondary: #718d79;
            --accent: #668871;
            --accent-light: #91ad98;
            --border: #d2e1d5;
            --border-light: #dbe7dd;
            --ornament: #7fa187;
            --decoration: #8eaf96;
            --shadow: rgba(52, 91, 61, 0.05);
        }

        body[data-theme="lavender"] {
            --bg-main: #f6f3fa;
            --bg-card: #fdfbff;
            --bg-soft: #ebe6f3;
            --text-main: #51495e;
            --text-heading: #68577d;
            --text-secondary: #817394;
            --accent: #806c9a;
            --accent-light: #a999bd;
            --border: #ded7e8;
            --border-light: #e4deec;
            --ornament: #9683ad;
            --decoration: #a796bb;
            --shadow: rgba(67, 52, 91, 0.05);
        }

        body[data-theme="yellow"] {
            --bg-main: #faf8ef;
            --bg-card: #fffef9;
            --bg-soft: #f3eed8;
            --text-main: #5e5842;
            --text-heading: #776d4c;
            --text-secondary: #8d825b;
            --accent: #91804e;
            --accent-light: #b7a66e;
            --border: #e6dfc5;
            --border-light: #ebe5d0;
            --ornament: #a49361;
            --decoration: #ad9c67;
            --shadow: rgba(91, 82, 52, 0.05);
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 12% 12%, var(--bg-soft) 0, transparent 25%),
                radial-gradient(circle at 88% 82%, var(--bg-soft) 0, transparent 27%),
                var(--bg-main);
            color: var(--text-main);
            font-family: Georgia, "Times New Roman", serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: normal;
        }

        .nav-link:hover {
            color: var(--text-main);
        }

        .coin-display {
            background: var(--bg-soft);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: bold;
            color: var(--accent);
            white-space: nowrap;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--text-heading);
            font-weight: normal;
            font-size: 26px;
            margin: 0 0 8px;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-secondary);
            margin: 0 0 32px;
            font-size: 15px;
            text-align: center;
        }

        .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            height: 22px;
            margin-bottom: 25px;
            color: var(--ornament);
        }

        .ornament.bottom {
            margin: 35px 0 0;
        }

        .ornament span {
            font-size: 16px;
        }

        .ornament i {
            width: 40px;
            height: 1px;
            background: var(--accent-light);
        }

        .decorations {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .decorations span {
            position: absolute;
            color: var(--decoration);
            opacity: 0.55;
            animation: float 5s ease-in-out infinite;
        }

        .decorations span:nth-child(1) {
            top: 8%;
            left: 8%;
            font-size: 20px;
        }

        .decorations span:nth-child(2) {
            top: 16%;
            right: 10%;
            font-size: 13px;
        }

        .decorations span:nth-child(3) {
            top: 42%;
            left: 5%;
            font-size: 12px;
        }

        .decorations span:nth-child(4) {
            top: 37%;
            right: 5%;
            font-size: 20px;
        }

        .decorations span:nth-child(5) {
            bottom: 18%;
            left: 9%;
            font-size: 12px;
        }

        .decorations span:nth-child(6) {
            bottom: 25%;
            right: 8%;
            font-size: 17px;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .shop-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 15px var(--shadow);
            transition: border-color 0.2s, transform 0.2s, background 0.2s;
        }

        .shop-card:hover {
            background: var(--bg-card);
            border-color: var(--accent-light);
            transform: translateY(-2px);
        }

        .shop-card h3 {
            color: var(--text-heading);
            font-size: 18px;
            font-weight: normal;
            margin: 0 0 20px;
        }

        .buy-btn {
            background: var(--bg-card);
            border: 1px solid var(--accent-light);
            padding: 8px 16px;
            border-radius: 100px;
            color: var(--accent);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 2px 6px var(--shadow);
            transition: 0.2s ease;
            width: 100%;
        }

        .buy-btn:hover:not(:disabled) {
            background: var(--bg-soft);
            transform: translateY(-1px);
        }

        .buy-btn:disabled {
            background: var(--bg-soft);
            border-color: var(--border);
            color: var(--text-secondary);
            cursor: default;
            box-shadow: none;
        }

        .unlocked-content {
            display: none;
            margin-top: 16px;
            padding: 12px;
            background: var(--bg-main);
            border-radius: 6px;
            border: 1px dashed var(--border-light);
            font-size: 13px;
            color: var(--text-main);
            line-height: 1.4;
        }

        .gift-image {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 5px;
            user-select: auto;
            -webkit-user-select: auto;
            -webkit-touch-callout: default;
        }

        .gift-link {
            display: block;
            color: var(--accent);
            text-decoration: none;
            text-align: center;
            padding: 10px;
            border: 1px solid var(--border-light);
            border-radius: 6px;
            background: var(--bg-card);
        }

        .gift-link:hover {
            background: var(--bg-soft);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0);
            }

            50% {
                transform: translateY(-7px) rotate(7deg);
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 12px 16px;
            }

            main {
                padding: 20px 12px;
            }

            .shop-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <script>
        function setTheme(themeName) {
            if (themeName === "blue") {
                document.body.removeAttribute("data-theme");
            } else {
                document.body.setAttribute("data-theme", themeName);
            }

            localStorage.setItem("arcade_theme", themeName);
        }

        function loadSavedTheme() {
            const savedTheme = localStorage.getItem("arcade_theme");

            if (savedTheme) {
                setTheme(savedTheme);
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            loadSavedTheme();

            document.querySelectorAll(".shop-card").forEach(function(card) {
                const itemId = card.id;

                if (localStorage.getItem(itemId + "_unlocked") === "true") {
                    revealItem(itemId);
                }
            });

            if (typeof updateCoinDisplays === "function") {
                updateCoinDisplays();
            }
        });

        window.addEventListener("pageshow", function() {
            loadSavedTheme();

            if (typeof updateCoinDisplays === "function") {
                updateCoinDisplays();
            }
        });

        function buyItem(itemId, cost) {
            if (localStorage.getItem(itemId + "_unlocked") === "true") {
                return;
            }

            let success = false;

            if (typeof spendCoins === "function") {
                success = spendCoins(cost);
            }

            if (success) {
                localStorage.setItem(itemId + "_unlocked", "true");
                revealItem(itemId);
            } else {
                alert("Not enough coins.");
            }
        }

        function revealItem(itemId) {
            const card = document.getElementById(itemId);

            if (!card) {
                return;
            }

            const btn = card.querySelector(".buy-btn");
            const content = card.querySelector(".unlocked-content");

            if (btn) {
                btn.innerText = "Unlocked";
                btn.disabled = true;
            }

            if (content) {
                content.style.display = "block";
            }
        }
    </script>
