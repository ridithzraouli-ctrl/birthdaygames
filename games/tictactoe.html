<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic-Tac-Toe</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #faf7f5;
            color: #4a3e3d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: #ffffff;
            border-bottom: 1px solid #eee8e5;
            position: relative;
            z-index: 100;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-link { color: #7d6b6d; text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; }
        .nav-link:hover { color: #4a3e3d; }
        .coin-display { background: #f4ece9; border: 1px solid #e2d7d3; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #635052; }

        main {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 500px;
            margin: 0 auto;
        }

        h1 { color: #4a3e3d; font-weight: 500; font-size: 24px; margin: 0 0 4px; }
        p.subtitle { color: #8c7b7d; margin: 0 0 20px; font-size: 14px; text-align: center; }

        .game-card {
            background: #ffffff;
            border: 1px solid #eee8e5;
            border-radius: 8px;
            padding: 24px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .controls-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .turn-badge {
            background: #f4ece9;
            color: #635052;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .btn {
            padding: 8px 12px;
            border: 1px solid #d1c4c0;
            border-radius: 6px;
            background: #ffffff;
            color: #4a3e3d;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background: #faf7f5; }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 8px;
            width: 316px;
            height: 316px;
        }

        .tile {
            width: 100px;
            height: 100px;
            border: 2px solid #e2d7d3;
            border-radius: 6px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .tile:hover {
            border-color: #8c7b7d;
        }

        .tile.x-mark { color: #b85b56; }
        .tile.o-mark { color: #5b8868; }

        .score-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            border-top: 1px solid #eee8e5;
            padding-top: 16px;
            text-align: center;
        }

        .score-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .score-label { font-size: 12px; color: #8c7b7d; }
        .score-val { font-size: 15px; color: #4a3e3d; font-weight: 600; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 24px;
            max-width: 320px;
            width: 90%;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a onclick="goBack()" class="nav-link">← Back to Games</a>
        </div>
        <div class="header-right">
            <div class="coin-display"><span class="coin-count">0</span> Coins</div>
        </div>
    </header>

    <main>
        <h1>Tic-Tac-Toe</h1>
        <p class="subtitle">Get 3 in a row to win.</p>

        <div class="game-card">
            <div class="controls-row">
                <span class="turn-badge" id="status-text">X'S TURN</span>
                <button class="btn" onclick="openModeModal()"><span id="mode-label">VS AI (EASY)</span> ▼</button>
                <button class="btn" onclick="resetGame()">Reset Board</button>
                <button class="btn" onclick="resetStats()">Reset Stats</button>
            </div>

            <div class="board" id="board">
                <div class="tile" onclick="handleCellClick(0)"></div>
                <div class="tile" onclick="handleCellClick(1)"></div>
                <div class="tile" onclick="handleCellClick(2)"></div>
                <div class="tile" onclick="handleCellClick(3)"></div>
                <div class="tile" onclick="handleCellClick(4)"></div>
                <div class="tile" onclick="handleCellClick(5)"></div>
                <div class="tile" onclick="handleCellClick(6)"></div>
                <div class="tile" onclick="handleCellClick(7)"></div>
                <div class="tile" onclick="handleCellClick(8)"></div>
            </div>

            <div class="score-bar">
                <div class="score-item">
                    <span class="score-label">X Wins</span>
                    <span class="score-val" id="x-wins">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label">Draws</span>
                    <span class="score-val" id="draws">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label">O Wins</span>
                    <span class="score-val" id="o-wins">0</span>
                </div>
            </div>
        </div>
    </main>

    <div id="mode-modal" class="modal-overlay" onclick="closeModeModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2 style="font-size: 18px; margin: 0 0 16px; color: #4a3e3d;">Select Mode</h2>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <button class="btn" onclick="setMode('easy')">VS AI (Easy)</button>
                <button class="btn" onclick="setMode('medium')">VS AI (Medium)</button>
                <button class="btn" onclick="setMode('hard')">VS AI (Hard)</button>
                <button class="btn" onclick="setMode('pvp')">2 Player (Local)</button>
            </div>
        </div>
    </div>

    <div id="reward-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modal-title" style="font-size: 20px; margin: 0 0 10px;">Victory!</h2>
            <p id="modal-desc" style="color: #8c7b7d; font-size: 14px; margin: 0 0 20px;"></p>
            <button class="btn" onclick="closeModalAndReset()" style="width: 100%;">Play Again</button>
        </div>
    </div>

    <script src="../script.js"></script>
    <script>
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            },
            play(type) {
                this.init();
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (type === 'key') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'lose') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(260, now);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 0.35);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                }
            }
        };

        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let gameActive = true;
        let gameMode = "easy";
        
        let xWins = 0;
        let oWins = 0;
        let drawCount = 0;

        const winConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '../index.html';
            }
        }

        function openModeModal() { document.getElementById('mode-modal').style.display = 'flex'; }
        function closeModeModal() { document.getElementById('mode-modal').style.display = 'none'; }

        function setMode(mode) {
            gameMode = mode;
            const labels = { easy: 'VS AI (EASY)', medium: 'VS AI (MEDIUM)', hard: 'VS AI (HARD)', pvp: '2 PLAYER' };
            document.getElementById('mode-label').innerText = labels[mode];
            closeModeModal();
            resetGame();
            resetStats();
        }

        function resetStats() {
            xWins = 0;
            oWins = 0;
            drawCount = 0;
            document.getElementById('x-wins').innerText = '0';
            document.getElementById('o-wins').innerText = '0';
            document.getElementById('draws').innerText = '0';
        }

        function handleCellClick(index) {
            if (board[index] !== "" || !gameActive) return;

            makeMove(index, currentPlayer);

            if (gameActive && gameMode !== 'pvp' && currentPlayer === 'O') {
                setTimeout(aiMove, 250);
            }
        }

        function makeMove(index, player) {
            AudioFX.play('key');
            board[index] = player;
            const tile = document.querySelectorAll('.tile')[index];
            tile.innerText = player;
            tile.classList.add(player === 'X' ? 'x-mark' : 'o-mark');

            if (checkWin(player)) {
                endGame(false, player);
            } else if (board.every(c => c !== "")) {
                endGame(true, null);
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                document.getElementById('status-text').innerText = `${currentPlayer}'S TURN`;
            }
        }

        function getRandomMove() {
            let emptyIndices = board.map((val, idx) => val === "" ? idx : null).filter(val => val !== null);
            return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
        }

        function aiMove() {
            if (!gameActive) return;

            let move;
            if (gameMode === 'easy') {
                move = getRandomMove();
            } else if (gameMode === 'medium') {
                // 50% optimal move, 50% random move
                if (Math.random() < 0.5) {
                    move = minimax(board, 'O').index;
                } else {
                    move = getRandomMove();
                }
            } else if (gameMode === 'hard') {
                // 85% optimal move, 15% random mistake chance
                if (Math.random() < 0.85) {
                    move = minimax(board, 'O').index;
                } else {
                    move = getRandomMove();
                }
            }

            if (move !== undefined) {
                makeMove(move, 'O');
            }
        }

        function checkWin(player) {
            return winConditions.some(cond => cond.every(idx => board[idx] === player));
        }

        function endGame(isDraw, winner) {
            gameActive = false;
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');

            if (isDraw) {
                drawCount++;
                document.getElementById('draws').innerText = drawCount;
                AudioFX.play('lose');
                title.innerText = "Draw!";
                desc.innerText = "It's a tie.";
            } else {
                if (winner === 'X') {
                    xWins++;
                    document.getElementById('x-wins').innerText = xWins;
                    AudioFX.play('win');
                    title.innerText = "Victory!";
                    desc.innerText = "X won the match.";
                    
                    if (gameMode !== 'pvp') {
                        const rewards = { easy: 10, medium: 18, hard: 25 };
                        const reward = rewards[gameMode] || 10;
                        desc.innerText += ` Earned ${reward} Coins!`;
                        if (typeof addCoins === 'function') addCoins(reward);
                    }
                } else {
                    oWins++;
                    document.getElementById('o-wins').innerText = oWins;
                    AudioFX.play('lose');
                    title.innerText = "Game Over";
                    desc.innerText = "O won the match.";
                }
            }

            setTimeout(() => {
                document.getElementById('reward-modal').style.display = 'flex';
            }, 300);
        }

        function closeModalAndReset() {
            document.getElementById('reward-modal').style.display = 'none';
            resetGame();
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            gameActive = true;
            document.getElementById('status-text').innerText = "X'S TURN";

            document.querySelectorAll('.tile').forEach(tile => {
                tile.innerText = "";
                tile.classList.remove('x-mark', 'o-mark');
            });
        }

        function minimax(newBoard, player) {
            let availSpots = newBoard.map((val, idx) => val === "" ? idx : null).filter(val => val !== null);

            if (checkWinCond(newBoard, 'X')) return { score: -10 };
            if (checkWinCond(newBoard, 'O')) return { score: 10 };
            if (availSpots.length === 0) return { score: 0 };

            let moves = [];
            for (let i = 0; i < availSpots.length; i++) {
                let move = {};
                move.index = availSpots[i];
                newBoard[availSpots[i]] = player;

                if (player === 'O') {
                    let result = minimax(newBoard, 'X');
                    move.score = result.score;
                } else {
                    let result = minimax(newBoard, 'O');
                    move.score = result.score;
                }

                newBoard[availSpots[i]] = "";
                moves.push(move);
            }

            let bestMove;
            if (player === 'O') {
                let bestScore = -10000;
                for (let i = 0; i < moves.length; i++) {
                    if (moves[i].score > bestScore) {
                        bestScore = moves[i].score;
                        bestMove = i;
                    }
                }
            } else {
                let bestScore = 10000;
                for (let i = 0; i < moves.length; i++) {
                    if (moves[i].score < bestScore) {
                        bestScore = moves[i].score;
                        bestMove = i;
                    }
                }
            }
            return moves[bestMove];
        }

        function checkWinCond(boardState, player) {
            return winConditions.some(cond => cond.every(idx => boardState[idx] === player));
        }
    </script>
</body>
</html>
