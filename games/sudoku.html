<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #faf7f5;
            color: #4a3e3d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            background: #ffffff;
            border-bottom: 1px solid #eee8e5;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-link { color: #7d6b6d; text-decoration: none; font-size: 14px; font-weight: 500; }
        .nav-link:hover { color: #4a3e3d; }
        .coin-display { background: #f4ece9; border: 1px solid #e2d7d3; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #635052; }

        main {
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: #4a3e3d; font-weight: 500; font-size: 24px; margin: 0 0 24px; }

        #sudoku-board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1;
            background: #8c7b7d;
            border: 2px solid #8c7b7d;
            border-radius: 6px;
            overflow: hidden;
        }

        .sudoku-cell {
            background: #ffffff;
            border: 1px solid #eee8e5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sudoku-cell:nth-child(3n) { border-right: 2px solid #8c7b7d; }
        .sudoku-cell:nth-child(9n) { border-right: none; }
        .sudoku-cell:nth-child(n+19):nth-child(-n+27),
        .sudoku-cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #8c7b7d; }

        .sudoku-cell input {
            width: 100%;
            height: 100%;
            border: 0;
            outline: 0;
            background: transparent;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #4a3e3d;
        }

        .sudoku-cell input:focus { background: #f4ece9; }
        .sudoku-cell.given input { color: #8c7b7d; background: #faf7f5; font-weight: 500; }
        .sudoku-cell.correct { background: #e2efe0 !important; }
        .sudoku-cell.wrong { background: #f9e2e2 !important; }

        .controls { display: flex; gap: 12px; margin-top: 24px; }

        .btn {
            padding: 10px 20px;
            border: 1px solid #d1c4c0;
            border-radius: 6px;
            background: #ffffff;
            color: #4a3e3d;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background: #faf7f5; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 30px;
            max-width: 320px;
            width: 90%;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="nav-link">← Games</a>
        <div class="coin-display"><span class="coin-count">0</span> Coins</div>
    </header>

    <main>
        <h1>Sudoku</h1>

        <div id="sudoku-board"></div>

        <div class="controls">
            <button class="btn" onclick="checkBoard()">Check Board</button>
            <button class="btn" onclick="generateNewGame()">New Puzzle</button>
        </div>
    </main>

    <div id="reward-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 style="font-size: 20px; margin: 0 0 10px;">Complete</h2>
            <p style="color: #8c7b7d; font-size: 14px; margin: 0 0 20px;">You earned 50 Coins.</p>
            <button class="btn" onclick="closeModalAndReset()" style="width: 100%;">Next Puzzle</button>
        </div>
    </div>

    <script src="../script.js"></script>
    <script>
        let solution = [];
        let boardState = [];

        function solveSudoku(board) {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (board[r][c] === 0) {
                        let nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
                        for (let k of nums) {
                            if (isValid(board, r, c, k)) {
                                board[r][c] = k;
                                if (solveSudoku(board)) return true;
                                board[r][c] = 0;
                            }
                        }
                        return false;
                    }
                }
            }
            return true;
        }

        function isValid(board, r, c, k) {
            for (let i = 0; i < 9; i++) {
                const m = 3 * Math.floor(r / 3) + Math.floor(i / 3);
                const n = 3 * Math.floor(c / 3) + i % 3;
                if (board[r][i] === k || board[i][c] === k || board[m][n] === k) return false;
            }
            return true;
        }

        function generateSudoku() {
            let board = Array(9).fill(0).map(() => Array(9).fill(0));
            solveSudoku(board);
            solution = board.map(row => [...row]);

            let puzzle = board.map(row => [...row]);
            let removed = 35;
            while (removed > 0) {
                let r = Math.floor(Math.random() * 9);
                let c = Math.floor(Math.random() * 9);
                if (puzzle[r][c] !== 0) {
                    puzzle[r][c] = 0;
                    removed--;
                }
            }
            return puzzle;
        }

        function renderBoard() {
            const container = document.getElementById('sudoku-board');
            container.innerHTML = '';
            
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'sudoku-cell';
                    const val = boardState[r][c];

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.dataset.row = r;
                    input.dataset.col = c;

                    if (val !== 0) {
                        input.value = val;
                        input.readOnly = true;
                        cell.classList.add('given');
                    } else {
                        input.addEventListener('input', (e) => {
                            e.target.value = e.target.value.replace(/[^1-9]/g, '');
                            cell.parentElement.classList.remove('correct', 'wrong');
                        });
                    }

                    cell.appendChild(input);
                    container.appendChild(cell);
                }
            }
        }

        function generateNewGame() {
            boardState = generateSudoku();
            renderBoard();
        }

        function checkBoard() {
            let isCompleteAndCorrect = true;
            const cells = document.querySelectorAll('.sudoku-cell');

            cells.forEach(cell => {
                const input = cell.querySelector('input');
                const r = parseInt(input.dataset.row);
                const c = parseInt(input.dataset.col);
                const val = parseInt(input.value);

                cell.classList.remove('correct', 'wrong');

                if (cell.classList.contains('given')) return;

                if (val === solution[r][c]) {
                    cell.classList.add('correct');
                } else if (val) {
                    cell.classList.add('wrong');
                    isCompleteAndCorrect = false;
                } else {
                    isCompleteAndCorrect = false;
                }
            });

            if (isCompleteAndCorrect) {
                addCoins(50);
                document.getElementById('reward-modal').style.display = 'flex';
            }
        }

        function closeModalAndReset() {
            document.getElementById('reward-modal').style.display = 'none';
            generateNewGame();
        }

        generateNewGame();
    </script>
</body>
</html>
