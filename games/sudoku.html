<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
    <style>
        :root {
            --bg-base: #f2f7fa;
            --bg-grad-1: #dce8f3;
            --bg-grad-2: #d3e2ea;
            --text-main: #3f5260;
            --text-heading: #46637a;
            --accent-border: #82a8bd;
            --accent-soft: #e9f3f9;
            --accent-badge: #dfe8f8;
            --ornament-color: #799eb8;
            --card-bg: rgba(255, 255, 255, 0.88);
            --header-bg: rgba(255, 255, 255, 0.88);
        }

        body[data-theme="pink"] {
            --bg-base: #faf2f5;
            --bg-grad-1: #f3dce5;
            --bg-grad-2: #ead3dc;
            --text-main: #603f4c;
            --text-heading: #7a4659;
            --accent-border: #bd8297;
            --accent-soft: #f9e9f0;
            --accent-badge: #f8dfe8;
            --ornament-color: #b87992;
            --card-bg: rgba(255, 255, 255, 0.88);
            --header-bg: rgba(255, 255, 255, 0.88);
        }

        body[data-theme="green"] {
            --bg-base: #f3f7f2;
            --bg-grad-1: #dce8dc;
            --bg-grad-2: #d3ead3;
            --text-main: #3f6043;
            --text-heading: #467a4c;
            --accent-border: #82bd8b;
            --accent-soft: #e9f9eb;
            --accent-badge: #dff8e2;
            --ornament-color: #79b882;
            --card-bg: rgba(255, 255, 255, 0.88);
            --header-bg: rgba(255, 255, 255, 0.88);
        }

        body[data-theme="lavender"] {
            --bg-base: #f5f2fa;
            --bg-grad-1: #e3dcf3;
            --bg-grad-2: #dad3ea;
            --text-main: #4a3f60;
            --text-heading: #59467a;
            --accent-border: #9882bd;
            --accent-soft: #f0e9f9;
            --accent-badge: #e9dff8;
            --ornament-color: #9379b8;
            --card-bg: rgba(255, 255, 255, 0.88);
            --header-bg: rgba(255, 255, 255, 0.88);
        }

        body[data-theme="yellow"] {
            --bg-base: #faf8f2;
            --bg-grad-1: #f3edd2;
            --bg-grad-2: #eae3c5;
            --text-main: #60573f;
            --text-heading: #7a6e46;
            --accent-border: #bdb182;
            --accent-soft: #f9f5e9;
            --accent-badge: #f8f3df;
            --ornament-color: #b8aa79;
            --card-bg: rgba(255, 255, 255, 0.88);
            --header-bg: rgba(255, 255, 255, 0.88);
        }

        * {
            box-sizing: border-box;
            min-width: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 10% 12%, var(--bg-grad-1) 0, transparent 28%),
                radial-gradient(circle at 90% 85%, var(--bg-grad-2) 0, transparent 30%),
                var(--bg-base);
            color: var(--text-main);
            font-family: Georgia, "Times New Roman", serif;
            transition: background 0.3s ease, color 0.3s ease;
        }
                header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 70px;
            padding: 15px 22px;
            background: var(--header-bg);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--bg-grad-2);
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 16px;
        }

        .header-left,
        .header-right {
            display: flex;
            align-items: center;
            min-width: 0;
        }

        .header-left {
            gap: 12px;
        }

        .header-right {
            justify-content: flex-end;
            gap: 10px;
        }

        .nav-link {
            color: var(--text-heading);
            text-decoration: none;
            font-size: 15px;
            font-weight: normal;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.2s ease;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        .coin-display {
            background: var(--accent-soft);
            border: 1px solid var(--accent-border);
            padding: 9px 15px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: bold;
            color: var(--text-heading);
            white-space: nowrap;
        }

        main {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: 28px 18px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 22px;
            margin-bottom: 15px;
            color: var(--ornament-color);
        }

        .ornament span {
            font-size: 16px;
        }

        .ornament i {
            width: 38px;
            height: 1px;
            background: var(--ornament-color);
            opacity: 0.45;
        }

        h1 {
            color: var(--text-heading);
            font-weight: normal;
            font-size: 28px;
            margin: 0 0 7px;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-main);
            opacity: 0.78;
            margin: 0 0 24px;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
        }
                .board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 24px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .tile {
            width: 50px;
            height: 50px;
            border: 2px solid var(--accent-border);
            border-radius: 8px;
            background: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: var(--text-heading);
            text-transform: uppercase;
            user-select: none;
            transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .tile[data-state="active"] {
            border-color: var(--text-heading);
            transform: scale(1.05);
        }

        .tile[data-state="correct"] {
            background-color: #88b04b;
            border-color: #88b04b;
            color: #ffffff;
        }

        .tile[data-state="present"] {
            background-color: #f0c961;
            border-color: #f0c961;
            color: #ffffff;
        }

        .tile[data-state="absent"] {
            background-color: var(--bg-grad-2);
            border-color: var(--bg-grad-2);
            color: var(--text-main);
            opacity: 0.7;
        }

        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 480px;
        }

        .kb-row {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .key-btn {
            height: 46px;
            border: 1px solid var(--accent-border);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-heading);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            user-select: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .key-btn:hover:not(:disabled) {
            background: var(--accent-soft);
            transform: translateY(-1px);
        }

        .key-btn.wide {
            flex: 1.5;
            font-size: 11px;
        }

        .key-btn[data-state="correct"] {
            background: #88b04b;
            color: #fff;
            border-color: #88b04b;
        }

        .key-btn[data-state="present"] {
            background: #f0c961;
            color: #fff;
            border-color: #f0c961;
        }

        .key-btn[data-state="absent"] {
            background: var(--bg-grad-2);
            color: var(--text-main);
            opacity: 0.5;
            border-color: var(--bg-grad-2);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            padding: 20px;
            background: rgba(30, 25, 25, 0.3);
            backdrop-filter: blur(5px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--accent-border);
            border-radius: 18px;
            padding: 32px 26px 26px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.16);
            overflow: hidden;
            animation: victoryPop 0.35s ease;
        }

        .modal-card::before,
        .modal-card::after {
            content: "✦";
            position: absolute;
            color: var(--ornament-color);
            opacity: 0.5;
            font-size: 20px;
        }

        .modal-card::before {
            top: 13px;
            left: 18px;
        }

        .modal-card::after {
            top: 13px;
            right: 18px;
        }

        .victory-decoration {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            color: var(--ornament-color);
            margin-bottom: 13px;
        }

        .victory-decoration span {
            font-size: 15px;
        }

        .victory-decoration i {
            width: 30px;
            height: 1px;
            background: var(--ornament-color);
            opacity: 0.5;
        }

        .victory-symbol {
            width: 66px;
            height: 66px;
            margin: 2px auto 14px;
            border-radius: 50%;
            background: var(--accent-soft);
            border: 1px solid var(--accent-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ornament-color);
            font-size: 29px;
            animation: victoryFloat 2s ease-in-out infinite;
        }

        .modal-card h2 {
            color: var(--text-heading);
            font-size: 25px;
            font-weight: normal;
            margin: 0 0 9px;
        }

        .modal-card p {
            color: var(--text-main);
            opacity: 0.82;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 21px;
        }

        .reward-amount {
            display: inline-block;
            margin: -5px 0 20px;
            padding: 7px 13px;
            border-radius: 100px;
            background: var(--accent-badge);
            border: 1px solid var(--accent-border);
            color: var(--text-heading);
            font-size: 13px;
            font-weight: bold;
        }

        .btn {
            padding: 11px 20px;
            border: 1px solid var(--accent-border);
            border-radius: 100px;
            background: var(--card-bg);
            color: var(--text-heading);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn:hover {
            background: var(--accent-soft);
            transform: translateY(-1px);
        }

        .modal-card.game-over .victory-symbol {
            animation: none;
        }

        .confetti {
            position: absolute;
            pointer-events: none;
            color: var(--ornament-color);
            font-size: 14px;
            animation: confettiFall 1.8s ease-out forwards;
        }

        .confetti:nth-child(1) { left: 18%; top: 5%; animation-delay: 0s; }
        .confetti:nth-child(2) { left: 32%; top: 2%; animation-delay: 0.12s; }
        .confetti:nth-child(3) { left: 50%; top: 4%; animation-delay: 0.2s; }
        .confetti:nth-child(4) { right: 32%; top: 2%; animation-delay: 0.08s; }
        .confetti:nth-child(5) { right: 17%; top: 6%; animation-delay: 0.18s; }

        @keyframes victoryPop {
            0% {
                transform: scale(0.88);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes victoryFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(115px) rotate(120deg);
                opacity: 0;
            }
        }

        .decorations {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .decorations span {
            position: absolute;
            color: var(--ornament-color);
            opacity: 0.35;
            animation: float 5s ease-in-out infinite;
        }

        .decorations span:nth-child(1) { top: 13%; left: 7%; font-size: 20px; }
        .decorations span:nth-child(2) { top: 28%; right: 8%; font-size: 13px; animation-delay: 1s; }
        .decorations span:nth-child(3) { top: 55%; left: 5%; font-size: 14px; animation-delay: 2s; }
        .decorations span:nth-child(4) { top: 68%; right: 6%; font-size: 21px; animation-delay: 1.5s; }
        .decorations span:nth-child(5) { bottom: 12%; left: 12%; font-size: 12px; animation-delay: 0.5s; }
        .decorations span:nth-child(6) { bottom: 20%; right: 13%; font-size: 16px; animation-delay: 2.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-7px) rotate(7deg); }
        }

        @media (max-width: 600px) {
            header { min-height: 66px; padding: 12px 11px; }
            main { padding: 24px 12px 35px; }
            .tile { width: 44px; height: 44px; font-size: 20px; }
            .modal-card { max-width: 340px; padding: 30px 21px 23px; }
        }
    </style>
</head>
<body>

    <div class="decorations">
        <span>✦</span>
        <span>✧</span>
        <span>♡</span>
        <span>✦</span>
        <span>✧</span>
        <span>♡</span>
    </div>

    <header>
        <div class="header-left">
            <a onclick="goBack()" class="nav-link">← Back to Games</a>
        </div>
        <div class="header-right">
            <div class="coin-display">
                <span class="coin-count">0</span> Coins
            </div>
        </div>
    </header>

    <main>
        <div class="ornament">
            <span>✦</span>
            <i></i>
            <span>♡</span>
            <i></i>
            <span>✦</span>
        </div>

        <h1>Wordle</h1>
        <p class="subtitle">Guess the 5-letter word in 6 tries.</p>

        <div class="board" id="board"></div>
        <div class="keyboard" id="keyboard"></div>

        <div class="ornament" style="margin-top: 25px; margin-bottom: 0;">
            <span>✧</span>
            <i></i>
            <span>♡</span>
            <i></i>
            <span>✧</span>
        </div>
    </main>

    <div id="reward-modal" class="modal-overlay">
        <div class="modal-card" id="modal-card">
            <span class="confetti">✦</span>
            <span class="confetti">✧</span>
            <span class="confetti">♡</span>
            <span class="confetti">✦</span>
            <span class="confetti">✧</span>

            <div class="victory-decoration">
                <span>✧</span>
                <i></i>
                <span>♡</span>
                <i></i>
                <span>✧</span>
            </div>

            <div class="victory-symbol" id="modal-symbol">♥ ✨</div>

            <h2 id="modal-title">Victory!</h2>
            <p id="modal-desc">You guessed the word and earned 30 Coins.</p>
            <div class="reward-amount" id="reward-amount">+30 Coins</div>

            <button class="btn" onclick="closeModalAndReset()" style="width: 100%;">
                Play Again
            </button>
        </div>
    </div>
        <script src="../script.js"></script>
    <script>
        function loadSavedTheme() {
            const savedTheme = localStorage.getItem("arcade_theme");
            if (["pink", "green", "lavender", "yellow"].includes(savedTheme)) {
                document.body.setAttribute("data-theme", savedTheme);
            } else {
                document.body.removeAttribute("data-theme");
            }
        }
        loadSavedTheme();

        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            },
            play(type) {
                this.init();
                if (!this.ctx) return;
                if (this.ctx.state === "suspended") this.ctx.resume();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (type === "key") {
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === "win") {
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === "lose") {
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(260, now);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 0.35);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                }
            }
        };

        const WORD_LIST = [
            "APPLE", "BEACH", "CHAIR", "DANCE", "EARTH",
            "FLUTE", "GRAPE", "HEART", "IMAGE", "JUICE",
            "KNIFE", "LEMON", "MUSIC", "NIGHT", "OCEAN",
            "PIANO", "QUEEN", "RIVER", "SMILE", "TRAIN",
            "UNITY", "VOICE", "WATER", "YOUTH", "ZEBRA",
            "PLANT", "CRANE", "GHOST", "FLAME", "SHARK",
            "SMART", "CLOUD", "BREAD", "LIGHT", "HOUSE",
            "CROWN", "STORM", "TIGER", "BRICK", "CANDY",
            "DREAM", "FROST", "GLORY", "HONEY", "IVORY",
            "JOKER", "KOWTOW", "LUNAR", "MAPLE", "NOBLE"
        ];

        let targetWord = "";
        let currentRow = 0;
        let currentTile = 0;
        let isGameOver = false;
        const guesses = Array(6).fill("").map(() => Array(5).fill(""));

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "../index.html";
            }
        }

        function initBoard() {
            const boardEl = document.getElementById("board");
            boardEl.innerHTML = "";
            for (let r = 0; r < 6; r++) {
                const rowEl = document.createElement("div");
                rowEl.className = "row";
                rowEl.id = `row-${r}`;
                for (let c = 0; c < 5; c++) {
                    const tileEl = document.createElement("div");
                    tileEl.className = "tile";
                    tileEl.id = `tile-${r}-${c}`;
                    rowEl.appendChild(tileEl);
                }
                boardEl.appendChild(rowEl);
            }
        }

        function initKeyboard() {
            const kbEl = document.getElementById("keyboard");
            kbEl.innerHTML = "";
            const layout = [
                ["Q","W","E","R","T","Y","U","I","O","P"],
                ["A","S","D","F","G","H","J","K","L"],
                ["ENTER","Z","X","C","V","B","N","M","BACK"]
            ];
            layout.forEach(row => {
                const rowEl = document.createElement("div");
                rowEl.className = "kb-row";
                row.forEach(key => {
                    const btn = document.createElement("button");
                    btn.className = "key-btn" + (key.length > 1 ? " wide" : "");
                    btn.innerText = key === "BACK" ? "⌫" : key;
                    btn.id = `key-${key}`;
                    btn.addEventListener("click", () => handleKeyPress(key));
                    rowEl.appendChild(btn);
                });
                kbEl.appendChild(rowEl);
            });
        }

        function handleKeyPress(key) {
            if (isGameOver) return;
            if (key === "ENTER") {
                submitGuess();
            } else if (key === "BACK" || key === "BACKSPACE") {
                deleteLetter();
            } else if (/^[A-Z]$/.test(key) && currentTile < 5) {
                addLetter(key);
            }
        }

        function addLetter(letter) {
            AudioFX.play("key");
            guesses[currentRow][currentTile] = letter;
            const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
            tile.innerText = letter;
            tile.setAttribute("data-state", "active");
            currentTile++;
        }

        function deleteLetter() {
            if (currentTile === 0) return;
            AudioFX.play("key");
            currentTile--;
            guesses[currentRow][currentTile] = "";
            const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
            tile.innerText = "";
            tile.removeAttribute("data-state");
        }

        function submitGuess() {
            if (currentTile < 5) return;
            const guess = guesses[currentRow].join("");
            const targetArr = targetWord.split("");
            const result = Array(5).fill("absent");
            const used = Array(5).fill(false);

            for (let i = 0; i < 5; i++) {
                if (guess[i] === targetArr[i]) {
                    result[i] = "correct";
                    used[i] = true;
                }
            }

            for (let i = 0; i < 5; i++) {
                if (result[i] !== "correct") {
                    for (let j = 0; j < 5; j++) {
                        if (!used[j] && guess[i] === targetArr[j]) {
                            result[i] = "present";
                            used[j] = true;
                            break;
                        }
                    }
                }
            }

            for (let i = 0; i < 5; i++) {
                const tile = document.getElementById(`tile-${currentRow}-${i}`);
                const letter = guess[i];
                const keyBtn = document.getElementById(`key-${letter}`);
                tile.setAttribute("data-state", result[i]);

                if (keyBtn) {
                    const currentState = keyBtn.getAttribute("data-state");
                    if (result[i] === "correct") {
                        keyBtn.setAttribute("data-state", "correct");
                    } else if (result[i] === "present" && currentState !== "correct") {
                        keyBtn.setAttribute("data-state", "present");
                    } else if (result[i] === "absent" && !currentState) {
                        keyBtn.setAttribute("data-state", "absent");
                    }
                }
            }

            if (guess === targetWord) {
                isGameOver = true;
                AudioFX.play("win");
                if (typeof addCoins === "function") addCoins(30);
                showVictory(`You found "${targetWord}" in ${currentRow + 1} try/tries and earned 30 Coins!`);
                return;
            }

            currentRow++;
            currentTile = 0;

            if (currentRow === 6) {
                isGameOver = true;
                AudioFX.play("lose");
                showGameOver(`Out of tries! The word was "${targetWord}".`);
            }
        }

        function showVictory(message) {
            const modal = document.getElementById("reward-modal");
            const card = document.getElementById("modal-card");
            const title = document.getElementById("modal-title");
            const desc = document.getElementById("modal-desc");
            const symbol = document.getElementById("modal-symbol");
            const amount = document.getElementById("reward-amount");

            card.classList.remove("game-over");
            title.innerText = "Victory!";
            desc.innerText = message;
            symbol.innerText = "♥ ✨";
            amount.innerText = "+30 Coins";
            modal.style.display = "flex";
        }

        function showGameOver(message) {
            const modal = document.getElementById("reward-modal");
            const card = document.getElementById("modal-card");
            const title = document.getElementById("modal-title");
            const desc = document.getElementById("modal-desc");
            const symbol = document.getElementById("modal-symbol");
            const amount = document.getElementById("reward-amount");

            card.classList.add("game-over");
            title.innerText = "Game Over";
            desc.innerText = message;
            symbol.innerText = "💔";
            amount.innerText = "Better luck next time";
            modal.style.display = "flex";
        }

        function resetGame() {
            targetWord = WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)];
            currentRow = 0;
            currentTile = 0;
            isGameOver = false;
            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < 5; c++) {
                    guesses[r][c] = "";
                }
            }
            initBoard();
            initKeyboard();
        }

        function closeModalAndReset() {
            document.getElementById("reward-modal").style.display = "none";
            resetGame();
        }

        document.addEventListener("keydown", (e) => {
            handleKeyPress(e.key.toUpperCase());
        });

        document.addEventListener("DOMContentLoaded", function() {
            loadSavedTheme();
            if (typeof updateCoinDisplays === "function") {
                updateCoinDisplays();
            }
            resetGame();
        });
    </script>
</body>
</html>
