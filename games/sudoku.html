<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <style>
        :root {
            --bg-base: #f2f7fa;
            --bg-grad-1: #dce8f3;
            --bg-grad-2: #d3e2ea;
            --text-main: #3f5260;
            --text-heading: #46637a;
            --accent-border: #82a8bd;
            --accent-soft: #e9f3f9;
            --accent-badge: #dfe8f8;
            --ornament-color: #799eb8;
            --card-bg: rgba(255, 255, 255, 0.88);
            --header-bg: rgba(255, 255, 255, 0.88);
        }

        body[data-theme="pink"] {
            --bg-base: #faf2f5;
            --bg-grad-1: #f3dce5;
            --bg-grad-2: #ead3dc;
            --text-main: #603f4c;
            --text-heading: #7a4659;
            --accent-border: #bd8297;
            --accent-soft: #f9e9f0;
            --accent-badge: #f8dfe8;
            --ornament-color: #b87992;
            --card-bg: rgba(255, 255, 255, 0.88);
            --header-bg: rgba(255, 255, 255, 0.88);
        }

        body[data-theme="green"] {
            --bg-base: #f3f7f2;
            --bg-grad-1: #dce8dc;
            --bg-grad-2: #d3ead3;
            --text-main: #3f6043;
            --text-heading: #467a4c;
            --accent-border: #82bd8b;
            --accent-soft: #e9f9eb;
            --accent-badge: #dff8e2;
            --ornament-color: #79b882;
            --card-bg: rgba(255, 255, 255, 0.88);
            --header-bg: rgba(255, 255, 255, 0.88);
        }

        body[data-theme="lavender"] {
            --bg-base: #f5f2fa;
            --bg-grad-1: #e3dcf3;
            --bg-grad-2: #dad3ea;
            --text-main: #4a3f60;
            --text-heading: #59467a;
            --accent-border: #9882bd;
            --accent-soft: #f0e9f9;
            --accent-badge: #e9dff8;
            --ornament-color: #9379b8;
            --card-bg: rgba(255, 255, 255, 0.88);
            --header-bg: rgba(255, 255, 255, 0.88);
        }

        body[data-theme="yellow"] {
            --bg-base: #faf8f2;
            --bg-grad-1: #f3edd2;
            --bg-grad-2: #eae3c5;
            --text-main: #60573f;
            --text-heading: #7a6e46;
            --accent-border: #bdb182;
            --accent-soft: #f9f5e9;
            --accent-badge: #f8f3df;
            --ornament-color: #b8aa79;
            --card-bg: rgba(255, 255, 255, 0.88);
            --header-bg: rgba(255, 255, 255, 0.88);
        }

        * {
            box-sizing: border-box;
            min-width: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 10% 12%, var(--bg-grad-1) 0, transparent 28%),
                radial-gradient(circle at 90% 85%, var(--bg-grad-2) 0, transparent 30%),
                var(--bg-base);
            color: var(--text-main);
            font-family: Georgia, "Times New Roman", serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 70px;
            padding: 15px 22px;
            background: var(--header-bg);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--bg-grad-2);
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 16px;
        }

        .header-left,
        .header-right {
            display: flex;
            align-items: center;
            min-width: 0;
        }

        .header-left { gap: 12px; }
        .header-right { justify-content: flex-end; gap: 10px; }

        .nav-link {
            color: var(--text-heading);
            text-decoration: none;
            font-size: 15px;
            font-weight: normal;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.2s ease;
        }

        .nav-link:hover { opacity: 0.7; }

        .coin-display {
            background: var(--accent-soft);
            border: 1px solid var(--accent-border);
            padding: 9px 15px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: bold;
            color: var(--text-heading);
            white-space: nowrap;
        }

        main {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 24px 18px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 22px;
            margin-bottom: 15px;
            color: var(--ornament-color);
        }

        .ornament span { font-size: 16px; }
        .ornament i {
            width: 38px;
            height: 1px;
            background: var(--ornament-color);
            opacity: 0.45;
        }

        h1 {
            color: var(--text-heading);
            font-weight: normal;
            font-size: 28px;
            margin: 0 0 7px;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-main);
            opacity: 0.78;
            margin: 0 0 20px;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
        }
                .sudoku-board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            border: 3px solid var(--text-heading);
            border-radius: 8px;
            background: var(--card-bg);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .cell {
            border: 1px solid var(--accent-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: var(--text-heading);
            background: var(--card-bg);
            cursor: pointer;
            user-select: none;
            transition: background-color 0.1s ease;
        }

        .cell[data-row="2"], .cell[data-row="5"] {
            border-bottom: 2px solid var(--text-heading);
        }
        .cell[data-col="2"], .cell[data-col="5"] {
            border-right: 2px solid var(--text-heading);
        }

        .cell.initial {
            color: var(--text-heading);
            background: var(--accent-soft);
        }

        .cell.selected {
            background-color: var(--accent-badge) !important;
        }

        .cell.error {
            color: #d9534f !important;
            background-color: rgba(217, 83, 79, 0.1) !important;
        }

        .numpad {
            display: flex;
            gap: 6px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
        }

        .num-btn {
            flex: 1;
            height: 42px;
            border: 1px solid var(--accent-border);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-heading);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: all 0.15s ease;
        }

        .num-btn:hover {
            background: var(--accent-soft);
            transform: translateY(-1px);
        }

        .action-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        .action-btn {
            flex: 1;
            height: 38px;
            border: 1px solid var(--accent-border);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-heading);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .action-btn:hover {
            background: var(--accent-soft);
        }
                .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            padding: 20px;
            background: rgba(30, 25, 25, 0.3);
            backdrop-filter: blur(5px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--accent-border);
            border-radius: 18px;
            padding: 32px 26px 26px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.16);
            overflow: hidden;
            animation: victoryPop 0.35s ease;
        }

        .modal-card::before, .modal-card::after {
            content: "✦";
            position: absolute;
            color: var(--ornament-color);
            opacity: 0.5;
            font-size: 20px;
        }
        .modal-card::before { top: 13px; left: 18px; }
        .modal-card::after { top: 13px; right: 18px; }

        .victory-decoration {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            color: var(--ornament-color);
            margin-bottom: 13px;
        }
        .victory-decoration span { font-size: 15px; }
        .victory-decoration i { width: 30px; height: 1px; background: var(--ornament-color); opacity: 0.5; }

        .victory-symbol {
            width: 66px;
            height: 66px;
            margin: 2px auto 14px;
            border-radius: 50%;
            background: var(--accent-soft);
            border: 1px solid var(--accent-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ornament-color);
            font-size: 29px;
            animation: victoryFloat 2s ease-in-out infinite;
        }

        .modal-card h2 { color: var(--text-heading); font-size: 25px; font-weight: normal; margin: 0 0 9px; }
        .modal-card p { color: var(--text-main); opacity: 0.82; font-size: 14px; line-height: 1.6; margin: 0 0 21px; }

        .reward-amount {
            display: inline-block;
            margin: -5px 0 20px;
            padding: 7px 13px;
            border-radius: 100px;
            background: var(--accent-badge);
            border: 1px solid var(--accent-border);
            color: var(--text-heading);
            font-size: 13px;
            font-weight: bold;
        }

        .btn {
            padding: 11px 20px;
            border: 1px solid var(--accent-border);
            border-radius: 100px;
            background: var(--card-bg);
            color: var(--text-heading);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .btn:hover { background: var(--accent-soft); transform: translateY(-1px); }

        .confetti {
            position: absolute;
            pointer-events: none;
            color: var(--ornament-color);
            font-size: 14px;
            animation: confettiFall 1.8s ease-out forwards;
        }
        .confetti:nth-child(1) { left: 18%; top: 5%; animation-delay: 0s; }
        .confetti:nth-child(2) { left: 32%; top: 2%; animation-delay: 0.12s; }
        .confetti:nth-child(3) { left: 50%; top: 4%; animation-delay: 0.2s; }
        .confetti:nth-child(4) { right: 32%; top: 2%; animation-delay: 0.08s; }
        .confetti:nth-child(5) { right: 17%; top: 6%; animation-delay: 0.18s; }

        @keyframes victoryPop { 0% { transform: scale(0.88); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes victoryFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 15% { opacity: 0.8; } 100% { transform: translateY(115px) rotate(120deg); opacity: 0; } }

        .decorations { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: -1; }
        .decorations span { position: absolute; color: var(--ornament-color); opacity: 0.35; animation: float 5s ease-in-out infinite; }
        .decorations span:nth-child(1) { top: 13%; left: 7%; font-size: 20px; }
        .decorations span:nth-child(2) { top: 28%; right: 8%; font-size: 13px; animation-delay: 1s; }
        .decorations span:nth-child(3) { top: 55%; left: 5%; font-size: 14px; animation-delay: 2s; }
        .decorations span:nth-child(4) { top: 68%; right: 6%; font-size: 21px; animation-delay: 1.5s; }
        .decorations span:nth-child(5) { bottom: 12%; left: 12%; font-size: 12px; animation-delay: 0.5s; }
        .decorations span:nth-child(6) { bottom: 20%; right: 13%; font-size: 16px; animation-delay: 2.5s; }

        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-7px) rotate(7deg); } }
    </style>
</head>
<body>

    <div class="decorations">
        <span>✦</span><span>✧</span><span>♡</span><span>✦</span><span>✧</span><span>♡</span>
    </div>

    <header>
        <div class="header-left">
            <a onclick="goBack()" class="nav-link">← Back to Games</a>
        </div>
        <div class="header-right">
            <div class="coin-display">
                <span class="coin-count">0</span> Coins
            </div>
        </div>
    </header>

    <main>
        <div class="ornament"><span>✦</span><i></i><span>♡</span><i></i><span>✦</span></div>

        <h1>Sudoku</h1>
        <p class="subtitle">Fill the grid so every row, column, and 3x3 box contains digits 1-9.</p>

        <div class="sudoku-board" id="sudoku-board"></div>

        <div class="numpad">
            <button class="num-btn" onclick="inputNumber(1)">1</button>
            <button class="num-btn" onclick="inputNumber(2)">2</button>
            <button class="num-btn" onclick="inputNumber(3)">3</button>
            <button class="num-btn" onclick="inputNumber(4)">4</button>
            <button class="num-btn" onclick="inputNumber(5)">5</button>
            <button class="num-btn" onclick="inputNumber(6)">6</button>
            <button class="num-btn" onclick="inputNumber(7)">7</button>
            <button class="num-btn" onclick="inputNumber(8)">8</button>
            <button class="num-btn" onclick="inputNumber(9)">9</button>
        </div>

        <div class="action-row">
            <button class="action-btn" onclick="inputNumber(0)">Erase</button>
            <button class="action-btn" onclick="resetGame()">New Game</button>
        </div>

        <div class="ornament" style="margin-top: 25px; margin-bottom: 0;">
            <span>✧</span><i></i><span>♡</span><i></i><span>✧</span>
        </div>
    </main>

    <div id="reward-modal" class="modal-overlay">
        <div class="modal-card" id="modal-card">
            <span class="confetti">✦</span><span class="confetti">✧</span><span class="confetti">♡</span><span class="confetti">✦</span><span class="confetti">✧</span>
            <div class="victory-decoration"><span>✧</span><i></i><span>♡</span><i></i><span>✧</span></div>
            <div class="victory-symbol" id="modal-symbol">♥ ✨</div>
            <h2 id="modal-title">Victory!</h2>
            <p id="modal-desc">You completed the puzzle and earned 50 Coins.</p>
            <div class="reward-amount" id="reward-amount">+50 Coins</div>
            <button class="btn" onclick="closeModalAndReset()" style="width: 100%;">Play Again</button>
        </div>
    </div>
