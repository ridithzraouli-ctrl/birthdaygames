<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chess ♡</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg-base:#f2f7fa;--bg-grad-1:#dce8f3;--bg-grad-2:#d3e2ea;
--text-main:#3f5260;--text-heading:#46637a;--accent-border:#82a8bd;
--accent-soft:#e9f3f9;--accent-badge:#dfe8f8;--ornament-color:#799eb8;
--board-light:#f7fbfd;--board-dark:#c6d9e4;--board-line:#6f94aa;
--selected:#b8d4e3;--legal:rgba(111,148,170,.28);--capture:rgba(160,100,120,.3);
}
:root[data-theme="pink"]{
--bg-base:#faf2f5;--bg-grad-1:#f3dce5;--bg-grad-2:#ead3dc;
--text-main:#603f4c;--text-heading:#7a4659;--accent-border:#bd8297;
--accent-soft:#f9e9f0;--accent-badge:#f8dfe8;--ornament-color:#b87992;
--board-light:#fff9fb;--board-dark:#e6c7d3;--board-line:#ad7189;
--selected:#dcb0c1;--legal:rgba(173,113,137,.28);--capture:rgba(140,75,100,.3);
}
:root[data-theme="green"]{
--bg-base:#f3f7f2;--bg-grad-1:#dce8dc;--bg-grad-2:#d3ead3;
--text-main:#3f6043;--text-heading:#467a4c;--accent-border:#82bd8b;
--accent-soft:#e9f9eb;--accent-badge:#dff8e2;--ornament-color:#79b882;
--board-light:#f9fdf8;--board-dark:#c9dfca;--board-line:#70a278;
--selected:#afd2b3;--legal:rgba(112,162,120,.28);--capture:rgba(80,125,85,.3);
}
:root[data-theme="lavender"]{
--bg-base:#f5f2fa;--bg-grad-1:#e3dcf3;--bg-grad-2:#dad3ea;
--text-main:#4a3f60;--text-heading:#59467a;--accent-border:#9882bd;
--accent-soft:#f0e9f9;--accent-badge:#e9dff8;--ornament-color:#9379b8;
--board-light:#fbf9ff;--board-dark:#d5c9e8;--board-line:#8d76ae;
--selected:#c5b5dc;--legal:rgba(141,118,174,.28);--capture:rgba(105,75,135,.3);
}
:root[data-theme="yellow"]{
--bg-base:#faf8f2;--bg-grad-1:#f3edd2;--bg-grad-2:#eae3c5;
--text-main:#60573f;--text-heading:#7a6e46;--accent-border:#bdb182;
--accent-soft:#f9f5e9;--accent-badge:#f8f3df;--ornament-color:#b8aa79;
--board-light:#fffdf7;--board-dark:#e4dbb9;--board-line:#a99b68;
--selected:#d9ca91;--legal:rgba(169,155,104,.28);--capture:rgba(125,105,55,.3);
}
html,body{min-height:100%;margin:0}
body{
min-height:100vh;
background:
radial-gradient(circle at 10% 12%,var(--bg-grad-1) 0,transparent 28%),
radial-gradient(circle at 90% 85%,var(--bg-grad-2) 0,transparent 30%),
var(--bg-base);
color:var(--text-main);
font-family:Georgia,"Times New Roman",serif;
position:relative;
overflow-x:hidden;
}
.decorations{position:fixed;inset:0;pointer-events:none;z-index:-1;color:var(--ornament-color);opacity:.4}
.decorations span{position:absolute}
.decorations span:nth-child(1){top:10%;left:7%;font-size:20px}
.decorations span:nth-child(2){top:25%;right:8%;font-size:13px}
.decorations span:nth-child(3){top:52%;left:5%;font-size:14px}
.decorations span:nth-child(4){top:68%;right:6%;font-size:21px}
.decorations span:nth-child(5){bottom:12%;left:12%;font-size:12px}
.decorations span:nth-child(6){bottom:20%;right:13%;font-size:16px}
header{
height:70px;display:flex;justify-content:space-between;align-items:center;
padding:15px 22px;background:rgba(255,255,255,.88);
backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
border-bottom:1px solid var(--bg-grad-2);
position:sticky;top:0;z-index:100;
}
.header-left,.header-right{display:flex;align-items:center;gap:12px}
.nav-link{
color:var(--text-heading);text-decoration:none;font-size:15px;cursor:pointer;
transition:opacity .2s;white-space:nowrap;
}
.nav-link:hover{opacity:.7}
.coin-display{
background:var(--accent-soft);
border:1px solid var(--accent-border);
padding:9px 15px;border-radius:100px;font-size:13px;font-weight:bold;
color:var(--text-heading);white-space:nowrap;
}
main{
width:min(100%,560px);margin:0 auto;padding:28px 18px 40px;
display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;
}
.ornament{
display:flex;align-items:center;justify-content:center;
gap:10px;height:22px;margin-bottom:15px;color:var(--ornament-color);
}
.ornament span{font-size:16px}
.ornament i{width:38px;height:1px;background:var(--ornament-color);opacity:.45}
.ornament.bottom{margin-top:30px;margin-bottom:0}
h1{
color:var(--text-heading);font-weight:normal;font-size:28px;
margin:0 0 22px;text-align:center;
}
.game-panel{
width:100%;padding:8px;background:rgba(255,255,255,.55);
border:1px solid var(--bg-grad-2);border-radius:13px;
box-shadow:0 6px 20px rgba(0,0,0,.045);
}
.board-frame{
width:100%;padding:7px;border-radius:11px;background:rgba(255,255,255,.8);
border:1px solid var(--accent-border);
}
#board-wrapper{width:100%;aspect-ratio:1;position:relative}
#board{
display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
width:100%;height:100%;border:2px solid var(--accent-border);border-radius:7px;
overflow:hidden;user-select:none;background:var(--board-light);
}
.square{
width:100%;height:100%;display:flex;align-items:center;justify-content:center;
cursor:pointer;position:relative;
}
.square.white{background:var(--board-light)}
.square.black{background:var(--board-dark)}
.square.selected{background:var(--selected)!important}
.square.legal::after{
content:"";position:absolute;width:22%;height:22%;border-radius:50%;
background:var(--legal);pointer-events:none;z-index:2;
}
.square.capture-target::after{
content:"";position:absolute;inset:8%;border:3px solid var(--capture);
border-radius:50%;pointer-events:none;z-index:2;
}
.square.last-move{background:color-mix(in srgb,var(--accent-border) 18%,transparent)}
.piece{
width:90%;height:90%;position:absolute;top:5%;left:5%;pointer-events:none;
z-index:10;will-change:transform;transition:transform .24s cubic-bezier(.4,0,.2,1);
}
.square:hover .piece{transform:scale(1.045)}
.piece img{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.15))}
.status-box{
margin-top:13px;min-height:20px;display:flex;align-items:center;justify-content:center;
color:var(--text-heading);font-size:14px;text-align:center;
}
.controls{display:flex;gap:10px;margin-top:16px;justify-content:center}
.btn{
padding:10px 17px;border:1px solid var(--accent-border);
border-radius:100px;background:rgba(255,255,255,.8);color:var(--text-heading);
font-family:Georgia,"Times New Roman",serif;font-size:13px;cursor:pointer;
transition:.2s ease;
}
.btn:hover{background:var(--accent-soft);transform:translateY(-1px)}
.difficulty-dropdown{position:relative}
.diff-btn{
padding:9px 15px;border:1px solid var(--accent-border);
border-radius:100px;background:var(--accent-soft);color:var(--text-heading);
font-family:Georgia,"Times New Roman",serif;font-size:13px;font-weight:bold;cursor:pointer;
display:flex;align-items:center;gap:5px;
}
.diff-btn:hover{opacity:.8}
.diff-menu{
display:none;position:absolute;right:0;top:calc(100% + 7px);
background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
border:1px solid var(--accent-border);
border-radius:13px;box-shadow:0 8px 25px rgba(60,70,80,.14);
z-index:200;min-width:125px;overflow:hidden;padding:4px;
}
.diff-menu.show{display:block}
.diff-option{
padding:9px 11px;border-radius:9px;font-size:12px;color:var(--text-main);
cursor:pointer;transition:background .15s;
}
.diff-option:hover{background:var(--accent-soft)}
.diff-option.active{font-weight:bold;color:var(--text-heading);background:var(--accent-soft)}
.modal-overlay{
display:none;position:fixed;inset:0;background:rgba(45,55,65,.28);
backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
z-index:500;align-items:center;justify-content:center;padding:20px;
}
.modal-card{
position:relative;background:rgba(255,255,255,.96);
border:1px solid var(--accent-border);
border-radius:15px;padding:28px 24px;max-width:360px;width:100%;
text-align:center;box-shadow:0 15px 45px rgba(0,0,0,.12);
}
.modal-card h2{font-size:23px;font-weight:normal;margin:0 0 18px;color:var(--text-heading)}
.promotion-options{display:flex;justify-content:center;gap:9px;margin-top:17px}
.promo-choice{
width:58px;height:58px;border:1px solid var(--accent-border);
border-radius:14px;background:rgba(255,255,255,.8);cursor:pointer;padding:4px;
transition:background .18s,transform .15s;
}
.promo-choice:hover{background:var(--accent-soft);transform:scale(1.04)}
.promo-choice img{width:100%;height:100%;display:block}
@media(max-width:600px){
header{padding:15px 14px}
main{padding:22px 10px 35px}
h1{font-size:27px}
}
</style>
</head>
<body>

<div class="decorations">
<span>✦</span><span>✧</span><span>♡</span><span>✦</span><span>✧</span><span>♡</span>
</div>

<header>
<div class="header-left">
<a onclick="goBack()" class="nav-link">← Back to Games</a>
</div>
<div class="header-right">
<div class="difficulty-dropdown">
<button class="diff-btn" onclick="toggleDiffMenu()">Difficulty · <span id="current-diff-label">Medium</span> ⌄</button>
<div class="diff-menu" id="diff-menu">
<div class="diff-option" onclick="setDifficulty('easy')">Easy</div>
<div class="diff-option active" onclick="setDifficulty('medium')">Medium</div>
<div class="diff-option" onclick="setDifficulty('hard')">Hard</div>
</div>
</div>
<div class="coin-display"><span class="coin-count">0</span> Coins</div>
</div>
</header>

<main>
<div class="ornament"><span>✦</span><i></i><span>♡</span><i></i><span>✦</span></div>
<h1>Chess</h1>

<div class="game-panel">
<div class="board-frame">
<div id="board-wrapper">
<div id="board"></div>
</div>
</div>

<div class="status-box" id="status-box"></div>

<div class="controls">
<button class="btn" onclick="resetGame()">New Game</button>
</div>
</div>
<div class="ornament bottom"><span>✧</span><i></i><span>♡</span><i></i><span>✧</span></div>
</main>

<div id="promotion-modal" class="modal-overlay">
<div class="modal-card">
<h2>Promote Pawn</h2>
<div class="promotion-options">
<button class="promo-choice" onclick="selectPromotion('q')"><img id="p-q" alt="Queen"></button>
<button class="promo-choice" onclick="selectPromotion('r')"><img id="p-r" alt="Rook"></button>
<button class="promo-choice" onclick="selectPromotion('b')"><img id="p-b" alt="Bishop"></button>
<button class="promo-choice" onclick="selectPromotion('n')"><img id="p-n" alt="Knight"></button>
</div>
</div>
</div>

<div id="reward-modal" class="modal-overlay">
<div class="modal-card">
<h2>✦ You won ♡</h2>
<p style="color:var(--text-main);font-size:14px;margin-bottom:18px;">Earned <strong>50 Coins</strong>!</p>
<button class="btn" onclick="closeModalAndReset()" style="width:100%">Play Again</button>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>
<script src="../script.js"></script>
<script>
const AudioFX={
ctx:null,
init(){
if(!this.ctx){
const C=window.AudioContext||window.webkitAudioContext;
if(C)this.ctx=new C();
}
},
play(type){
this.init();
if(!this.ctx)return;
if(this.ctx.state==="suspended")this.ctx.resume();
const now=this.ctx.currentTime;
const data={
move:[390,260,.075,"sine",.035],
capture:[720,170,.12,"triangle",.045],
check:[520,920,.18,"sine",.045],
castle:[330,510,.16,"sine",.04],
promote:[523,784,.28,"sine",.045],
end:[440,220,.38,"triangle",.04]
}[type];
if(!data)return;
const [start,end,duration,wave,volume]=data;
const osc=this.ctx.createOscillator();
const gain=this.ctx.createGain();
osc.type=wave;
osc.connect(gain);
gain.connect(this.ctx.destination);
osc.frequency.setValueAtTime(start,now);
osc.frequency.exponentialRampToValueAtTime(end,now+duration);
gain.gain.setValueAtTime(volume,now);
gain.gain.exponentialRampToValueAtTime(.001,now+duration);
osc.start(now);
osc.stop(now+duration);
},
win(){
this.init();
if(!this.ctx)return;
if(this.ctx.state==="suspended")this.ctx.resume();
const now=this.ctx.currentTime;
[523.25,659.25,783.99,1046.5].forEach((freq,i)=>{
const osc=this.ctx.createOscillator();
const gain=this.ctx.createGain();
osc.type="sine";
osc.connect(gain);
gain.connect(this.ctx.destination);
const t=now+i*.11;
osc.frequency.setValueAtTime(freq,t);
gain.gain.setValueAtTime(.001,t);
gain.gain.linearRampToValueAtTime(.045,t+.025);
gain.gain.exponentialRampToValueAtTime(.001,t+.16);
osc.start(t);
osc.stop(t+.17);
});
}
};

const pieceCDN={
wP:"https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/wP.svg",
wR:"https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/wR.svg",
wN:"https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/wN.svg",
wB:"https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/wB.svg",
wQ:"https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/wQ.svg",
wK:"https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/wK.svg",
bP:"https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/bP.svg",
bR:"https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/bR.svg",
bN:"https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/bN.svg",
bB:"https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/bB.svg",
bQ:"https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/bQ.svg",
bK:"https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/bK.svg"
};

const pieceValues={p:10,n:30,b:35,r:50,q:90,k:1000};
let game;
let selectedSquare=null;
let isAnimating=false;
let pendingMove=null;
let currentDifficulty="medium";
let lastMove=null;

function applySavedTheme(){
const theme=localStorage.getItem("arcade_theme");
if(["pink","green","lavender","yellow"].includes(theme)){
document.documentElement.dataset.theme=theme;
}else{
document.documentElement.removeAttribute("data-theme");
}
}

function updateCoins(){
if(typeof updateCoinDisplays==="function")updateCoinDisplays();
}

function goBack(){
if(window.history.length>1)window.history.back();
else window.location.href="../index.html";
}

function toggleDiffMenu(){
document.getElementById("diff-menu").classList.toggle("show");
}

document.addEventListener("click",e=>{
if(!e.target.closest(".difficulty-dropdown")){
document.getElementById("diff-menu").classList.remove("show");
}
});

function setDifficulty(diff){
currentDifficulty=diff;
const labels={easy:"Easy",medium:"Medium",hard:"Hard"};
document.getElementById("current-diff-label").textContent=labels[diff];
document.querySelectorAll(".diff-option").forEach(opt=>{
opt.classList.toggle("active",opt.textContent.toLowerCase()===diff);
});
document.getElementById("diff-menu").classList.remove("show");
AudioFX.play("move");
resetGame();
}

function createGrid(){
const boardEl=document.getElementById("board");
boardEl.innerHTML="";
for(let r=0;r<8;r++){
for(let c=0;c<8;c++){
const square=document.createElement("div");
const name=String.fromCharCode(97+c)+(8-r);
square.className=`square ${(r+c)%2===0?"white":"black"}`;
square.dataset.square=name;
square.addEventListener("click",()=>handleSquareClick(name));
boardEl.appendChild(square);
}
}
}

function renderPieces(){
if(!game)return;
document.querySelectorAll(".piece").forEach(p=>p.remove());
document.querySelectorAll(".square").forEach(s=>{
s.classList.remove("selected","legal","capture-target","last-move");
});
const board=game.board();

for(let r=0;r<8;r++){
for(let c=0;c<8;c++){
const squareName=String.fromCharCode(97+c)+(8-r);
const piece=board[r][c];
const squareEl=document.querySelector(`[data-square="${squareName}"]`);
if(!squareEl)continue;

if(lastMove&&(lastMove.from===squareName||lastMove.to===squareName)){
squareEl.classList.add("last-move");
}

if(piece){
const key=piece.color+piece.type.toUpperCase();
const pieceEl=document.createElement("div");
pieceEl.className="piece";
pieceEl.dataset.square=squareName;
pieceEl.innerHTML=`<img src="${pieceCDN[key]}" alt="">`;
squareEl.appendChild(pieceEl);
}
}
}

if(selectedSquare){
const selected=document.querySelector(`[data-square="${selectedSquare}"]`);
if(selected)selected.classList.add("selected");

game.moves({square:selectedSquare,verbose:true}).forEach(move=>{
const target=document.querySelector(`[data-square="${move.to}"]`);
if(!target)return;
if(move.captured||move.flags.includes("e"))target.classList.add("capture-target");
else target.classList.add("legal");
});
}
}

function isPromotionMove(from,to){
const piece=game.get(from);
if(!piece||piece.type!=="p")return false;
if((piece.color==="w"&&to[1]==="8")||(piece.color==="b"&&to[1]==="1")){
return game.moves({square:from,verbose:true}).some(m=>m.to===to&&m.flags.includes("p"));
}
return false;
}

function playSoundForMove(move,isCapture){
if(!move)return;
if(game.in_check())AudioFX.play("check");
else if(move.flags.includes("k")||move.flags.includes("q"))AudioFX.play("castle");
else if(move.flags.includes("p"))AudioFX.play("promote");
else if(isCapture||move.flags.includes("e"))AudioFX.play("capture");
else AudioFX.play("move");
}

function handleSquareClick(square){
if(!game||game.game_over()||game.turn()!=="w"||isAnimating)return;

if(selectedSquare===null){
const piece=game.get(square);
if(piece&&piece.color==="w"){
selectedSquare=square;
AudioFX.play("move");
}
}else{
const from=selectedSquare;
const to=square;

if(from===to){
selectedSquare=null;
renderPieces();
AudioFX.play("move");
return;
}

const legalMoves=game.moves({square:from,verbose:true});
const legal=legalMoves.some(m=>m.to===to);

if(!legal){
const piece=game.get(to);
if(piece&&piece.color==="w"){
selectedSquare=to;
AudioFX.play("move");
}else{
selectedSquare=null;
AudioFX.play("capture");
}
renderPieces();
return;
}

if(isPromotionMove(from,to)){
pendingMove={from,to};
openPromotionModal();
return;
}

executePlayerMove(from,to,"q");
return;
}
renderPieces();
}

function executePlayerMove(from,to,promotion){
const isCapture=game.get(to)!==null;
animateMove(from,to,()=>{
const move=game.move({from,to,promotion});
selectedSquare=null;

if(move){
lastMove={from,to};
playSoundForMove(move,isCapture);
renderPieces();
updateStatus();

if(!game.game_over()){
setTimeout(makeComputerMove,150);
}
}else{
renderPieces();
}
});
}

function openPromotionModal(){
document.getElementById("p-q").src=pieceCDN.wQ;
document.getElementById("p-r").src=pieceCDN.wR;
document.getElementById("p-b").src=pieceCDN.wB;
document.getElementById("p-n").src=pieceCDN.wN;
document.getElementById("promotion-modal").style.display="flex";
AudioFX.play("promote");
}

function selectPromotion(piece){
document.getElementById("promotion-modal").style.display="none";
if(!pendingMove)return;
const {from,to}=pendingMove;
pendingMove=null;
executePlayerMove(from,to,piece);
}

function animateMove(from,to,callback){
const fromEl=document.querySelector(`[data-square="${from}"] .piece`);
const toEl=document.querySelector(`[data-square="${to}"]`);

if(!fromEl||!toEl){
callback();
return;
}

isAnimating=true;
const a=fromEl.getBoundingClientRect();
const b=toEl.getBoundingClientRect();

fromEl.style.zIndex="50";
fromEl.style.transform=`translate3d(${b.left-a.left}px,${b.top-a.top}px,0)`;

setTimeout(()=>{
isAnimating=false;
callback();
},220);
}

function evaluateBoard(board){
let total=0;
for(let r=0;r<8;r++){
for(let c=0;c<8;c++){
const p=board[r][c];
if(p){
const value=pieceValues[p.type]||0;
total+=p.color==="b"?value:-value;
}
}
}
return total;
}

function minimax(depth,isMaximizing,alpha,beta){
if(depth===0||game.game_over())return evaluateBoard(game.board());
const moves=game.moves();

if(isMaximizing){
let best=-Infinity;
for(const move of moves){
game.move(move);
const value=minimax(depth-1,false,alpha,beta);
game.undo();
best=Math.max(best,value);
alpha=Math.max(alpha,value);
if(beta<=alpha)break;
}
return best;
}

let best=Infinity;
for(const move of moves){
game.move(move);
const value=minimax(depth-1,true,alpha,beta);
game.undo();
best=Math.min(best,value);
beta=Math.min(beta,value);
if(beta<=alpha)break;
}
return best;
}

function makeComputerMove(){
if(!game||game.game_over()||game.turn()!=="b")return;

const moves=game.moves({verbose:true});
if(!moves.length)return;

let selectedMove;

if(currentDifficulty==="easy"){
selectedMove=moves[Math.floor(Math.random()*moves.length)];
}else if(currentDifficulty==="medium"){
const captures=moves.filter(m=>m.flags.includes("c")||m.flags.includes("e"));
if(captures.length&&Math.random()<.6){
selectedMove=captures[Math.floor(Math.random()*captures.length)];
}else{
selectedMove=moves[Math.floor(Math.random()*moves.length)];
}
}else{
let bestEval=Infinity;
let bestMoves=[];

for(const move of moves){
game.move(move);
const value=minimax(1,true,-Infinity,Infinity);
game.undo();

if(value<bestEval){
bestEval=value;
bestMoves=[move];
}else if(value===bestEval){
bestMoves.push(move);
}
}
selectedMove=bestMoves[Math.floor(Math.random()*bestMoves.length)]||moves[0];
}

const isCapture=game.get(selectedMove.to)!==null;

animateMove(selectedMove.from,selectedMove.to,()=>{
const move=game.move(selectedMove);
lastMove={from:selectedMove.from,to:selectedMove.to};
playSoundForMove(move,isCapture);
renderPieces();
updateStatus();
});
}

function updateStatus(){
if(!game)return;
const box=document.getElementById("status-box");

if(game.in_checkmate()){
AudioFX.play("end");
if(game.turn()==="b"){
box.textContent="✦ Checkmate · You won ♡";
if(typeof addCoins==="function")addCoins(50);
updateCoins();
setTimeout(()=>{
AudioFX.win();
document.getElementById("reward-modal").style.display="flex";
},280);
}else{
box.textContent="Checkmate · Computer won";
}
}else if(game.in_draw()){
AudioFX.play("end");
box.textContent="Draw game";
}else if(game.in_check()){
box.textContent="Check!";
}else{
box.textContent="";
}
}

function resetGame(){
if(!game)game=new Chess();
else game.reset();

selectedSquare=null;
pendingMove=null;
isAnimating=false;
lastMove=null;

document.getElementById("promotion-modal").style.display="none";
document.getElementById("reward-modal").style.display="none";

renderPieces();
updateStatus();
}

function closeModalAndReset(){
document.getElementById("reward-modal").style.display="none";
resetGame();
}

document.addEventListener("keydown",e=>{
if(e.key==="Escape"){
document.getElementById("promotion-modal").style.display="none";
document.getElementById("diff-menu").classList.remove("show");
pendingMove=null;
}
});

window.addEventListener("pageshow",applySavedTheme);

document.addEventListener("DOMContentLoaded",()=>{
applySavedTheme();
try{
game=new Chess();
}catch(e){
document.getElementById("status-box").textContent="Chess failed to load.";
return;
}
createGrid();
renderPieces();
updateStatus();
updateCoins();
});
</script>
</body>
