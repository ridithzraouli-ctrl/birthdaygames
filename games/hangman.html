<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Bunny Run ♡</title>

<style>
:root{
    --bg-base:#f2f7fa;
    --bg-grad-1:#dce8f3;
    --bg-grad-2:#d3e2ea;
    --text-main:#3f5260;
    --text-heading:#46637a;
    --accent-border:#82a8bd;
    --accent-soft:#e9f3f9;
    --accent-badge:#dfe8f8;
    --ornament-color:#799eb8;
    --card-bg:rgba(255,255,255,.88);
    --header-bg:rgba(255,255,255,.88);

    --sky-top:#a8c7d0;
    --sky-bottom:#d5e1d9;
}

body[data-theme="pink"]{
    --bg-base:#faf2f5;
    --bg-grad-1:#f3dce5;
    --bg-grad-2:#ead3dc;
    --text-main:#603f4c;
    --text-heading:#7a4659;
    --accent-border:#bd8297;
    --accent-soft:#f9e9f0;
    --accent-badge:#f8dfe8;
    --ornament-color:#b87992;
    --card-bg:rgba(255,255,255,.88);
    --header-bg:rgba(255,255,255,.88);

    --sky-top:#e7c1ce;
    --sky-bottom:#f6dfe4;
}

body[data-theme="green"]{
    --bg-base:#f3f7f2;
    --bg-grad-1:#dce8dc;
    --bg-grad-2:#d3ead3;
    --text-main:#3f6043;
    --text-heading:#467a4c;
    --accent-border:#82bd8b;
    --accent-soft:#e9f9eb;
    --accent-badge:#dff8e2;
    --ornament-color:#79b882;
    --card-bg:rgba(255,255,255,.88);
    --header-bg:rgba(255,255,255,.88);

    --sky-top:#b9d2bc;
    --sky-bottom:#dcebd8;
}

body[data-theme="lavender"]{
    --bg-base:#f5f2fa;
    --bg-grad-1:#e3dcf3;
    --bg-grad-2:#dad3ea;
    --text-main:#4a3f60;
    --text-heading:#59467a;
    --accent-border:#9882bd;
    --accent-soft:#f0e9f9;
    --accent-badge:#e9dff8;
    --ornament-color:#9379b8;
    --card-bg:rgba(255,255,255,.88);
    --header-bg:rgba(255,255,255,.88);

    --sky-top:#c9bee0;
    --sky-bottom:#e5dff1;
}

body[data-theme="yellow"]{
    --bg-base:#faf8f2;
    --bg-grad-1:#f3edd2;
    --bg-grad-2:#eae3c5;
    --text-main:#60573f;
    --text-heading:#7a6e46;
    --accent-border:#bdb182;
    --accent-soft:#f9f5e9;
    --accent-badge:#f8f3df;
    --ornament-color:#b8aa79;
    --card-bg:rgba(255,255,255,.88);
    --header-bg:rgba(255,255,255,.88);

    --sky-top:#dfd3a7;
    --sky-bottom:#f1e8c7;
}

*{
    box-sizing:border-box;
    min-width:0;
    -webkit-tap-highlight-color:transparent;
}

html{
    width:100%;
    max-width:100%;
    overflow:hidden;
}

body{
    width:100%;
    max-width:100%;
    min-height:100vh;
    margin:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 10% 12%,var(--bg-grad-1) 0,transparent 28%),
        radial-gradient(circle at 90% 85%,var(--bg-grad-2) 0,transparent 30%),
        var(--bg-base);
    color:var(--text-main);
    font-family:Georgia,"Times New Roman",serif;
    transition:background .3s ease,color .3s ease;
    display:flex;
    align-items:center;
    justify-content:center;
}

.decorations{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.decorations span{
    position:absolute;
    color:var(--ornament-color);
    opacity:.35;
    animation:float 5s ease-in-out infinite;
}

.decorations span:nth-child(1){
    top:13%;
    left:7%;
    font-size:20px;
}

.decorations span:nth-child(2){
    top:28%;
    right:8%;
    font-size:13px;
    animation-delay:1s;
}

.decorations span:nth-child(3){
    top:55%;
    left:5%;
    font-size:14px;
    animation-delay:2s;
}

.decorations span:nth-child(4){
    top:68%;
    right:6%;
    font-size:21px;
    animation-delay:1.5s;
}

.decorations span:nth-child(5){
    bottom:12%;
    left:12%;
    font-size:12px;
    animation-delay:.5s;
}

.decorations span:nth-child(6){
    bottom:20%;
    right:13%;
    font-size:16px;
    animation-delay:2.5s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0) rotate(0);
    }
    50%{
        transform:translateY(-7px) rotate(7deg);
    }
}

.game-shell{
    position:relative;
    z-index:2;
    width:min(100%,1000px);
    padding:18px;
}

.game-card{
    position:relative;
    width:100%;
    padding:10px;
    border:1px solid var(--bg-grad-2);
    border-radius:20px;
    background:var(--card-bg);
    box-shadow:0 12px 35px rgba(0,0,0,.08);
    backdrop-filter:blur(8px);
}

.game-card::before,
.game-card::after{
    content:"✦";
    position:absolute;
    color:var(--ornament-color);
    opacity:.5;
    font-size:19px;
    z-index:5;
    pointer-events:none;
}

.game-card::before{
    top:15px;
    left:17px;
}

.game-card::after{
    top:15px;
    right:17px;
}

#game{
    display:block;
    width:100%;
    height:auto;
    border-radius:13px;
    background:linear-gradient(
        to bottom,
        var(--sky-top),
        var(--sky-bottom)
    );
    image-rendering:pixelated;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

.fullscreen-btn{
    position:fixed;
    top:14px;
    right:14px;
    z-index:300;
    width:42px;
    height:42px;
    border:1px solid var(--accent-border);
    border-radius:12px;
    background:var(--card-bg);
    color:var(--text-heading);
    font-family:Georgia,"Times New Roman",serif;
    font-size:21px;
    line-height:1;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.08);
    backdrop-filter:blur(8px);
    transition:.2s ease;
}

.fullscreen-btn:hover{
    background:var(--accent-soft);
    transform:translateY(-1px);
}

.fullscreen-btn:active{
    transform:translateY(0);
}

.game-card:fullscreen{
    width:100vw;
    height:100vh;
    padding:0;
    border:0;
    border-radius:0;
    background:var(--card-bg);
    display:flex;
    align-items:center;
    justify-content:center;
}

.game-card:fullscreen #game{
    width:min(960px,100vw);
    max-width:960px;
    height:auto;
    border-radius:0;
}

.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    padding:20px;
    background:rgba(30,25,25,.3);
    backdrop-filter:blur(5px);
    z-index:500;
    align-items:center;
    justify-content:center;
}

.modal-card{
    position:relative;
    background:var(--card-bg);
    border:1px solid var(--accent-border);
    border-radius:18px;
    padding:32px 26px 26px;
    max-width:360px;
    width:100%;
    text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.16);
    animation:victoryPop .35s ease;
    overflow:hidden;
}

.modal-card::before,
.modal-card::after{
    content:"✦";
    position:absolute;
    color:var(--ornament-color);
    opacity:.5;
    font-size:20px;
}

.modal-card::before{
    top:13px;
    left:18px;
}

.modal-card::after{
    top:13px;
    right:18px;
}

.victory-decoration{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    color:var(--ornament-color);
    margin-bottom:13px;
}

.victory-decoration span{
    font-size:15px;
}

.victory-decoration i{
    width:30px;
    height:1px;
    background:var(--ornament-color);
    opacity:.5;
}

.victory-symbol{
    width:66px;
    height:66px;
    margin:2px auto 14px;
    border-radius:50%;
    background:var(--accent-soft);
    border:1px solid var(--accent-border);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ornament-color);
}

.modal-card h2{
    color:var(--text-heading);
    font-size:25px;
    font-weight:normal;
    margin:0 0 9px;
}

.modal-card p{
    color:var(--text-main);
    opacity:.82;
    font-size:14px;
    line-height:1.6;
    margin:0 0 14px;
}

.run-stats{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin:0 auto 19px;
    width:100%;
}

.run-stat{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 12px;
    border-radius:10px;
    background:var(--accent-soft);
    border:1px solid var(--accent-border);
    color:var(--text-main);
    font-size:13px;
}

.run-stat strong{
    color:var(--text-heading);
    font-size:14px;
}

.reward-amount{
    display:inline-block;
    margin:-3px 0 20px;
    padding:7px 13px;
    border-radius:100px;
    background:var(--accent-badge);
    border:1px solid var(--accent-border);
    color:var(--text-heading);
    font-size:13px;
    font-weight:bold;
}

.modal-card.game-over .victory-symbol{
    animation:none;
}

.confetti{
    position:absolute;
    pointer-events:none;
    color:var(--ornament-color);
    font-size:14px;
    animation:confettiFall 1.8s ease-out forwards;
}

.confetti:nth-child(1){
    left:18%;
    top:5%;
    animation-delay:0s;
}

.confetti:nth-child(2){
    left:32%;
    top:2%;
    animation-delay:.12s;
}

.confetti:nth-child(3){
    left:50%;
    top:4%;
    animation-delay:.2s;
}

.confetti:nth-child(4){
    right:32%;
    top:2%;
    animation-delay:.08s;
}

.confetti:nth-child(5){
    right:17%;
    top:6%;
    animation-delay:.18s;
}

.modal-btn{
    width:100%;
    padding:11px 20px;
    border:1px solid var(--accent-border);
    border-radius:100px;
    background:var(--card-bg);
    color:var(--text-heading);
    font-family:Georgia,"Times New Roman",serif;
    font-size:13px;
    cursor:pointer;
    transition:.2s ease;
}

.modal-btn:hover{
    background:var(--accent-soft);
    transform:translateY(-1px);
}

@keyframes victoryPop{
    0%{
        transform:scale(.88);
        opacity:0;
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes confettiFall{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }
    15%{
        opacity:.8;
    }
    100%{
        transform:translateY(115px) rotate(120deg);
        opacity:0;
    }
}

@media(max-width:700px){
    .game-shell{
        padding:9px;
    }

    .game-card{
        padding:6px;
        border-radius:15px;
    }

    .game-card::before,
    .game-card::after{
        font-size:15px;
        top:10px;
    }

    .game-card::before{
        left:11px;
    }

    .game-card::after{
        right:11px;
    }

    .fullscreen-btn{
        top:9px;
        right:9px;
        width:38px;
        height:38px;
        font-size:19px;
    }

    .modal-card{
        max-width:340px;
        padding:30px 21px 23px;
    }
}
</style>
</head>

    const savedTheme=localStorage.getItem("arcade_theme");

        savedTheme==="green" ||
        savedTheme==="lavender" ||
        savedTheme==="yellow"

        document.body.setAttribute("data-theme",savedTheme);
    }else{
        document.body.removeAttribute("data-theme");

}

cactusMediumImage.src="games/1000082080-removebg-preview.png";
cactusWideImage.src="games/1000082081-removebg-preview.png";


/* =========================================================
   GAME COLORS
========================================================= */

const DARK="#29332f";

const GROUND_TOP="#756d59";
const GROUND_BASE="#625b4b";
const GROUND_LIGHT="#887f68";
const GROUND_DARK="#48453b";


/* =========================================================
   BUNNY
========================================================= */

const bunny={
    x:110,
    y:GROUND-28,
    width:28,
    height:28,
    velocityY:0,
    grounded:true
};

const gravity=0.72;
const jumpPower=-15.5;


/* =========================================================
   GAME STATE
========================================================= */

let started=false;
let dead=false;

let score=0;
let highScore=Number(
    localStorage.getItem("bunnyRunHighScore")||0
);

let runCoins=0;
let lastCoinMilestone=0;
let lastScoreMilestone=0;

let speed=6;

let lastTime=0;

let spawnTimer=0;
let nextSpawn=1200;

let groundOffset=0;

let runFrame=0;
let runFrameTimer=0;

let jumpFrame=0;
let jumpFrameTimer=0;

const obstacles=[];


/* =========================================================
   AUDIO
========================================================= */

let audioContext=null;

function initAudio(){
    if(!audioContext){
        const AudioCtx=
            window.AudioContext||
            window.webkitAudioContext;

        if(AudioCtx){
            audioContext=new AudioCtx();
        }
    }

    if(
        audioContext &&
        audioContext.state==="suspended"
    ){
        audioContext.resume();
    }
}

function playScoreSound(){
    initAudio();

    if(!audioContext) return;

    const now=audioContext.currentTime;

    const osc1=audioContext.createOscillator();
    const gain1=audioContext.createGain();

    osc1.type="square";
    osc1.frequency.setValueAtTime(880,now);

    gain1.gain.setValueAtTime(.055,now);
    gain1.gain.exponentialRampToValueAtTime(
        .001,
        now+.055
    );

    osc1.connect(gain1);
    gain1.connect(audioContext.destination);

    osc1.start(now);
    osc1.stop(now+.06);


    const osc2=audioContext.createOscillator();
    const gain2=audioContext.createGain();

    osc2.type="square";
    osc2.frequency.setValueAtTime(1175,now+.06);

    gain2.gain.setValueAtTime(.055,now+.06);
    gain2.gain.exponentialRampToValueAtTime(
        .001,
        now+.12
    );

    osc2.connect(gain2);
    gain2.connect(audioContext.destination);

    osc2.start(now+.06);
    osc2.stop(now+.125);
}


/* =========================================================
   SHARED ARCADE COINS
========================================================= */

if(typeof window.addCoins!=="function"){
    window.addCoins=function(amount){
        const current=
            Number(localStorage.getItem("arcade_coins")||0);

        localStorage.setItem(
            "arcade_coins",
            String(current+Number(amount))
        );
    };
}

function awardArcadeCoins(amount){
    if(typeof window.addCoins==="function"){
        window.addCoins(amount);
    }

    if(typeof window.updateCoinDisplays==="function"){
        window.updateCoinDisplays();
    }

    runCoins+=amount;
}


/* =========================================================
   HIGH SCORE
========================================================= */

function updateHighScore(){
    const wholeScore=Math.floor(score);

    if(wholeScore>highScore){
        highScore=wholeScore;

        localStorage.setItem(
            "bunnyRunHighScore",
            String(highScore)
        );
    }
}


/* =========================================================
   SCORE / COIN MILESTONES
========================================================= */

function updateScoreSystems(){
    const wholeScore=Math.floor(score);

    const scoreMilestone=
        Math.floor(wholeScore/100);

    if(scoreMilestone>lastScoreMilestone){
        for(
            let i=lastScoreMilestone+1;
            i<=scoreMilestone;
            i++
        ){
            playScoreSound();
        }

        lastScoreMilestone=scoreMilestone;
    }

    const coinMilestone=
        Math.floor(wholeScore/1000);

    if(coinMilestone>lastCoinMilestone){
        const milestonesEarned=
            coinMilestone-lastCoinMilestone;

        awardArcadeCoins(
            milestonesEarned*10
        );

        lastCoinMilestone=coinMilestone;
    }

    updateHighScore();
}


/* =========================================================
   INPUT
========================================================= */

function handleInput(){
    initAudio();

    if(dead){
        restart();
        return;
    }

    jump();
}

function jump(){
    initAudio();

    if(!started){
        started=true;
        bunny.grounded=true;

        runFrame=0;
        runFrameTimer=0;

        jumpFrame=0;
        jumpFrameTimer=0;

        lastTime=performance.now();

        requestAnimationFrame(loop);

        return;
    }

    if(bunny.grounded){
        bunny.velocityY=jumpPower;
        bunny.grounded=false;

        jumpFrame=0;
        jumpFrameTimer=0;
    }
}

document.addEventListener("keydown",function(e){
    if(
        e.code==="Space" ||
        e.code==="ArrowUp" ||
        e.code==="KeyW"
    ){
        e.preventDefault();
        handleInput();
    }
});

canvas.addEventListener("pointerdown",function(e){
    e.preventDefault();
    handleInput();
});<script>
/* =========================================================
   CACTUS TYPES
   Gameplay values remain exactly as the working branch.
========================================================= */

const cactusTypes=[
    {
        image:cactusSmallImage,
        width:65,
        height:65,
        hitWidth:24,
        hitHeight:24
    },
    {
        image:cactusTallImage,
        width:65,
        height:120,
        hitWidth:24,
        hitHeight:75
    },
    {
        image:cactusMediumImage,
        width:80,
        height:80,
        hitWidth:38,
        hitHeight:38
    },
    {
        image:cactusWideImage,
        width:120,
        height:75,
        hitWidth:70,
        hitHeight:38
    }
];


/* =========================================================
   SPAWN
========================================================= */

function spawnObstacle(){
    const type=
        cactusTypes[
            Math.floor(
                Math.random()*cactusTypes.length
            )
        ];

    obstacles.push({
        x:W+20,
        width:type.width,
        height:type.height,
        hitWidth:type.hitWidth,
        hitHeight:type.hitHeight,
        image:type.image
    });
}


/* =========================================================
   COLLISION
========================================================= */

function getBunnyHitbox(){
    return {
        x:bunny.x+13,
        y:bunny.y+12,
        width:52,
        height:60
    };
}

function checkCollision(o){
    const bunnyHit=getBunnyHitbox();

    const cactusHit={
        x:o.x+(o.width-o.hitWidth)/2,
        y:GROUND-o.hitHeight,
        width:o.hitWidth,
        height:o.hitHeight
    };

    return(
        bunnyHit.x<
            cactusHit.x+cactusHit.width &&
        bunnyHit.x+bunnyHit.width>
            cactusHit.x &&
        bunnyHit.y<
            cactusHit.y+cactusHit.height &&
        bunnyHit.y+bunnyHit.height>
            cactusHit.y
    );
}


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){
    if(dead) return;

    dead=true;

    updateHighScore();

    showGameOverModal();
}


/* =========================================================
   RESTART
========================================================= */

function restart(){
    score=0;
    speed=6;

    runCoins=0;

    lastCoinMilestone=0;
    lastScoreMilestone=0;

    obstacles.length=0;

    spawnTimer=0;
    nextSpawn=1200;

    bunny.x=110;
    bunny.y=GROUND-28;
    bunny.velocityY=0;
    bunny.grounded=true;

    runFrame=0;
    runFrameTimer=0;

    jumpFrame=0;
    jumpFrameTimer=0;

    groundOffset=0;

    dead=false;
    started=true;

    document.getElementById(
        "gameOverModal"
    ).style.display="none";

    lastTime=performance.now();

    requestAnimationFrame(loop);
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){
    if(dead) return;

    const difficulty=
        Math.min(score/100,30);

    speed+=0.00035*dt;

    const movement=
        speed*(dt/16.6667);

    groundOffset+=movement;

    if(!bunny.grounded){
        bunny.velocityY+=gravity;
        bunny.y+=bunny.velocityY;

        if(bunny.y>=GROUND-bunny.height){
            bunny.y=GROUND-bunny.height;
            bunny.velocityY=0;
            bunny.grounded=true;
            jumpFrame=0;
            jumpFrameTimer=0;
        }
    }

    if(bunny.grounded){
        runFrameTimer+=dt;

        if(runFrameTimer>=45){
            runFrameTimer-=45;
            runFrame=(runFrame+1)%8;
        }
    }else{
        jumpFrameTimer+=dt;

        if(jumpFrameTimer>=70){
            jumpFrameTimer-=70;

            if(jumpFrame<7){
                jumpFrame++;
            }
        }
    }


    /* SCORE */

    score+=movement*0.055;

    updateScoreSystems();


    /* OBSTACLES */

    spawnTimer+=dt;

    if(spawnTimer>=nextSpawn){
        spawnObstacle();

        const minimum=
            1050-
            Math.min(
                difficulty*10,
                350
            );

        const maximum=
            1500-
            Math.min(
                difficulty*8,
                300
            );

        nextSpawn=
            minimum+
            Math.random()*
            (maximum-minimum);

        spawnTimer=0;
    }


    for(let i=obstacles.length-1;i>=0;i--){
        const o=obstacles[i];

        o.x-=movement;

        if(checkCollision(o)){
            endGame();
            return;
        }

        if(o.x+o.width<-50){
            obstacles.splice(i,1);

            score+=10;

            updateScoreSystems();
        }
    }
}


/* =========================================================
   GROUND
========================================================= */

function drawGround(){
    ctx.fillStyle=GROUND_BASE;

    ctx.fillRect(
        0,
        GROUND,
        W,
        H-GROUND
    );

    ctx.fillStyle=GROUND_TOP;

    ctx.fillRect(
        0,
        GROUND,
        W,
        8
    );

    const offset=
        -(
            groundOffset%80
        );

    for(
        let x=offset-80;
        x<W+80;
        x+=80
    ){
        ctx.fillStyle=GROUND_LIGHT;

        ctx.fillRect(
            x,
            GROUND+17,
            34,
            3
        );

        ctx.fillStyle=GROUND_DARK;

        ctx.fillRect(
            x+43,
            GROUND+31,
            25,
            3
        );

        ctx.fillRect(
            x+10,
            GROUND+49,
            20,
            3
        );

        ctx.fillStyle=GROUND_LIGHT;

        ctx.fillRect(
            x+52,
            GROUND+64,
            17,
            3
        );

        ctx.fillStyle=GROUND_DARK;

        ctx.fillRect(
            x+28,
            GROUND+82,
            31,
            3
        );

        ctx.fillRect(
            x+4,
            GROUND+105,
            25,
            3
        );
    }
}


/* =========================================================
   CACTI
========================================================= */

function drawObstacles(){
    for(const o of obstacles){
        const drawY=
            GROUND-o.height;

        ctx.drawImage(
            o.image,
            o.x,
            drawY,
            o.width,
            o.height
        );
    }
}


/* =========================================================
   BUNNY
========================================================= */

function drawBunny(){
    let image;
    let frameWidth;
    let frameHeight;

    if(!started){
        image=idleImage;
        frameWidth=28;
        frameHeight=28;
    }else if(!bunny.grounded){
        image=jumpImage;
        frameWidth=28;
        frameHeight=36;
    }else{
        image=runImage;
        frameWidth=28;
        frameHeight=28;
    }

    let frame=0;

    if(started){
        if(!bunny.grounded){
            frame=jumpFrame;
        }else{
            frame=runFrame;
        }
    }

    const drawW=frameWidth*3;
    const drawH=frameHeight*3;

    const feetY=
        bunny.y+bunny.height;

    const drawX=
        bunny.x;

    const drawY=
        feetY-drawH;

    ctx.save();

    ctx.translate(
        drawX+drawW,
        drawY
    );

    ctx.scale(-1,1);

    ctx.drawImage(
        image,
        frame*frameWidth,
        0,
        frameWidth,
        frameHeight,
        0,
        0,
        drawW,
        drawH
    );

    ctx.restore();
}


/* =========================================================
   SCORE DISPLAY
========================================================= */

function drawScore(){
    ctx.save();

    ctx.textAlign="right";
    ctx.textBaseline="top";

    ctx.font=
        '24px Georgia, "Times New Roman", serif';

    ctx.fillStyle=DARK;

    ctx.fillText(
        String(Math.floor(score)).padStart(5,"0"),
        W-25,
        25
    );

    ctx.font=
        '15px Georgia, "Times New Roman", serif';

    ctx.fillStyle=DARK;

    ctx.fillText(
        "HI "+
        String(highScore).padStart(5,"0"),
        W-25,
        57
    );

    ctx.restore();
}


/* =========================================================
   START TEXT
========================================================= */

function drawStartText(){
    if(started || dead) return;

    ctx.save();

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.font=
        '18px Georgia, "Times New Roman", serif';

    ctx.fillStyle=DARK;

    ctx.fillText(
        "PRESS SPACE OR TAP",
        W/2,
        90
    );

    ctx.restore();
}


/* =========================================================
   DRAW
========================================================= */

function draw(){
    const gradient=
        ctx.createLinearGradient(
            0,
            0,
            0,
            GROUND
        );

    gradient.addColorStop(
        0,
        getComputedStyle(document.body)
            .getPropertyValue("--sky-top")
            .trim()
    );

    gradient.addColorStop(
        1,
        getComputedStyle(document.body)
            .getPropertyValue("--sky-bottom")
            .trim()
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        GROUND
    );

    drawGround();
    drawObstacles();
    drawBunny();
    drawScore();
    drawStartText();
}


/* =========================================================
   GAME LOOP
========================================================= */

function loop(time){
    const dt=
        Math.min(
            time-lastTime,
            32
        );

    lastTime=time;

    update(dt);
    draw();

    if(!dead){
        requestAnimationFrame(loop);
    }
}


/* =========================================================
   GAME OVER MODAL
========================================================= */

function showGameOverModal(){
    document.getElementById(
        "modalScore"
    ).innerText=
        Math.floor(score);

    document.getElementById(
        "modalHighScore"
    ).innerText=
        highScore;

    document.getElementById(
        "modalCoins"
    ).innerText=
        "+"+runCoins;

    document.getElementById(
        "modalReward"
    ).innerText=
        "+"+runCoins+" Coins";

    document.getElementById(
        "gameOverModal"
    ).style.display="flex";
}


/* =========================================================
   PLAY AGAIN
========================================================= */

document.getElementById(
    "playAgainBtn"
).addEventListener(
    "click",
    function(e){
        e.stopPropagation();
        restart();
    }
);

document.getElementById(
    "gameOverModal"
).addEventListener(
    "click",
    function(e){
        if(e.target===this){
            restart();
        }
    }
);


/* =========================================================
   FULLSCREEN
========================================================= */

const fullscreenBtn=
    document.getElementById(
        "fullscreenBtn"
    );

const gameCard=
    document.getElementById(
        "gameCard"
    );

function updateFullscreenButton(){
    if(document.fullscreenElement){
        fullscreenBtn.innerText="×";
        fullscreenBtn.title="Exit fullscreen";
        fullscreenBtn.setAttribute(
            "aria-label",
            "Exit fullscreen"
        );
    }else{
        fullscreenBtn.innerText="⛶";
        fullscreenBtn.title="Enter fullscreen";
        fullscreenBtn.setAttribute(
            "aria-label",
            "Enter fullscreen"
        );
    }
}

fullscreenBtn.addEventListener(
    "click",
    async function(e){
        e.preventDefault();
        e.stopPropagation();

        try{
            if(document.fullscreenElement){
                await document.exitFullscreen();
            }else{
                await gameCard.requestFullscreen();
            }
        }catch(error){
            /* Browser may block fullscreen; gameplay remains unaffected. */
        }

        updateFullscreenButton();
    }
);

document.addEventListener(
    "fullscreenchange",
    updateFullscreenButton
);

updateFullscreenButton();
</script><script>
/* =========================================================
   PREVENT UI CONTROLS FROM TRIGGERING GAME INPUT
========================================================= */

fullscreenBtn.addEventListener(
    "pointerdown",
    function(e){
        e.stopPropagation();
    }
);

document.getElementById(
    "gameOverModal"
).addEventListener(
    "pointerdown",
    function(e){
        e.stopPropagation();
    }
);


/* =========================================================
   KEEP HIGH SCORE DISPLAY FRESH
========================================================= */

function refreshHighScore(){
    highScore=Number(
        localStorage.getItem(
            "bunnyRunHighScore"
        )||0
    );
}

refreshHighScore();


/* =========================================================
   COIN DISPLAY BRIDGE
========================================================= */

function refreshArcadeCoins(){
    if(
        typeof window.updateCoinDisplays===
        "function"
    ){
        window.updateCoinDisplays();
    }
}


/* =========================================================
   INITIAL DRAW
========================================================= */

draw();


/* =========================================================
   STARTUP
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){
        loadSavedTheme();

        refreshHighScore();
        refreshArcadeCoins();

        draw();
    }
);


/* =========================================================
   THEME CHANGE SUPPORT
========================================================= */

window.addEventListener(
    "storage",
    function(e){
        if(e.key==="arcade_theme"){
            loadSavedTheme();
            draw();
        }
    }
);


/* =========================================================
   VISIBILITY SAFETY
========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){
        if(!document.hidden && started && !dead){
            lastTime=performance.now();
        }
    }
);
</script>
