<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle</title>
<style>
:root{
--bg-base:#f2f7fa;--bg-grad-1:#dce8f3;--bg-grad-2:#d3e2ea;
--text-main:#3f5260;--text-heading:#46637a;--accent-border:#82a8bd;
--accent-soft:#e9f3f9;--accent-badge:#dfe8f8;--ornament-color:#799eb8;
--card-bg:rgba(255,255,255,.88);--header-bg:rgba(255,255,255,.88);
--correct:#88b04b;--present:#f0c961;
}
body[data-theme="pink"]{
--bg-base:#faf2f5;--bg-grad-1:#f3dce5;--bg-grad-2:#ead3dc;
--text-main:#603f4c;--text-heading:#7a4659;--accent-border:#bd8297;
--accent-soft:#f9e9f0;--accent-badge:#f8dfe8;--ornament-color:#b87992;
}
body[data-theme="green"]{
--bg-base:#f3f7f2;--bg-grad-1:#dce8dc;--bg-grad-2:#d3ead3;
--text-main:#3f6043;--text-heading:#467a4c;--accent-border:#82bd8b;
--accent-soft:#e9f9eb;--accent-badge:#dff8e2;--ornament-color:#79b882;
}
body[data-theme="lavender"]{
--bg-base:#f5f2fa;--bg-grad-1:#e3dcf3;--bg-grad-2:#dad3ea;
--text-main:#4a3f60;--text-heading:#59467a;--accent-border:#9882bd;
--accent-soft:#f0e9f9;--accent-badge:#e9dff8;--ornament-color:#9379b8;
}
body[data-theme="yellow"]{
--bg-base:#faf8f2;--bg-grad-1:#f3edd2;--bg-grad-2:#eae3c5;
--text-main:#60573f;--text-heading:#7a6e46;--accent-border:#bdb182;
--accent-soft:#f9f5e9;--accent-badge:#f8f3df;--ornament-color:#b8aa79;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{
margin:0;min-height:100vh;color:var(--text-main);font-family:Georgia,"Times New Roman",serif;
background:radial-gradient(circle at 10% 12%,var(--bg-grad-1) 0,transparent 28%),
radial-gradient(circle at 90% 85%,var(--bg-grad-2) 0,transparent 30%),var(--bg-base);
transition:background .3s ease,color .3s ease;
}

header{
display:flex;align-items:center;justify-content:space-between;width:100%;min-height:70px;
padding:15px 22px;background:var(--header-bg);backdrop-filter:blur(8px);
border-bottom:1px solid var(--bg-grad-2);position:sticky;top:0;z-index:100;gap:16px;
}
.header-left,.header-right{display:flex;align-items:center;min-width:0}
.header-left{gap:12px}.header-right{justify-content:flex-end;gap:10px}
.nav-link{color:var(--text-heading);text-decoration:none;font-size:15px;cursor:pointer;white-space:nowrap}
.nav-link:hover{opacity:.7}
.coin-display{
background:var(--accent-soft);border:1px solid var(--accent-border);padding:9px 15px;
border-radius:100px;font-size:13px;font-weight:bold;color:var(--text-heading);white-space:nowrap;
}

main{
width:100%;max-width:560px;margin:0 auto;padding:28px 18px 40px;
display:flex;flex-direction:column;align-items:center;
}
.ornament{
display:flex;align-items:center;justify-content:center;gap:10px;height:22px;
margin-bottom:15px;color:var(--ornament-color);
}
.ornament span{font-size:16px}.ornament i{width:38px;height:1px;background:var(--ornament-color);opacity:.45}
h1{color:var(--text-heading);font-weight:normal;font-size:28px;margin:0 0 7px;text-align:center}
.subtitle{color:var(--text-main);opacity:.78;margin:0 0 24px;font-size:14px;text-align:center;line-height:1.5}

.board{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;margin-bottom:24px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{
width:50px;height:50px;border:2px solid var(--accent-border);border-radius:8px;
background:var(--card-bg);display:flex;align-items:center;justify-content:center;
font-size:22px;font-weight:bold;color:var(--text-heading);text-transform:uppercase;
user-select:none;box-shadow:0 2px 8px rgba(0,0,0,.03);
transition:transform .15s ease,background-color .25s ease,border-color .25s ease,color .25s ease;
}
.tile[data-state="active"]{border-color:var(--text-heading);transform:scale(1.05)}
.tile[data-state="correct"]{background:var(--correct);border-color:var(--correct);color:#fff}
.tile[data-state="present"]{background:var(--present);border-color:var(--present);color:#fff}
.tile[data-state="absent"]{background:var(--bg-grad-2);border-color:var(--bg-grad-2);color:var(--text-main);opacity:.7}

.keyboard{display:flex;flex-direction:column;gap:6px;width:100%;max-width:480px}
.kb-row{display:flex;justify-content:center;gap:5px}
.key-btn{
height:46px;border:1px solid var(--accent-border);border-radius:8px;background:var(--card-bg);
color:var(--text-heading);font-family:Georgia,"Times New Roman",serif;font-size:13px;
font-weight:bold;cursor:pointer;text-transform:uppercase;flex:1;display:flex;
align-items:center;justify-content:center;transition:background .2s ease,transform .12s ease;
user-select:none;box-shadow:0 2px 6px rgba(0,0,0,.03);
}
.key-btn:hover:not(:disabled){background:var(--accent-soft);transform:translateY(-1px)}
.key-btn:active:not(:disabled){transform:scale(.96)}
.key-btn.wide{flex:1.5;font-size:11px}
.key-btn[data-state="correct"]{background:var(--correct);color:#fff;border-color:var(--correct)}
.key-btn[data-state="present"]{background:var(--present);color:#fff;border-color:var(--present)}
.key-btn[data-state="absent"]{background:var(--bg-grad-2);color:var(--text-main);opacity:.5;border-color:var(--bg-grad-2)}

.modal-overlay{
display:none;position:fixed;inset:0;padding:20px;background:rgba(30,25,25,.3);
backdrop-filter:blur(5px);z-index:200;align-items:center;justify-content:center;
}
.modal-card{
position:relative;background:var(--card-bg);border:1px solid var(--bg-grad-2);
border-radius:18px;padding:30px 24px;max-width:350px;width:100%;text-align:center;
box-shadow:0 18px 50px rgba(0,0,0,.16);overflow:hidden;
}
.modal-card:before{
content:"✦  ✧  ♡  ✧  ✦";display:block;color:var(--ornament-color);
font-size:15px;letter-spacing:4px;margin-bottom:14px;
}
.modal-card h2{color:var(--text-heading);font-size:24px;font-weight:normal;margin:0 0 10px}
.modal-card p{color:var(--text-main);opacity:.8;font-size:14px;line-height:1.5;margin:0 0 22px}
.btn{
padding:11px 20px;border:1px solid var(--accent-border);border-radius:100px;
background:var(--card-bg);color:var(--text-heading);font-family:Georgia,"Times New Roman",serif;
font-size:13px;cursor:pointer;transition:.2s ease;
}
.btn:hover{background:var(--accent-soft);transform:translateY(-1px)}

.decorations{
position:fixed;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:-1;
}
.decorations span{
position:absolute;color:var(--ornament-color);opacity:.35;animation:float 5s ease-in-out infinite;
}
.decorations span:nth-child(1){top:13%;left:7%;font-size:20px}
.decorations span:nth-child(2){top:28%;right:8%;font-size:13px;animation-delay:1s}
.decorations span:nth-child(3){top:55%;left:5%;font-size:14px;animation-delay:2s}
.decorations span:nth-child(4){top:68%;right:6%;font-size:21px;animation-delay:1.5s}
.decorations span:nth-child(5){bottom:12%;left:12%;font-size:12px;animation-delay:.5s}
.decorations span:nth-child(6){bottom:20%;right:13%;font-size:16px;animation-delay:2.5s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(7deg)}}

@media(max-width:600px){
header{min-height:66px;padding:12px 11px}
main{padding:24px 12px 35px}
.tile{width:44px;height:44px;font-size:20px}
}
</style>
</head>
<body>

<div class="decorations">
<span>✦</span><span>✧</span><span>♡</span><span>✦</span><span>✧</span><span>♡</span>
</div>

<header>
<div class="header-left"><a onclick="goBack()" class="nav-link">← Back to Games</a></div>
<div class="header-right"><div class="coin-display"><span class="coin-count">0</span> Coins</div></div>
</header>

<main>
<div class="ornament"><span>✦</span><i></i><span>♡</span><i></i><span>✦</span></div>
<h1>Wordle</h1>
<p class="subtitle">Guess the 5-letter word in 6 tries.</p>
<div class="board" id="board"></div>
<div class="keyboard" id="keyboard"></div>
<div class="ornament" style="margin-top:25px;margin-bottom:0">
<span>✧</span><i></i><span>♡</span><i></i><span>✧</span>
</div>
</main>

<div id="reward-modal" class="modal-overlay">
<div class="modal-card">
<h2 id="modal-title">Victory!</h2>
<p id="modal-desc">You guessed the word and earned 30 Coins.</p>
<button class="btn" onclick="closeModalAndReset()" style="width:100%">Play Again</button>
</div>
</div>

<script src="../script.js"></script>
<script>
function loadSavedTheme(){
const t=localStorage.getItem("arcade_theme");
if(["pink","green","lavender","yellow"].includes(t))document.body.setAttribute("data-theme",t);
else document.body.removeAttribute("data-theme");
}
loadSavedTheme();

const AudioFX={
ctx:null,
init(){
if(!this.ctx){
const A=window.AudioContext||window.webkitAudioContext;
if(A)this.ctx=new A();
}
},
tone(freq,duration,type="sine",volume=.06,delay=0){
this.init();if(!this.ctx)return;
if(this.ctx.state==="suspended")this.ctx.resume();
const n=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();
o.type=type;o.frequency.setValueAtTime(freq,n);
g.gain.setValueAtTime(volume,n);g.gain.exponentialRampToValueAtTime(.001,n+duration);
o.connect(g);g.connect(this.ctx.destination);o.start(n);o.stop(n+duration);
},
play(type){
if(type==="key")this.tone(400,.05,"sine",.05);
if(type==="submit")this.tone(500,.08,"sine",.06);
if(type==="win"){
this.tone(523.25,.22,"sine",.1,0);
this.tone(659.25,.22,"sine",.1,.08);
this.tone(783.99,.3,"sine",.1,.16);
this.tone(1046.5,.38,"sine",.08,.25);
}
if(type==="lose"){
this.tone(260,.18,"triangle",.08,0);
this.tone(190,.3,"triangle",.06,.12);
}
}
};

const WORD_LIST=[
'APPLE','BEACH','CHAIR','DANCE','EARTH','FLUTE','GRAPE','HEART','IMAGE','JUICE',
'KNIFE','LEMON','MUSIC','NIGHT','OCEAN','PIANO','QUEEN','RIVER','SMILE','TRAIN',
'UNITY','VOICE','WATER','YOUTH','ZEBRA','PLANT','CRANE','GHOST','FLAME','SHARK',
'SMART','CLOUD','BREAD','LIGHT','HOUSE','CROWN','STORM','TIGER','BRICK','CANDY',
'DREAM','FROST','GLORY','HONEY','IVORY','JOKER','LUNAR','MAPLE','NOBLE','MAGIC'
];

let targetWord='';
let currentRow=0;
let currentTile=0;
let isGameOver=false;
const guesses=Array(6).fill(null).map(()=>Array(5).fill(''));

function goBack(){
if(window.history.length>1)window.history.back();
else window.location.href='../index.html';
}

function initBoard(){
const boardEl=document.getElementById('board');
boardEl.innerHTML='';
for(let r=0;r<6;r++){
const row=document.createElement('div');
row.className='row';row.id=`row-${r}`;
for(let c=0;c<5;c++){
const tile=document.createElement('div');
tile.className='tile';tile.id=`tile-${r}-${c}`;
row.appendChild(tile);
}
boardEl.appendChild(row);
}
}

function initKeyboard(){
const kb=document.getElementById('keyboard');
kb.innerHTML='';
[
['Q','W','E','R','T','Y','U','I','O','P'],
['A','S','D','F','G','H','J','K','L'],
['ENTER','Z','X','C','V','B','N','M','BACK']
].forEach(row=>{
const rowEl=document.createElement('div');
rowEl.className='kb-row';
row.forEach(key=>{
const btn=document.createElement('button');
btn.className='key-btn'+(key.length>1?' wide':'');
btn.innerText=key==='BACK'?'⌫':key;
btn.id=`key-${key}`;
btn.addEventListener('click',()=>handleKeyPress(key));
rowEl.appendChild(btn);
});
kb.appendChild(rowEl);
});
}

function handleKeyPress(key){
if(isGameOver)return;
if(key==='ENTER')submitGuess();
else if(key==='BACK'||key==='BACKSPACE')deleteLetter();
else if(/^[A-Z]$/.test(key)&&currentTile<5)addLetter(key);
}

function addLetter(letter){
AudioFX.play('key');
guesses[currentRow][currentTile]=letter;
const tile=document.getElementById(`tile-${currentRow}-${currentTile}`);
tile.innerText=letter;
tile.setAttribute('data-state','active');
currentTile++;
}

function deleteLetter(){
if(currentTile===0)return;
AudioFX.play('key');
currentTile--;
guesses[currentRow][currentTile]='';
const tile=document.getElementById(`tile-${currentRow}-${currentTile}`);
tile.innerText='';
tile.removeAttribute('data-state');
}<script>
function getResults(guess,target){
const targetArr=target.split('');
const result=Array(5).fill('absent');
const used=Array(5).fill(false);

for(let i=0;i<5;i++){
if(guess[i]===targetArr[i]){
result[i]='correct';
used[i]=true;
}
}

for(let i=0;i<5;i++){
if(result[i]==='correct')continue;
for(let j=0;j<5;j++){
if(!used[j]&&guess[i]===targetArr[j]){
result[i]='present';
used[j]=true;
break;
}
}
}
return result;
}

function updateKeyboard(letter,result){
const keyBtn=document.getElementById(`key-${letter}`);
if(!keyBtn)return;

const current=keyBtn.getAttribute('data-state');

if(result==='correct'){
keyBtn.setAttribute('data-state','correct');
}else if(result==='present'&&current!=='correct'){
keyBtn.setAttribute('data-state','present');
}else if(result==='absent'&&!current){
keyBtn.setAttribute('data-state','absent');
}
}

function animateTiles(row,result){
result.forEach((state,i)=>{
const tile=document.getElementById(`tile-${row}-${i}`);
setTimeout(()=>{
tile.setAttribute('data-state',state);
tile.style.animation='tileFlip .42s ease';
setTimeout(()=>tile.style.animation='',450);
},i*90);
});
}

function submitGuess(){
if(isGameOver||currentTile<5)return;

const guess=guesses[currentRow].join('');
const result=getResults(guess,targetWord);

AudioFX.play('submit');
animateTiles(currentRow,result);

result.forEach((state,i)=>{
setTimeout(()=>updateKeyboard(guess[i],state),i*90);
});

if(guess===targetWord){
isGameOver=true;

setTimeout(()=>{
AudioFX.play('win');
if(typeof addCoins==='function')addCoins(30);

document.getElementById('modal-title').innerText='Victory!';
document.getElementById('modal-desc').innerText=
`You found "${targetWord}" in ${currentRow+1} ${currentRow===0?'try':'tries'} and earned 30 Coins!`;

document.getElementById('reward-modal').style.display='flex';
},650);

return;
}

currentRow++;
currentTile=0;

if(currentRow===6){
isGameOver=true;

setTimeout(()=>{
AudioFX.play('lose');
document.getElementById('modal-title').innerText='Game Over';
document.getElementById('modal-desc').innerText=
`Out of tries! The word was "${targetWord}".`;
document.getElementById('reward-modal').style.display='flex';
},650);
}
}

function resetGame(){
targetWord=WORD_LIST[Math.floor(Math.random()*WORD_LIST.length)];
currentRow=0;
currentTile=0;
isGameOver=false;

for(let r=0;r<6;r++){
for(let c=0;c<5;c++){
guesses[r][c]='';
}
}

document.getElementById('reward-modal').style.display='none';
initBoard();
initKeyboard();
}

function closeModalAndReset(){
document.getElementById('reward-modal').style.display='none';
resetGame();
}

document.addEventListener('keydown',e=>{
let key=e.key.toUpperCase();

if(key==='ENTER'){
e.preventDefault();
handleKeyPress('ENTER');
}else if(key==='BACKSPACE'){
e.preventDefault();
handleKeyPress('BACK');
}else if(/^[A-Z]$/.test(key)){
handleKeyPress(key);
}
});

document.addEventListener('DOMContentLoaded',()=>{
loadSavedTheme();
if(typeof updateCoinDisplays==='function')updateCoinDisplays();
resetGame();
});
</script><style>
@keyframes tileFlip{
0%{transform:rotateX(0) scale(1)}
45%{transform:rotateX(90deg) scale(.96)}
100%{transform:rotateX(0) scale(1)}
}

.tile[data-state="correct"],
.tile[data-state="present"],
.tile[data-state="absent"]{
transition:background-color .35s ease,border-color .35s ease,color .35s ease,opacity .35s ease;
}

.key-btn[data-state="correct"]{
background:#88b04b!important;
border-color:#88b04b!important;
color:#fff!important;
opacity:1!important;
}

.key-btn[data-state="correct"]:hover{
background:#769d3f!important;
border-color:#769d3f!important;
color:#fff!important;
}

.key-btn[data-state="present"]{
background:#f0c961!important;
border-color:#f0c961!important;
color:#fff!important;
opacity:1!important;
}

.key-btn[data-state="present"]:hover{
background:#dfb84e!important;
border-color:#dfb84e!important;
color:#fff!important;
}

.key-btn[data-state="absent"]{
background:var(--bg-grad-2)!important;
border-color:var(--bg-grad-2)!important;
color:var(--text-main)!important;
opacity:.5!important;
}

/* keeps a correct green letter green when the keyboard is clicked */
.key-btn[data-state="correct"]:active,
.key-btn[data-state="correct"]:focus,
.key-btn[data-state="correct"]:hover{
color:#fff!important;
}

/* if a correct key is clicked, give it a darker green instead of turning white */
.key-btn[data-state="correct"]:active{
background:#6f963a!important;
border-color:#6f963a!important;
}

/* nicer present-key interaction */
.key-btn[data-state="present"]:active{
background:#d5ae43!important;
border-color:#d5ae43!important;
color:#fff!important;
}

@media(max-width:380px){
.tile{width:41px;height:41px;font-size:18px}
.key-btn{height:43px;font-size:12px}
.key-btn.wide{font-size:10px}
}
</style>
</body>
</html>
