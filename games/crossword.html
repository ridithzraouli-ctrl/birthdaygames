<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Crossword ♡</title>
<style>
:root{
--bg-base:#f2f7fa;--bg-grad-1:#dce8f3;--bg-grad-2:#d3e2ea;
--text-main:#3f5260;--text-heading:#46637a;--accent-border:#82a8bd;
--accent-soft:#e9f3f9;--accent-badge:#dfe8f8;--ornament-color:#799eb8;
--card-bg:rgba(255,255,255,.88);--header-bg:rgba(255,255,255,.88)
}
body[data-theme="pink"]{--bg-base:#faf2f5;--bg-grad-1:#f3dce5;--bg-grad-2:#ead3dc;--text-main:#603f4c;--text-heading:#7a4659;--accent-border:#bd8297;--accent-soft:#f9e9f0;--accent-badge:#f8dfe8;--ornament-color:#b87992}
body[data-theme="green"]{--bg-base:#f3f7f2;--bg-grad-1:#dce8dc;--bg-grad-2:#d3ead3;--text-main:#3f6043;--text-heading:#467a4c;--accent-border:#82bd8b;--accent-soft:#e9f9eb;--accent-badge:#dff8e2;--ornament-color:#79b882}
body[data-theme="lavender"]{--bg-base:#f5f2fa;--bg-grad-1:#e3dcf3;--bg-grad-2:#dad3ea;--text-main:#4a3f60;--text-heading:#59467a;--accent-border:#9882bd;--accent-soft:#f0e9f9;--accent-badge:#e9dff8;--ornament-color:#9379b8}
body[data-theme="yellow"]{--bg-base:#faf8f2;--bg-grad-1:#f3edd2;--bg-grad-2:#eae3c5;--text-main:#60573f;--text-heading:#7a6e46;--accent-border:#bdb182;--accent-soft:#f9f5e9;--accent-badge:#f8f3df;--ornament-color:#b8aa79}

*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{
min-height:100vh;margin:0;
background:
radial-gradient(circle at 10% 12%,var(--bg-grad-1) 0,transparent 28%),
radial-gradient(circle at 90% 85%,var(--bg-grad-2) 0,transparent 30%),
var(--bg-base);
color:var(--text-main);
font-family:Georgia,"Times New Roman",serif
}

.decorations{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}
.decorations span{position:absolute;color:var(--ornament-color);opacity:.35;animation:float 5s ease-in-out infinite}
.decorations span:nth-child(1){top:13%;left:7%;font-size:20px}
.decorations span:nth-child(2){top:28%;right:8%;font-size:13px;animation-delay:1s}
.decorations span:nth-child(3){top:55%;left:5%;font-size:14px;animation-delay:2s}
.decorations span:nth-child(4){top:68%;right:6%;font-size:21px;animation-delay:1.5s}
.decorations span:nth-child(5){bottom:12%;left:12%;font-size:12px;animation-delay:.5s}
.decorations span:nth-child(6){bottom:20%;right:13%;font-size:16px;animation-delay:2.5s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(7deg)}}

header{
display:flex;align-items:center;justify-content:space-between;
width:100%;min-height:64px;padding:10px 16px;
background:var(--header-bg);backdrop-filter:blur(8px);
border-bottom:1px solid var(--bg-grad-2);
position:sticky;top:0;z-index:100
}
.nav-link{color:var(--text-heading);font-size:13px;cursor:pointer;text-decoration:none}
.coin-display{
background:var(--accent-soft);border:1px solid var(--accent-border);
padding:6px 10px;border-radius:100px;font-size:12px;font-weight:bold;
color:var(--text-heading)
}

main{
width:100%;max-width:620px;margin:auto;
padding:18px 10px 30px;display:flex;flex-direction:column;align-items:center
}
.ornament{display:flex;align-items:center;justify-content:center;gap:9px;height:18px;margin-bottom:8px;color:var(--ornament-color)}
.ornament span{font-size:14px}
.ornament i{width:32px;height:1px;background:var(--ornament-color);opacity:.45}
h1{color:var(--text-heading);font-weight:normal;font-size:27px;margin:0 0 13px;text-align:center}

.crossword-card{
width:100%;background:var(--card-bg);border:1px solid var(--bg-grad-2);
border-radius:14px;padding:10px;
box-shadow:0 7px 22px rgba(0,0,0,.045)
}

.crossword-grid{
width:100%;
display:grid;
grid-template-columns:repeat(17,1fr);
grid-template-rows:repeat(16,1fr);
aspect-ratio:17/16;
gap:2px;
background:transparent;
}

.cell{
position:relative;
min-width:0;min-height:0;
background:rgba(255,255,255,.72);
border:1px solid var(--accent-border);
border-radius:5px;
display:flex;align-items:center;justify-content:center;
overflow:hidden;
transition:background-color .8s ease,opacity .8s ease
}

.cell.block{
background:transparent;
border-color:transparent
}

.cell input{
width:100%;height:100%;
border:0;outline:0;padding:0;margin:0;
background:transparent;
color:var(--text-heading);
text-align:center;
font-family:Georgia,"Times New Roman",serif;
font-size:clamp(10px,3.3vw,20px);
font-weight:bold;
text-transform:uppercase;
caret-color:var(--accent-border)
}

.cell-number{
position:absolute;top:1px;left:2px;
font-size:clamp(5px,1.25vw,8px);
line-height:1;color:var(--text-heading);
opacity:.8;pointer-events:none;z-index:2
}

.cell.correct{background:#cfe9d2}
.cell.wrong{background:#f0cccc}

.check-area{display:flex;justify-content:center;margin-top:12px}
.btn{
padding:9px 22px;border:1px solid var(--accent-border);
border-radius:100px;background:var(--card-bg);
color:var(--text-heading);
font-family:Georgia,"Times New Roman",serif;font-size:13px;
cursor:pointer;transition:.2s ease
}
.btn:hover{background:var(--accent-soft);transform:translateY(-1px)}

.clues{
width:100%;margin-top:18px;
display:flex;flex-direction:column;gap:7px
}
.clue{
display:flex;align-items:flex-start;gap:8px;
padding:7px 9px;border:1px solid var(--bg-grad-2);
border-radius:8px;background:rgba(255,255,255,.45);
font-size:13px;line-height:1.35
}
.clue-number{
flex:0 0 auto;width:21px;height:21px;
display:flex;align-items:center;justify-content:center;
border-radius:50%;background:var(--accent-badge);
border:1px solid var(--accent-border);
color:var(--text-heading);font-size:10px;font-weight:bold
}
.clue-word{color:var(--text-heading);font-weight:bold;margin-right:4px}

.modal-overlay{
display:none;position:fixed;inset:0;padding:20px;
background:rgba(30,25,25,.3);backdrop-filter:blur(5px);
z-index:500;align-items:center;justify-content:center
}
.modal-card{
position:relative;background:var(--card-bg);
border:1px solid var(--accent-border);border-radius:18px;
padding:28px 23px 23px;max-width:350px;width:100%;
text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.16);
animation:victoryPop .35s ease
}
.modal-card:before,.modal-card:after{
content:"✦";position:absolute;color:var(--ornament-color);
opacity:.5;font-size:19px;top:12px
}
.modal-card:before{left:17px}.modal-card:after{right:17px}
.victory-symbol{
width:62px;height:62px;margin:2px auto 13px;border-radius:50%;
background:var(--accent-soft);border:1px solid var(--accent-border);
display:flex;align-items:center;justify-content:center;
color:var(--ornament-color);animation:victoryFloat 2s ease-in-out infinite
}
.modal-card h2{color:var(--text-heading);font-size:24px;font-weight:normal;margin:0 0 8px}
.modal-card p{font-size:14px;line-height:1.55;margin:0 0 18px}
.reward-amount{
display:inline-block;margin:-2px 0 18px;padding:7px 13px;
border-radius:100px;background:var(--accent-badge);
border:1px solid var(--accent-border);
color:var(--text-heading);font-size:13px;font-weight:bold
}
.confetti{
position:absolute;pointer-events:none;color:var(--ornament-color);
font-size:14px;animation:confettiFall 1.8s ease-out forwards
}
.confetti:nth-child(1){left:18%;top:5%}
.confetti:nth-child(2){left:32%;top:2%;animation-delay:.12s}
.confetti:nth-child(3){left:50%;top:4%;animation-delay:.2s}
.confetti:nth-child(4){right:32%;top:2%;animation-delay:.08s}
.confetti:nth-child(5){right:17%;top:6%;animation-delay:.18s}

@keyframes victoryPop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes victoryFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.8}100%{transform:translateY(115px) rotate(120deg);opacity:0}}

@media(max-width:500px){
header{padding:9px 10px}
main{padding:15px 7px 25px}
.crossword-card{padding:7px}
.clue{font-size:12px}
}
</style>
</head>

<body>

<div class="decorations">
<span>✦</span><span>✧</span><span>♡</span>
<span>✦</span><span>✧</span><span>♡</span>
</div>

<header>
<div>
<a onclick="goBack()" class="nav-link">← Back to Games</a>
</div>
<div class="coin-display">
<span class="coin-count">0</span> Coins
</div>
</header>

<main>

<div class="ornament">
<span>✦</span><i></i><span>♡</span><i></i><span>✦</span>
</div>

<h1>Crossword</h1>

<div class="crossword-card">

<div class="crossword-grid" id="crossword-grid"></div>

<div class="check-area">
<button class="btn" id="check-btn" onclick="checkPuzzle()">Check</button>
</div>

<div class="clues" id="clues"></div>

</div>
</main>

<div id="reward-modal" class="modal-overlay">
<div class="modal-card">

<span class="confetti">✦</span>
<span class="confetti">✧</span>
<span class="confetti">♡</span>
<span class="confetti">✦</span>
<span class="confetti">✧</span>

<div class="victory-symbol">
<svg width="31" height="31" viewBox="0 0 24 24" fill="currentColor">
<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
</svg>
</div>

<h2>You did it ♡</h2>
<p>You solved the whole crossword!</p>
<div class="reward-amount">+50 Coins</div>

<button class="btn" onclick="goBack()" style="width:100%">
Back to Games
</button>

</div>
</div>

<script src="../script.js"></script>
<script>
function loadSavedTheme(){
const t=localStorage.getItem("arcade_theme");
if(["pink","green","lavender","yellow"].includes(t))
document.body.setAttribute("data-theme",t);
}

loadSavedTheme();

const rawGrid=[
"............s....",
"............t....",
".......b....r....",
"....angel..bakugo",
".......a....w....",
".......c..m.bunny",
"..l.lightmode....",
"..i.u.....o.rin..",
"..l.n.n...n.r....",
"Polkadots...y....",
"..i...v..........",
"..e...e..........",
"..s...m..........",
"......b..........",
"......e..........",
"......r.........."
];

const answers=[
["STRAWBERRY","fields in italy",0,12,"down"],
["BEACH","your favorite place",2,7,"down"],
["ANGEL","your favorite nickname",3,4,"across"],
["BAKUGO","the character that is most like you",3,11,"across"],
["MOON","a word from my favorite way to say i love you",5,10,"down"],
["BUNNY","the animal that reminds me most of you",5,12,"across"],
["LILLIES","you favorite flower",6,2,"down"],
["LIGHTMODE","the sickest most controversial thing you like",6,4,"across"],
["LUNA","your favorite gf",6,4,"down"],
["RIN","your nickname for me",7,12,"across"],
["NOVEMBER","when we got together",8,6,"down"],
["POLKADOTS","your favorite pattern",9,0,"across"]
];

let cells={};
let numbered={};
let solved=false;

function key(r,c){return r+"-"+c}

function buildNumbers(){
let n=1;

[...answers]
.sort((a,b)=>a[2]-b[2]||a[3]-b[3])
.forEach(a=>{
let k=key(a[2],a[3]);
if(!numbered[k]) numbered[k]=n++;
});

answers.forEach(a=>a[5]=numbered[key(a[2],a[3])]);
}

function buildGrid(){
buildNumbers();

const grid=document.getElementById("crossword-grid");
grid.innerHTML="";
cells={};

for(let r=0;r<16;r++){
for(let c=0;c<17;c++){

const char=rawGrid[r][c];
const cell=document.createElement("div");

cell.className=char==="."?"cell block":"cell";

if(char!=="."){

const k=key(r,c);

if(numbered[k]){
const num=document.createElement("span");
num.className="cell-number";
num.textContent=numbered[k];
cell.appendChild(num);
}

const input=document.createElement("input");
input.type="text";
input.maxLength=1;
input.autocomplete="off";
input.autocorrect="off";
input.autocapitalize="characters";
input.spellcheck=false;

input.addEventListener("input",function(){
this.value=this.value
.replace(/[^a-zA-Z]/g,"")
.toUpperCase()
.slice(0,1);

cell.classList.remove("correct","wrong");
});

cell.appendChild(input);

cells[k]={
cell:cell,
input:input,
answer:char.toUpperCase()
};
}

grid.appendChild(cell);
}
}
}

function buildClues(){
const box=document.getElementById("clues");
box.innerHTML="";

[...answers]
.sort((a,b)=>a[5]-b[5])
.forEach(a=>{

const clue=document.createElement("div");
clue.className="clue";

clue.innerHTML=
`<span class="clue-number">${a[5]}</span>
<div><span class="clue-word">${a[0].toLowerCase()}</span>${a[1]}</div>`;

box.appendChild(clue);
});
}

function checkPuzzle(){

if(solved)return;

let all=true;

Object.values(cells).forEach(x=>{

x.cell.classList.remove("correct","wrong");

if(x.input.value.toUpperCase()===x.answer){
x.cell.classList.add("correct");
}else{
x.cell.classList.add("wrong");
all=false;
}
});

const button=document.getElementById("check-btn");

button.style.pointerEvents="none";
button.style.opacity="0";
button.style.transition="opacity .6s ease";

setTimeout(()=>{
Object.values(cells).forEach(x=>{
x.cell.classList.remove("correct","wrong");
});
},1800);

if(all){
solved=true;
setTimeout(winPuzzle,700);
}
}function winPuzzle(){

if(typeof addCoins==="function")
addCoins(50);

if(typeof updateCoinDisplays==="function")
updateCoinDisplays();

document.getElementById("reward-modal").style.display="flex";
}

function goBack(){
if(window.history.length>1)
window.history.back();
else
window.location.href="../index.html";
}

document.addEventListener("DOMContentLoaded",function(){

loadSavedTheme();

if(typeof updateCoinDisplays==="function")
updateCoinDisplays();

buildGrid();
buildClues();

});
</script>

</body>
</html>
