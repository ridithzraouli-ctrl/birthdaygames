.confetti span:nth-child(2){

.confetti span:nth-child(5){

}

.confetti span:nth-child(6){
margin-left:72px;
animation-delay:.24s;

@keyframes drawHeart{
to{stroke-dashoffset:0}
}

@keyframes heartAppear{
0%{opacity:0;transform:scale(.65)}
70%{opacity:1;transform:scale(1.08)}
100%{opacity:1;transform:scale(1)}

@keyframes heartFloat{

<script>

const rawGrid = const rawGrid = [
    “............s....”,
    “............t....”,
    “.......b....r....”,
    “....angel..bakugo”,
    “.......a....w....”,
    “.......c..m.bunny”,
    “..l.lightmode....”,
    “..i.u.....o.rin..”,
    “..l.n.n...n.r....”,
    “Polkadots...y....”,
    “..i...v..........”,
    “..e...e..........”,
    “..s...m..........”,
    “......b..........”,
    “......e..........”,
    “......r..........”
];

const clues = [
{
word:"BUNNY",
clue:"the animal that reminds me most of you"
},
{
word:"BAKUGO",
clue:"the character that is most like you"
},
{
word:"POLKADOTS",
clue:"your favorite pattern"
},
{
word:"ANGEL",
clue:"your favorite nickname"
},
{
word:"LILLIES",
clue:"you favorite flower"
},
{
word:"STRAWBERRY",
clue:"fields in italy"
},
{
word:"NOVEMBER",
clue:"when we got together"
},
{
word:"RIN",
clue:"your nickname for me"
},
{
word:"BEACH",
clue:"your favorite place"
},
{
word:"LUNA",
clue:"your favorite gf"
},
{
word:"LIGHTMODE",
clue:"the sickest most controversial thing you like"
},
{
word:"MOON",
clue:"a word from my favorite way to say i love you"
}
];

let inputs=[];
let solved=false;
let feedbackTimer=null;
let cellMap=[];

function loadSavedTheme(){

const theme=localStorage.getItem("arcade_theme");

if(["pink","green","lavender","yellow"].includes(theme)){
document.body.setAttribute("data-theme",theme);
}else{
document.body.removeAttribute("data-theme");
}

}

const AudioFX={

ctx:null,

init(){

if(!this.ctx){

const AudioContext=
window.AudioContext||
window.webkitAudioContext;

if(AudioContext){
this.ctx=new AudioContext();
}

}

},

play(type){

this.init();

if(!this.ctx)return;

if(this.ctx.state==="suspended"){
this.ctx.resume();
}

const now=this.ctx.currentTime;

if(type==="click"){

this.tone(520,.07,"sine",.08,now);

return;

}

if(type==="correct"){

this.tone(523.25,.1,"sine",.11,now);
this.tone(659.25,.14,"sine",.09,now+.07);

return;

}

if(type==="wrong"){

this.tone(220,.12,"triangle",.11,now);
this.tone(165,.16,"triangle",.08,now+.08);

return;

}

if(type==="win"){

this.tone(523.25,.12,"sine",.12,now);
this.tone(659.25,.12,"sine",.12,now+.1);
this.tone(783.99,.2,"sine",.14,now+.2);

}

},

tone(freq,duration,type,volume,start){

const osc=this.ctx.createOscillator();
const gain=this.ctx.createGain();

osc.type=type;
osc.frequency.setValueAtTime(freq,start);

gain.gain.setValueAtTime(volume,start);

gain.gain.exponentialRampToValueAtTime(
.001,
start+duration
);

osc.connect(gain);
gain.connect(this.ctx.destination);

osc.start(start);
osc.stop(start+duration);

}

};

function goBack(){

if(window.history.length>1){
window.history.back();
}else{
window.location.href="../index.html";
}

}

function findWord(word){

const rows=rawGrid.length;
const cols=rawGrid[0].length;

word=word.toUpperCase();

for(let r=0;r<rows;r++){

for(let c=0;c<cols;c++){

let fits=true;

for(let i=0;i<word.length;i++){

if(
c+i>=cols||
rawGrid[r][c+i].toUpperCase()!==word[i]
){

fits=false;
break;

}

}

if(fits){

return{
row:r,
col:c,
direction:"across"
};

}

}

}

for(let r=0;r<rows;r++){

for(let c=0;c<cols;c++){

let fits=true;

for(let i=0;i<word.length;i++){

if(
r+i>=rows||
rawGrid[r+i][c].toUpperCase()!==word[i]
){

fits=false;
break;

}

}

if(fits){

return{
row:r,
col:c,
direction:"down"
};

}

}

}

return null;

}

function getNumberMap(){

const rows=rawGrid.length;
const cols=rawGrid[0].length;

const numbers={};
let number=1;

for(let r=0;r<rows;r++){

for(let c=0;c<cols;c++){

if(rawGrid[r][c]===".")continue;

const startsAcross=
(c===0||rawGrid[r][c-1]===".")&&
c+1<cols;

const startsDown=
(r===0||rawGrid[r-1][c]===".")&&
r+1<rows;

if(startsAcross||startsDown){

numbers[`${r},${c}`]=number++;

}

}

}

return numbers;

}

function buildClues(){

const across=document.getElementById("across-clues");
const down=document.getElementById("down-clues");

across.innerHTML="";
down.innerHTML="";

const numberMap=getNumberMap();

clues.forEach(item=>{

const position=findWord(item.word);

if(!position)return;

const number=
numberMap[
`${position.row},${position.col}`
];

const li=document.createElement("li");

li.textContent=item.clue;
li.value=number;

if(position.direction==="across"){
across.appendChild(li);
}else{
down.appendChild(li);
}

});

}function buildCrossword(){

const crossword=document.getElementById("crossword");

crossword.innerHTML="";
inputs=[];
cellMap=[];

const rows=rawGrid.length;
const cols=rawGrid[0].length;

crossword.style.gridTemplateColumns=
`repeat(${cols},1fr)`;

crossword.style.gridTemplateRows=
`repeat(${rows},1fr)`;

const numberMap=getNumberMap();

for(let r=0;r<rows;r++){

for(let c=0;c<cols;c++){

const char=
rawGrid[r][c].toUpperCase();

const cell=document.createElement("div");

cellMap.push(cell);

if(char==="."){

cell.className="blocked";

}else{

cell.className="cell";

const number=
numberMap[`${r},${c}`];

if(number){

const numSpan=
document.createElement("span");

numSpan.className="number";
numSpan.textContent=number;

cell.appendChild(numSpan);

}

const input=
document.createElement("input");

input.type="text";
input.maxLength=1;
input.autocomplete="off";
input.autocapitalize="characters";

input.dataset.answer=char;

input.addEventListener("input",()=>{

input.value=
input.value
.replace(/[^a-zA-Z]/g,"")
.toUpperCase();

AudioFX.play("click");

});

input.addEventListener("keydown",(event)=>{

if(event.key==="ArrowRight"){

event.preventDefault();

moveInput(input,1);

}

if(event.key==="ArrowLeft"){

event.preventDefault();

moveInput(input,-1);

}

if(event.key==="ArrowDown"){

event.preventDefault();

moveInput(input,cols);

}

if(event.key==="ArrowUp"){

event.preventDefault();

moveInput(input,-cols);

}

});

inputs.push(input);

cell.appendChild(input);

}

crossword.appendChild(cell);

}

}

buildClues();

}

function moveInput(current,direction){

const index=inputs.indexOf(current);

if(index===-1)return;

let next=index+direction;

if(next<0){
next=inputs.length-1;
}

if(next>=inputs.length){
next=0;
}

inputs[next].focus();

}

function checkCrossword(){

if(solved)return;

let complete=true;
let incorrect=false;

inputs.forEach(input=>{

const value=input.value.toUpperCase();

input.parentElement.classList.remove(
"correct",
"wrong"
);

if(value===""){

complete=false;
incorrect=true;

}else if(value===input.dataset.answer){

input.parentElement.classList.add("correct");

}else{

input.parentElement.classList.add("wrong");

incorrect=true;

}

});

if(feedbackTimer){
clearTimeout(feedbackTimer);
}

feedbackTimer=setTimeout(()=>{

document
.querySelectorAll(".cell")
.forEach(cell=>{

cell.classList.remove(
"correct",
"wrong"
);

});

feedbackTimer=null;

},4000);

if(complete&&!incorrect){

solved=true;

AudioFX.play("win");

if(typeof addCoins==="function"){
addCoins(50);
}

document
.getElementById("win-modal")
.classList.add("show");

return;

}

if(incorrect){

AudioFX.play("wrong");

}else{

AudioFX.play("correct");

}

}

function newGame(){

AudioFX.play("click");

solved=false;

if(feedbackTimer){
clearTimeout(feedbackTimer);
feedbackTimer=null;
}

document
.getElementById("win-modal")
.classList.remove("show");

buildCrossword();

}

document.addEventListener("DOMContentLoaded",()=>{

loadSavedTheme();

buildCrossword();

if(typeof updateCoinDisplays==="function"){
updateCoinDisplays();
}

});

window.addEventListener("pageshow",()=>{

loadSavedTheme();

if(typeof updateCoinDisplays==="function"){
updateCoinDisplays();
}

});

</script>

</body>
