<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #faf7f5;
            color: #4a3e3d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: #ffffff;
            border-bottom: 1px solid #eee8e5;
            position: relative;
            z-index: 100;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-link { color: #7d6b6d; text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; }
        .nav-link:hover { color: #4a3e3d; }
        .coin-display { background: #f4ece9; border: 1px solid #e2d7d3; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #635052; }

        main {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 { color: #4a3e3d; font-weight: 500; font-size: 24px; margin: 0 0 4px; }
        p.subtitle { color: #8c7b7d; margin: 0 0 20px; font-size: 14px; text-align: center; }

        .game-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 360px;
            margin-bottom: 16px;
            background: #ffffff;
            border: 1px solid #e2d7d3;
            border-radius: 8px;
            padding: 10px 16px;
        }

        .status-box {
            font-size: 14px;
            font-weight: 600;
            color: #635052;
        }

        .flag-toggle-btn {
            padding: 6px 12px;
            border: 1px solid #d1c4c0;
            border-radius: 6px;
            background: #ffffff;
            color: #4a3e3d;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .flag-toggle-btn.active {
            background: #e0f2fe;
            border-color: #0284c7;
            color: #0369a1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 4px;
            width: 100%;
            max-width: 360px;
            background: #e2d7d3;
            padding: 4px;
            border-radius: 8px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            background: #ffffff;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .cell:hover:not(.revealed) { background: #f5eeeb; }

        .cell.revealed {
            background: #eae2df;
            cursor: default;
        }

        .cell.mine { background: #fecdd3; }

        .c-1 { color: #2563eb; }
        .c-2 { color: #16a34a; }
        .c-3 { color: #dc2626; }
        .c-4 { color: #7c3aed; }
        .c-5 { color: #991b1b; }
        .c-6 { color: #0891b2; }
        .c-7 { color: #1f2937; }
        .c-8 { color: #4b5563; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 24px;
            max-width: 320px;
            width: 90%;
            text-align: center;
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid #d1c4c0;
            border-radius: 6px;
            background: #ffffff;
            color: #4a3e3d;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background: #faf7f5; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a onclick="goBack()" class="nav-link">← Back to Games</a>
        </div>
        <div class="header-right">
            <div class="coin-display"><span class="coin-count">0</span> Coins</div>
        </div>
    </header>

    <main>
        <h1>Minesweeper</h1>
        <p class="subtitle">Clear the grid without setting off any mines!</p>

        <div class="game-status">
            <div class="status-box">🚩 <span id="flag-count">10</span></div>
            <button class="flag-toggle-btn" id="flag-btn" onclick="toggleFlagMode()">
                Mode: <span>Dig ⛏️</span>
            </button>
        </div>

        <div class="grid" id="grid"></div>
    </main>

    <div id="game-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modal-title" style="font-size: 20px; margin: 0 0 10px;">Game Over</h2>
            <p id="modal-msg" style="color: #8c7b7d; font-size: 14px; margin: 0 0 20px;">You hit a mine!</p>
            <button class="btn" onclick="closeModalAndReset()" style="width: 100%;">Play Again</button>
        </div>
    </div>

    <script src="../script.js"></script>
    <script>
        const ROWS = 9;
        const COLS = 9;
        const MINES = 10;

        let board = [];
        let flagMode = false;
        let flagsLeft = MINES;
        let gameOver = false;
        let revealedCount = 0;

        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            },
            play(type) {
                this.init();
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (type === 'reveal') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
                    osc.start(now);
                    osc.stop(now + 0.03);
                } else if (type === 'flag') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'explode') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                }
            }
        };

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '../index.html';
            }
        }

        function toggleFlagMode() {
            flagMode = !flagMode;
            const btn = document.getElementById('flag-btn');
            btn.classList.toggle('active', flagMode);
            btn.querySelector('span').innerText = flagMode ? 'Flag 🚩' : 'Dig ⛏️';
        }

        function initGame() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            board = [];
            gameOver = false;
            revealedCount = 0;
            flagsLeft = MINES;
            document.getElementById('flag-count').innerText = flagsLeft;

            // Create blank board array
            for (let r = 0; r < ROWS; r++) {
                board[r] = [];
                for (let c = 0; c < COLS; c++) {
                    board[r][c] = {
                        row: r,
                        col: c,
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        neighborMines: 0,
                        element: null
                    };
                }
            }

            // Place mines randomly
            let minesPlaced = 0;
            while (minesPlaced < MINES) {
                let r = Math.floor(Math.random() * ROWS);
                let c = Math.floor(Math.random() * COLS);
                if (!board[r][c].isMine) {
                    board[r][c].isMine = true;
                    minesPlaced++;
                }
            }

            // Calculate neighbor mine counts
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c].isMine) continue;
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            let nr = r + dr;
                            let nc = c + dc;
                            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].isMine) {
                                count++;
                            }
                        }
                    }
                    board[r][c].neighborMines = count;
                }
            }

            // Build grid DOM
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cellEl = document.createElement('div');
                    cellEl.className = 'cell';
                    board[r][c].element = cellEl;

                    cellEl.addEventListener('click', () => handleCellClick(r, c));
                    cellEl.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleFlag(r, c);
                    });

                    gridEl.appendChild(cellEl);
                }
            }
        }

        function handleCellClick(r, c) {
            if (gameOver) return;
            const cell = board[r][c];

            if (flagMode) {
                handleFlag(r, c);
                return;
            }

            if (cell.isFlagged || cell.isRevealed) return;

            if (cell.isMine) {
                endGame(false);
                return;
            }

            revealCell(r, c);

            if (revealedCount === (ROWS * COLS) - MINES) {
                endGame(true);
            }
        }

        function handleFlag(r, c) {
            if (gameOver) return;
            const cell = board[r][c];
            if (cell.isRevealed) return;

            if (cell.isFlagged) {
                cell.isFlagged = false;
                cell.element.innerText = '';
                flagsLeft++;
                AudioFX.play('flag');
            } else if (flagsLeft > 0) {
                cell.isFlagged = true;
                cell.element.innerText = '🚩';
                flagsLeft--;
                AudioFX.play('flag');
            }
            document.getElementById('flag-count').innerText = flagsLeft;
        }

        function revealCell(r, c) {
            const cell = board[r][c];
            if (cell.isRevealed || cell.isFlagged) return;

            cell.isRevealed = true;
            cell.element.classList.add('revealed');
            revealedCount++;
            AudioFX.play('reveal');

            if (cell.neighborMines > 0) {
                cell.element.innerText = cell.neighborMines;
                cell.element.classList.add(`c-${cell.neighborMines}`);
            } else {
                // Flood fill for empty spaces
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr;
                        let nc = c + dc;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                            revealCell(nr, nc);
                        }
                    }
                }
            }
        }

        function endGame(won) {
            gameOver = true;

            // Reveal all mines
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = board[r][c];
                    if (cell.isMine) {
                        cell.element.classList.add('revealed', 'mine');
                        cell.element.innerText = '💣';
                    }
                }
            }

            const modal = document.getElementById('game-modal');
            const title = document.getElementById('modal-title');
            const msg = document.getElementById('modal-msg');

            if (won) {
                AudioFX.play('win');
                title.innerText = 'Victory!';
                msg.innerText = 'You cleared the minefield and earned 30 Coins!';
                if (typeof addCoins === 'function') addCoins(30);
            } else {
                AudioFX.play('explode');
                title.innerText = 'Boom!';
                msg.innerText = 'You stepped on a mine. Try again!';
            }

            setTimeout(() => {
                modal.style.display = 'flex';
            }, 600);
        }

        function closeModalAndReset() {
            document.getElementById('game-modal').style.display = 'none';
            initGame();
        }

        initGame();
    </script>
</body>
</html>
