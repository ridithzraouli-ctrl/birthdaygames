<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Minesweeper</title>

<style>
:root {
    --bg-base:#f2f7fa;
    --bg-grad-1:#dce8f3;
    --bg-grad-2:#d3e2ea;
    --text-main:#3f5260;
    --text-heading:#46637a;
    --accent-border:#82a8bd;
    --accent-soft:#e9f3f9;
    --accent-badge:#dfe8f8;
    --ornament-color:#799eb8;
    --card-bg:rgba(255,255,255,.88);
    --header-bg:rgba(255,255,255,.88);

    --pixel-light:#ffffff;
    --pixel-mid:#c0c0c0;
    --pixel-dark:#808080;
    --pixel-deep:#3f5260;
    --game-accent:#46637a;
    --game-soft:#dce8f3;
}

body[data-theme="pink"] {
    --bg-base:#faf2f5;
    --bg-grad-1:#f3dce5;
    --bg-grad-2:#ead3dc;
    --text-main:#603f4c;
    --text-heading:#7a4659;
    --accent-border:#bd8297;
    --accent-soft:#f9e9f0;
    --accent-badge:#f8dfe8;
    --ornament-color:#b87992;
    --card-bg:rgba(255,255,255,.88);
    --header-bg:rgba(255,255,255,.88);
    --game-accent:#7a4659;
    --game-soft:#f3dce5;
}

body[data-theme="green"] {
    --bg-base:#f3f7f2;
    --bg-grad-1:#dce8dc;
    --bg-grad-2:#d3ead3;
    --text-main:#3f6043;
    --text-heading:#467a4c;
    --accent-border:#82bd8b;
    --accent-soft:#e9f9eb;
    --accent-badge:#dff8e2;
    --ornament-color:#79b882;
    --card-bg:rgba(255,255,255,.88);
    --header-bg:rgba(255,255,255,.88);
    --game-accent:#467a4c;
    --game-soft:#dce8dc;
}

body[data-theme="lavender"] {
    --bg-base:#f5f2fa;
    --bg-grad-1:#e3dcf3;
    --bg-grad-2:#dad3ea;
    --text-main:#4a3f60;
    --text-heading:#59467a;
    --accent-border:#9882bd;
    --accent-soft:#f0e9f9;
    --accent-badge:#e9dff8;
    --ornament-color:#9379b8;
    --card-bg:rgba(255,255,255,.88);
    --header-bg:rgba(255,255,255,.88);
    --game-accent:#59467a;
    --game-soft:#e3dcf3;
}

body[data-theme="yellow"] {
    --bg-base:#faf8f2;
    --bg-grad-1:#f3edd2;
    --bg-grad-2:#eae3c5;
    --text-main:#60573f;
    --text-heading:#7a6e46;
    --accent-border:#bdb182;
    --accent-soft:#f9f5e9;
    --accent-badge:#f8f3df;
    --ornament-color:#b8aa79;
    --card-bg:rgba(255,255,255,.88);
    --header-bg:rgba(255,255,255,.88);
    --game-accent:#7a6e46;
    --game-soft:#f3edd2;
}

* {
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html {
    width:100%;
    max-width:100%;
    overflow-x:hidden;
}

body {
    width:100%;
    min-height:100vh;
    margin:0;
    overflow-x:hidden;
    background:
        radial-gradient(circle at 10% 12%,var(--bg-grad-1) 0,transparent 28%),
        radial-gradient(circle at 90% 85%,var(--bg-grad-2) 0,transparent 30%),
        var(--bg-base);
    color:var(--text-main);
    font-family:Georgia,"Times New Roman",serif;
    user-select:none;
}

header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    min-height:70px;
    padding:15px 22px;
    background:var(--header-bg);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--bg-grad-2);
    position:sticky;
    top:0;
    z-index:100;
}

.nav-link {
    color:var(--text-heading);
    text-decoration:none;
    font-size:15px;
    cursor:pointer;
}

.coin-display {
    background:var(--accent-soft);
    border:1px solid var(--accent-border);
    padding:9px 15px;
    border-radius:100px;
    font-size:13px;
    font-weight:bold;
    color:var(--text-heading);
}

/* BACKGROUND DECORATION */

.decorations {
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:-1;
}

.decorations span {
    position:absolute;
    color:var(--ornament-color);
    opacity:.35;
    animation:float 5s ease-in-out infinite;
}

.decorations span:nth-child(1) {
    top:13%;
    left:7%;
    font-size:20px;
}

.decorations span:nth-child(2) {
    top:28%;
    right:8%;
    font-size:13px;
    animation-delay:1s;
}

.decorations span:nth-child(3) {
    top:55%;
    left:5%;
    font-size:14px;
    animation-delay:2s;
}

.decorations span:nth-child(4) {
    top:68%;
    right:6%;
    font-size:21px;
    animation-delay:1.5s;
}

.decorations span:nth-child(5) {
    bottom:12%;
    left:12%;
    font-size:12px;
    animation-delay:.5s;
}

.decorations span:nth-child(6) {
    bottom:20%;
    right:13%;
    font-size:16px;
    animation-delay:2.5s;
}

@keyframes float {
    0%,100% { transform:translateY(0) rotate(0); }
    50% { transform:translateY(-7px) rotate(7deg); }
}

main {
    width:100%;
    min-height:calc(100vh - 70px);
    padding:22px 12px 28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.ornament {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    height:22px;
    margin-bottom:10px;
    color:var(--ornament-color);
}

.ornament span {
    font-size:16px;
}

.ornament i {
    width:38px;
    height:1px;
    background:var(--ornament-color);
    opacity:.45;
}

/* GAME */

.game-window {
    background:var(--card-bg);
    border:1px solid var(--bg-grad-2);
    border-radius:14px;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:9px;
    width:max-content;
    max-width:96vw;
    box-shadow:0 8px 28px rgba(0,0,0,.055);
}

.status-bar {
    background:var(--game-soft);
    border:1px solid var(--accent-border);
    border-radius:7px;
    padding:6px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-shrink:0;
}

.counter {
    background:var(--game-accent);
    color:#fff;
    font-family:"Courier New",monospace;
    font-size:19px;
    font-weight:bold;
    padding:3px 5px;
    border:2px solid;
    border-color:rgba(255,255,255,.55) rgba(0,0,0,.15) rgba(0,0,0,.15) rgba(255,255,255,.55);
    min-width:48px;
    text-align:right;
    line-height:1;
    border-radius:2px;
}

.center-controls {
    display:flex;
    align-items:center;
    gap:6px;
}

.control-btn {
    width:34px;
    height:34px;
    background:var(--card-bg);
    border:1px solid var(--accent-border);
    border-radius:7px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
}

.control-btn:active,
.control-btn.active {
    background:var(--accent-soft);
    transform:translateY(1px);
}

.custom-select-btn {
    height:34px;
    padding:0 8px;
    background:var(--card-bg);
    border:1px solid var(--accent-border);
    border-radius:7px;
    color:var(--text-heading);
    font-family:Georgia,"Times New Roman",serif;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
}

.icon-svg {
    width:18px;
    height:18px;
    display:block;
    shape-rendering:crispEdges;
}

/* PIXEL MINESWEEPER BOARD */

.grid-frame {
    border:3px solid;
    border-color:#8fa6b5 #ffffff #ffffff #8fa6b5;
    background:#aab8c0;
    padding:3px;
    overflow:hidden;
}

.grid {
    display:grid;
    gap:0;
    background:#8999a2;
}

.cell {
    appearance:none;
    -webkit-appearance:none;
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    aspect-ratio:1;
    border:2px solid;
    border-color:#ffffff #7d8990 #7d8990 #ffffff;
    background:#b8c1c5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-family:"Courier New",monospace;
    cursor:pointer;
    user-select:none;
    border-radius:0;
    color:var(--game-accent);
    image-rendering:pixelated;
}

.cell:active {
    border-color:#7d8990 #ffffff #ffffff #7d8990;
    background:#aab4b8;
}

.cell.revealed {
    border:1px solid #899399;
    background:#c5cccf;
}

.cell.mine {
    background:var(--game-soft);
}

.cell.flagged {
    background:#b8c1c5;
}

.cell svg {
    width:70%;
    height:70%;
    max-width:18px;
    max-height:18px;
    shape-rendering:crispEdges;
    image-rendering:pixelated;
}

.c-1 { color:#365d91; }
.c-2 { color:#467a4c; }
.c-3 { color:#9a5262; }
.c-4 { color:#59467a; }
.c-5 { color:#79534a; }
.c-6 { color:#4b7f83; }
.c-7 { color:#394047; }
.c-8 { color:#69747b; }

.dashboard-bar {
    background:var(--game-soft);
    border:1px solid var(--accent-border);
    border-radius:7px;
    padding:6px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:4px;
    text-align:center;
}

.stat-item {
    display:flex;
    flex-direction:column;
    align-items:center;
    font-size:9px;
    font-weight:bold;
    color:var(--text-heading);
}

.stat-val {
    font-family:"Courier New",monospace;
    font-size:13px;
    color:var(--game-accent);
    margin-top:1px;
}

/* MODALS */

.diff-modal,
.modal-overlay {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(30,25,25,.25);
    backdrop-filter:blur(3px);
    z-index:200;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.diff-card,
.modal-card {
    background:var(--card-bg);
    border:1px solid var(--bg-grad-2);
    border-radius:14px;
    padding:16px;
    box-shadow:0 12px 35px rgba(0,0,0,.12);
}

.diff-card {
    width:210px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.diff-title {
    color:var(--text-heading);
    font-size:12px;
    font-weight:bold;
    text-align:center;
    border-bottom:1px solid var(--bg-grad-2);
    padding-bottom:7px;
}

.diff-option {
    background:var(--card-bg);
    border:1px solid var(--accent-border);
    border-radius:8px;
    padding:9px;
    color:var(--text-heading);
    font-family:Georgia,"Times New Roman",serif;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
    text-align:center;
}

.diff-option:active,
.diff-option.selected {
    background:var(--accent-soft);
}

.modal-card {
    max-width:300px;
    width:90%;
    text-align:center;
}

.modal-card h2 {
    color:var(--text-heading);
    font-size:21px;
    font-weight:normal;
    margin:0 0 10px;
}

.modal-card p {
    color:var(--text-main);
    font-size:14px;
    line-height:1.5;
    margin:0 0 20px;
}

.btn {
    padding:10px 20px;
    border:1px solid var(--accent-border);
    border-radius:100px;
    background:var(--card-bg);
    color:var(--text-heading);
    font-family:Georgia,"Times New Roman",serif;
    font-size:13px;
    cursor:pointer;
}

/* PIXEL ICONS */

.pixel-flag {
    width:16px;
    height:16px;
    display:block;
    image-rendering:pixelated;
    shape-rendering:crispEdges;
}

.pixel-mine {
    width:16px;
    height:16px;
    display:block;
    image-rendering:pixelated;
    shape-rendering:crispEdges;
}

@media (max-width:600px) {
    header {
        min-height:66px;
        padding:12px 11px;
    }

    .nav-link {
        font-size:13px;
    }

    .coin-display {
        padding:8px 10px;
        font-size:11px;
    }

    main {
        padding:16px 8px 22px;
    }

    .game-window {
        padding:8px;
        max-width:98vw;
    }
}

@media (max-width:430px) {
    header {
        padding:10px 7px;
    }

    .nav-link {
        font-size:12px;
    }

    .coin-display {
        padding:7px 8px;
        font-size:10px;
    }

    .game-window {
        padding:6px;
        gap:7px;
    }

    .status-bar {
        padding:5px;
    }

    .counter {
        font-size:17px;
        min-width:44px;
    }

    .control-btn,
    .custom-select-btn {
        height:31px;
    }
}
</style>
</head>

<body>

<div class="decorations">
    <span>✦</span>
    <span>✧</span>
    <span>♡</span>
    <span>✦</span>
    <span>✧</span>
    <span>♡</span>
</div>

<header>
    <a onclick="goBack()" class="nav-link">&lt;- Back to Games</a>

    <div class="coin-display">
        <span class="coin-count">0</span> Coins
    </div>
</header>

<main>

    <div class="ornament">
        <span>✦</span>
        <i></i>
        <span>♡</span>
        <i></i>
        <span>✦</span>
    </div>

    <div class="game-window">

        <div class="status-bar">

            <div class="counter" id="flag-count">010</div>

            <div class="center-controls">

                <button class="control-btn" id="face-btn" title="Reset Game">
                    <svg class="icon-svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
                        <rect x="2" y="2" width="12" height="12" fill="#f4d96b"/>
                        <rect x="3" y="1" width="10" height="1" fill="var(--game-accent)"/>
                        <rect x="3" y="14" width="10" height="1" fill="var(--game-accent)"/>
                        <rect x="1" y="3" width="1" height="10" fill="var(--game-accent)"/>
                        <rect x="14" y="3" width="1" height="10" fill="var(--game-accent)"/>
                        <rect x="5" y="6" width="2" height="2" fill="var(--game-accent)"/>
                        <rect x="9" y="6" width="2" height="2" fill="var(--game-accent)"/>
                        <rect x="5" y="10" width="6" height="1" fill="var(--game-accent)"/>
                    </svg>
                </button>

                <button
                    class="control-btn"
                    id="mode-btn"
                    onclick="toggleFlagMode()"
                    title="Toggle Dig/Flag Mode"
                >
                    <svg id="mode-icon" class="pixel-flag" viewBox="0 0 16 16">
                        <rect x="3" y="1" width="2" height="14" fill="var(--game-accent)"/>
                        <rect x="5" y="2" width="7" height="2" fill="var(--game-accent)"/>
                        <rect x="5" y="4" width="5" height="2" fill="var(--game-accent)"/>
                        <rect x="5" y="6" width="3" height="2" fill="var(--game-accent)"/>
                        <rect x="2" y="14" width="8" height="1" fill="var(--game-accent)"/>
                    </svg>
                </button>

                <button class="custom-select-btn" onclick="openDiffModal()">
                    <span id="diff-label">8x8</span> ▼
                </button>

            </div>

            <div class="counter" id="timer">000</div>

        </div>

        <div class="grid-frame">
            <div class="grid" id="grid"></div>
        </div>

        <div class="dashboard-bar">

            <div class="stat-item">
                <span>BEST</span>
                <span class="stat-val" id="best-time">--</span>
            </div>

            <div class="stat-item">
                <span>WINS</span>
                <span class="stat-val" id="win-count">0</span>
            </div>

            <div class="stat-item">
                <span>PROGRESS</span>
                <span class="stat-val" id="cleared-pct">0%</span>
            </div>

        </div>

    </div>

    <div class="ornament" style="margin-top:16px;margin-bottom:0;">
        <span>✧</span>
        <i></i>
        <span>♡</span>
        <i></i>
        <span>✧</span>
    </div>

</main>

<div id="diff-modal" class="diff-modal" onclick="closeDiffModal()">

    <div class="diff-card" onclick="event.stopPropagation()">

        <div class="diff-title">SELECT GRID SIZE</div>

        <div
            class="diff-option selected"
            id="opt-easy"
            onclick="selectDifficulty('easy')"
        >
            8 x 8 (10 Mines)
        </div>

        <div
            class="diff-option"
            id="opt-medium"
            onclick="selectDifficulty('medium')"
        >
            10 x 10 (18 Mines)
        </div>

        <div
            class="diff-option"
            id="opt-hard"
            onclick="selectDifficulty('hard')"
        >
            12 x 12 (28 Mines)
        </div>

    </div>

</div>

<div id="game-modal" class="modal-overlay">

    <div class="modal-card">

        <h2 id="modal-title">Game Over</h2>

        <p id="modal-msg">You hit a mine!</p>

        <button
            class="btn"
            onclick="closeModalAndReset()"
            style="width:100%;"
        >
            Play Again
        </button>

    </div>

</div>

<script src="../script.js"></script><script>

function loadSavedTheme() {

    const savedTheme = localStorage.getItem("arcade_theme");

    if (
        savedTheme === "pink" ||
        savedTheme === "green" ||
        savedTheme === "lavender" ||
        savedTheme === "yellow"
    ) {
        document.body.setAttribute("data-theme", savedTheme);
    } else {
        document.body.removeAttribute("data-theme");
    }
}

loadSavedTheme();


const PRESETS = {

    easy: {
        rows: 8,
        cols: 8,
        mines: 10,
        reward: 20,
        label: "8x8"
    },

    medium: {
        rows: 10,
        cols: 10,
        mines: 18,
        reward: 40,
        label: "10x10"
    },

    hard: {
        rows: 12,
        cols: 12,
        mines: 28,
        reward: 70,
        label: "12x12"
    }

};


let currentDiff = "easy";
let board = [];
let flagMode = false;
let flagsLeft = 10;
let gameOver = false;
let revealedCount = 0;
let firstClick = true;
let timerInterval = null;
let seconds = 0;

let wins =
    parseInt(localStorage.getItem("ms_wins")) || 0;


/* PIXEL FLAG */

function createFlagSVG() {

    return `
        <svg class="pixel-flag" viewBox="0 0 16 16">
            <rect x="3" y="1" width="2" height="14"
                fill="var(--game-accent)"/>
            <rect x="5" y="2" width="7" height="2"
                fill="var(--game-accent)"/>
            <rect x="5" y="4" width="5" height="2"
                fill="var(--game-accent)"/>
            <rect x="5" y="6" width="3" height="2"
                fill="var(--game-accent)"/>
            <rect x="2" y="14" width="8" height="1"
                fill="var(--game-accent)"/>
        </svg>
    `;

}


/* PIXEL DIG */

function createDigSVG() {

    return `
        <svg class="pixel-flag" viewBox="0 0 16 16">
            <rect x="9" y="2" width="3" height="2"
                fill="var(--game-accent)"/>
            <rect x="8" y="4" width="3" height="2"
                fill="var(--game-accent)"/>
            <rect x="7" y="6" width="3" height="2"
                fill="var(--game-accent)"/>
            <rect x="6" y="8" width="3" height="2"
                fill="var(--game-accent)"/>
            <rect x="3" y="10" width="5" height="3"
                fill="var(--game-accent)"/>
            <rect x="2" y="13" width="7" height="2"
                fill="var(--game-accent)"/>
            <rect x="9" y="9" width="2" height="2"
                fill="var(--game-accent)"/>
            <rect x="10" y="8" width="2" height="2"
                fill="var(--game-accent)"/>
            <rect x="11" y="7" width="2" height="2"
                fill="var(--game-accent)"/>
        </svg>
    `;

}


/* PIXEL MINE */

function createMineSVG() {

    return `
        <svg class="pixel-mine" viewBox="0 0 16 16">

            <rect x="6" y="1" width="4" height="2"
                fill="var(--game-accent)"/>

            <rect x="3" y="3" width="10" height="2"
                fill="var(--game-accent)"/>

            <rect x="2" y="5" width="12" height="6"
                fill="var(--game-accent)"/>

            <rect x="3" y="11" width="10" height="2"
                fill="var(--game-accent)"/>

            <rect x="6" y="13" width="4" height="2"
                fill="var(--game-accent)"/>

            <rect x="5" y="5" width="2" height="2"
                fill="#ffffff"/>

            <rect x="8" y="3" width="2" height="2"
                fill="#ffffff"/>

        </svg>
    `;

}


document
    .getElementById("face-btn")
    .addEventListener("click", function() {

        initGame();

    });


function goBack() {

    if (window.history.length > 1) {

        window.history.back();

    } else {

        window.location.href = "../index.html";

    }

}


function openDiffModal() {

    document
        .getElementById("diff-modal")
        .style.display = "flex";

}


function closeDiffModal() {

    document
        .getElementById("diff-modal")
        .style.display = "none";

}


function selectDifficulty(diff) {

    currentDiff = diff;

    document
        .getElementById("diff-label")
        .innerText = PRESETS[diff].label;

    document
        .querySelectorAll(".diff-option")
        .forEach(function(el) {

            el.classList.remove("selected");

        });

    document
        .getElementById(`opt-${diff}`)
        .classList.add("selected");

    closeDiffModal();

    initGame();

}


/* ONE BUTTON = DIG / FLAG */

function toggleFlagMode() {

    flagMode = !flagMode;

    const btn =
        document.getElementById("mode-btn");

    const icon =
        document.getElementById("mode-icon");

    btn.classList.toggle(
        "active",
        flagMode
    );

    icon.outerHTML =
        flagMode
            ? createFlagSVG()
            : createDigSVG();

    const newIcon =
        document.querySelector("#mode-btn svg");

    if (newIcon) {
        newIcon.id = "mode-icon";
    }

}


function startTimer() {

    clearInterval(timerInterval);

    seconds = 0;

    updateTimerDisplay();

    timerInterval =
        setInterval(function() {

            seconds =
                Math.min(
                    999,
                    seconds + 1
                );

            updateTimerDisplay();

        }, 1000);

}


function stopTimer() {

    clearInterval(timerInterval);

}


function updateTimerDisplay() {

    document
        .getElementById("timer")
        .innerText =
        String(seconds).padStart(3, "0");

}


function updateFlagDisplay() {

    document
        .getElementById("flag-count")
        .innerText =
        flagsLeft < 0
            ? flagsLeft
            : String(flagsLeft).padStart(3, "0");

}


function updateStatsDisplay() {

    const best =
        localStorage.getItem(
            `ms_best_${currentDiff}`
        );

    document
        .getElementById("best-time")
        .innerText =
        best ? `${best}s` : "--";

    document
        .getElementById("win-count")
        .innerText =
        wins;

    const config =
        PRESETS[currentDiff];

    const totalSafe =
        (config.rows * config.cols)
        - config.mines;

    const pct =
        Math.floor(
            (revealedCount / totalSafe) * 100
        );

    document
        .getElementById("cleared-pct")
        .innerText =
        `${pct}%`;

}


function initGame() {

    stopTimer();

    seconds = 0;

    updateTimerDisplay();

    const config =
        PRESETS[currentDiff];

    const gridEl =
        document.getElementById("grid");

    gridEl.innerHTML = "";

    gridEl.style.gridTemplateColumns =
        `repeat(${config.cols}, 1fr)`;

    gridEl.style.gridTemplateRows =
        `repeat(${config.rows}, 1fr)`;

    board = [];

    gameOver = false;

    firstClick = true;

    revealedCount = 0;

    flagsLeft = config.mines;

    updateFlagDisplay();

    updateStatsDisplay();


    for (
        let r = 0;
        r < config.rows;
        r++
    ) {

        board[r] = [];

        for (
            let c = 0;
            c < config.cols;
            c++
        ) {

            board[r][c] = {

                row:r,
                col:c,

                isMine:false,
                isRevealed:false,
                isFlagged:false,

                neighborMines:0,

                element:null

            };

        }

    }


    for (
        let r = 0;
        r < config.rows;
        r++
    ) {

        for (
            let c = 0;
            c < config.cols;
            c++
        ) {

            const cellEl =
                document.createElement("button");

            cellEl.className =
                "cell";

            board[r][c].element =
                cellEl;


            cellEl.addEventListener(
                "click",
                function() {

                    handleCellClick(r,c);

                }
            );


            cellEl.addEventListener(
                "contextmenu",
                function(e) {

                    e.preventDefault();

                    handleFlag(r,c);

                }
            );


            gridEl.appendChild(cellEl);

        }

    }


    adjustBoardDimensions();

}


function adjustBoardDimensions() {

    const config =
        PRESETS[currentDiff];

    const gridEl =
        document.getElementById("grid");


    /*
       The width stays constrained.
       Height is increased so the board
       fills the previously empty space.
    */

    const availWidth =
        Math.min(
            window.innerWidth * .91,
            500
        );

    const availHeight =
        Math.max(
            260,
            window.innerHeight - 215
        );


    const maxCellW =
        availWidth / config.cols;

    const maxCellH =
        availHeight / config.rows;


    const cellSize =
        Math.min(
            maxCellW,
            maxCellH,
            52
        );


    gridEl.style.width =
        `${cellSize * config.cols}px`;

    gridEl.style.height =
        `${cellSize * config.rows}px`;


    const fontSize =
        Math.max(
            12,
            Math.floor(cellSize * .52)
        );


    document
        .querySelectorAll(".cell")
        .forEach(function(cell) {

            cell.style.fontSize =
                `${fontSize}px`;

        });

}


function generateMines(
    startRow,
    startCol
) {

    const config =
        PRESETS[currentDiff];

    let minesPlaced = 0;


    while (
        minesPlaced <
        config.mines
    ) {

        const r =
            Math.floor(
                Math.random()
                * config.rows
            );

        const c =
            Math.floor(
                Math.random()
                * config.cols
            );


        const isSafeZone =
            Math.abs(
                r - startRow
            ) <= 1 &&
            Math.abs(
                c - startCol
            ) <= 1;


        if (
            !board[r][c].isMine &&
            !isSafeZone
        ) {

            board[r][c].isMine =
                true;

            minesPlaced++;

        }

    }


    for (
        let r = 0;
        r < config.rows;
        r++
    ) {

        for (
            let c = 0;
            c < config.cols;
            c++
        ) {

            if (
                board[r][c].isMine
            ) {
                continue;
            }


            let count = 0;


            for (
                let dr = -1;
                dr <= 1;
                dr++
            ) {

                for (
                    let dc = -1;
                    dc <= 1;
                    dc++
                ) {

                    const nr =
                        r + dr;

                    const nc =
                        c + dc;


                    if (
                        nr >= 0 &&
                        nr < config.rows &&
                        nc >= 0 &&
                        nc < config.cols &&
                        board[nr][nc].isMine
                    ) {

                        count++;

                    }

                }

            }


            board[r][c].neighborMines =
                count;

        }

    }

}


function handleCellClick(r,c) {

    if (gameOver) {
        return;
    }


    const cell =
        board[r][c];


    if (flagMode) {

        handleFlag(r,c);

        return;

    }


    if (
        cell.isFlagged ||
        cell.isRevealed
    ) {
        return;
    }


    if (firstClick) {

        firstClick = false;

        generateMines(r,c);

        startTimer();

    }


    if (cell.isMine) {

        endGame(false);

        return;

    }


    revealCell(r,c);


    const config =
        PRESETS[currentDiff];


    if (
        revealedCount ===
        (
            config.rows *
            config.cols
        ) - config.mines
    ) {

        endGame(true);

    }

}


function handleFlag(r,c) {

    if (gameOver) {
        return;
    }


    const cell =
        board[r][c];


    if (cell.isRevealed) {
        return;
    }


    if (cell.isFlagged) {

        cell.isFlagged = false;

        cell.element.innerHTML = "";

        cell.element.classList.remove(
            "flagged"
        );

        flagsLeft++;


    } else {

        cell.isFlagged = true;

        cell.element.innerHTML =
            createFlagSVG();

        cell.element.classList.add(
            "flagged"
        );

        flagsLeft--;

    }


    updateFlagDisplay();

}


function revealCell(r,c) {

    const config =
        PRESETS[currentDiff];

    const cell =
        board[r][c];


    if (
        cell.isRevealed ||
        cell.isFlagged
    ) {
        return;
    }


    cell.isRevealed = true;

    cell.element.classList.add(
        "revealed"
    );

    revealedCount++;


    updateStatsDisplay();


    if (
        cell.neighborMines > 0
    ) {

        cell.element.innerText =
            cell.neighborMines;

        cell.element.classList.add(
            `c-${cell.neighborMines}`
        );


    } else {


        for (
            let dr = -1;
            dr <= 1;
            dr++
        ) {

            for (
                let dc = -1;
                dc <= 1;
                dc++
            ) {

                const nr =
                    r + dr;

                const nc =
                    c + dc;


                if (
                    nr >= 0 &&
                    nr < config.rows &&
                    nc >= 0 &&
                    nc < config.cols
                ) {

                    revealCell(nr,nc);

                }

            }

        }

    }

}


function endGame(won) {

    gameOver = true;

    stopTimer();

    const config =
        PRESETS[currentDiff];


    for (
        let r = 0;
        r < config.rows;
        r++
    ) {

        for (
            let c = 0;
            c < config.cols;
            c++
        ) {

            const cell =
                board[r][c];


            if (cell.isMine) {

                cell.element.classList.add(
                    "revealed"
                );


                if (!cell.isFlagged) {

                    cell.element.classList.add(
                        "mine"
                    );

                    cell.element.innerHTML =
                        createMineSVG();

                }

            }

        }

    }


    const modal =
        document.getElementById(
            "game-modal"
        );

    const title =
        document.getElementById(
            "modal-title"
        );

    const msg =
        document.getElementById(
            "modal-msg"
        );


    if (won) {

        wins++;

        localStorage.setItem(
            "ms_wins",
            wins
        );


        const best =
            localStorage.getItem(
                `ms_best_${currentDiff}`
            );


        if (
            !best ||
            seconds < parseInt(best)
        ) {

            localStorage.setItem(
                `ms_best_${currentDiff}`,
                seconds
            );

        }


        title.innerText =
            "Victory!";


        msg.innerText =
            `Cleared in ${seconds}s! Earned ${config.reward} Coins!`;


        if (
            typeof addCoins ===
            "function"
        ) {

            addCoins(
                config.reward
            );

        }


    } else {

        title.innerText =
            "Boom!";


        msg.innerText =
            "You stepped on a mine. Try again!";

    }


    updateStatsDisplay();


    setTimeout(function() {

        modal.style.display =
            "flex";

    },400);

}


function closeModalAndReset() {

    document
        .getElementById("game-modal")
        .style.display = "none";

    initGame();

}


window.addEventListener(
    "resize",
    function() {

        adjustBoardDimensions();

    }
);


document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadSavedTheme();

        if (
            typeof updateCoinDisplays ===
            "function"
        ) {

            updateCoinDisplays();

        }

        initGame();

    }
);


initGame();

</script>
