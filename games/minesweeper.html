<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #faf7f5;
            color: #4a3e3d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: #ffffff;
            border-bottom: 1px solid #eee8e5;
            position: relative;
            z-index: 100;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-link { color: #7d6b6d; text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; }
        .nav-link:hover { color: #4a3e3d; }
        .coin-display { background: #f4ece9; border: 1px solid #e2d7d3; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #635052; }

        main {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 { color: #4a3e3d; font-weight: 500; font-size: 24px; margin: 0 0 4px; }
        p.subtitle { color: #8c7b7d; margin: 0 0 16px; font-size: 14px; text-align: center; }

        .difficulty-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .diff-btn {
            padding: 6px 12px;
            border: 2px solid #d1c4c0;
            border-radius: 0px;
            background: #ffffff;
            color: #4a3e3d;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 2px 2px 0px #d1c4c0;
        }

        .diff-btn.active {
            background: #635052;
            color: #ffffff;
            border-color: #4a3e3d;
            box-shadow: 2px 2px 0px #342a2b;
        }

        .game-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 16px;
            background: #ffffff;
            border: 2px solid #e2d7d3;
            padding: 8px 12px;
            box-shadow: 3px 3px 0px #e2d7d3;
        }

        .status-box {
            font-size: 13px;
            font-weight: 700;
            color: #635052;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .flag-toggle-btn {
            padding: 6px 12px;
            border: 2px solid #d1c4c0;
            border-radius: 0px;
            background: #ffffff;
            color: #4a3e3d;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 2px 2px 0px #d1c4c0;
            text-transform: uppercase;
        }

        .flag-toggle-btn.active {
            background: #fecdd3;
            border-color: #e11d48;
            color: #9f1239;
            box-shadow: 2px 2px 0px #be123c;
        }

        .grid-container {
            background: #e2d7d3;
            padding: 6px;
            border: 3px solid #c2b5b3;
            box-shadow: 4px 4px 0px #a39593;
            max-width: 100%;
            overflow-x: auto;
        }

        .grid {
            display: grid;
            gap: 2px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            background: #ffffff;
            border: 2px solid;
            border-color: #ffffff #c2b5b3 #c2b5b3 #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-family: monospace, monospace;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
        }

        .cell:active:not(.revealed) {
            border-color: #c2b5b3 #ffffff #ffffff #c2b5b3;
            background: #f5eeeb;
        }

        .cell.revealed {
            background: #eae2df;
            border: 1px solid #d1c4c0;
            cursor: default;
        }

        .cell.mine { background: #fecdd3; }

        .icon-svg {
            width: 60%;
            height: 60%;
            display: block;
        }

        .c-1 { color: #2563eb; }
        .c-2 { color: #16a34a; }
        .c-3 { color: #dc2626; }
        .c-4 { color: #7c3aed; }
        .c-5 { color: #991b1b; }
        .c-6 { color: #0891b2; }
        .c-7 { color: #1f2937; }
        .c-8 { color: #4b5563; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: #ffffff;
            border: 3px solid #4a3e3d;
            border-radius: 0px;
            padding: 24px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            box-shadow: 6px 6px 0px #4a3e3d;
        }

        .btn {
            padding: 10px 20px;
            border: 2px solid #4a3e3d;
            border-radius: 0px;
            background: #ffffff;
            color: #4a3e3d;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 3px 3px 0px #4a3e3d;
            text-transform: uppercase;
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #4a3e3d;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a onclick="goBack()" class="nav-link">← Back to Games</a>
        </div>
        <div class="header-right">
            <div class="coin-display"><span class="coin-count">0</span> Coins</div>
        </div>
    </header>

    <main>
        <h1>Minesweeper</h1>
        <p class="subtitle">Clear the grid without setting off any hidden mines!</p>

        <div class="difficulty-selector">
            <button class="diff-btn active" onclick="setDifficulty('easy')">Easy (8x8)</button>
            <button class="diff-btn" onclick="setDifficulty('medium')">Medium (10x10)</button>
            <button class="diff-btn" onclick="setDifficulty('hard')">Hard (12x12)</button>
        </div>

        <div class="game-status">
            <div class="status-box">
                <svg class="icon-svg" style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="#e11d48" stroke-width="2.5"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
                <span id="flag-count">10</span>
            </div>
            <button class="flag-toggle-btn" id="flag-btn" onclick="toggleFlagMode()">
                Mode: <span id="flag-btn-text">Dig</span>
            </button>
        </div>

        <div class="grid-container">
            <div class="grid" id="grid"></div>
        </div>
    </main>

    <div id="game-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modal-title" style="font-size: 20px; margin: 0 0 10px;">Game Over</h2>
            <p id="modal-msg" style="color: #8c7b7d; font-size: 14px; margin: 0 0 20px;">You hit a mine!</p>
            <button class="btn" onclick="closeModalAndReset()" style="width: 100%;">Play Again</button>
        </div>
    </div>

    <script src="../script.js"></script>
    <script>
        const PRESETS = {
            easy: { rows: 8, cols: 8, mines: 10, reward: 20, size: '320px', fontSize: '16px' },
            medium: { rows: 10, cols: 10, mines: 18, reward: 40, size: '360px', fontSize: '15px' },
            hard: { rows: 12, cols: 12, mines: 28, reward: 70, size: '400px', fontSize: '14px' }
        };

        const FLAG_SVG = `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="#e11d48" stroke-width="2.5"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>`;
        const MINE_SVG = `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="#4a3e3d" stroke-width="2"><circle cx="12" cy="12" r="6" fill="#4a3e3d"/><line x1="12" y1="2" x2="12" y2="22"/><line x1="5" y1="5" x2="19" y2="19"/><line x1="5" y1="19" x2="19" y2="5"/></svg>`;

        let currentDiff = 'easy';
        let board = [];
        let flagMode = false;
        let flagsLeft = 10;
        let gameOver = false;
        let revealedCount = 0;
        let firstClick = true;

        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            },
            play(type) {
                this.init();
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (type === 'reveal') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
                    osc.start(now);
                    osc.stop(now + 0.03);
                } else if (type === 'flag') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'explode') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                }
            }
        };

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '../index.html';
            }
        }

        function setDifficulty(diff) {
            currentDiff = diff;
            document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            initGame();
        }

        function toggleFlagMode() {
            flagMode = !flagMode;
            const btn = document.getElementById('flag-btn');
            btn.classList.toggle('active', flagMode);
            document.getElementById('flag-btn-text').innerText = flagMode ? 'Flag' : 'Dig';
        }

        function initGame() {
            const config = PRESETS[currentDiff];
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            gridEl.style.gridTemplateColumns = `repeat(${config.cols}, 1fr)`;
            gridEl.style.width = config.size;

            board = [];
            gameOver = false;
            firstClick = true;
            revealedCount = 0;
            flagsLeft = config.mines;
            document.getElementById('flag-count').innerText = flagsLeft;

            for (let r = 0; r < config.rows; r++) {
                board[r] = [];
                for (let c = 0; c < config.cols; c++) {
                    board[r][c] = {
                        row: r, col: c,
                        isMine: false, isRevealed: false, isFlagged: false,
                        neighborMines: 0, element: null
                    };
                }
            }

            for (let r = 0; r < config.rows; r++) {
                for (let c = 0; c < config.cols; c++) {
                    const cellEl = document.createElement('div');
                    cellEl.className = 'cell';
                    cellEl.style.fontSize = config.fontSize;
                    board[r][c].element = cellEl;

                    cellEl.addEventListener('click', () => handleCellClick(r, c));
                    cellEl.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleFlag(r, c);
                    });

                    gridEl.appendChild(cellEl);
                }
            }
        }

        function generateMines(startRow, startCol) {
            const config = PRESETS[currentDiff];
            let minesPlaced = 0;

            while (minesPlaced < config.mines) {
                let r = Math.floor(Math.random() * config.rows);
                let c = Math.floor(Math.random() * config.cols);

                // Keep starting tile and immediate neighbors clear of mines
                const isSafeZone = Math.abs(r - startRow) <= 1 && Math.abs(c - startCol) <= 1;

                if (!board[r][c].isMine && !isSafeZone) {
                    board[r][c].isMine = true;
                    minesPlaced++;
                }
            }

            for (let r = 0; r < config.rows; r++) {
                for (let c = 0; c < config.cols; c++) {
                    if (board[r][c].isMine) continue;
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            let nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < config.rows && nc >= 0 && nc < config.cols && board[nr][nc].isMine) {
                                count++;
                            }
                        }
                    }
                    board[r][c].neighborMines = count;
                }
            }
        }

        function handleCellClick(r, c) {
            if (gameOver) return;
            const cell = board[r][c];

            if (flagMode) {
                handleFlag(r, c);
                return;
            }

            if (cell.isFlagged || cell.isRevealed) return;

            if (firstClick) {
                firstClick = false;
                generateMines(r, c);
            }

            if (cell.isMine) {
                endGame(false);
                return;
            }

            revealCell(r, c);

            const config = PRESETS[currentDiff];
            if (revealedCount === (config.rows * config.cols) - config.mines) {
                endGame(true);
            }
        }

        function handleFlag(r, c) {
            if (gameOver) return;
            const cell = board[r][c];
            if (cell.isRevealed) return;

            if (cell.isFlagged) {
                cell.isFlagged = false;
                cell.element.innerHTML = '';
                flagsLeft++;
                AudioFX.play('flag');
            } else if (flagsLeft > 0) {
                cell.isFlagged = true;
                cell.element.innerHTML = FLAG_SVG;
                flagsLeft--;
                AudioFX.play('flag');
            }
            document.getElementById('flag-count').innerText = flagsLeft;
        }

        function revealCell(r, c) {
            const config = PRESETS[currentDiff];
            const cell = board[r][c];
            if (cell.isRevealed || cell.isFlagged) return;

            cell.isRevealed = true;
            cell.element.classList.add('revealed');
            revealedCount++;
            AudioFX.play('reveal');

            if (cell.neighborMines > 0) {
                cell.element.innerText = cell.neighborMines;
                cell.element.classList.add(`c-${cell.neighborMines}`);
            } else {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < config.rows && nc >= 0 && nc < config.cols) {
                            revealCell(nr, nc);
                        }
                    }
                }
            }
        }

        function endGame(won) {
            gameOver = true;
            const config = PRESETS[currentDiff];

            for (let r = 0; r < config.rows; r++) {
                for (let c = 0; c < config.cols; c++) {
                    const cell = board[r][c];
                    if (cell.isMine) {
                        cell.element.classList.add('revealed', 'mine');
                        cell.element.innerHTML = MINE_SVG;
                    }
                }
            }

            const modal = document.getElementById('game-modal');
            const title = document.getElementById('modal-title');
            const msg = document.getElementById('modal-msg');

            if (won) {
                AudioFX.play('win');
                title.innerText = 'Victory!';
                msg.innerText = `You cleared the board and earned ${config.reward} Coins!`;
                if (typeof addCoins === 'function') addCoins(config.reward);
            } else {
                AudioFX.play('explode');
                title.innerText = 'Boom!';
                msg.innerText = 'You stepped on a mine. Try again!';
            }

            setTimeout(() => { modal.style.display = 'flex'; }, 600);
        }

        function closeModalAndReset() {
            document.getElementById('game-modal').style.display = 'none';
            initGame();
        }

        initGame();
    </script>
</body>
    </html>
