<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minesweeper</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: #faf7f5;
            color: #4a3e3d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: #ffffff;
            border-bottom: 1px solid #eee8e5;
            flex-shrink: 0;
        }

        .nav-link { color: #7d6b6d; text-decoration: none; font-size: 13px; font-weight: 500; cursor: pointer; }
        .nav-link:hover { color: #4a3e3d; }
        .coin-display { background: #f4ece9; border: 1px solid #e2d7d3; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; color: #635052; }

        main {
            flex: 1;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .game-window {
            background: #c0c0c0;
            border: 3px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 98vw;
            max-height: calc(100vh - 65px);
        }

        .status-bar {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .counter {
            background: #000000;
            color: #ff0000;
            font-family: "Courier New", Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            padding: 1px 5px;
            border: 1px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            min-width: 44px;
            text-align: right;
            line-height: 1;
        }

        .center-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-btn {
            width: 30px;
            height: 30px;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .control-btn:active, .control-btn.active {
            border-color: #808080 #ffffff #ffffff #808080;
            background: #b5b5b5;
        }

        .diff-select {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            font-size: 11px;
            font-weight: bold;
            height: 30px;
            padding: 0 2px;
            cursor: pointer;
            outline: none;
            color: #000000;
        }

        .grid-frame {
            border: 3px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            background: #808080;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid {
            display: grid;
            gap: 0;
            background: #808080;
        }

        .cell {
            width: 24px;
            height: 24px;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-family: Arial, sans-serif;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
            padding: 0;
        }

        .cell.revealed {
            border: 1px solid #7b7b7b;
            background: #c0c0c0;
        }

        .cell.mine { background: #ff0000; }

        .c-1 { color: #0000ff; }
        .c-2 { color: #008000; }
        .c-3 { color: #ff0000; }
        .c-4 { color: #000080; }
        .c-5 { color: #800000; }
        .c-6 { color: #008080; }
        .c-7 { color: #000000; }
        .c-8 { color: #808080; }

        .icon-svg {
            width: 16px;
            height: 16px;
            display: block;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: #c0c0c0;
            border: 3px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 16px;
            max-width: 280px;
            width: 90%;
            text-align: center;
        }

        .btn {
            padding: 6px 12px;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            background: #c0c0c0;
            color: #000000;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:active {
            border-color: #808080 #ffffff #ffffff #808080;
        }
    </style>
</head>
<body>

    <header>
        <a onclick="goBack()" class="nav-link">&lt;- Back to Games</a>
        <div class="coin-display"><span class="coin-count">0</span> Coins</div>
    </header>

    <main>
        <div class="game-window">
            <div class="status-bar">
                <div class="counter" id="flag-count">010</div>
                <div class="center-controls">
                    <button class="control-btn" id="face-btn" onclick="initGame()" title="Reset Game">
                        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2"><circle cx="12" cy="12" r="10" fill="#ffff00"/><circle cx="9" cy="9" r="1" fill="#000"/><circle cx="15" cy="9" r="1" fill="#000"/><path d="M8 15s1.5 2 4 2 4-2 4-2" stroke="#000"/></svg>
                    </button>
                    <button class="control-btn" id="mode-btn" onclick="toggleFlagMode()" title="Toggle Dig/Flag Mode">
                        <svg id="mode-icon" class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2"><path d="M6 3v18M6 3l12 4-12 4" fill="#ff0000" stroke="#000000"/></svg>
                    </button>
                    <select class="diff-select" id="diff-select" onchange="changeDifficulty(this.value)">
                        <option value="easy">8x8</option>
                        <option value="medium">10x10</option>
                        <option value="hard">12x12</option>
                    </select>
                </div>
                <div class="counter" id="timer">000</div>
            </div>

            <div class="grid-frame">
                <div class="grid" id="grid"></div>
            </div>
        </div>
    </main>

    <div id="game-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modal-title" style="font-size: 16px; margin: 0 0 8px; color: #000;">Game Over</h2>
            <p id="modal-msg" style="color: #4a3e3d; font-size: 12px; margin: 0 0 14px;">You hit a mine!</p>
            <button class="btn" onclick="closeModalAndReset()" style="width: 100%;">Play Again</button>
        </div>
    </div>

    <script src="../script.js"></script>
    <script>
        const PRESETS = {
            easy: { rows: 8, cols: 8, mines: 10, reward: 20 },
            medium: { rows: 10, cols: 10, mines: 18, reward: 40 },
            hard: { rows: 12, cols: 12, mines: 28, reward: 70 }
        };

        const FLAG_SVG = `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M6 3v18M6 3l12 4-12 4" fill="#ff0000" stroke="#000000" stroke-width="1.5"/></svg>`;
        const MINE_SVG = `<svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#000000"/><line x1="12" y1="3" x2="12" y2="21" stroke="#000" stroke-width="2"/><line x1="3" y1="12" x2="21" y2="12" stroke="#000" stroke-width="2"/><line x1="5.6" y1="5.6" x2="18.4" y2="18.4" stroke="#000" stroke-width="2"/><line x1="5.6" y1="18.4" x2="18.4" y2="5.6" stroke="#000" stroke-width="2"/><rect x="9" y="9" width="2" height="2" fill="#fff"/></svg>`;
        const DIG_SVG = `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><path d="M14 4l6 6-9 9-6 1 1-6 9-9z"/><line x1="5" y1="19" x2="11" y2="13"/></svg>`;

        let currentDiff = 'easy';
        let board = [];
        let flagMode = false;
        let flagsLeft = 10;
        let gameOver = false;
        let revealedCount = 0;
        let firstClick = true;
        let timerInterval = null;
        let seconds = 0;

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '../index.html';
            }
        }

        function changeDifficulty(diff) {
            currentDiff = diff;
            initGame();
        }

        function toggleFlagMode() {
            flagMode = !flagMode;
            const btn = document.getElementById('mode-btn');
            const icon = document.getElementById('mode-icon');
            btn.classList.toggle('active', flagMode);
            icon.outerHTML = flagMode ? FLAG_SVG : DIG_SVG;
            if (flagMode) document.querySelector('#mode-btn svg').id = 'mode-icon';
        }

        function startTimer() {
            clearInterval(timerInterval);
            seconds = 0;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                seconds = Math.min(999, seconds + 1);
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function updateTimerDisplay() {
            document.getElementById('timer').innerText = String(seconds).padStart(3, '0');
        }

        function updateFlagDisplay() {
            const formatted = String(flagsLeft).padStart(3, flagsLeft < 0 ? '0' : '0');
            document.getElementById('flag-count').innerText = flagsLeft < 0 ? flagsLeft : String(flagsLeft).padStart(3, '0');
        }

        function calculateCellSize(rows, cols) {
            const maxW = window.innerWidth * 0.92;
            const maxH = (window.innerHeight - 130) * 0.88;
            const sizeByW = Math.floor(maxW / cols);
            const sizeByH = Math.floor(maxH / rows);
            return Math.max(16, Math.min(28, Math.min(sizeByW, sizeByH)));
        }

        function initGame() {
            stopTimer();
            seconds = 0;
            updateTimerDisplay();

            const config = PRESETS[currentDiff];
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';

            const cellSize = calculateCellSize(config.rows, config.cols);

            gridEl.style.gridTemplateColumns = `repeat(${config.cols}, ${cellSize}px)`;
            gridEl.style.gridTemplateRows = `repeat(${config.rows}, ${cellSize}px)`;

            board = [];
            gameOver = false;
            firstClick = true;
            revealedCount = 0;
            flagsLeft = config.mines;
            updateFlagDisplay();

            for (let r = 0; r < config.rows; r++) {
                board[r] = [];
                for (let c = 0; c < config.cols; c++) {
                    board[r][c] = {
                        row: r, col: c,
                        isMine: false, isRevealed: false, isFlagged: false,
                        neighborMines: 0, element: null
                    };
                }
            }

            for (let r = 0; r < config.rows; r++) {
                for (let c = 0; c < config.cols; c++) {
                    const cellEl = document.createElement('button');
                    cellEl.className = 'cell';
                    cellEl.style.width = `${cellSize}px`;
                    cellEl.style.height = `${cellSize}px`;
                    cellEl.style.fontSize = `${Math.floor(cellSize * 0.55)}px`;
                    board[r][c].element = cellEl;

                    cellEl.addEventListener('click', () => handleCellClick(r, c));
                    cellEl.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleFlag(r, c);
                    });

                    gridEl.appendChild(cellEl);
                }
            }
        }

        function generateMines(startRow, startCol) {
            const config = PRESETS[currentDiff];
            let minesPlaced = 0;

            while (minesPlaced < config.mines) {
                let r = Math.floor(Math.random() * config.rows);
                let c = Math.floor(Math.random() * config.cols);

                const isSafeZone = Math.abs(r - startRow) <= 1 && Math.abs(c - startCol) <= 1;

                if (!board[r][c].isMine && !isSafeZone) {
                    board[r][c].isMine = true;
                    minesPlaced++;
                }
            }

            for (let r = 0; r < config.rows; r++) {
                for (let c = 0; c < config.cols; c++) {
                    if (board[r][c].isMine) continue;
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            let nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < config.rows && nc >= 0 && nc < config.cols && board[nr][nc].isMine) {
                                count++;
                            }
                        }
                    }
                    board[r][c].neighborMines = count;
                }
            }
        }

        function handleCellClick(r, c) {
            if (gameOver) return;
            const cell = board[r][c];

            if (flagMode) {
                handleFlag(r, c);
                return;
            }

            if (cell.isFlagged || cell.isRevealed) return;

            if (firstClick) {
                firstClick = false;
                generateMines(r, c);
                startTimer();
            }

            if (cell.isMine) {
                endGame(false);
                return;
            }

            revealCell(r, c);

            const config = PRESETS[currentDiff];
            if (revealedCount === (config.rows * config.cols) - config.mines) {
                endGame(true);
            }
        }

        function handleFlag(r, c) {
            if (gameOver) return;
            const cell = board[r][c];
            if (cell.isRevealed) return;

            if (cell.isFlagged) {
                cell.isFlagged = false;
                cell.element.innerHTML = '';
                flagsLeft++;
            } else {
                cell.isFlagged = true;
                cell.element.innerHTML = FLAG_SVG;
                flagsLeft--;
            }
            updateFlagDisplay();
        }

        function revealCell(r, c) {
            const config = PRESETS[currentDiff];
            const cell = board[r][c];
            if (cell.isRevealed || cell.isFlagged) return;

            cell.isRevealed = true;
            cell.element.classList.add('revealed');
            revealedCount++;

            if (cell.neighborMines > 0) {
                cell.element.innerText = cell.neighborMines;
                cell.element.classList.add(`c-${cell.neighborMines}`);
            } else {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < config.rows && nc >= 0 && nc < config.cols) {
                            revealCell(nr, nc);
                        }
                    }
                }
            }
        }

        function endGame(won) {
            gameOver = true;
            stopTimer();
            const config = PRESETS[currentDiff];

            for (let r = 0; r < config.rows; r++) {
                for (let c = 0; c < config.cols; c++) {
                    const cell = board[r][c];
                    if (cell.isMine) {
                        cell.element.classList.add('revealed');
                        if (!cell.isFlagged) {
                            cell.element.classList.add('mine');
                            cell.element.innerHTML = MINE_SVG;
                        }
                    }
                }
            }

            const modal = document.getElementById('game-modal');
            const title = document.getElementById('modal-title');
            const msg = document.getElementById('modal-msg');

            if (won) {
                title.innerText = 'Victory!';
                msg.innerText = `Cleared in ${seconds}s! Earned ${config.reward} Coins!`;
                if (typeof addCoins === 'function') addCoins(config.reward);
            } else {
                title.innerText = 'Boom!';
                msg.innerText = 'You stepped on a mine. Try again!';
            }

            setTimeout(() => { modal.style.display = 'flex'; }, 400);
        }

        function closeModalAndReset() {
            document.getElementById('game-modal').style.display = 'none';
            initGame();
        }

        window.addEventListener('resize', () => {
            if (board.length > 0) {
                const config = PRESETS[currentDiff];
                const cellSize = calculateCellSize(config.rows, config.cols);
                const gridEl = document.getElementById('grid');
                gridEl.style.gridTemplateColumns = `repeat(${config.cols}, ${cellSize}px)`;
                gridEl.style.gridTemplateRows = `repeat(${config.rows}, ${cellSize}px)`;
                
                for (let r = 0; r < config.rows; r++) {
                    for (let c = 0; c < config.cols; c++) {
                        if (board[r][c] && board[r][c].element) {
                            board[r][c].element.style.width = `${cellSize}px`;
                            board[r][c].element.style.height = `${cellSize}px`;
                            board[r][c].element.style.fontSize = `${Math.floor(cellSize * 0.55)}px`;
                        }
                    }
                }
            }
        });

        initGame();
    </script>
</body>
</html>
