<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bunny Jump</title>

<style>
:root{
    --bg:#f2f7fa;
    --card:#ffffff;
    --text:#4c5961;
    --soft:#dcecf7;
    --accent:#8faebe;
    --dark:#6f8997;
    --pink:#e8b9c8;
    --brown:#8b6642;
    --bunny:#e5caa0;
    --cream:#fff5e4;
}

*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:Georgia,serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.game{
    width:min(920px,100%);
    text-align:center;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
}

.back{
    color:var(--text);
    text-decoration:none;
    font-size:16px;
}

.coins{
    background:white;
    border:2px solid var(--soft);
    border-radius:20px;
    padding:7px 14px;
}

h1{
    margin:0;
    font-size:38px;
    letter-spacing:2px;
}

.subtitle{
    margin:6px 0 18px;
    opacity:.7;
}

.gamebox{
    position:relative;
    background:var(--card);
    border:2px solid var(--soft);
    border-radius:24px;
    padding:18px;
    box-shadow:0 12px 35px rgba(80,100,110,.1);
}

.scorebar{
    display:flex;
    justify-content:center;
    gap:35px;
    margin-bottom:12px;
    font-size:18px;
}

.scorebar span{
    font-weight:bold;
}

canvas{
    width:100%;
    max-width:820px;
    height:auto;
    display:block;
    margin:auto;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    border-radius:14px;
    cursor:pointer;
}

.hint{
    margin:12px 0 0;
    opacity:.55;
    font-size:14px;
}

.start{
    position:absolute;
    inset:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(255,255,255,.16);
    pointer-events:none;
}

.startbox{
    background:rgba(255,255,255,.94);
    border:2px solid var(--soft);
    border-radius:20px;
    padding:20px 32px;
    box-shadow:0 8px 25px rgba(70,90,100,.12);
}

.startbox h2{
    margin:0 0 7px;
}

button{
    border:0;
    background:var(--accent);
    color:white;
    padding:10px 25px;
    border-radius:18px;
    font-family:Georgia,serif;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    transform:translateY(-1px);
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(55,65,70,.35);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:10;
}

.modal.show{
    display:flex;
}

.modalbox{
    background:white;
    border:2px solid var(--soft);
    border-radius:25px;
    padding:30px 40px;
    text-align:center;
    min-width:280px;
}

.modalbox h2{
    margin:0 0 8px;
}

.reward{
    margin:12px 0 20px;
    font-size:18px;
}

.symbols{
    color:var(--pink);
    letter-spacing:10px;
    margin-bottom:12px;
}
</style>
</head>

<body>

<div class="game">

    <div class="top">
        <a class="back" href="../index.html">← Back to Games</a>
        <div class="coins">♡ <span id="coinDisplay">0</span></div>
    </div>

    <h1>Bunny Jump</h1>
    <div class="subtitle">hop over the cactuses ✦</div>

    <div class="gamebox">

        <div class="scorebar">
            <div>SCORE <span id="score">00000</span></div>
            <div>BEST <span id="best">00000</span></div>
        </div>

        <canvas id="game" width="820" height="330"></canvas>

        <div class="hint">SPACE / ↑ / TAP to jump</div>

        <div class="start" id="startScreen">
            <div class="startbox">
                <div class="symbols">✦ ✧ ♡</div>
                <h2>Bunny Jump</h2>
                <p>ready when you are</p>
                <button id="startButton">Start</button>
            </div>
        </div>

    </div>
</div>

<div class="modal" id="gameOver">
    <div class="modalbox">
        <div class="symbols">✦ ♡ ✧</div>
        <h2>you fell!</h2>
        <div id="finalScore"></div>
        <div class="reward" id="rewardText"></div>
        <button id="againButton">Try Again</button>
    </div>
</div>

<script src="../script.js"></script>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;

const W=canvas.width;
const H=canvas.height;
const groundY=267;

let running=false;
let dead=false;
let score=0;
let best=Number(localStorage.getItem("bunny_jump_best")||0);
let last=0;
let spawnTimer=0;
let animationTime=0;
let bunnyFrame=0;
let cactuses=[];

const bunny={
    x:105,
    y:groundY-54,
    w:48,
    h:54,
    vy:0,
    grounded:true
};

document.getElementById("best").textContent=String(Math.floor(best)).padStart(5,"0");

function theme(){
    return localStorage.getItem("arcade_theme")||"blue";
}

function sky(){
    const t=theme();

    if(t==="pink")
        return ["#f2d5df","#fff3f7","#fff9fb","#e9b6c8","#dcb9c5"];
    if(t==="green")
        return ["#d8ead9","#f2f8f0","#fbfff9","#cbdba8","#bdd5bf"];
    if(t==="lavender")
        return ["#e1d9ef","#f7f3fb","#fffaff","#d2bde3","#cbc0df"];
    if(t==="yellow")
        return ["#eee5c5","#fcfaf0","#fffdf5","#e2c96d","#d8d0a9"];

    return ["#d9eaf4","#f3f8fb","#ffffff","#efd5a5","#c4dbe5"];
}

function drawSky(){
    const s=sky();

    const g=ctx.createLinearGradient(0,0,0,groundY);
    g.addColorStop(0,s[0]);
    g.addColorStop(1,s[1]);

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,groundY);

    /* pixel sun */
    ctx.fillStyle=s[3];
    ctx.fillRect(650,42,32,32);
    ctx.fillRect(642,50,48,16);
    ctx.fillRect(658,34,16,48);

    /* pixel clouds */
    drawCloud(105,65,1,s[2]);
    drawCloud(350,105,.8,s[2]);
    drawCloud(545,54,.65,s[2]);

    /* distant pixel hills */
    ctx.fillStyle=s[4];

    for(let x=-20;x<W;x+=110){
        ctx.fillRect(x,235,110,32);
        ctx.fillRect(x+18,226,74,9);
        ctx.fillRect(x+35,218,40,8);
    }
}

function drawCloud(x,y,scale,color){
    ctx.fillStyle=color;

    const p=8*scale;

    ctx.fillRect(x,y+p*2,p*7,p*2);
    ctx.fillRect(x+p,y+p,p*5,p*3);
    ctx.fillRect(x+p*3,y,p*3,p*4);
    ctx.fillRect(x+p*6,y+p*2,p*2,p*2);
}<script>
function drawGround(){
    const s=sky();

    ctx.fillStyle=s[1];
    ctx.fillRect(0,groundY,W,H-groundY);

    ctx.fillStyle=s[4];
    ctx.fillRect(0,groundY,W,5);

    /* clean pixel ground marks */
    ctx.fillStyle=s[4];

    for(let x=-40;x<W+40;x+=90){
        ctx.fillRect(x,groundY+22,28,4);
        ctx.fillRect(x+45,groundY+43,15,4);
    }
}

function pixelRect(x,y,w,h,color){
    ctx.fillStyle=color;
    ctx.fillRect(Math.round(x),Math.round(y),w,h);
}

/* CUTE RIGHT-FACING BUNNY */

function drawBunny(){
    const x=Math.round(bunny.x);
    const y=Math.round(bunny.y);

    const brown="#8b6642";
    const fur="#e5caa0";
    const cream="#fff5e4";
    const eye="#3b2211";

    let bob=0;

    if(!running){
        bob=Math.sin(animationTime*.004)*2;
    }else if(bunny.grounded){
        bob=Math.sin(animationTime*.018)*1.5;
    }

    const Y=Math.round(y+bob);

    /*
       4px pixel grid.
       The bunny faces RIGHT.
    */

    /* ears */
    pixelRect(x+12,Y+4,12,28,brown);
    pixelRect(x+32,Y,12,28,brown);

    pixelRect(x+16,Y+8,8,20,fur);
    pixelRect(x+36,Y+5,8,19,fur);

    /* body outline */
    pixelRect(x+8,Y+27,36,22,brown);
    pixelRect(x+12,Y+23,28,30,brown);

    /* body */
    pixelRect(x+12,Y+29,28,19,fur);
    pixelRect(x+16,Y+25,20,25,fur);

    /* head outline */
    pixelRect(x+27,Y+15,22,27,brown);
    pixelRect(x+23,Y+20,29,22,brown);

    /* head */
    pixelRect(x+28,Y+18,18,20,fur);
    pixelRect(x+24,Y+24,24,14,fur);

    /* chest */
    pixelRect(x+29,Y+34,10,14,cream);

    /* back foot */
    pixelRect(x+8,Y+44,14,9,brown);
    pixelRect(x+12,Y+43,12,7,cream);

    /* front foot */
    pixelRect(x+36,Y+45,13,8,brown);
    pixelRect(x+36,Y+43,9,7,cream);

    /* tail */
    pixelRect(x+4,Y+27,9,12,brown);
    pixelRect(x+2,Y+29,9,8,cream);

    /* eye */
    pixelRect(x+42,Y+24,4,5,eye);

    /* nose */
    pixelRect(x+47,Y+31,5,4,eye);

    /* tiny cheek */
    pixelRect(x+38,Y+32,4,3,"#d9a98d");

    /* RUNNING LEGS */
    if(running && bunny.grounded){
        const frame=Math.floor(animationTime/90)%2;

        if(frame===0){
            pixelRect(x+13,Y+46,8,10,brown);
            pixelRect(x+34,Y+46,8,6,brown);
            pixelRect(x+10,Y+52,11,4,cream);
        }else{
            pixelRect(x+18,Y+46,8,6,brown);
            pixelRect(x+39,Y+45,8,10,brown);
            pixelRect(x+39,Y+52,11,4,cream);
        }
    }

    /* JUMPING POSE */
    if(!bunny.grounded){
        pixelRect(x+9,Y+46,12,6,brown);
        pixelRect(x+38,Y+43,13,6,brown);
        pixelRect(x+6,Y+47,10,5,cream);
        pixelRect(x+42,Y+45,10,5,cream);
    }
}

/* PIXEL CACTUS */

function drawCactus(c){
    const x=Math.round(c.x);
    const y=Math.round(groundY-c.h);

    const dark="#5f725d";
    const mid="#79936f";
    const light="#a9bd92";

    /* shadow */
    ctx.fillStyle="rgba(75,90,80,.16)";
    ctx.fillRect(x-4,groundY+7,c.w+8,5);

    /* outline */
    pixelRect(x+8,y,16,c.h,dark);

    if(c.type===1){
        pixelRect(x,y+14,12,8,dark);
        pixelRect(x-4,y+10,8,15,dark);
        pixelRect(x+24,y+22,10,8,dark);
        pixelRect(x+28,y+17,8,16,dark);
    }else{
        pixelRect(x+3,y+20,10,8,dark);
        pixelRect(x-1,y+16,7,17,dark);
        pixelRect(x+23,y+10,10,9,dark);
        pixelRect(x+29,y+5,7,19,dark);
    }

    /* inner cactus */
    pixelRect(x+12,y+4,8,c.h-8,mid);

    if(c.type===1){
        pixelRect(x+3,y+14,5,7,mid);
        pixelRect(x+28,y+22,5,6,mid);
    }else{
        pixelRect(x+3,y+20,6,6,mid);
        pixelRect(x+25,y+10,6,7,mid);
    }

    /* pixel highlights */
    pixelRect(x+14,y+8,3,8,light);
    pixelRect(x+14,y+25,3,7,light);
}

function spawnCactus(){
    const first=score<3;

    cactuses.push({
        x:W+(first?120:20),
        w:first?30:32,
        h:first?43:(30+Math.floor(Math.random()*28)),
        type:Math.random()<.65?1:2,
        passed:false
    });
}

function resetBunny(){
    bunny.y=groundY-bunny.h;
    bunny.vy=0;
    bunny.grounded=true;
}

function jump(){
    if(!running)return;

    if(bunny.grounded){
        bunny.vy=-10.2;
        bunny.grounded=false;
    }
}

function collision(a,b){
    return (
        a.x+12 < b.x+b.w-5 &&
        a.x+a.w-6 > b.x+5 &&
        a.y+10 < b.y+b.h-3 &&
        a.y+a.h-3 > b.y+4
    );
}

function rewardForScore(){
    if(score>=500)return 25;
    if(score>=250)return 20;
    if(score>=100)return 15;
    return 10;
    }<script>
function startGame(){
    running=true;
    dead=false;
    score=0;
    spawnTimer=0;
    cactuses=[];
    resetBunny();

    document.getElementById("startScreen").style.display="none";
    document.getElementById("gameOver").classList.remove("show");

    last=performance.now();
}

function endGame(){
    if(dead)return;

    dead=true;
    running=false;

    const reward=rewardForScore();

    if(score>best){
        best=score;
        localStorage.setItem("bunny_jump_best",best);
        document.getElementById("best").textContent=
            String(Math.floor(best)).padStart(5,"0");
    }

    document.getElementById("finalScore").textContent=
        "Score: "+String(Math.floor(score)).padStart(5,"0");

    document.getElementById("rewardText").textContent=
        "✦ +"+reward+" coins ✦";

    document.getElementById("gameOver").classList.add("show");

    if(typeof addCoins==="function"){
        addCoins(reward);
    }

    if(typeof updateCoinDisplays==="function"){
        updateCoinDisplays();
    }
}

function update(dt){
    animationTime+=dt;

    if(!running)return;

    /* score rises continuously like the Dino game */
    score+=dt*.012;

    document.getElementById("score").textContent=
        String(Math.floor(score)).padStart(5,"0");

    const speed=Math.min(9,4.7+score/420);

    bunny.vy+=.55*(dt/16.67);
    bunny.y+=bunny.vy*(dt/16.67);

    if(bunny.y>=groundY-bunny.h){
        bunny.y=groundY-bunny.h;
        bunny.vy=0;
        bunny.grounded=true;
    }else{
        bunny.grounded=false;
    }

    spawnTimer+=dt;

    const delay=Math.max(900,1450-score*1.5);

    if(spawnTimer>=delay){
        spawnTimer=0;
        spawnCactus();
    }

    for(let i=cactuses.length-1;i>=0;i--){
        const c=cactuses[i];

        c.x-=speed*(dt/16.67);

        const box={
            x:c.x,
            y:groundY-c.h,
            w:c.w,
            h:c.h
        };

        if(collision(bunny,box)){
            endGame();
            return;
        }

        if(!c.passed && c.x+c.w<bunny.x){
            c.passed=true;
        }

        if(c.x<-60){
            cactuses.splice(i,1);
        }
    }
}

function draw(){
    ctx.clearRect(0,0,W,H);

    drawSky();
    drawGround();

    for(const c of cactuses){
        drawCactus(c);
    }

    drawBunny();

    if(!running && !dead){
        /* idle scene */
        ctx.fillStyle="rgba(255,255,255,.18)";
        ctx.fillRect(0,0,W,groundY);
    }
}

function loop(now){
    const dt=Math.min(35,now-last||16.67);
    last=now;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

function handleInput(){
    if(!running){
        if(!dead){
            startGame();
            jump();
        }
        return;
    }

    jump();
}

canvas.addEventListener("pointerdown",handleInput);

document.addEventListener("keydown",e=>{
    if(
        e.code==="Space" ||
        e.code==="ArrowUp" ||
        e.code==="KeyW"
    ){
        e.preventDefault();
        handleInput();
    }
});

document.getElementById("startButton").addEventListener("click",e=>{
    e.stopPropagation();
    startGame();
});

document.getElementById("againButton").addEventListener("click",()=>{
    startGame();
});

document.addEventListener("DOMContentLoaded",()=>{
    if(typeof updateCoinDisplays==="function"){
        updateCoinDisplays();
    }
});

requestAnimationFrame(loop);
</script></body>
</html>
