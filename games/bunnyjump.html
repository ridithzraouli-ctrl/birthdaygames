<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>Bunny Jump ♡</title>

<style>

:root{
    --bg-base:#f2f7fa;
    --bg-grad-1:#dce8f3;
    --bg-grad-2:#d3e2ea;

    --text:#405563;
    --heading:#49677a;
    --border:#a9c2d0;
    --accent:#7e9eaf;

    --card:rgba(255,255,255,.82);
    --shadow:rgba(63,82,96,.15);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    margin:0;
}

body{
    min-height:100vh;

    overflow-x:hidden;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    color:var(--text);

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(255,255,255,.8),
            transparent 28%
        ),
        linear-gradient(
            145deg,
            var(--bg-grad-1),
            var(--bg-grad-2)
        );

    transition:
        background .35s ease;
}

button,
a{
    font:inherit;
}

button{
    cursor:pointer;
}

.page-decoration{
    position:fixed;

    pointer-events:none;

    color:var(--accent);

    opacity:.45;

    z-index:0;
}

.decoration-one{
    left:7%;
    top:110px;
    font-size:20px;
}

.decoration-two{
    right:8%;
    top:175px;
    font-size:15px;
}

.decoration-three{
    left:9%;
    bottom:13%;
    font-size:14px;
}

.decoration-four{
    right:10%;
    bottom:18%;
    font-size:21px;
}


/* HEADER */

header{
    width:min(
        1100px,
        calc(100% - 28px)
    );

    margin:18px auto 0;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    position:relative;

    z-index:5;
}

.header-left,
.header-right{
    display:flex;

    align-items:center;

    gap:10px;
}

.nav-button,
.fullscreen-button{
    border:1px solid var(--border);

    background:rgba(255,255,255,.72);

    color:var(--text);

    padding:9px 15px;

    border-radius:999px;

    text-decoration:none;

    box-shadow:
        0 4px 15px var(--shadow);

    transition:
        transform .2s ease,
        background .2s ease;
}

.nav-button:hover,
.fullscreen-button:hover{
    transform:translateY(-1px);

    background:#fff;
}

.coin-display{
    display:flex;

    align-items:center;

    gap:7px;

    padding:9px 15px;

    border-radius:999px;

    background:rgba(255,255,255,.76);

    border:1px solid var(--border);

    box-shadow:
        0 4px 15px var(--shadow);

    white-space:nowrap;

    font-size:14px;
}

.coin-display .coin-count{
    font-weight:bold;

    color:var(--heading);
}


/* MAIN */

main{
    width:min(
        1100px,
        calc(100% - 28px)
    );

    margin:28px auto 40px;

    position:relative;

    z-index:1;
}

.game-heading{
    text-align:center;

    margin-bottom:20px;
}

.ornament{
    color:var(--accent);

    font-size:15px;

    letter-spacing:8px;

    margin-bottom:6px;
}

.game-heading h1{
    margin:0;

    color:var(--heading);

    font-size:
        clamp(
            36px,
            6vw,
            55px
        );

    font-weight:normal;

    letter-spacing:1px;
}


/* GAME */

.game-shell{
    position:relative;

    width:100%;

    max-width:1000px;

    margin:auto;

    padding:14px;

    border-radius:30px;

    background:rgba(255,255,255,.48);

    border:
        1px solid
        rgba(255,255,255,.8);

    box-shadow:
        0 22px 55px var(--shadow),
        inset 0 1px 0 rgba(255,255,255,.8);

    backdrop-filter:blur(10px);
}

.game-shell::before,
.game-shell::after{
    position:absolute;

    pointer-events:none;

    z-index:4;

    color:var(--accent);

    opacity:.7;
}

.game-shell::before{
    content:"✦";

    top:18px;
    left:24px;

    font-size:15px;
}

.game-shell::after{
    content:"✧";

    top:18px;
    right:25px;

    font-size:18px;
}

canvas{
    display:block;

    width:100%;

    height:auto;

    aspect-ratio:16 / 9;

    border-radius:21px;

    background:#a9bec5;

    touch-action:none;

    user-select:none;

    box-shadow:
        inset 0 0 0 1px
        rgba(255,255,255,.45),

        0 8px 25px
        rgba(40,60,70,.13);
}


/* FULLSCREEN */

.fullscreen-exit{
    display:none;

    position:absolute;

    top:18px;

    right:18px;

    z-index:30;

    border:
        1px solid
        rgba(255,255,255,.7);

    background:
        rgba(255,255,255,.88);

    color:var(--text);

    padding:9px 14px;

    border-radius:999px;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.12);
}

.fullscreen-info{
    display:none;

    position:absolute;

    top:18px;

    left:18px;

    z-index:30;

    gap:8px;

    align-items:center;
}

.fullscreen-pill{
    padding:8px 13px;

    border-radius:999px;

    background:
        rgba(255,255,255,.88);

    border:
        1px solid
        rgba(255,255,255,.75);

    color:var(--text);

    font-size:13px;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.1);
}

.fullscreen-pill strong{
    color:var(--heading);
}


/* MOBILE */

@media(max-width:650px){

    header{
        margin-top:12px;
    }

    .nav-button,
    .fullscreen-button,
    .coin-display{
        padding:8px 11px;

        font-size:12px;
    }

    main{
        margin-top:20px;
    }

    .game-heading{
        margin-bottom:15px;
    }

    .game-heading h1{
        font-size:38px;
    }

    .game-shell{
        padding:8px;

        border-radius:22px;
    }

    canvas{
        border-radius:16px;
    }
}


/* FULLSCREEN MODE */

body.game-fullscreen{
    width:100vw;

    height:100vh;

    overflow:hidden;

    background:
        var(--bg-base);
}

body.game-fullscreen header,
body.game-fullscreen main > .game-heading,
body.game-fullscreen .page-decoration{
    display:none;
}

body.game-fullscreen main{
    width:100vw;

    height:100vh;

    margin:0;
}

body.game-fullscreen .game-shell{
    width:100vw;

    height:100vh;

    max-width:none;

    margin:0;

    padding:0;

    border:0;

    border-radius:0;

    background:var(--bg-base);

    box-shadow:none;

    backdrop-filter:none;

    display:flex;

    align-items:center;

    justify-content:center;
}

body.game-fullscreen .game-shell::before,
body.game-fullscreen .game-shell::after{
    display:none;
}

body.game-fullscreen canvas{
    width:100vw;

    height:100vh;

    max-width:none;

    max-height:none;

    aspect-ratio:auto;

    object-fit:contain;

    border-radius:0;

    box-shadow:none;
}

body.game-fullscreen .fullscreen-exit,
body.game-fullscreen .fullscreen-info{
    display:flex;
}

@media(max-aspect-ratio:16/9){

    body.game-fullscreen canvas{
        width:100vw;

        height:auto;
    }
}

@media(min-aspect-ratio:16/9){

    body.game-fullscreen canvas{
        width:auto;

        height:100vh;
    }
}

</style>

/* ---------------------------------------------------------

   --------------------------------------------------------- */

let audioContext = null;


function getAudio(){

    if(!audioContext){

        try{

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }catch(e){}

    }

    if(
        audioContext &&
        audioContext.state === "suspended"
    ){

        audioContext
            .resume()
            .catch(()=>{});

    }

    return audioContext;
}


function playJumpSound(){

    const audio = getAudio();

    if(!audio) return;

    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
        420,
        audio.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        700,
        audio.currentTime + .12
    );

    gain.gain.setValueAtTime(
        .045,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime + .13
    );

    oscillator.connect(gain);

    gain.connect(
        audio.destination
    );

    oscillator.start();

    oscillator.stop(
        audio.currentTime + .14
    );
}

/* ---------------------------------------------------------
   DRAWING HELPERS
   --------------------------------------------------------- */

function roundedRectPath(
    x,
    y,
    width,
    height,
    radius
){

    radius =
        Math.min(
            radius,
            width / 2,
            height / 2
        );

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.lineTo(
        x + width - radius,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    ctx.lineTo(
        x + width,
        y + height - radius
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    ctx.lineTo(
        x + radius,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();
}


function fillRoundedRect(
    x,
    y,
    width,
    height,
    radius,
    fill,
    stroke = null
){

    roundedRectPath(
        x,
        y,
        width,
        height,
        radius
    );

    ctx.fillStyle = fill;

    ctx.fill();

    if(stroke){

        ctx.strokeStyle =
            stroke;

        ctx.lineWidth = 1;

        ctx.stroke();

    }
}

function drawCloud(
    x,
    y,
    size
){

    ctx.save();

    ctx.fillStyle =
        "rgba(255,255,255,.43)";

    ctx.beginPath();

    ctx.arc(
        x,

    );

    ctx.arc(
        x + 24 * size,
        y - 7 * size,
        26 * size,
        Math.PI,
        0
    );

    ctx.arc(
        x + 55 * size,
        y,
        20 * size,
        Math.PI,
        0
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();
}

function checkCollision(

       Forgiving bunny hitbox.
    */

            bunny.x + 15,

        y:
            bunny.y + 17,

            Math.max(

            )

        bunnyBox.x <
        obstacleBox.x +
        obstacleBox.width

        &&

        bunnyBox.x +
        bunnyBox.width >
        obstacleBox.x

        &&

        bunnyBox.y <
        obstacleBox.y +

        &&

        bunnyBox.y +
        bunnyBox.height >

/* ---------------------------------------------------------
   UPDATE
   --------------------------------------------------------- */

function update(delta){

    if(
        !started ||
        gameOver
    ){

        return;

    }


    const dt =
        Math.min(
            delta,
            32
        );


    /*
       Bunny physics
    */

    bunny.velocityY +=
        bunny.gravity *
        (dt / 16.67);

    bunny.y +=
        bunny.velocityY *
        (dt / 16.67);


    const groundY =
        GROUND -
        bunny.height;


    if(
        bunny.y >= groundY
    ){

        bunny.y =
            groundY;

        bunny.velocityY =
            0;

        bunny.grounded =
            true;

    }

    else{

        bunny.grounded =
            false;

    }


    /*
       Run animation
    */

    if(bunny.grounded){

        runFrameTimer += dt;

        if(
            runFrameTimer >= 45
        ){

            runFrameTimer = 0;

            runFrame =
                (
                    runFrame + 1
                ) % 8;

        }

    }


    /*
       Jump animation
    */

    if(!bunny.grounded){

        jumpFrameTimer += dt;

        if(
            jumpFrameTimer >= 55
        ){

            jumpFrameTimer = 0;

            jumpFrame =
                (
                    jumpFrame + 1
                ) % 8;

        }

    }


    /*
       Gradually increase speed
    */

    speed +=
        .0008 * dt;


    /*
       Score
    */

    score +=
        .12 * dt;


    /*
       Obstacles
    */

    obstacleTimer += dt;


    if(
        obstacleTimer >=
        nextObstacle
    ){

        obstacleTimer = 0;

        nextObstacle =
            getNextObstacleDelay();

        spawnObstacle();

    }


    obstacles.forEach(
        obstacle => {

            obstacle.x -=
                speed *
                (dt / 16.67);


            if(
                !obstacle.passed &&
                obstacle.x +
                obstacle.width <
                bunny.x
            ){

                obstacle.passed = true;

            }

        }
    );


    /*
       Remove old obstacles
    */

    while(

        obstacles.length &&

        obstacles[0].x +
        obstacles[0].width <
        -60

    ){

        obstacles.shift();

    }


    /*
       Collision
    */

    for(
        const obstacle of obstacles
    ){

        if(
            checkCollision(
                obstacle
            )
        ){

            endGame();

            break;

        }

    }


    updateFullscreenDisplays();
}


/* ---------------------------------------------------------
   END GAME
   --------------------------------------------------------- */

function endGame(){

    if(gameOver){

        return;

    }


    gameOver = true;


    score =
        Math.floor(score);


    /*
       Award ALL coins only now.

       1000 score = 10 coins
       2000 score = 20 coins
       3000 score = 30 coins
       etc.
    */

    awardRunCoins();


    /*
       High score
    */

    if(
        score > topScore
    ){

        topScore =
            score;

        localStorage.setItem(
            "bunnyJumpHighScore",
            String(topScore)
        );

    }


    updateFullscreenDisplays();

    playGameOverSound();

    draw();
}


/* ---------------------------------------------------------
   GAME LOOP
   --------------------------------------------------------- */

function gameLoop(timestamp){

    if(!started){

        return;

    }


    if(!lastTime){

        lastTime =
            timestamp;

    }


    const delta =
        timestamp -
        lastTime;


    lastTime =
        timestamp;


    update(delta);

    draw();


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );
}


/* ---------------------------------------------------------
   TOUCH / POINTER
   --------------------------------------------------------- */

canvas.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        event.stopPropagation();

        jump();

    },
    {
        passive:false
    }
);


/*
   Fullscreen letterbox areas can also
   be tapped to jump, but the canvas itself
   is excluded so jumping cannot happen twice.
*/

document.addEventListener(
    "pointerdown",
    event => {

        if(
            !document.body.classList.contains(
                "game-fullscreen"
            )
        ){

            return;

        }


        if(
            event.target === canvas
        ){

            return;

        }


        if(
            event.target.closest &&
            event.target.closest(
                "button,a"
            )
        ){

            return;

        }


        event.preventDefault();

        jump();

    },
    {
        passive:false
    }
);


/* ---------------------------------------------------------
   KEYBOARD
   --------------------------------------------------------- */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.code === "Space" ||
            event.code === "ArrowUp" ||
            event.code === "KeyW"
        ){

            event.preventDefault();

            jump();

        }


        if(
            event.code === "KeyF"
        ){

            event.preventDefault();

            toggleFullscreen();

        }

    }
);


/* ---------------------------------------------------------
   FULLSCREEN
   --------------------------------------------------------- */

function setFullscreenClass(
    active
){

    document.body.classList.toggle(
        "game-fullscreen",
        active
    );

}


async function toggleFullscreen(){

    /*
       Real browser fullscreen is preferred.
    */

    if(
        document.fullscreenElement
    ){

        try{

            await document.exitFullscreen();

        }catch(e){}

        manualFullscreen = false;

        setFullscreenClass(
            false
        );

        return;

    }


    /*
       If visual fallback is already active,
       turn it off.
    */

    if(
        document.body.classList.contains(
            "game-fullscreen"
        )
    ){

        manualFullscreen = false;

        setFullscreenClass(
            false
        );

        return;

    }


    /*
       Try real fullscreen first.
    */

    if(
        gameShell.requestFullscreen &&
        document.fullscreenEnabled !== false
    ){

        try{

            await gameShell.requestFullscreen();

            manualFullscreen = false;

            setFullscreenClass(
                true
            );

            return;

        }catch(error){

            /*
               Mobile browser rejected
               the native fullscreen request.
               Use the visual fallback below.
            */

        }

    }


    /*
       Mobile fallback.
    */

    manualFullscreen = true;

    setFullscreenClass(
        true
    );

}


/*
   Native fullscreen state changes.
*/

document.addEventListener(
    "fullscreenchange",
    () => {

        if(
            document.fullscreenElement
        ){

            manualFullscreen = false;

            setFullscreenClass(
                true
            );

        }

        else if(
            !manualFullscreen
        ){

            setFullscreenClass(
                false
            );

        }

    }
);


fullscreenButton.addEventListener(
    "click",
    event => {

        event.preventDefault();

        event.stopPropagation();

        toggleFullscreen();

    }
);


fullscreenExit.addEventListener(
    "click",
    event => {

        event.preventDefault();

        event.stopPropagation();

        toggleFullscreen();

    }
);


/* ---------------------------------------------------------
   THEME
   --------------------------------------------------------- */

window.addEventListener(
    "storage",
    event => {

        if(
            event.key ===
            "arcade_theme"
        ){

            applyTheme();

            draw();

        }

    }
);


/* ---------------------------------------------------------
   IMAGE LOADING
   --------------------------------------------------------- */

idleImage.onload =
    () => draw();

runImage.onload =
    () => draw();

jumpImage.onload =
    () => draw();


/* ---------------------------------------------------------
   INITIAL STATE
   --------------------------------------------------------- */

updateCoinDisplay();

updateFullscreenDisplays();

draw();


/* ---------------------------------------------------------
   KEEP COINS SYNCED WITH ARCADE
   --------------------------------------------------------- */

setInterval(
    () => {

        updateCoinDisplay();

    },
    1000
);


/* ---------------------------------------------------------
   RESPONSIVE REDRAW
   --------------------------------------------------------- */

window.addEventListener(
    "resize",
    () => {

        draw();

    }
);

</script>
