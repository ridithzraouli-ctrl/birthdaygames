<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Bunny Run ♡</title>

<style>
:root{
    --bg-base:#f2f7fa;
    --bg-grad-1:#dce8f3;
    --bg-grad-2:#d3e2ea;
    --text:#405563;
    --heading:#49677a;
    --border:#a9c2d0;
    --accent:#7e9eaf;
    --accent-soft:#e8f1f5;
    --card:#ffffffd9;
    --shadow:rgba(63,82,96,.14);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:Georgia,"Times New Roman",serif;
    color:var(--text);
    background:
        radial-gradient(circle at 15% 10%,rgba(255,255,255,.75),transparent 28%),
        linear-gradient(145deg,var(--bg-grad-1),var(--bg-grad-2));
    transition:background .35s ease;
}

button,
a{
    font:inherit;
}

button{
    cursor:pointer;
}

.page-decoration{
    position:fixed;
    pointer-events:none;
    color:var(--accent);
    opacity:.45;
    font-size:20px;
    z-index:0;
}

.decoration-1{
    top:105px;
    left:7%;
}

.decoration-2{
    top:180px;
    right:8%;
    font-size:15px;
}

.decoration-3{
    bottom:12%;
    left:8%;
    font-size:14px;
}

.decoration-4{
    bottom:18%;
    right:10%;
    font-size:21px;
}

header{
    width:min(1100px,calc(100% - 28px));
    margin:18px auto 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    position:relative;
    z-index:5;
}

.header-left,
.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.nav-button,
.fullscreen-button{
    border:1px solid var(--border);
    background:rgba(255,255,255,.72);
    color:var(--text);
    padding:9px 15px;
    border-radius:999px;
    text-decoration:none;
    box-shadow:0 4px 15px var(--shadow);
    transition:.2s ease;
}

.nav-button:hover,
.fullscreen-button:hover{
    transform:translateY(-1px);
    background:white;
}

.coin-display{
    display:flex;
    align-items:center;
    gap:7px;
    padding:9px 15px;
    border-radius:999px;
    background:rgba(255,255,255,.76);
    border:1px solid var(--border);
    box-shadow:0 4px 15px var(--shadow);
    white-space:nowrap;
    font-size:14px;
}

.coin-display .coin-count{
    font-weight:bold;
    color:var(--heading);
}

main{
    width:min(1100px,calc(100% - 28px));
    margin:30px auto 45px;
    position:relative;
    z-index:1;
}

.game-heading{
    text-align:center;
    margin-bottom:20px;
}

.game-heading .ornament{
    color:var(--accent);
    font-size:15px;
    letter-spacing:8px;
    margin-bottom:5px;
}

.game-heading h1{
    margin:0;
    color:var(--heading);
    font-size:clamp(34px,6vw,55px);
    font-weight:normal;
    letter-spacing:1px;
}

.game-heading p{
    margin:8px 0 0;
    opacity:.72;
    font-size:15px;
}

.game-shell{
    position:relative;
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:14px;
    border-radius:30px;
    background:rgba(255,255,255,.48);
    border:1px solid rgba(255,255,255,.75);
    box-shadow:
        0 22px 55px var(--shadow),
        inset 0 1px 0 rgba(255,255,255,.8);
    backdrop-filter:blur(10px);
}

.game-shell::before,
.game-shell::after{
    position:absolute;
    color:var(--accent);
    opacity:.7;
    pointer-events:none;
    z-index:3;
}

.game-shell::before{
    content:"✦";
    left:24px;
    top:18px;
    font-size:15px;
}

.game-shell::after{
    content:"✧";
    right:25px;
    top:19px;
    font-size:18px;
}

canvas{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:16 / 9;
    border-radius:21px;
    background:#a9bec5;
    touch-action:none;
    user-select:none;
    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.5),
        0 8px 25px rgba(40,60,70,.13);
}

.fullscreen-exit{
    display:none;
    position:absolute;
    top:18px;
    right:18px;
    z-index:20;
    border:1px solid rgba(255,255,255,.65);
    background:rgba(255,255,255,.84);
    color:var(--text);
    padding:9px 14px;
    border-radius:999px;
    box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.fullscreen-info{
    display:none;
    position:absolute;
    top:18px;
    left:18px;
    z-index:20;
    gap:8px;
    align-items:center;
}

.fullscreen-pill{
    padding:8px 13px;
    border-radius:999px;
    background:rgba(255,255,255,.84);
    border:1px solid rgba(255,255,255,.7);
    color:var(--text);
    font-size:13px;
    box-shadow:0 5px 18px rgba(0,0,0,.1);
}

.game-hint{
    text-align:center;
    margin-top:13px;
    font-size:13px;
    opacity:.6;
}

@media(max-width:650px){
    header{
        margin-top:12px;
    }

    .nav-button,
    .fullscreen-button,
    .coin-display{
        padding:8px 11px;
        font-size:12px;
    }

    .game-heading{
        margin-top:24px;
    }

    .game-heading h1{
        font-size:38px;
    }

    main{
        margin-top:20px;
    }

    .game-shell{
        padding:8px;
        border-radius:22px;
    }

    canvas{
        border-radius:16px;
    }
}

/* fullscreen */

body.game-fullscreen{
    overflow:hidden;
    width:100vw;
    height:100vh;
    background:var(--bg-base);
}

body.game-fullscreen header,
body.game-fullscreen main > .game-heading,
body.game-fullscreen .game-hint,
body.game-fullscreen .page-decoration{
    display:none;
}

body.game-fullscreen main{
    width:100vw;
    height:100vh;
    margin:0;
}

body.game-fullscreen .game-shell{
    width:100vw;
    height:100vh;
    max-width:none;
    padding:0;
    margin:0;
    border:0;
    border-radius:0;
    background:var(--bg-base);
    box-shadow:none;
    backdrop-filter:none;
    display:flex;
    align-items:center;
    justify-content:center;
}

body.game-fullscreen .game-shell::before,
body.game-fullscreen .game-shell::after{
    display:none;
}

body.game-fullscreen canvas{
    width:100vw;
    height:100vh;
    max-width:none;
    max-height:none;
    aspect-ratio:auto;
    object-fit:contain;
    border-radius:0;
    box-shadow:none;
}

body.game-fullscreen .fullscreen-exit,
body.game-fullscreen .fullscreen-info{
    display:flex;
}

@media(max-aspect-ratio:16/9){
    body.game-fullscreen canvas{
        width:100vw;
        height:auto;
    }
}

@media(min-aspect-ratio:16/9){
    body.game-fullscreen canvas{
        width:auto;
        height:100vh;
    }
}
</style>
</head>

/* ---------------------------------------------------------
   AUDIO
   --------------------------------------------------------- */

let audioContext = null;

function getAudio(){
    if(!audioContext){
        try{
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }catch(e){}
    }

    if(audioContext && audioContext.state === "suspended"){
        audioContext.resume().catch(()=>{});
    }

    return audioContext;
}

function playJumpSound(){
    const audio = getAudio();
    if(!audio) return;

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(420,audio.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(
        700,
        audio.currentTime + .12
    );

    gain.gain.setValueAtTime(.045,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime + .13
    );

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.start();
    oscillator.stop(audio.currentTime + .14);
}

function playGameOverSound(){
    const audio = getAudio();
    if(!audio) return;

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(300,audio.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(
        110,
        audio.currentTime + .35
    );

    gain.gain.setValueAtTime(.05,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime + .38
    );

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.start();
    oscillator.stop(audio.currentTime + .4);
}

function updateCoinDisplay(){
    if(typeof updateCoinDisplays === "function"){
        updateCoinDisplays();
    }

    const main = document.getElementById("coin-count");
    const fullscreen = document.getElementById("fullscreen-coin-count");

    if(main && fullscreen){
        fullscreen.textContent = main.textContent;
    }
}

function awardRunCoins(){
    if(coinsAlreadyAwarded) return;

    coinsAlreadyAwarded = true;

    const milestones = Math.floor(score / 1000);
    runCoinsEarned = milestones * 10;

    if(runCoinsEarned > 0){
        if(typeof addCoins === "function"){
            addCoins(runCoinsEarned);
        }
    }

    updateCoinDisplay();
}

/* ---------------------------------------------------------
   RESET
   --------------------------------------------------------- */

function resetRun(){
    score = 0;

    runCoinsEarned = 0;
    coinsAlreadyAwarded = false;

    speed = 6;

    obstacleTimer = 0;
    nextObstacle = 1450;

    obstacles.length = 0;

    bunny.x = 110;
    bunny.y = GROUND - bunny.height;
    bunny.velocityY = 0;
    bunny.grounded = true;

    runFrame = 0;
    runFrameTimer = 0;

    jumpFrame = 0;
    jumpFrameTimer = 0;

    gameOver = false;

    updateCoinDisplay();
    updateFullscreenScore();
}

function startGame(){
    if(started && !gameOver) return;

    resetRun();

    started = true;
    gameOver = false;

    lastTime = performance.now();

    if(animationFrame){
        cancelAnimationFrame(animationFrame);
    }

    animationFrame = requestAnimationFrame(gameLoop);

    draw();
}

function jump(){
    getAudio();

    if(!started){
        startGame();
        return;
    }

    if(gameOver){
        startGame();
        return;
    }

    if(bunny.grounded){
        bunny.velocityY = bunny.jumpPower;
        bunny.grounded = false;
        playJumpSound();
    }
}

/* ---------------------------------------------------------
   OBSTACLE CREATION
   --------------------------------------------------------- */

function spawnObstacle(){
    const imageIndex =
        Math.floor(Math.random() * cactusImages.length);

    const image = cactusImages[imageIndex];

    const height =
        45 + Math.floor(Math.random() * 42);

    const width =
        25 + Math.floor(Math.random() * 25);

    obstacles.push({
        x:W + 30,
        y:GROUND - height,
        width,
        height,
        image,
        passed:false
    });
}

function getNextObstacleDelay(){
    return 1450 + Math.random() * 750;
}<script>
/* ---------------------------------------------------------
   DRAWING HELPERS
   --------------------------------------------------------- */

function roundedRectPath(x,y,w,h,r){
    r = Math.min(r,w/2,h/2);

    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function fillRoundedRect(x,y,w,h,r,fill,stroke=null,lineWidth=1){
    roundedRectPath(x,y,w,h,r);

    ctx.fillStyle = fill;
    ctx.fill();

    if(stroke){
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = stroke;
        ctx.stroke();
    }
}

/* ---------------------------------------------------------
   BACKGROUND
   --------------------------------------------------------- */

function drawBackground(){
    const theme = getTheme();

    const gradient = ctx.createLinearGradient(0,0,0,H);

    gradient.addColorStop(0,theme.skyTop);
    gradient.addColorStop(.68,theme.skyBottom);
    gradient.addColorStop(1,theme.ground);

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,W,H);

    /* soft distant hills */

    ctx.fillStyle = "rgba(255,255,255,.16)";

    ctx.beginPath();
    ctx.moveTo(0,350);

    for(let x=0;x<=W;x+=100){
        ctx.quadraticCurveTo(
            x+50,
            320 + Math.sin(x*.018)*15,
            x+100,
            350
        );
    }

    ctx.lineTo(W,H);
    ctx.lineTo(0,H);
    ctx.closePath();
    ctx.fill();

    drawClouds();
}

function drawClouds(){
    const now = performance.now();

    clouds.forEach(cloud=>{
        let x =
            (cloud.x - (now / 70) % 1180 + 1180) % 1180;

        if(x > W + 120) x -= 1180;

        drawCloud(
            x,
            cloud.y,
            cloud.size
        );
    });
}

function drawCloud(x,y,size){
    ctx.save();

    ctx.fillStyle = "rgba(255,255,255,.42)";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        20 * size,
        Math.PI,
        0
    );

    ctx.arc(
        x + 24 * size,
        y - 7 * size,
        26 * size,
        Math.PI,
        0
    );

    ctx.arc(
        x + 55 * size,
        y,
        20 * size,
        Math.PI,
        0
    );

    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

/* ---------------------------------------------------------
   GROUND
   --------------------------------------------------------- */

function drawGround(){
    const theme = getTheme();

    ctx.fillStyle = theme.ground;
    ctx.fillRect(0,GROUND,W,H-GROUND);

    ctx.fillStyle = theme.groundDark;
    ctx.fillRect(0,GROUND,W,5);

    ctx.fillStyle = theme.groundLine;

    const offset =
        (performance.now() / 7) % 44;

    for(let x=-44+offset;x<W+44;x+=44){
        ctx.fillRect(
            x,
            GROUND + 28,
            20,
            2
        );

        ctx.fillRect(
            x + 12,
            GROUND + 55,
            30,
            2
        );

        ctx.fillRect(
            x - 4,
            GROUND + 83,
            18,
            2
        );
    }
}

/* ---------------------------------------------------------
   BUNNY DRAWING
   --------------------------------------------------------- */

function drawBunny(){
    ctx.save();

    /*
       Keep the bunny facing right.
       The actual sprite itself is not modified.
    */

    if(bunny.grounded){
        if(runImage.complete && runImage.naturalWidth){
            const frameX =
                runFrame * RUN_FRAME_W;

            ctx.drawImage(
                runImage,
                frameX,
                0,
                RUN_FRAME_W,
                RUN_FRAME_H,
                bunny.x,
                bunny.y,
                84,
                84
            );
        }
    }else{
        if(jumpImage.complete && jumpImage.naturalWidth){
            const frameX =
                jumpFrame * JUMP_FRAME_W;

            ctx.drawImage(
                jumpImage,
                frameX,
                0,
                JUMP_FRAME_W,
                JUMP_FRAME_H,
                bunny.x,
                bunny.y - 8,
                84,
                108
            );
        }
    }

    ctx.restore();
}

/* ---------------------------------------------------------
   CACTI
   --------------------------------------------------------- */

function drawObstacles(){
    obstacles.forEach(obstacle=>{

        if(
            obstacle.image &&
            obstacle.image.complete &&
            obstacle.image.naturalWidth
        ){
            ctx.drawImage(
                obstacle.image,
                obstacle.x,
                obstacle.y,
                obstacle.width,
                obstacle.height
            );
        }else{
            drawFallbackCactus(obstacle);
        }
    });
}

function drawFallbackCactus(obstacle){
    const x = obstacle.x;
    const y = obstacle.y;
    const w = obstacle.width;
    const h = obstacle.height;

    ctx.fillStyle = "#66836d";

    roundedRectPath(
        x + w*.32,
        y,
        w*.36,
        h,
        4
    );

    ctx.fill();

    roundedRectPath(
        x,
        y + h*.42,
        w*.4,
        h*.12,
        3
    );

    ctx.fill();

    roundedRectPath(
        x + w*.65,
        y + h*.28,
        w*.35,
        h*.12,
        3
    );

    ctx.fill();
}

/* ---------------------------------------------------------
   SCORE
   --------------------------------------------------------- */

function drawScore(){
    ctx.save();

    ctx.textAlign = "right";

    const theme = getTheme();

    ctx.font = "bold 23px Georgia";
    ctx.fillStyle = "rgba(255,255,255,.72)";

    ctx.fillText(
        String(Math.floor(score)).padStart(5,"0"),
        W - 30,
        43
    );

    ctx.font = "13px Georgia";
    ctx.fillStyle = theme.text;

    ctx.fillText(
        "SCORE",
        W - 31,
        62
    );

    ctx.restore();
}

function updateFullscreenScore(){
    scoreDisplay.textContent = Math.floor(score);
}

/* ---------------------------------------------------------
   START SCREEN
   --------------------------------------------------------- */

function drawStartScreen(){
    const theme = getTheme();

    ctx.fillStyle = "rgba(43,57,64,.08)";
    ctx.fillRect(0,0,W,H);

    const panelW = 490;
    const panelH = 230;
    const panelX = (W-panelW)/2;
    const panelY = 145;

    fillRoundedRect(
        panelX + 5,

    );

    fillRoundedRect(
        panelX,

    ctx.font = "normal 38px Georgia";
    ctx.fillText("Bunny Run",W/2,panelY+94);

    ctx.fillStyle = theme.text;
    ctx.font = "16px Georgia";
    ctx.fillText(
        "Tap to start",
        W/2,
        panelY+140
    );

    ctx.font = "13px Georgia";
    ctx.globalAlpha = .65;
    ctx.fillText(

    );

/* ---------------------------------------------------------
   GAME OVER SCREEN
   --------------------------------------------------------- */

function drawGameOver(){
    const theme = getTheme();

    ctx.fillStyle = "rgba(38,49,54,.28)";
    ctx.fillRect(0,0,W,H);

    const panelW = 560;
    const panelH = 310;

    const panelX = (W-panelW)/2;
    const panelY = (H-panelH)/2;

    /* shadow */

    fillRoundedRect(
        panelX + 7,
        panelY + 9,
        panelW,
        panelH,
        32,
        "rgba(38,49,54,.16)"
    );

    /* main card */

    fillRoundedRect(
        panelX,
        panelY,
        panelW,
        panelH,
        32,
        "rgba(255,255,255,.94)",
        "rgba(255,255,255,.9)",
        1
    );

    ctx.textAlign = "center";

    ctx.fillStyle = theme.accent;
    ctx.font = "20px Georgia";
    ctx.fillText(
        "✦   ✧   ✦",
        W/2,
        panelY+43
    );

    ctx.fillStyle = theme.heading;
    ctx.font = "normal 39px Georgia";
    ctx.fillText(
        "Game Over",
        W/2,
        panelY+91
    );

    ctx.fillStyle = theme.text;
    ctx.font = "16px Georgia";

    ctx.fillText(
        "Score",
        W/2 - 95,
        panelY+136
    );

    ctx.font = "bold 22px Georgia";

    ctx.fillText(
        Math.floor(score),
        W/2 + 95,
        panelY+136
    );

    /* divider */

    ctx.strokeStyle = theme.border;
    ctx.lineWidth = 1;
    ctx.globalAlpha = .7;

    ctx.beginPath();
    ctx.moveTo(panelX+65,panelY+160);
    ctx.lineTo(panelX+panelW-65,panelY+160);
    ctx.stroke();

    ctx.globalAlpha = 1;

    /* coins earned */

    ctx.fillStyle = theme.text;
    ctx.font = "16px Georgia";

    ctx.fillText(
        "Coins earned",
        W/2 - 95,
        panelY+205
    );

    ctx.fillStyle = theme.heading;
    ctx.font = "bold 24px Georgia";

    ctx.fillText(
        "+" + runCoinsEarned,
        W/2 + 95,
        panelY+205
    );

    ctx.fillStyle = theme.text;
    ctx.font = "13px Georgia";
    ctx.globalAlpha = .68;

    ctx.fillText(
        "Tap anywhere to run again",
        W/2,
        panelY+257
    );

    ctx.globalAlpha = 1;
}

/* ---------------------------------------------------------
   MAIN DRAW
   --------------------------------------------------------- */

function draw(){
    ctx.clearRect(0,0,W,H);

    drawBackground();
    drawGround();
    drawObstacles();
    drawBunny();
    drawScore();

    if(!started){
        drawStartScreen();
    }

    if(gameOver){
        drawGameOver();
    }

    updateFullscreenScore();
}

/* ---------------------------------------------------------
   COLLISION
   --------------------------------------------------------- */

function checkCollision(obstacle){
    /*
       Slightly forgiving hitbox around the bunny.
    */

    const bunnyBox = {
        x:bunny.x + 15,
        y:bunny.y + 17,
        width:48,
        height:59
    };

    const obstacleBox = {
        x:obstacle.x + 3,
        y:obstacle.y + 4,
        width:Math.max(1,obstacle.width - 6),
        height:Math.max(1,obstacle.height - 5)
    };

    return (
        bunnyBox.x < obstacleBox.x + obstacleBox.width &&
        bunnyBox.x + bunnyBox.width > obstacleBox.x &&
        bunnyBox.y < obstacleBox.y + obstacleBox.height &&
        bunnyBox.y + bunnyBox.height > obstacleBox.y
    );
}
</script><script>
/* ---------------------------------------------------------
   GAME UPDATE
   --------------------------------------------------------- */

function update(delta){
    if(!started || gameOver) return;

    const dt = Math.min(delta,32);

    /* bunny physics */

    bunny.velocityY += bunny.gravity * (dt / 16.67);
    bunny.y += bunny.velocityY * (dt / 16.67);

    const groundY = GROUND - bunny.height;

    if(bunny.y >= groundY){
        bunny.y = groundY;
        bunny.velocityY = 0;
        bunny.grounded = true;
    }else{
        bunny.grounded = false;
    }

    /* running animation */

    if(bunny.grounded){
        runFrameTimer += dt;

        if(runFrameTimer >= 45){
            runFrameTimer = 0;
            runFrame = (runFrame + 1) % 8;
        }
    }

    /* jumping animation */

    if(!bunny.grounded){
        jumpFrameTimer += dt;

        if(jumpFrameTimer >= 55){
            jumpFrameTimer = 0;
            jumpFrame = (jumpFrame + 1) % 8;
        }
    }

    /* speed */

    speed += .0008 * dt;

    /* score */

    score += .12 * dt;

    /* obstacles */

    obstacleTimer += dt;

    if(obstacleTimer >= nextObstacle){
        obstacleTimer = 0;
        nextObstacle = getNextObstacleDelay();

        spawnObstacle();
    }

    obstacles.forEach(obstacle=>{
        obstacle.x -= speed * (dt / 16.67);

        if(
            !obstacle.passed &&
            obstacle.x + obstacle.width < bunny.x
        ){
            obstacle.passed = true;
        }
    });

    /* remove old obstacles */

    while(
        obstacles.length &&
        obstacles[0].x + obstacles[0].width < -50
    ){
        obstacles.shift();
    }

    /* collision */

    for(const obstacle of obstacles){
        if(checkCollision(obstacle)){
            endGame();
            break;
        }
    }

    updateFullscreenScore();
}

/* ---------------------------------------------------------
   END GAME
   --------------------------------------------------------- */

function endGame(){
    if(gameOver) return;

    gameOver = true;

    playGameOverSound();

    score = Math.floor(score);

    /*
       IMPORTANT:
       Coins are NOT awarded during the run.

       We calculate them here and add them once.
       Every complete 1000 score = 10 coins.
    */

    awardRunCoins();

    if(score > topScore){
        topScore = score;
        localStorage.setItem(
            "bunnyRunHighScore",
            String(topScore)
        );
    }

    draw();
}

/* ---------------------------------------------------------
   GAME LOOP
   --------------------------------------------------------- */

function gameLoop(timestamp){
    if(!started) return;

    if(!lastTime){
        lastTime = timestamp;
    }

    const delta = timestamp - lastTime;
    lastTime = timestamp;

    update(delta);
    draw();

    animationFrame = requestAnimationFrame(gameLoop);
}

/* ---------------------------------------------------------
   INPUT
   --------------------------------------------------------- */

canvas.addEventListener("pointerdown",event=>{
    event.preventDefault();
    event.stopPropagation();

    jump();
},{
    passive:false
});

document.addEventListener("keydown",event=>{
    if(
        event.code === "Space" ||
        event.code === "ArrowUp" ||
        event.code === "KeyW"
    ){
        event.preventDefault();
        jump();
    }

    if(event.code === "KeyF"){
        event.preventDefault();
        toggleFullscreen();
    }
});

/*
   When fullscreen is active, tapping the small letterbox area
   outside the canvas can still jump.

   The canvas itself is excluded so it cannot trigger jump twice.
*/

document.addEventListener("pointerdown",event=>{
    const fullscreenActive =
        document.body.classList.contains("game-fullscreen");

    if(!fullscreenActive) return;

    if(event.target === canvas) return;

    if(
        event.target.closest &&
        event.target.closest("button,a")
    ){
        return;
    }

    event.preventDefault();
    jump();
},{
    passive:false
});

/* ---------------------------------------------------------
   FULLSCREEN
   --------------------------------------------------------- */

function setFullscreenClass(active){
    document.body.classList.toggle(
        "game-fullscreen",
        active
    );
}

async function toggleFullscreen(){
    try{
        if(document.fullscreenElement){
            await document.exitFullscreen();
            manualFullscreen = false;
            setFullscreenClass(false);
            return;
        }

        if(document.body.classList.contains("game-fullscreen")){
            manualFullscreen = false;
            setFullscreenClass(false);
            return;
        }

        if(
            gameShell.requestFullscreen &&
            document.fullscreenEnabled !== false
        ){
            try{
                await gameShell.requestFullscreen();

                manualFullscreen = false;
                setFullscreenClass(true);

                return;
            }catch(error){
                /*
                   Some mobile browsers expose the API but don't
                   allow it for this element. Use the visual fallback.
                */
            }
        }

        manualFullscreen = true;
        setFullscreenClass(true);

    }catch(error){
        manualFullscreen = true;
        setFullscreenClass(true);
    }
}

fullscreenButton.addEventListener("click",event=>{
    event.preventDefault();
    event.stopPropagation();

    toggleFullscreen();
});

fullscreenExit.addEventListener("click",event=>{
    event.preventDefault();
    event.stopPropagation();

    toggleFullscreen();
});

document.addEventListener("fullscreenchange",()=>{
    if(document.fullscreenElement){
        manualFullscreen = false;
        setFullscreenClass(true);
    }else if(!manualFullscreen){
        setFullscreenClass(false);
    }
});

   THEME CHANGES

window.addEventListener("storage",event=>{
    if(event.key === "arcade_theme"){
        applyTheme();

    }
});
