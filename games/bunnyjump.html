<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Bunny Run ♡</title>

<style>
:root{
    --bg-base:#f2f7fa;
    --bg-grad-1:#dce8f3;
    --bg-grad-2:#d3e2ea;
    --card:#ffffff;
    --text:#4a5360;
    --muted:#7d8792;
    --accent:#9db8c9;
    --accent-dark:#7e9caf;
    --border:#d8e2e8;
    --shadow:rgba(100,120,135,.16);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:Georgia,"Times New Roman",serif;
    color:var(--text);
    background:
        radial-gradient(circle at top left,rgba(255,255,255,.8),transparent 35%),
        linear-gradient(135deg,var(--bg-grad-1),var(--bg-grad-2));
    overflow-x:hidden;
}

button{
    font-family:inherit;
}

.page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 14px 30px;
}

.topbar{
    width:min(960px,100%);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
}

.back-btn,
.fullscreen-btn{
    border:1px solid var(--border);
    background:rgba(255,255,255,.82);
    color:var(--text);
    border-radius:14px;
    padding:10px 15px;
    font-size:14px;
    cursor:pointer;
    box-shadow:0 5px 16px var(--shadow);
    transition:.18s ease;
}

.back-btn:hover,
.fullscreen-btn:hover{
    transform:translateY(-1px);
    background:#fff;
}

.coin-display{
    border:1px solid var(--border);
    background:rgba(255,255,255,.88);
    color:var(--text);
    border-radius:14px;
    padding:10px 15px;
    font-size:14px;
    box-shadow:0 5px 16px var(--shadow);
    white-space:nowrap;
}

.coin-display span{
    font-weight:bold;
}

.game-card{
    width:min(1000px,100%);
    display:flex;
    flex-direction:column;
    align-items:center;
}

.game-title{
    margin:3px 0 5px;
    font-size:28px;
    font-weight:normal;
    letter-spacing:.3px;
}

.game-subtitle{
    margin:0 0 14px;
    color:var(--muted);
    font-size:14px;
}

.game-shell{
    position:relative;
    width:min(960px,100%);
    aspect-ratio:16/9;
    background:#8a9ca5;
    border:1px solid rgba(74,83,96,.16);
    border-radius:22px;
    overflow:hidden;
    box-shadow:
        0 18px 45px rgba(77,95,108,.20),
        0 3px 10px rgba(77,95,108,.10);
}

canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

.coin-toast{
    position:absolute;
    top:72px;
    left:50%;
    transform:translate(-50%,-8px);
    padding:9px 15px;
    border-radius:14px;
    background:rgba(255,255,255,.94);
    border:1px solid var(--border);
    box-shadow:0 8px 22px rgba(70,85,98,.18);
    color:var(--text);
    font-size:15px;
    font-weight:bold;
    opacity:0;
    pointer-events:none;
    transition:
        opacity .22s ease,
        transform .22s ease;
    z-index:20;
}

.coin-toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.game-shell.fullscreen-shell{
    border-radius:0;
}

body.game-fullscreen{
    padding:0;
    background:#8a9ca5;
}

body.game-fullscreen .page{
    padding:0;
    min-height:100vh;
    background:#8a9ca5;
}

body.game-fullscreen .topbar,
body.game-fullscreen .game-title,
body.game-fullscreen .game-subtitle{
    display:none;
}

body.game-fullscreen .game-card{
    width:100%;
    height:100vh;
}

body.game-fullscreen .game-shell{
    width:100vw;
    height:100vh;
    max-width:none;
    aspect-ratio:auto;
    border:none;
    border-radius:0;
    box-shadow:none;
}

@media(max-width:700px){
    .page{
        padding:12px 9px 20px;
    }

    .topbar{
        margin-bottom:10px;
    }

    .back-btn,
    .fullscreen-btn,
    .coin-display{
        padding:8px 11px;
        font-size:12px;
        border-radius:12px;
    }

    .game-title{
        font-size:23px;
    }

    .game-subtitle{
        font-size:12px;
        margin-bottom:10px;
    }

    .game-shell{
        border-radius:17px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="topbar">
        <button class="back-btn" id="backBtn">← Back to Games</button>

        <button class="fullscreen-btn" id="fullscreenBtn">
            Fullscreen
        </button>

        <div class="coin-display">
            <span id="coin-count">0</span> Coins
        </div>
    </div>

    <div class="game-card">

        <h1 class="game-title">Bunny Run</h1>
        <p class="game-subtitle">How far can you run?</p>

        <div class="game-shell" id="gameShell">

            <canvas id="gameCanvas" width="960" height="540"></canvas>

            <div class="coin-toast" id="coinToast"></div>

        </div>

    </div>

</div>

<script>
/* =========================================
   ARCADE COIN SYSTEM BRIDGE
   ========================================= */

function getCurrentArcadeUser(){
    return localStorage.getItem("arcade_current_user") || "Player";
}

function getArcadeUsers(){
    try{
        return JSON.parse(localStorage.getItem("arcade_users") || "{}");
    }catch{
        return {};
    }
}

function saveArcadeUsers(users){
    localStorage.setItem("arcade_users",JSON.stringify(users));
}

function getArcadeCoins(){
    const users=getArcadeUsers();
    const currentUser=getCurrentArcadeUser();

    if(users[currentUser] && typeof users[currentUser].coins==="number"){
        return users[currentUser].coins;
    }

    const fallback=parseInt(localStorage.getItem("arcade_coins") || "0",10);

    if(!users[currentUser]){
        users[currentUser]={
            coins:isNaN(fallback) ? 0 : fallback
        };
        saveArcadeUsers(users);
    }

    return users[currentUser].coins || 0;
}

function addCoins(amount){
    amount=parseInt(amount,10);

    if(!Number.isFinite(amount) || amount<=0){
        return;
    }

    const users=getArcadeUsers();
    const currentUser=getCurrentArcadeUser();

    if(!users[currentUser]){
        users[currentUser]={
            coins:0
        };
    }

    if(typeof users[currentUser].coins!=="number"){
        users[currentUser].coins=0;
    }

    users[currentUser].coins+=amount;

    localStorage.setItem(
        "arcade_coins",
        String(users[currentUser].coins)
    );

    saveArcadeUsers(users);

    updateCoinDisplays();
}

function updateCoinDisplays(){
    const coins=getArcadeCoins();

    document.querySelectorAll("#coin-count,.coin-count").forEach(el=>{
        el.textContent=coins;
    });
}

/* Keep the counter synced if another Arcade page changes it. */
window.addEventListener("storage",e=>{
    if(
        e.key==="arcade_coins" ||
        e.key==="arcade_users" ||
        e.key==="arcade_current_user"
    ){
        updateCoinDisplays();
    }
});

updateCoinDisplays();


/* =========================================
   NAVIGATION
   ========================================= */

document.getElementById("backBtn").addEventListener("click",()=>{
    window.location.href="games.html";
});


/* =========================================
   FULLSCREEN
   ========================================= */

const gameShell=document.getElementById("gameShell");
const fullscreenBtn=document.getElementById("fullscreenBtn");

fullscreenBtn.addEventListener("click",async()=>{
    try{
        if(!document.fullscreenElement){
            await gameShell.requestFullscreen();
        }else{
            await document.exitFullscreen();
        }
    }catch(err){
        console.log("Fullscreen unavailable:",err);
    }
});

document.addEventListener("fullscreenchange",()=>{
    if(document.fullscreenElement===gameShell){
        document.body.classList.add("game-fullscreen");
        gameShell.classList.add("fullscreen-shell");
        fullscreenBtn.textContent="Exit Fullscreen";
    }else{
        document.body.classList.remove("game-fullscreen");
        gameShell.classList.remove("fullscreen-shell");
        fullscreenBtn.textContent="Fullscreen";
    }
});


/* =========================================
   CANVAS
   ========================================= */

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

const W=960;
const H=540;

const GROUND=425;

let gameStarted=false;
let dead=false;

let score=0;
let topScore=parseInt(
    localStorage.getItem("bunnyRun_topScore") || "0",
    10
);

let gameSpeed=6;

let lastTime=0;
let animationFrame=0;

let lastCoinMilestone=0;
let runCoinsEarned=0;


/* =========================================
   BUNNY
   ========================================= */

const bunny={
    x:110,
    y:GROUND-28,
    width:28,
    height:28,

    velocityY:0,

    gravity:.72,
    jumpPower:-16.2,

    grounded:true,

    frame:0,
    frameTimer:0,
    frameDelay:45
};


/* =========================================
   IMAGES
   ========================================= */

const idleImage=new Image();
const runImage=[];
const jumpImage=[];


/*
   Bunny sprites.
   The base64 sprite data stays in the game.
*/

idleImage.src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABwAAAAcCAYAAAByDd+UAAAA9klEQVR42u1UMQ6EIBAEYmdvjIUlhbVP8AE+1Qf4BGsLSwtj";


for(let i=0;i<8;i++){
    const img=new Image();
    runImage.push(img);
}


for(let i=0;i<8;i++){
    const img=new Image();
    jumpImage.push(img);
}


/* =========================================
   OBSTACLES
   ========================================= */

let obstacles=[];

let obstacleTimer=0;

const cactusTextures=[
    {
        width:24,
        height:42,
        type:"small"
    },
    {
        width:31,
        height:54,
        type:"medium"
    },
    {
        width:40,
        height:68,
        type:"tall"
    },
    {
        width:55,
        height:48,
        type:"wide"
    }
];

function createObstacle(){

    const texture=
        cactusTextures[
            Math.floor(
                Math.random()*cactusTextures.length
            )
        ];

    const last=obstacles[obstacles.length-1];

    let minimumGap=360;

    if(last){
        minimumGap=Math.max(
            330,
            410-(gameSpeed*4)
        );
    }

    const x=
        W+
        minimumGap+
        Math.random()*170;

    obstacles.push({
        x:x,
        y:GROUND-texture.height,
        width:texture.width,
        height:texture.height,
        type:texture.type,
        passed:false
    });
}


/* =========================================
   COIN REWARDS
   ========================================= */

function showCoinToast(amount){

    const toast=document.getElementById("coinToast");

    toast.textContent=`+${amount} Coins`;
    toast.classList.remove("show");

    void toast.offsetWidth;

    toast.classList.add("show");

    clearTimeout(window.coinToastTimer);

    window.coinToastTimer=setTimeout(()=>{
        toast.classList.remove("show");
    },1100);
}

function awardCoinsForScore(){

    const currentCoinMilestone=
        Math.floor(score/1000);

    if(currentCoinMilestone>lastCoinMilestone){

        const earned=
            currentCoinMilestone-
            lastCoinMilestone;

        const coinsEarned=
            earned*10;

        addCoins(coinsEarned);

        runCoinsEarned+=coinsEarned;

        lastCoinMilestone=
            currentCoinMilestone;

        showCoinToast(coinsEarned);
    }
}

function updateCoinDisplay(){
    updateCoinDisplays();
}<script>

/* =========================================
   DRAWING HELPERS
   ========================================= */

function drawBackground(){

    ctx.fillStyle="#8a9ca5";
    ctx.fillRect(0,0,W,H);

    /*
       Soft sky details.
    */

    ctx.fillStyle="rgba(255,255,255,.10)";

    ctx.beginPath();
    ctx.arc(160,95,45,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(760,125,62,0,Math.PI*2);
    ctx.fill();

    /*
       Ground.
    */

    ctx.fillStyle="#687b84";
    ctx.fillRect(0,GROUND,W,H-GROUND);

    ctx.fillStyle="#536870";
    ctx.fillRect(0,GROUND,W,5);

    /*
       Small ground pixels.
    */

    ctx.fillStyle="rgba(255,255,255,.12)";

    for(let x=0;x<W;x+=48){

        const offset=
            Math.floor(
                (x+animationFrame*.5)%96
            );

        ctx.fillRect(
            x-offset,
            GROUND+23,
            16,
            3
        );
    }
}


/* =========================================
   CACTUS DRAWING
   ========================================= */

function drawCactus(obstacle){

    const x=obstacle.x;
    const y=obstacle.y;
    const w=obstacle.width;
    const h=obstacle.height;

    ctx.save();

    ctx.fillStyle="#536b58";

    /*
       Main cactus body.
    */

    const bodyWidth=
        obstacle.type==="wide"
        ? w*.48
        : Math.max(10,w*.42);

    const bodyX=
        x+(w-bodyWidth)/2;

    ctx.fillRect(
        bodyX,
        y,
        bodyWidth,
        h
    );

    /*
       Rounded top.
    */

    ctx.beginPath();

    ctx.arc(
        bodyX+bodyWidth/2,
        y,
        bodyWidth/2,
        Math.PI,
        0
    );

    ctx.fill();

    /*
       Arms.
    */

    if(obstacle.type!=="small"){

        const armWidth=
            Math.max(7,bodyWidth*.65);

        const armHeight=
            Math.max(13,h*.28);

        ctx.fillRect(
            x,
            y+h*.35,
            armWidth,
            armHeight
        );

        ctx.fillRect(
            x,
            y+h*.35-armWidth*.45,
            armWidth*.7,
            armWidth*.45
        );

        ctx.fillRect(
            x+w-armWidth,
            y+h*.48,
            armWidth,
            armHeight
        );

        ctx.fillRect(
            x+w-armWidth*.7,
            y+h*.48-armWidth*.45,
            armWidth*.7,
            armWidth*.45
        );
    }

    /*
       Cactus highlights.
    */

    ctx.fillStyle="rgba(255,255,255,.12)";

    ctx.fillRect(
        bodyX+2,
        y+5,
        3,
        Math.max(8,h-10)
    );

    ctx.restore();
}


/* =========================================
   BUNNY DRAWING
   ========================================= */

function drawBunny(){

    ctx.save();

    const bx=bunny.x;
    const by=bunny.y;

    /*
       Keep the bunny facing right.
    */

    ctx.translate(
        bx+bunny.width,
        by
    );

    ctx.scale(-1,1);

    let img=null;

    if(!bunny.grounded){

        if(
            jumpImage[bunny.frame] &&
            jumpImage[bunny.frame].complete &&
            jumpImage[bunny.frame].naturalWidth
        ){
            img=jumpImage[bunny.frame];
        }else if(
            idleImage.complete &&
            idleImage.naturalWidth
        ){
            img=idleImage;
        }

    }else{

        if(
            runImage[bunny.frame] &&
            runImage[bunny.frame].complete &&
            runImage[bunny.frame].naturalWidth
        ){
            img=runImage[bunny.frame];
        }else if(
            idleImage.complete &&
            idleImage.naturalWidth
        ){
            img=idleImage;
        }
    }

    if(img){

        const drawHeight=
            bunny.grounded
            ? bunny.height
            : bunny.height+8;

        const drawY=
            bunny.grounded
            ? 0
            : -4;

        ctx.drawImage(
            img,
            0,
            drawY,
            bunny.width,
            drawHeight
        );

    }else{

        /*
           Temporary fallback only if an image
           has not loaded yet.
        */

        ctx.fillStyle="#b8905b";

        ctx.fillRect(
            4,
            8,
            20,
            17
        );

        ctx.fillRect(
            9,
            2,
            7,
            11
        );

        ctx.fillRect(
            17,
            4,
            6,
            10
        );

        ctx.fillStyle="#3a2518";

        ctx.fillRect(
            19,
            11,
            3,
            3
        );

        ctx.fillRect(
            24,
            17,
            3,
            3
        );

        ctx.fillStyle="#e6d5b8";

        ctx.fillRect(
            7,
            20,
            8,
            4
        );
    }

    ctx.restore();
}


/* =========================================
   SCORE
   ========================================= */

function drawScore(){

    ctx.save();

    ctx.textAlign="right";

    ctx.font="bold 24px Georgia, serif";

    ctx.fillStyle="rgba(255,255,255,.92)";

    ctx.fillText(
        `Score: ${score}`,
        W-28,
        42
    );

    ctx.font="16px Georgia, serif";

    ctx.fillStyle="rgba(255,255,255,.72)";

    ctx.fillText(
        `Best: ${topScore}`,
        W-28,
        65
    );

    ctx.restore();
}


/* =========================================
   START SCREEN
   ========================================= */

function drawStartScreen(){

    if(gameStarted || dead){
        return;
    }

    ctx.save();

    ctx.fillStyle="rgba(40,52,58,.18)";
    ctx.fillRect(0,0,W,H);

    ctx.textAlign="center";

    ctx.fillStyle="rgba(255,255,255,.96)";
    ctx.font="bold 34px Georgia, serif";

    ctx.fillText(
        "Bunny Run",
        W/2,
        215
    );

    ctx.font="19px Georgia, serif";

    ctx.fillStyle="rgba(255,255,255,.88)";

    ctx.fillText(
        "Tap or press Space to start",
        W/2,
        255
    );

    ctx.font="15px Georgia, serif";

    ctx.fillStyle="rgba(255,255,255,.68)";

    ctx.fillText(
        "Jump over the cacti",
        W/2,
        285
    );

    ctx.restore();
}


/* =========================================
   GAME OVER
   ========================================= */

function drawGameOver(){

    ctx.save();

    /*
       Dark overlay.
    */

    ctx.fillStyle="rgba(38,48,54,.42)";
    ctx.fillRect(0,0,W,H);

    /*
       Bigger losing panel.
    */

    const panelWidth=500;
    const panelHeight=330;

    const panelX=
        (W-panelWidth)/2;

    const panelY=
        (H-panelHeight)/2;

    ctx.fillStyle="rgba(255,255,255,.97)";

    roundRect(
        ctx,
        panelX,
        panelY,
        panelWidth,
        panelHeight,
        28
    );

    ctx.fill();

    /*
       Little shadow/border.
    */

    ctx.strokeStyle="rgba(74,83,96,.12)";
    ctx.lineWidth=2;

    roundRect(
        ctx,
        panelX,
        panelY,
        panelWidth,
        panelHeight,
        28
    );

    ctx.stroke();

    /*
       Skull.
    */

    ctx.textAlign="center";

    ctx.font="44px Georgia, serif";

    ctx.fillStyle="#687b84";

    ctx.fillText(
        "☠",
        W/2,
        panelY+68
    );

    /*
       Title.
    */

    ctx.font="bold 32px Georgia, serif";

    ctx.fillStyle="#4a5360";

    ctx.fillText(
        "Game Over",
        W/2,
        panelY+116
    );

    /*
       Score.
    */

    ctx.font="19px Georgia, serif";

    ctx.fillStyle="#68737d";

    ctx.fillText(
        `Score: ${score}`,
        W/2,
        panelY+158
    );

    /*
       Coins.
    */

    ctx.font="18px Georgia, serif";

    ctx.fillStyle="#68737d";

    ctx.fillText(
        `Coins earned: ${runCoinsEarned}`,
        W/2,
        panelY+190
    );

    /*
       Best score.
    */

    ctx.font="16px Georgia, serif";

    ctx.fillStyle="#8a949c";

    ctx.fillText(
        `Best: ${topScore}`,
        W/2,
        panelY+218
    );

    /*
       Restart instruction.
    */

    ctx.font="16px Georgia, serif";

    ctx.fillStyle="#9aa3aa";

    ctx.fillText(
        "Tap anywhere to play again",
        W/2,
        panelY+270
    );

    ctx.restore();
}


/* =========================================
   ROUNDED RECTANGLE
   ========================================= */

function roundRect(
    context,
    x,
    y,
    width,
    height,
    radius
){

    context.beginPath();

    context.moveTo(
        x+radius,
        y
    );

    context.lineTo(
        x+width-radius,
        y
    );

    context.quadraticCurveTo(
        x+width,
        y,
        x+width,
        y+radius
    );

    context.lineTo(
        x+width,
        y+height-radius
    );

    context.quadraticCurveTo(
        x+width,
        y+height,
        x+width-radius,
        y+height
    );

    context.lineTo(
        x+radius,
        y+height
    );

    context.quadraticCurveTo(
        x,
        y+height,
        x,
        y+height-radius
    );

    context.lineTo(
        x,
        y+radius
    );

    context.quadraticCurveTo(
        x,
        y,
        x+radius,
        y
    );

    context.closePath();
}


/* =========================================
   MAIN DRAW
   ========================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawBackground();

    for(const obstacle of obstacles){
        drawCactus(obstacle);
    }

    drawBunny();

    drawScore();

    if(!gameStarted && !dead){
        drawStartScreen();
    }

    if(dead){
        drawGameOver();
    }
}


/* =========================================
   COLLISION
   ========================================= */

function checkCollision(obstacle){

    /*
       Slightly forgiving hitbox.
    */

    const paddingX=5;
    const paddingY=4;

    const bunnyLeft=
        bunny.x+paddingX;

    const bunnyRight=
        bunny.x+bunny.width-paddingX;

    const bunnyTop=
        bunny.y+paddingY;

    const bunnyBottom=
        bunny.y+bunny.height-paddingY;

    const obstacleLeft=
        obstacle.x+3;

    const obstacleRight=
        obstacle.x+
        obstacle.width-
        3;

    const obstacleTop=
        obstacle.y+3;

    const obstacleBottom=
        obstacle.y+
        obstacle.height;

    return(
        bunnyRight>obstacleLeft &&
        bunnyLeft<obstacleRight &&
        bunnyBottom>obstacleTop &&
        bunnyTop<obstacleBottom
    );

/* =========================================
   JUMP
   ========================================= */

function jump(){

    if(dead){
        restartGame();
        return;
    }

    if(!gameStarted){
        gameStarted=true;
        bunny.grounded=true;
        return;
    }

    if(bunny.grounded){

        bunny.velocityY=
            bunny.jumpPower;

        bunny.grounded=false;
    }
}


/* =========================================
   RESTART
   ========================================= */

function restartGame(){

    gameStarted=true;
    dead=false;

    score=0;

    gameSpeed=6;

    obstacles=[];

    obstacleTimer=0;

    lastCoinMilestone=0;

    runCoinsEarned=0;

    bunny.x=110;
    bunny.y=GROUND-bunny.height;
    bunny.velocityY=0;
    bunny.grounded=true;

    bunny.frame=0;
    bunny.frameTimer=0;

    lastTime=performance.now();

    draw();
}


/* =========================================
   GAME OVER
   ========================================= */

function endGame(){

    if(dead){
        return;
    }

    dead=true;
    gameStarted=false;

    if(score>topScore){

        topScore=score;

        localStorage.setItem(
            "bunnyRun_topScore",
            String(topScore)
        );
    }

    draw();
}


/* =========================================
   UPDATE BUNNY
   ========================================= */

function updateBunny(delta){

    if(!gameStarted || dead){
        return;
    }

    bunny.velocityY+=
        bunny.gravity*delta;

    bunny.y+=
        bunny.velocityY*delta;

    const floorY=
        GROUND-bunny.height;

    if(bunny.y>=floorY){

        bunny.y=floorY;

        bunny.velocityY=0;

        bunny.grounded=true;
    }else{

        bunny.grounded=false;
    }


    /*
       Run animation.
    */

    if(bunny.grounded){

        bunny.frameTimer+=
            delta*16.67;

        if(
            bunny.frameTimer>=
            bunny.frameDelay
        ){

            bunny.frameTimer=0;

            bunny.frame=
                (bunny.frame+1)%
                Math.max(
                    1,
                    runImage.length
                );
        }

    }else{

        bunny.frameTimer+=
            delta*16.67;

        if(
            bunny.frameTimer>=
            bunny.frameDelay
        ){

            bunny.frameTimer=0;

            bunny.frame=
                (bunny.frame+1)%
                Math.max(
                    1,
                    jumpImage.length
                );
        }
    }
}


/* =========================================
   UPDATE OBSTACLES
   ========================================= */

function updateObstacles(delta){

    if(!gameStarted || dead){
        return;
    }

    /*
       Increase speed gradually.
    */

    gameSpeed+=
        0.0008*delta;

    if(gameSpeed>11){
        gameSpeed=11;
    }

    /*
       Spawn timing.

       Cacti are intentionally farther apart
       than the original version.
    */

    obstacleTimer+=
        delta*16.67;

    const spawnDelay=
        Math.max(
            950,
            1450-
            gameSpeed*35
        );

    if(
        obstacleTimer>=spawnDelay &&
        (
            obstacles.length===0 ||
            obstacles[obstacles.length-1].x<
            W-300
        )
    ){

        createObstacle();

        obstacleTimer=0;
    }


    /*
       Move obstacles.
    */

    for(let i=obstacles.length-1;i>=0;i--){

        const obstacle=
            obstacles[i];

        obstacle.x-=
            gameSpeed*delta;


        /*
           Collision.
        */

        if(checkCollision(obstacle)){

            endGame();

            return;
        }


        /*
           Score when passed.
        */

        if(
            !obstacle.passed &&
            obstacle.x+
            obstacle.width<
            bunny.x
        ){

            obstacle.passed=true;

            score++;

            if(score>topScore){

                topScore=score;

                localStorage.setItem(
                    "bunnyRun_topScore",
                    String(topScore)
                );
            }

            awardCoinsForScore();
        }


        /*
           Remove old obstacles.
        */

        if(
            obstacle.x+
            obstacle.width<
            -100
        ){

            obstacles.splice(i,1);
        }
    }
}


/* =========================================
   GAME UPDATE
   ========================================= */

function updateGame(delta){

    if(!gameStarted || dead){
        return;
    }

    updateBunny(delta);

    updateObstacles(delta);

    /*
       Also check the score here so a milestone
       cannot be missed.
    */

    awardCoinsForScore();
}


/* =========================================
   MAIN LOOP
   ========================================= */

function gameLoop(timestamp){

    if(!lastTime){
        lastTime=timestamp;
    }

    let delta=
        (timestamp-lastTime)/16.67;

    /*
       Prevent huge jumps after tab switching.
    */

    if(delta>2){
        delta=2;
    }

    lastTime=timestamp;

    animationFrame++;

    updateGame(delta);

    draw();

    requestAnimationFrame(gameLoop);
}


/* =========================================
   INPUT
   ========================================= */

document.addEventListener("keydown",event=>{

    if(
        event.code==="Space" ||
        event.code==="ArrowUp"
    ){

        event.preventDefault();

        jump();
    }
});


canvas.addEventListener(
    "pointerdown",
    event=>{

        event.preventDefault();

        jump();
    },
    {
        passive:false
    }
);


/*
   Prevent accidental scrolling from touch
   while playing.
*/

canvas.addEventListener(
    "touchstart",
    event=>{
        event.preventDefault();
    },
    {
        passive:false
    }
);

canvas.addEventListener(
    "touchmove",
    event=>{
        event.preventDefault();
    },
    {
        passive:false
    }
);


/* =========================================
   THEME SUPPORT
   ========================================= */

function applyArcadeTheme(){

    const theme=
        localStorage.getItem("arcade_theme");

    if(!theme){
        return;
    }

    /*
       The Bunny Run game keeps its own
       canvas palette, but the surrounding
       page follows the Arcade theme where
       possible.
    */

    document.documentElement
        .style
        .setProperty(
            "--accent",
            theme
        );
}


/* =========================================
   IMAGE LOAD / STARTUP
   ========================================= */

applyArcadeTheme();

updateCoinDisplay();

bunny.y=
    GROUND-bunny.height;

draw();

requestAnimationFrame(gameLoop);

</script>

</html>
