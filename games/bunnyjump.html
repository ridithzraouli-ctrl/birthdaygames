<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bunny Run</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#b8cbd1;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Georgia,serif;
}

#game{
    width:min(960px,100vw);
    height:auto;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    display:block;
}
</style>
</head>

<body>

<canvas id="game" width="960" height="540"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

ctx.imageSmoothingEnabled=false;

const W=960;
const H=540;
const GROUND=425;

const BG="#b8cbd1";
const SKY_TOP="#a8c7d0";
const SKY_BOTTOM="#d5e1d9";

const DARK="#29332f";

const GROUND_TOP="#756d59";
const GROUND_BASE="#625b4b";
const GROUND_LIGHT="#887f68";
const GROUND_DARK="#48453b";


/* =========================
   BUNNY
========================= */

const idleImage=new Image();
const runImage=new Image();
const jumpImage=new Image();


/* =========================
   CACTUS TEXTURES
========================= */

const cactusImages={
    small:new Image(),
    tall:new Image(),
    left:new Image(),
    right:new Image(),
    cluster:new Image()
};

cactusImages.small.src="images/cactus-small.png";
cactusImages.tall.src="images/cactus-tall.png";
cactusImages.left.src="images/cactus-left.png";
cactusImages.right.src="images/cactus-right.png";
cactusImages.cluster.src="images/cactus-cluster.png";


/* =========================
   GAME STATE
========================= */

let started=false;
let dead=false;

let lastTime=0;

let score=0;

let highScore=
    Number(
        localStorage.getItem("bunnyRunHighScore")||0
    );

let speed=6;

let groundOffset=0;

let runAnimTime=0;
let jumpTime=0;

let spawnTimer=0;
let nextSpawn=1200;

let lastMilestone=0;


/* =========================
   BUNNY
========================= */

const bunny={
    x:110,

    y:GROUND-28,

    width:28,
    height:28,

    velocityY:0,

    grounded:true,

    gravity:0.72,

    jumpPower:-21.5
};


/* =========================
   CACTUS SIZES
========================= */

const UNIT=84;

const cactusTypes=[

    {
        name:"small",
        image:cactusImages.small,
        width:UNIT,
        height:UNIT
    },

    {
        name:"tall",
        image:cactusImages.tall,
        width:UNIT,
        height:UNIT*3
    },

    {
        name:"left",
        image:cactusImages.left,
        width:UNIT*1.5,
        height:UNIT*2
    },

    {
        name:"right",
        image:cactusImages.right,
        width:UNIT*1.5,
        height:UNIT*2
    },

    {
        name:"cluster",
        image:cactusImages.cluster,
        width:UNIT*3.5,
        height:UNIT*2
    }

];


/* =========================
   CREATE CACTUS
========================= */

function createCactus(type,x){

    return{
        x:x,

        y:
            GROUND-
            type.height,

        width:type.width,

        height:type.height,

        image:type.image,

        name:type.name,

        counted:false
    };
}


/* =========================
   OBSTACLES
========================= */

const obstacles=[];


/* =========================
   SPAWN CACTUS
========================= */

function spawnCactus(){

    const difficulty=
        Math.min(
            score/100,
            30
        );

    let count=1;

    if(
        difficulty>8 &&
        Math.random()<0.22
    ){
        count=2;
    }

    if(
        difficulty>18 &&
        Math.random()<0.10
    ){
        count=3;
    }

    const firstType=
        cactusTypes[
            Math.floor(
                Math.random()*
                cactusTypes.length
            )
        ];

    let x=W+60;

    for(
        let i=0;
        i<count;
        i++
    ){

        let type;

        if(i===0){

            type=firstType;

        }else{

            const extraTypes=[
                cactusTypes[0],
                cactusTypes[2],
                cactusTypes[3]
            ];

            type=
                extraTypes[
                    Math.floor(
                        Math.random()*
                        extraTypes.length
                    )
                ];
        }

        const cactus=
            createCactus(
                type,
                x
            );

        obstacles.push(cactus);

        x+=
            type.width+
            45;
    }

    const minimum=
        Math.max(
            900,
            1250-
            difficulty*12
        );

    const maximum=
        Math.max(
            1250,
            1650-
            difficulty*10
        );

    nextSpawn=
        minimum+
        Math.random()*
        (maximum-minimum);

    spawnTimer=0;
}


/* =========================
   SKY
========================= */

function drawSky(){

    const gradient=
        ctx.createLinearGradient(
            0,
            0,
            0,
            GROUND
        );

    gradient.addColorStop(
        0,
        SKY_TOP
    );

    gradient.addColorStop(
        1,
        SKY_BOTTOM
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        GROUND
    );

    ctx.fillStyle="#dfe8e4";

    const cloudY=92;

    ctx.fillRect(
        130,
        cloudY,
        70,
        8
    );

    ctx.fillRect(
        146,
        cloudY-7,
        38,
        7
    );

    ctx.fillRect(
        158,
        cloudY-12,
        20,
        5
    );

    ctx.fillRect(
        620,
        145,
        86,
        8
    );

    ctx.fillRect(
        640,
        138,
        42,
        7
    );

    ctx.fillRect(
        655,
        132,
        22,
        6
    );

    ctx.fillStyle="#cbdcda";

    ctx.fillRect(
        335,
        72,
        45,
        6
    );

    ctx.fillRect(
        347,
        66,
        25,
        6
    );

    ctx.fillRect(
        790,
        78,
        58,
        7
    );

    ctx.fillRect(
        805,
        71,
        27,
        7
    );
}


/* =========================
   GROUND
========================= */

function drawGround(){

    ctx.fillStyle=GROUND_BASE;

    ctx.fillRect(
        0,
        GROUND,
        W,
        H-GROUND
    );

    ctx.fillStyle=GROUND_TOP;

    ctx.fillRect(
        0,
        GROUND,
        W,
        9
    );

    ctx.fillStyle=GROUND_LIGHT;

    ctx.fillRect(
        0,
        GROUND,
        W,
        3
    );

    const tile=80;

    for(
        let x=groundOffset-tile;
        x<W+tile;
        x+=tile
    ){

        ctx.fillStyle=GROUND_DARK;

        ctx.fillRect(
            x+7,
            GROUND+22,
            22,
            4
        );

        ctx.fillRect(
            x+49,
            GROUND+39,
            15,
            4
        );

        ctx.fillRect(
            x+19,
            GROUND+57,
            30,
            4
        );

        ctx.fillStyle=GROUND_LIGHT;

        ctx.fillRect(
            x+32,
            GROUND+15,
            8,
            3
        );

        ctx.fillRect(
            x+63,
            GROUND+28,
            7,
            3
        );

        ctx.fillRect(
            x+3,
            GROUND+48,
            10,
            3
        );

        ctx.fillRect(
            x+56,
            GROUND+65,
            16,
            3
        );
    }

    for(
        let x=groundOffset-40;
        x<W+80;
        x+=120
    ){

        ctx.fillStyle=GROUND_LIGHT;

        ctx.fillRect(
            x,
            GROUND+12,
            3,
            7
        );

        ctx.fillRect(
            x+4,
            GROUND+15,
            3,
            4
        );
    }
}/* =========================
   CACTUS DRAWING
========================= */

function drawCactus(o){

    if(
        !o.image.complete ||
        !o.image.naturalWidth
    ){
        return;
    }

    ctx.drawImage(
        o.image,

        Math.round(o.x),
        Math.round(o.y),

        Math.round(o.width),
        Math.round(o.height)
    );
}


/* =========================
   BUNNY ANIMATION
========================= */

function drawBunny(){

    let image;

    let frameWidth=28;
    let frameHeight=28;

    let frameIndex=0;


    if(!started && !dead){

        image=idleImage;

        frameIndex=0;

    }

    else if(!bunny.grounded){

        image=jumpImage;

        frameWidth=28;
        frameHeight=36;

        const jumpAnimationDuration=560;

        frameIndex=Math.min(
            7,
            Math.floor(
                (
                    jumpTime/
                    jumpAnimationDuration
                )*8
            )
        );

    }

    else{

        image=runImage;

        frameWidth=28;
        frameHeight=28;

        frameIndex=
            Math.floor(
                runAnimTime/45
            )%8;
    }


    if(
        !image.complete ||
        !image.naturalWidth
    ){
        return;
    }


    /*
        Bunny stays at the old
        3× visual size.
    */

    const drawW=
        frameWidth*3;

    const drawH=
        frameHeight*3;


    const feetY=
        bunny.y+bunny.height;

    const drawX=
        bunny.x;

    const drawY=
        feetY-drawH;


    ctx.save();

    ctx.translate(
        drawX+drawW,
        drawY
    );

    ctx.scale(
        -1,
        1
    );

    ctx.drawImage(
        image,

        frameIndex*frameWidth,
        0,

        frameWidth,
        frameHeight,

        0,
        0,

        drawW,
        drawH
    );

    ctx.restore();
}


/* =========================
   BUNNY COLLISION
========================= */

function getBunnyHitbox(){

    return{

        x:
            bunny.x+13,

        y:
            bunny.y+12,

        width:52,

        height:60
    };
}


/* =========================
   CACTUS COLLISION
========================= */

function checkCollision(){

    const b=
        getBunnyHitbox();


    for(
        const o of obstacles
    ){

        const paddingX=8;
        const paddingTop=4;


        const cactusHit={

            x:
                o.x+
                paddingX,

            y:
                o.y+
                paddingTop,

            width:
                Math.max(
                    1,
                    o.width-
                    paddingX*2
                ),

            height:
                Math.max(
                    1,
                    o.height-
                    paddingTop
                )
        };


        if(

            b.x<
                cactusHit.x+
                cactusHit.width

            &&

            b.x+b.width>
                cactusHit.x

            &&

            b.y<
                cactusHit.y+
                cactusHit.height

            &&

            b.y+b.height>
                cactusHit.y

        ){

            return true;
        }
    }


    return false;
}


/* =========================
   AUDIO
========================= */

let audioContext=null;


function initAudio(){

    if(!audioContext){

        audioContext=
            new(
                window.AudioContext||
                window.webkitAudioContext
            )();
    }


    if(
        audioContext.state===
        "suspended"
    ){

        audioContext.resume();
    }
}


function play100Sound(){

    if(!audioContext){
        return;
    }


    const now=
        audioContext.currentTime;


    const notes=[
        880,
        1046.5,
        1318.5
    ];


    notes.forEach(
        (frequency,index)=>{

            const oscillator=
                audioContext.createOscillator();

            const gain=
                audioContext.createGain();


            oscillator.type="square";

            oscillator.frequency.value=
                frequency;


            const start=
                now+
                index*0.075;


            gain.gain.setValueAtTime(
                0,
                start
            );


            gain.gain.linearRampToValueAtTime(
                0.055,
                start+0.008
            );


            gain.gain.exponentialRampToValueAtTime(
                0.001,
                start+0.07
            );


            oscillator.connect(gain);

            gain.connect(
                audioContext.destination
            );


            oscillator.start(start);

            oscillator.stop(
                start+0.075
            );
        }
    );
}


/* =========================
   SCORE
========================= */

function passCactus(o){

    if(o.counted){
        return;
    }


    if(
        o.x+o.width<
        bunny.x
    ){

        o.counted=true;


        /*
            EXACTLY +10 FOR EVERY
            INDIVIDUAL CACTUS.
        */

        score+=10;


        if(score>highScore){

            highScore=score;

            localStorage.setItem(
                "bunnyRunHighScore",
                highScore
            );
        }


        /*
            Sound at exactly:
            100, 200, 300...
        */

        if(
            score%100===0 &&
            score!==lastMilestone
        ){

            lastMilestone=score;

            play100Sound();
        }
    }
}


/* =========================
   JUMP
========================= */

function jump(){

    if(!started){

        started=true;

        bunny.grounded=true;

        runAnimTime=0;

        jumpTime=0;

        lastTime=
            performance.now();

        requestAnimationFrame(loop);

        return;
    }


    if(dead){

        restart();

        return;
    }


    if(bunny.grounded){

        bunny.velocityY=
            bunny.jumpPower;

        bunny.grounded=false;

        jumpTime=0;
    }
}


/* =========================
   RESTART
========================= */

function restart(){

    score=0;

    speed=6;

    lastMilestone=0;

    obstacles.length=0;

    spawnTimer=0;

    nextSpawn=1200;


    bunny.y=
        GROUND-28;

    bunny.velocityY=0;

    bunny.grounded=true;


    runAnimTime=0;

    jumpTime=0;

    groundOffset=0;


    dead=false;

    started=true;


    lastTime=
        performance.now();


    requestAnimationFrame(loop);
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    dead=true;

    bunny.velocityY=0;
    }/* =========================
   UPDATE
========================= */

function update(dt){

    if(
        !started||
        dead
    ){
        return;
    }


    /*
        RUN ANIMATION
    */

    if(bunny.grounded){

        runAnimTime+=dt;
    }


    /*
        BUNNY PHYSICS
    */

    if(!bunny.grounded){

        jumpTime+=dt;


        bunny.velocityY+=
            bunny.gravity*
            (dt/16.6667);


        bunny.y+=
            bunny.velocityY*
            (dt/16.6667);


        const groundY=
            GROUND-28;


        if(
            bunny.y>=groundY
        ){

            bunny.y=groundY;

            bunny.velocityY=0;

            bunny.grounded=true;

            runAnimTime=0;

            jumpTime=0;
        }
    }


    /*
        SPEED
    */

    speed+=
        0.00035*dt;


    speed=
        Math.min(
            speed,
            12
        );


    const movement=
        speed*
        (dt/16.6667);


    /*
        GROUND
    */

    groundOffset-=movement;


    if(
        groundOffset<=-80
    ){

        groundOffset+=80;
    }


    /*
        CACTUSES
    */

    for(
        let i=obstacles.length-1;
        i>=0;
        i--
    ){

        const o=
            obstacles[i];


        o.x-=movement;


        passCactus(o);


        if(
            o.x+
            o.width<
            -100
        ){

            obstacles.splice(
                i,
                1
            );
        }
    }


    /*
        SPAWN
    */

    spawnTimer+=dt;


    if(
        spawnTimer>=nextSpawn
    ){

        spawnCactus();
    }


    /*
        COLLISION
    */

    if(
        checkCollision()
    ){

        gameOver();
    }
}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawSky();

    drawGround();


    for(
        const o of obstacles
    ){

        drawCactus(o);
    }


    drawBunny();


    /*
        SCORE
    */

    ctx.fillStyle=DARK;

    ctx.font="24px Georgia";

    ctx.textAlign="right";


    ctx.fillText(

        String(
            Math.floor(score)
        ).padStart(
            5,
            "0"
        ),

        W-28,

        42
    );


    /*
        HIGH SCORE
    */

    ctx.font="14px Georgia";

    ctx.fillStyle=
        "rgba(41,51,47,0.65)";


    ctx.fillText(

        "HI "+
        String(
            highScore
        ).padStart(
            5,
            "0"
        ),

        W-28,

        61
    );


    /*
        START SCREEN
    */

    if(!started){

        ctx.textAlign="center";

        ctx.font="26px Georgia";

        ctx.fillStyle=DARK;


        ctx.fillText(
            "PRESS SPACE OR TAP",
            W/2,
            90
        );
    }


    /*
        GAME OVER
    */

    if(dead){

        ctx.textAlign="center";

        ctx.font="30px Georgia";

        ctx.fillStyle=DARK;


        ctx.fillText(
            "PRESS SPACE OR TAP TO RESTART",
            W/2,
            105
        );
    }
}


/* =========================
   GAME LOOP
========================= */

function loop(time){

    const dt=
        Math.min(
            time-lastTime,
            32
        );


    lastTime=time;


    update(dt);

    draw();


    if(!dead){

        requestAnimationFrame(loop);
    }
}


/* =========================
   INPUT
========================= */

function handleInput(){

    initAudio();


    if(dead){

        restart();

        return;
    }


    jump();
}


window.addEventListener(
    "keydown",
    e=>{

        if(
            e.code==="Space"||
            e.code==="ArrowUp"||
            e.code==="KeyW"
        ){

            e.preventDefault();

            handleInput();
        }
    }
);


canvas.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        handleInput();
    }
