<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bunny Jump</title>

<style>
:root{
    --bg:#f2f7fa;
    --card:#ffffff;
    --text:#4c5961;
    --soft:#dcecf7;
    --accent:#8faebe;
}

*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:Georgia,serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.game{
    width:min(900px,100%);
    text-align:center;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.back{
    color:var(--text);
    text-decoration:none;
}

.coins{
    background:#fff;
    border:2px solid var(--soft);
    border-radius:20px;
    padding:7px 14px;
}

h1{
    margin:0 0 15px;
    font-size:34px;
}

.gamebox{
    position:relative;
    background:var(--card);
    border:2px solid var(--soft);
    border-radius:22px;
    padding:16px;
    box-shadow:0 10px 30px rgba(70,90,100,.1);
}

.scorebar{
    display:flex;
    justify-content:center;
    gap:45px;
    margin-bottom:12px;
    font-size:17px;
}

canvas{
    display:block;
    width:100%;
    height:auto;
    border-radius:12px;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    cursor:pointer;
}

.startScreen{
    position:absolute;
    inset:16px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(255,255,255,.12);
}

.startButton,
.restartButton{
    border:0;
    background:var(--accent);
    color:#fff;
    padding:11px 28px;
    border-radius:20px;
    font-family:Georgia,serif;
    font-size:16px;
    cursor:pointer;
}

.modal{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(40,50,55,.3);
    z-index:10;
}

.modal.show{
    display:flex;
}

.modalBox{
    background:#fff;
    border:2px solid var(--soft);
    border-radius:22px;
    padding:25px;
    min-width:260px;
}

.modalBox h2{
    margin:0 0 15px;
}

#finalScore{
    margin-bottom:18px;
}
</style>
</head>

<body>

<div class="game">

    <div class="top">
        <a class="back" href="../index.html">← Back</a>

        <div class="coins">
            ♡ <span id="coinDisplay">0</span>
        </div>
    </div>

    <h1>Bunny Jump</h1>

    <div class="gamebox">

        <div class="scorebar">
            <div>SCORE <span id="score">00000</span></div>
            <div>BEST <span id="best">00000</span></div>
        </div>

        <canvas id="game" width="820" height="330"></canvas>

        <div class="startScreen" id="startScreen">
            <button class="startButton" id="startButton">Start</button>
        </div>

    </div>
</div>

<div class="modal" id="gameOver">
    <div class="modalBox">
        <h2>Game Over</h2>
        <div id="finalScore"></div>
        <button class="restartButton" id="restartButton">Restart</button>
    </div>
</div>

<script src="../script.js"></script><script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

ctx.imageSmoothingEnabled=false;

const W=canvas.width;
const H=canvas.height;
const groundY=267;

let running=false;
let dead=false;
let score=0;
let best=Number(localStorage.getItem("bunny_jump_best")||0);
let last=performance.now();
let spawnTimer=0;
let animationTime=0;
let cactuses=[];

const bunny={
    x:105,
    y:groundY-54,
    w:48,
    h:54,
    vy:0,
    grounded:true
};

document.getElementById("best").textContent=
    String(Math.floor(best)).padStart(5,"0");

function getTheme(){
    return localStorage.getItem("arcade_theme")||"blue";
}

function getSky(){
    const t=getTheme();

    if(t==="pink"){
        return {
            top:"#f2d5df",
            bottom:"#fff3f7",
            cloud:"#fff9fb",
            sun:"#e9b6c8",
            hill:"#dcb9c5"
        };
    }

    if(t==="green"){
        return {
            top:"#d8ead9",
            bottom:"#f2f8f0",
            cloud:"#fbfff9",
            sun:"#cbdba8",
            hill:"#bdd5bf"
        };
    }

    if(t==="lavender"){
        return {
            top:"#e1d9ef",
            bottom:"#f7f3fb",
            cloud:"#fffaff",
            sun:"#d2bde3",
            hill:"#cbc0df"
        };
    }

    if(t==="yellow"){
        return {
            top:"#eee5c5",
            bottom:"#fcfaf0",
            cloud:"#fffdf5",
            sun:"#e2c96d",
            hill:"#d8d0a9"
        };
    }

    return {
        top:"#d9eaf4",
        bottom:"#f3f8fb",
        cloud:"#ffffff",
        sun:"#efd5a5",
        hill:"#c4dbe5"
    };
}

function pixel(x,y,w,h,color){
    ctx.fillStyle=color;
    ctx.fillRect(
        Math.round(x),
        Math.round(y),
        Math.round(w),
        Math.round(h)
    );
}

function drawCloud(x,y,s,color){
    const p=8*s;

    pixel(x,y+p*2,p*7,p*2,color);
    pixel(x+p,y+p,p*5,p*3,color);
    pixel(x+p*3,y,p*3,p*4,color);
    pixel(x+p*6,y+p*2,p*2,p*2,color);
}

function drawSky(){
    const s=getSky();

    const gradient=ctx.createLinearGradient(
        0,0,0,groundY
    );

    gradient.addColorStop(0,s.top);
    gradient.addColorStop(1,s.bottom);

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,groundY);

    pixel(650,42,32,32,s.sun);
    pixel(642,50,48,16,s.sun);
    pixel(658,34,16,48,s.sun);

    drawCloud(105,65,1,s.cloud);
    drawCloud(350,105,.8,s.cloud);
    drawCloud(545,54,.65,s.cloud);

    for(let x=-20;x<W+100;x+=110){
        pixel(x,235,110,32,s.hill);
        pixel(x+18,226,74,9,s.hill);
        pixel(x+35,218,40,8,s.hill);
    }
}

function drawGround(){
    const s=getSky();

    pixel(
        0,
        groundY,
        W,
        H-groundY,
        s.bottom
    );

    pixel(
        0,
        groundY,
        W,
        5,
        s.hill
    );

    for(let x=-40;x<W+50;x+=90){
        pixel(x,groundY+22,28,4,s.hill);
        pixel(x+45,groundY+43,15,4,s.hill);
    }
}<script>
function drawBunny(){
    const x=Math.round(bunny.x);
    let y=Math.round(bunny.y);

    const outline="#8b6642";
    const fur="#e5caa0";
    const cream="#fff5e4";
    const eye="#3b2211";

    if(!running){
        y+=Math.round(
            Math.sin(animationTime*.004)*2
        );
    }

    if(running && bunny.grounded){
        y+=Math.round(
            Math.sin(animationTime*.018)
        );
    }

    pixel(x+12,y+4,12,28,outline);
    pixel(x+32,y,12,28,outline);

    pixel(x+16,y+8,8,20,fur);
    pixel(x+36,y+5,8,19,fur);

    pixel(x+8,y+27,36,22,outline);
    pixel(x+12,y+23,28,30,outline);

    pixel(x+12,y+29,28,19,fur);
    pixel(x+16,y+25,20,25,fur);

    pixel(x+27,y+15,22,27,outline);
    pixel(x+23,y+20,29,22,outline);

    pixel(x+28,y+18,18,20,fur);
    pixel(x+24,y+24,24,14,fur);

    pixel(x+29,y+34,10,14,cream);

    pixel(x+4,y+27,9,12,outline);
    pixel(x+2,y+29,9,8,cream);

    pixel(x+8,y+44,14,9,outline);
    pixel(x+12,y+43,12,7,cream);

    pixel(x+36,y+45,13,8,outline);
    pixel(x+36,y+43,9,7,cream);

    pixel(x+42,y+24,4,5,eye);
    pixel(x+47,y+31,5,4,eye);

    pixel(x+38,y+32,4,3,"#d9a98d");

    if(running && bunny.grounded){
        const frame=
            Math.floor(animationTime/100)%2;

        if(frame===0){
            pixel(x+10,y+48,11,6,outline);
            pixel(x+34,y+47,9,8,outline);
            pixel(x+8,y+52,11,4,cream);
        }else{
            pixel(x+17,y+47,9,8,outline);
            pixel(x+39,y+46,11,7,outline);
            pixel(x+39,y+52,11,4,cream);
        }
    }

    if(!bunny.grounded){
        pixel(x+7,y+46,13,6,outline);
        pixel(x+39,y+43,13,7,outline);
        pixel(x+5,y+50,11,4,cream);
        pixel(x+43,y+48,10,4,cream);
    }
}

function drawCactus(c){
    const x=Math.round(c.x);
    const y=Math.round(groundY-c.h);

    const outline="#5f725d";
    const body="#79936f";
    const light="#a9bd92";

    pixel(
        x-4,
        groundY+7,
        c.w+8,
        5,
        "rgba(75,90,80,.16)"
    );

    pixel(x+8,y,16,c.h,outline);

    if(c.type===1){
        pixel(x,y+14,12,8,outline);
        pixel(x-4,y+10,8,15,outline);

        pixel(x+24,y+22,10,8,outline);
        pixel(x+28,y+17,8,16,outline);
    }else{
        pixel(x+3,y+20,10,8,outline);
        pixel(x-1,y+16,7,17,outline);

        pixel(x+23,y+10,10,9,outline);
        pixel(x+29,y+5,7,19,outline);
    }

    pixel(
        x+12,
        y+4,
        8,
        c.h-8,
        body
    );

    if(c.type===1){
        pixel(x+3,y+14,5,7,body);
        pixel(x+28,y+22,5,6,body);
    }else{
        pixel(x+3,y+20,6,6,body);
        pixel(x+25,y+10,6,7,body);
    }

    pixel(x+14,y+8,3,8,light);
    pixel(x+14,y+25,3,7,light);
}

function spawnCactus(){
    const easy=score<3;

    cactuses.push({
        x:W+(easy?130:20),
        w:easy?30:32,
        h:easy?
            43:
            30+Math.floor(Math.random()*28),
        type:Math.random()<.65?1:2
    });
}

function resetBunny(){
    bunny.y=groundY-bunny.h;
    bunny.vy=0;
    bunny.grounded=true;
}

function jump(){
    if(
        running &&
        bunny.grounded
    ){
        bunny.vy=-10.2;
        bunny.grounded=false;
    }
}

function collision(a,c){
    const b={
        x:c.x,
        y:groundY-c.h,
        w:c.w,
        h:c.h
    };

    return(
        a.x+12<b.x+b.w-5 &&
        a.x+a.w-6>b.x+5 &&
        a.y+10<b.y+b.h-3 &&
        a.y+a.h-3>b.y+4
    );
}

function rewardForScore(){
    if(score>=500)return 25;
    if(score>=250)return 20;
    if(score>=100)return 15;
    return 10;
}

function startGame(){
    running=true;
    dead=false;
    score=0;
    spawnTimer=0;
    cactuses=[];

    resetBunny();

    document.getElementById(
        "startScreen"
    ).style.display="none";

    document.getElementById(
        "gameOver"
    ).classList.remove("show");

    last=performance.now();
    }<script>
function endGame(){
    if(dead)return;

    dead=true;
    running=false;

    const reward=rewardForScore();

    if(score>best){
        best=score;

        localStorage.setItem(
            "bunny_jump_best",
            String(Math.floor(best))
        );

        document.getElementById(
            "best"
        ).textContent=
            String(Math.floor(best)).padStart(5,"0");
    }

    document.getElementById(
        "finalScore"
    ).textContent=
        "Score: "+
        String(Math.floor(score)).padStart(5,"0");

    document.getElementById(
        "gameOver"
    ).classList.add("show");

    if(typeof addCoins==="function"){
        addCoins(reward);
    }

    if(typeof updateCoinDisplays==="function"){
        updateCoinDisplays();
    }
}

function update(dt){
    animationTime+=dt;

    if(!running)return;

    score+=dt*.012;

    document.getElementById(
        "score"
    ).textContent=
        String(Math.floor(score)).padStart(5,"0");

    const speed=Math.min(
        9,
        4.7+score/420
    );

    bunny.vy+=
        .55*(dt/16.67);

    bunny.y+=
        bunny.vy*(dt/16.67);

    if(bunny.y>=groundY-bunny.h){
        bunny.y=groundY-bunny.h;
        bunny.vy=0;
        bunny.grounded=true;
    }else{
        bunny.grounded=false;
    }

    spawnTimer+=dt;

    const delay=Math.max(
        900,
        1450-score*1.5
    );

    if(spawnTimer>=delay){
        spawnTimer=0;
        spawnCactus();
    }

    for(let i=cactuses.length-1;i>=0;i--){
        const c=cactuses[i];

        c.x-=speed*(dt/16.67);

        if(collision(bunny,c)){
            endGame();
            return;
        }

        if(c.x<-70){
            cactuses.splice(i,1);
        }
    }
}

function draw(){
    ctx.clearRect(0,0,W,H);

    drawSky();
    drawGround();

    for(const c of cactuses){
        drawCactus(c);
    }

    drawBunny();
}

function loop(now){
    const dt=Math.min(
        35,
        Math.max(1,now-last)
    );

    last=now;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

canvas.addEventListener(
    "pointerdown",
    function(){
        if(running){
            jump();
        }
    }
);

document.addEventListener(
    "keydown",
    function(e){
        if(
            e.code==="Space" ||
            e.code==="ArrowUp" ||
            e.code==="KeyW"
        ){
            e.preventDefault();

            if(running){
                jump();
            }
        }
    }
);

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    function(){
        startGame();
    }
);

document.getElementById(
    "restartButton"
).addEventListener(
    "click",
    function(){
        startGame();
    }
);

if(typeof updateCoinDisplays==="function"){
    updateCoinDisplays();
}

draw();
requestAnimationFrame(loop);
</script>

</body>
</html>
