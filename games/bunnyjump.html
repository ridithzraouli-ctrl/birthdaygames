<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bunny Run ♡</title>

<style>

    --bg-base:#f2f7fa;
    --bg-grad-1:#dce8f3;
    --bg-grad-2:#d3e2ea;
    --text-main:#3f5260;
    --text-heading:#46637a;
    --accent-border:#82a8bd;
    --accent-soft:#e9f3f9;

}

body[data-theme="pink"] {
    --bg-base:#faf2f5;
    --bg-grad-1:#f3dce5;
    --bg-grad-2:#ead3dc;
    --text-main:#603f4c;
    --text-heading:#7a4659;
    --accent-border:#bd8297;
    --accent-soft:#f9e9f0;
    --accent-badge:#f8dfe8;
    --ornament-color:#b87992;
}

body[data-theme="green"] {
    --bg-base:#f3f7f2;
    --bg-grad-1:#dce8dc;
    --bg-grad-2:#d3ead3;
    --text-main:#3f6043;
    --text-heading:#467a4c;
    --accent-border:#82bd8b;
    --accent-soft:#e9f9eb;
    --accent-badge:#dff8e2;
    --ornament-color:#79b882;
}

body[data-theme="lavender"] {
    --bg-base:#f5f2fa;
    --bg-grad-1:#e3dcf3;
    --bg-grad-2:#dad3ea;
    --text-main:#4a3f60;
    --text-heading:#59467a;
    --accent-border:#9882bd;
    --accent-soft:#f0e9f9;
    --accent-badge:#e9dff8;
    --ornament-color:#9379b8;
}

body[data-theme="yellow"] {
    --bg-base:#faf8f2;
    --bg-grad-1:#f3edd2;
    --bg-grad-2:#eae3c5;
    --text-main:#60573f;
    --text-heading:#7a6e46;
    --accent-border:#bdb182;
    --accent-soft:#f9f5e9;
    --accent-badge:#f8f3df;
    --ornament-color:#b8aa79;
}

* {
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body {
    width:100%;
    min-height:100%;
    margin:0;
    overflow-x:hidden;
}

body {
    min-height:100vh;
    background:
        radial-gradient(circle at 10% 12%,var(--bg-grad-1) 0,transparent 28%),
        radial-gradient(circle at 90% 85%,var(--bg-grad-2) 0,transparent 30%),
        var(--bg-base);
    color:var(--text-main);
    font-family:Georgia,"Times New Roman",serif;
    transition:background .3s ease,color .3s ease;
}

.decorations {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
    z-index:-1;
}

.decorations span {
    position:absolute;
    color:var(--ornament-color);
    opacity:.35;
    animation:float 5s ease-in-out infinite;
}

.decorations span:nth-child(1){top:13%;left:7%;font-size:20px}
.decorations span:nth-child(2){top:28%;right:8%;font-size:13px;animation-delay:1s}
.decorations span:nth-child(3){top:55%;left:5%;font-size:14px;animation-delay:2s}
.decorations span:nth-child(4){top:68%;right:6%;font-size:21px;animation-delay:1.5s}
.decorations span:nth-child(5){bottom:12%;left:12%;font-size:12px;animation-delay:.5s}
.decorations span:nth-child(6){bottom:20%;right:13%;font-size:16px;animation-delay:2.5s}

@keyframes float {
    0%,100%{transform:translateY(0) rotate(0)}
    50%{transform:translateY(-7px) rotate(7deg)}
}

header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    min-height:70px;
    padding:12px 16px;
    background:var(--header-bg);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--bg-grad-2);
    position:sticky;
    top:0;
    z-index:100;
    gap:8px;
}

.header-left,
.header-right {
    display:flex;
    align-items:center;
    min-width:0;
}

.header-left {
    gap:8px;
}

.header-right {
    justify-content:flex-end;
    gap:6px;
}

.nav-link {
    color:var(--text-heading);
    text-decoration:none;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
}

.coin-display {
    background:var(--accent-soft);
    border:1px solid var(--accent-border);
    padding:6px 10px;
    border-radius:100px;
    font-size:12px;
    font-weight:bold;
    color:var(--text-heading);
    white-space:nowrap;
}

main {
    width:100%;
    max-width:1050px;
    margin:0 auto;
    padding:25px 14px 35px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.ornament {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    height:22px;
    margin-bottom:12px;
    color:var(--ornament-color);
}

.ornament span {
    font-size:16px;
}

.ornament i {
    width:38px;
    height:1px;
    background:var(--ornament-color);
    opacity:.45;
}

h1 {
    color:var(--text-heading);
    font-weight:normal;
    font-size:28px;
    margin:0 0 6px;
    text-align:center;
}

.subtitle {
    color:var(--text-main);
    opacity:.78;
    margin:0 0 15px;
    font-size:14px;
    text-align:center;
}

.game-wrap {
    width:min(960px,100%);
    background:var(--card-bg);
    border:1px solid var(--bg-grad-2);
    border-radius:16px;
    padding:10px;
    box-shadow:0 8px 28px rgba(0,0,0,.055);
}

.canvas-wrap {
    position:relative;
    width:100%;
    overflow:hidden;
    border-radius:10px;
}

#game {
    display:block;
    width:100%;
    height:auto;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    touch-action:none;
}

.score-badge {
    position:absolute;
    top:13px;
    right:17px;
    color:var(--text-heading);
    background:rgba(255,255,255,.72);
    border:1px solid var(--accent-border);
    border-radius:100px;
    padding:6px 11px;
    font-size:13px;
    font-weight:bold;
    pointer-events:none;
    backdrop-filter:blur(4px);
}

.controls {
    display:flex;
    justify-content:center;
    margin-top:14px;
}

.btn {
    padding:10px 20px;
    border:1px solid var(--accent-border);
    border-radius:100px;
    background:var(--card-bg);
    color:var(--text-heading);
    font-family:Georgia,"Times New Roman",serif;
    font-size:13px;
    cursor:pointer;
    transition:.2s ease;
}

.btn:hover {
    background:var(--accent-soft);
    transform:translateY(-1px);
}

.modal-overlay {
    display:none;
    position:fixed;
    inset:0;
    padding:20px;
    background:rgba(30,25,25,.3);
    backdrop-filter:blur(5px);
    z-index:500;
    align-items:center;
    justify-content:center;
}

.modal-card {
    position:relative;
    background:var(--card-bg);
    border:1px solid var(--accent-border);
    border-radius:18px;
    padding:32px 26px 26px;
    max-width:360px;
    width:100%;
    text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.16);
    animation:victoryPop .35s ease;
    overflow:hidden;
}

.modal-card::before,
.modal-card::after {
    content:"✦";
    position:absolute;
    color:var(--ornament-color);
    opacity:.5;
    font-size:20px;
    top:13px;
}

.modal-card::before {left:18px}
.modal-card::after {right:18px}

.victory-decoration {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    color:var(--ornament-color);
    margin-bottom:13px;
}

.victory-decoration i {
    width:30px;
    height:1px;
    background:var(--ornament-color);
    opacity:.5;
}

.victory-symbol {
    width:66px;
    height:66px;
    margin:2px auto 14px;
    border-radius:50%;
    background:var(--accent-soft);
    border:1px solid var(--accent-border);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ornament-color);
    animation:victoryFloat 2s ease-in-out infinite;
}

.modal-card h2 {
    color:var(--text-heading);
    font-size:25px;
    font-weight:normal;
    margin:0 0 9px;
}

.modal-card p {
    color:var(--text-main);
    opacity:.82;
    font-size:14px;
    line-height:1.6;
    margin:0 0 21px;
}

.reward-amount {
    display:inline-block;
    margin:-5px 0 20px;
    padding:7px 13px;
    border-radius:100px;
    background:var(--accent-badge);
    border:1px solid var(--accent-border);
    color:var(--text-heading);
    font-size:13px;
    font-weight:bold;
}

.modal-card.game-over .victory-symbol {
    animation:none;
}

.confetti {
    position:absolute;
    pointer-events:none;
    color:var(--ornament-color);
    font-size:14px;
    animation:confettiFall 1.8s ease-out forwards;
}

.confetti:nth-child(1){left:18%;top:5%;animation-delay:0s}
.confetti:nth-child(2){left:32%;top:2%;animation-delay:.12s}
.confetti:nth-child(3){left:50%;top:4%;animation-delay:.2s}
.confetti:nth-child(4){right:32%;top:2%;animation-delay:.08s}
.confetti:nth-child(5){right:17%;top:6%;animation-delay:.18s}

@keyframes victoryPop {
    0%{transform:scale(.88);opacity:0}
    100%{transform:scale(1);opacity:1}
}

@keyframes victoryFloat {
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-5px)}
}

@keyframes confettiFall {
    0%{transform:translateY(0) rotate(0);opacity:0}
    15%{opacity:.8}
    100%{transform:translateY(115px) rotate(120deg);opacity:0}
}

@media(max-width:600px) {
    header {
        min-height:66px;
        padding:12px 11px;
    }

    main {
        padding:20px 8px 30px;
    }

    .game-wrap {
        padding:6px;
        border-radius:12px;
    }

    .modal-card {
        max-width:340px;
        padding:30px 21px 23px;
    }
}
</style>

<script src="../script.js"></script><script>

function loadSavedTheme(){

    const savedTheme=localStorage.getItem("arcade_theme");

    if(
        ["pink","green","lavender","yellow"].includes(savedTheme)
    ){
        document.body.setAttribute(
            "data-theme",
            savedTheme
        );
    }else{
        document.body.removeAttribute("data-theme");
    }
}

loadSavedTheme();


function goBack(){

    if(window.history.length>1){
        window.history.back();
    }else{
        window.location.href="../index.html";
    }
}


if(typeof updateCoinDisplays==="function"){
    updateCoinDisplays();
}


/* =========================
   AUDIO
========================= */

const AudioFX={

    ctx:null,

    init(){

        if(!this.ctx){

            const AudioCtx=
                window.AudioContext ||
                window.webkitAudioContext;

            if(AudioCtx){
                this.ctx=new AudioCtx();
            }
        }
    },

    play(type){

        this.init();

        if(!this.ctx){
            return;
        }

        if(this.ctx.state==="suspended"){
            this.ctx.resume();
        }

        const now=this.ctx.currentTime;

        const osc=this.ctx.createOscillator();
        const gain=this.ctx.createGain();

        osc.connect(gain);
        gain.connect(this.ctx.destination);


        if(type==="jump"){

            osc.type="sine";

            osc.frequency.setValueAtTime(
                420,
                now
            );

            osc.frequency.exponentialRampToValueAtTime(
                680,
                now+.12
            );

            gain.gain.setValueAtTime(
                .14,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                .001,
                now+.16
            );

            osc.start(now);
            osc.stop(now+.16);

        }else if(type==="lose"){

            osc.type="triangle";

            osc.frequency.setValueAtTime(
                330,
                now
            );

            osc.frequency.exponentialRampToValueAtTime(
                100,
                now+.4
            );

            gain.gain.setValueAtTime(
                .22,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                .001,
                now+.4
            );

            osc.start(now);
            osc.stop(now+.4);

        }else if(type==="start"){

            osc.type="sine";

            osc.frequency.setValueAtTime(
                523.25,
                now
            );

            osc.frequency.setValueAtTime(
                659.25,
                now+.08
            );

            gain.gain.setValueAtTime(
                .12,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                .001,
                now+.2
            );

            osc.start(now);
            osc.stop(now+.2);
        }
    }
};


/* =========================
   CANVAS
========================= */

const canvas=
    document.getElementById("game");

const ctx=
    canvas.getContext("2d");

ctx.imageSmoothingEnabled=false;

const W=960;
const H=540;
const GROUND=425;


/* =========================
   COLORS
========================= */

const SKY_TOP="#a8c7d0";
const SKY_BOTTOM="#d5e1d9";

const DARK="#29332f";

const GROUND_TOP="#756d59";
const GROUND_BASE="#625b4b";
const GROUND_LIGHT="#887f68";
const GROUND_DARK="#48453b";


/* =========================
   GAME STATE
========================= */

let started=false;
let dead=false;

let lastTime=0;

let score=0;

/*
    This is the actual score value.

    It is NOT based on frame count,
    so it remains consistent even if
    the phone drops frames.
*/

let distanceScore=0;
let passedBonus=0;

let speed=6;

let groundOffset=0;

let spawnTimer=0;
let nextSpawn=1200;

let runAnimTime=0;
let jumpTime=0;


/* =========================
   BUNNY IMAGES
========================= */

const idleImage=new Image();
const runImage=new Image();
const jumpImage=new Image();


/* =========================
   BUNNY
========================= */

const bunny={

    x:110,

    /*
        Physics hitbox remains manageable,
        while the sprite itself is drawn 3×.
    */

    y:GROUND-28,

    width:28,
    height:28,

    velocityY:0,

    grounded:true,

    gravity:.72,

    jumpPower:-15.5
};


/* =========================
   CACTUS IMAGE PATHS
========================= */

const cactusImages={

    small:new Image(),

    big:new Image(),

    two:new Image(),

    cluster:new Image()
};


cactusImages.small.src=
    "games/1000082076-removebg-preview.png";

cactusImages.big.src=
    "games/1000082078-removebg-preview.png";

cactusImages.two.src=
    "games/1000082080-removebg-preview.png";

cactusImages.cluster.src=
    "games/1000082081-removebg-preview.png";


/* =========================
   CACTUS TYPES
========================= */

/*
    The important part here is that
    each cactus has its own deliberate
    visual size.

    Bunny visual height = 84px.

    SMALL:
        1 × bunny height
        1 unit wide

    BIG:
        3 × bunny height
        1 unit wide

    TWO:
        2 × bunny height
        1.5 units wide

    CLUSTER:
        2 × bunny height
        3.5 units wide
*/

const CACTUS_UNIT=28;

const cactusDefinitions={

    small:{
        image:cactusImages.small,
        width:CACTUS_UNIT,
        height:84
    },

    big:{
        image:cactusImages.big,
        width:CACTUS_UNIT,
        height:252
    },

    two:{
        image:cactusImages.two,
        width:42,
        height:168
    },

    cluster:{
        image:cactusImages.cluster,
        width:98,
        height:168
    }
};


const cactusTypes=[
    "small",
    "big",
    "two",
    "cluster"
];


const obstacles=[];


/* =========================
   CREATE CACTUS
========================= */

function createCactus(type,x){

    const def=cactusDefinitions[type];

    return {

        type:type,

        image:def.image,

        x:x,

        y:GROUND-def.height,

        width:def.width,

        height:def.height,

        counted:false
    };
}


/* =========================
   RANDOM CACTUS
========================= */

function randomCactusType(){

    return cactusTypes[
        Math.floor(
            Math.random()*cactusTypes.length
        )
    ];
}


/* =========================
   SPAWN
========================= */

function spawnCactus(){

    const firstType=randomCactusType();

    const first=createCactus(
        firstType,
        W+60
    );

    obstacles.push(first);


    /*
        Keep groups possible later,
        but make sure they have space.

        Only the four requested cactus
        forms are ever used.
    */

    const difficulty=Math.min(
        score/100,
        30
    );

    if(
        difficulty>10 &&
        Math.random()<.18
    ){

        const secondType=
            Math.random()<.65
                ?"small"
                :"two";

        const second=createCactus(
            secondType,
            first.x+
            first.width+
            115
        );

        obstacles.push(second);
    }


    /*
        Spawn distance becomes gradually
        shorter as the score rises.
    */

    const minimum=
        1050-
        Math.min(
            difficulty*10,
            300
        );

    const maximum=
        1450-
        Math.min(
            difficulty*8,
            250
        );

    nextSpawn=
        minimum+
        Math.random()*
        Math.max(
            250,
            maximum-minimum
        );

    spawnTimer=0;
}/* =========================
   SKY
========================= */

function drawSky(){

    const gradient=
        ctx.createLinearGradient(
            0,
            0,
            0,
            GROUND
        );

    gradient.addColorStop(
        0,
        SKY_TOP
    );

    gradient.addColorStop(
        1,
        SKY_BOTTOM
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        GROUND
    );


    ctx.fillStyle="#dfe8e4";

    const cloudY=92;

    ctx.fillRect(
        130,
        cloudY,
        70,
        8
    );

    ctx.fillRect(
        146,
        cloudY-7,
        38,
        7
    );

    ctx.fillRect(
        158,
        cloudY-12,
        20,
        5
    );


    ctx.fillRect(
        620,
        145,
        86,
        8
    );

    ctx.fillRect(
        640,
        138,
        42,
        7
    );

    ctx.fillRect(
        655,
        132,
        22,
        6
    );


    ctx.fillStyle="#cbdcda";

    ctx.fillRect(
        335,
        72,
        45,
        6
    );

    ctx.fillRect(
        347,
        66,
        25,
        6
    );

    ctx.fillRect(
        790,
        78,
        58,
        7
    );

    ctx.fillRect(
        805,
        71,
        27,
        7
    );
}


/* =========================
   GROUND
========================= */

function drawGround(){

    ctx.fillStyle=GROUND_BASE;

    ctx.fillRect(
        0,
        GROUND,
        W,
        H-GROUND
    );

    ctx.fillStyle=GROUND_TOP;

    ctx.fillRect(
        0,
        GROUND,
        W,
        9
    );

    ctx.fillStyle=GROUND_LIGHT;

    ctx.fillRect(
        0,
        GROUND,
        W,
        3
    );


    const tile=80;

    for(
        let x=groundOffset-tile;
        x<W+tile;
        x+=tile
    ){

        ctx.fillStyle=GROUND_DARK;

        ctx.fillRect(
            x+7,
            GROUND+22,
            22,
            4
        );

        ctx.fillRect(
            x+49,
            GROUND+39,
            15,
            4
        );

        ctx.fillRect(
            x+19,
            GROUND+57,
            30,
            4
        );


        ctx.fillStyle=GROUND_LIGHT;

        ctx.fillRect(
            x+32,
            GROUND+15,
            8,
            3
        );

        ctx.fillRect(
            x+63,
            GROUND+28,
            7,
            3
        );

        ctx.fillRect(
            x+3,
            GROUND+48,
            10,
            3
        );

        ctx.fillRect(
            x+56,
            GROUND+65,
            16,
            3
        );
    }


    for(
        let x=groundOffset-40;
        x<W+80;
        x+=120
    ){

        ctx.fillStyle=GROUND_LIGHT;

        ctx.fillRect(
            x,

            3,

        ctx.fillRect(
            x+4,

/* =========================
   CACTUS DRAW
========================= */

function drawCactus(o){

    /*
        The actual uploaded image is used.

        If the image has not loaded yet,
        a simple placeholder is drawn so
        the cactus still exists during testing.
    */

    if(
        o.image &&
        o.image.complete &&
        o.image.naturalWidth>0
    ){

        ctx.drawImage(
            o.image,
            o.x,
            o.y,
            o.width,
            o.height
        );

        return;
    }


    /*
        Temporary placeholder.
        This disappears automatically when
        your cactus PNG loads.
    */

    ctx.fillStyle="#63745f";

    ctx.fillRect(
        o.x,
        o.y,
        o.width,
        o.height
    );

    ctx.fillStyle="#70836b";

    ctx.fillRect(
        o.x+Math.min(4,o.width/4),
        o.y+4,
        Math.max(2,o.width/5),
        Math.max(4,o.height-8)
    );

    ctx.strokeStyle=DARK;
    ctx.lineWidth=2;

    ctx.strokeRect(
        o.x,
        o.y,
        o.width,
        o.height
    );
}


/* =========================
   BUNNY DRAW
========================= */

function drawBunny(){

    let image;

    let frameWidth=28;
    let frameHeight=28;

    let frameIndex=0;


    if(!started && !dead){

        image=idleImage;

    }else if(!bunny.grounded){

        image=jumpImage;

        frameWidth=28;
        frameHeight=36;

        const duration=560;

        frameIndex=Math.min(
            7,
            Math.floor(
                (jumpTime/duration)*8
            )
        );

    }else{

        image=runImage;

        frameWidth=28;
        frameHeight=28;

        frameIndex=
            Math.floor(
                runAnimTime/45
            )%8;
    }


    if(
        !image.complete ||
        !image.naturalWidth
    ){
        return;
    }


    /*
        This is the larger bunny size
        from the old working version.

        28 × 3 = 84px.
    */

    const drawW=frameWidth*3;
    const drawH=frameHeight*3;

    const feetY=
        bunny.y+bunny.height;

    const drawX=bunny.x;

    const drawY=
        feetY-drawH;


    ctx.save();

    ctx.translate(
        drawX+drawW,
        drawY
    );

    ctx.scale(-1,1);

    ctx.drawImage(
        image,

        frameIndex*frameWidth,
        0,

        frameWidth,
        frameHeight,

        0,
        0,

        drawW,
        drawH
    );

    ctx.restore();
}


/* =========================
   BUNNY HITBOX
========================= */

function getBunnyHitbox(){

    /*
        Deliberately smaller than the
        visible bunny so collisions feel
        fair instead of hitting the ears.
    */

    return {

        x:bunny.x+18,

        y:bunny.y+9,

        width:48,

        height:65
    };
}


/* =========================
   CACTUS HITBOX
========================= */

function checkCollision(){

    const b=getBunnyHitbox();


    for(const o of obstacles){

        /*
            Slightly shrink the cactus box
            so transparent edges of the PNG
            do not cause unfair collisions.
        */

        const paddingX=
            Math.min(
                5,
                o.width*.12
            );

        const paddingY=
            Math.min(
                3,
                o.height*.03
            );

        const cactusHit={

            x:o.x+paddingX,

            y:o.y+paddingY,

            width:Math.max(
                1,
                o.width-paddingX*2
            ),

            height:Math.max(
                1,
                o.height-paddingY*2
            )
        };


        if(

            b.x <
                cactusHit.x+
                cactusHit.width &&

            b.x+b.width >
                cactusHit.x &&

            b.y <
                cactusHit.y+
                cactusHit.height &&

            b.y+b.height >
                cactusHit.y

        ){

            return true;
        }
    }

    return false;
}


/* =========================
   SCORE DISPLAY
========================= */

function updateScoreDisplay(){

    /*
        Score is ALWAYS converted to an
        integer here.

        This fixes the old broken counter
        where the canvas number and actual
        score could drift apart.
    */

    score=
        Math.max(
            0,
            Math.floor(
                distanceScore+
                passedBonus
            )
        );


    const display=
        document.getElementById(
            "score-display"
        );


    if(display){

        display.textContent=
            String(score).padStart(
                5,
                "0"
            );
    }
}


/* =========================
   JUMP
========================= */

function jump(){

    if(!started){

        started=true;

        dead=false;

        lastTime=
            performance.now();

        AudioFX.play("start");

        requestAnimationFrame(loop);

        return;
    }


    if(dead){

        restartGame();

        return;
    }


    if(bunny.grounded){

        bunny.velocityY=
            bunny.jumpPower;

        bunny.grounded=false;

        jumpTime=0;

        AudioFX.play("jump");
    }
}


/* =========================
   RESTART
========================= */

function restartGame(){

    started=true;

    dead=false;

    score=0;

    distanceScore=0;

    passedBonus=0;

    speed=6;

    groundOffset=0;

    spawnTimer=0;

    nextSpawn=1200;

    obstacles.length=0;


    bunny.y=
        GROUND-bunny.height;

    bunny.velocityY=0;

    bunny.grounded=true;


    runAnimTime=0;

    jumpTime=0;


    document.getElementById(
        "reward-modal"
    ).style.display="none";


    updateScoreDisplay();


    lastTime=
        performance.now();


    requestAnimationFrame(loop);
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    if(dead){
        return;
    }

    dead=true;

    bunny.velocityY=0;

    AudioFX.play("lose");

    updateScoreDisplay();

    showGameOverModal();
}


/* =========================
   UPDATE
========================= */

function update(dt){

    if(!started || dead){
        return;
    }


    /*
        Prevent giant jumps if the browser
        pauses for a moment.
    */

    dt=Math.min(
        dt,
        32
    );


    /*
        RUN ANIMATION
    */

    if(bunny.grounded){

        runAnimTime+=dt;
    }


    /*
        PHYSICS
    */

    if(!bunny.grounded){

        jumpTime+=dt;

        const frameScale=
            dt/16.6667;

        bunny.velocityY+=
            bunny.gravity*
            frameScale;

        bunny.y+=
            bunny.velocityY*
            frameScale;


        const groundY=
            GROUND-bunny.height;


        if(bunny.y>=groundY){

            bunny.y=groundY;

            bunny.velocityY=0;

            bunny.grounded=true;

            runAnimTime=0;

            jumpTime=0;
        }
    }


    /*
        GAME SPEED
    */

    speed+=
        .00035*dt;


    const movement=
        speed*
        (dt/16.6667);


    /*
        FIXED, RELIABLE SCORE

        Every 10 pixels travelled = 1 point.

        Because distanceScore is based on
        movement rather than frame count,
        the score remains stable on mobile.
    */

    distanceScore+=
        movement/10;


    updateScoreDisplay();


    /*
        GROUND
    */

    groundOffset-=movement;

    if(groundOffset<=-80){

        groundOffset+=80;
    }


    /*
        CACTUSES
    */

    for(
        let i=obstacles.length-1;
        i>=0;
        i--
    ){

        const o=obstacles[i];

        o.x-=movement;


        /*
            +100 when the bunny successfully
            clears an entire cactus.
        */

        if(
            !o.counted &&
            o.x+o.width<bunny.x
        ){

            o.counted=true;

            passedBonus+=100;

            updateScoreDisplay();
        }


        if(
            o.x+o.width<
            -120
        ){

            obstacles.splice(
                i,
                1
            );
        }
    }


    /*
        SPAWN
    */

    spawnTimer+=dt;

    if(
        spawnTimer>=nextSpawn
    ){

        spawnCactus();
    }


    /*
        COLLISION
    */

    if(checkCollision()){

        gameOver();
    }
}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawSky();

    drawGround();


    for(const o of obstacles){

        drawCactus(o);
    }


    drawBunny();


    /*
        Start text is drawn on the
        actual game canvas.
    */

    if(!started){

        ctx.textAlign="center";

        ctx.fillStyle=DARK;

        ctx.font="26px Georgia";

        ctx.fillText(
            "PRESS SPACE OR TAP",
            W/2,
            90
        );
    }


    if(dead){

        ctx.textAlign="center";

        ctx.fillStyle=DARK;

        ctx.font="25px Georgia";

        ctx.fillText(
            "GAME OVER",
            W/2,
            90
        );
    }
}


/* =========================
   GAME LOOP
========================= */

function loop(time){

    /*
        First frame protection.
    */

    if(!lastTime){

        lastTime=time;
    }


    const dt=Math.min(
        time-lastTime,
        32
    );


    lastTime=time;


    update(dt);

    draw();


    if(!dead){

        requestAnimationFrame(loop);
    }
