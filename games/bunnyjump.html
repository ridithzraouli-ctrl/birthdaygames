<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Bunny Run ♡</title>

<style>
:root{
    --bg-base:#f2f7fa;
    --bg-grad-1:#dce8f3;
    --bg-grad-2:#d3e2ea;
    --text-main:#3f5260;
    --text-heading:#46637a;
    --accent-border:#82a8bd;
    --accent-soft:#e9f3f9;
    --ornament-color:#799eb8;
    --card-bg:rgba(255,255,255,.88);
    --header-bg:rgba(255,255,255,.88);
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
    overflow-x:hidden;
    background:
        radial-gradient(circle at top left,var(--bg-grad-1),transparent 45%),
        radial-gradient(circle at bottom right,var(--bg-grad-2),transparent 50%),
        var(--bg-base);
    color:var(--text-main);
    font-family:Georgia,serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
}

header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    min-height:70px;
    padding:15px 22px;
    background:var(--header-bg);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--bg-grad-2);
    position:sticky;
    top:0;
    z-index:100;
    gap:16px;
}

.header-left,
.header-right{
    display:flex;
    align-items:center;
    min-width:0;
}

.header-left{
    gap:12px;
}

.header-right{
    justify-content:flex-end;
    gap:10px;
}

.nav-link{
    color:var(--text-heading);
    text-decoration:none;
    font-size:15px;
    cursor:pointer;
    white-space:nowrap;
    transition:opacity .2s ease;
}

.nav-link:hover{
    opacity:.7;
}

.fullscreen-button{
    border:1px solid var(--accent-border);
    background:var(--accent-soft);
    color:var(--text-heading);
    border-radius:100px;
    padding:9px 13px;
    font-family:Georgia,serif;
    font-size:13px;
    cursor:pointer;
    transition:opacity .2s ease;
}

.fullscreen-button:hover{
    opacity:.75;
}

main{
    width:100%;
    min-height:calc(100vh - 70px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:30px 15px 40px;
    position:relative;
    z-index:1;
}

.decorations{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.decorations span{
    position:absolute;
    color:var(--ornament-color);
    opacity:.35;
    animation:float 5s ease-in-out infinite;
}

.decorations span:nth-child(1){
    top:13%;
    left:7%;
    font-size:20px;
}

.decorations span:nth-child(2){
    top:28%;
    right:8%;
    font-size:13px;
    animation-delay:1s;
}

.decorations span:nth-child(3){
    top:55%;
    left:5%;
    font-size:14px;
    animation-delay:2s;
}

.decorations span:nth-child(4){
    top:68%;
    right:6%;
    font-size:21px;
    animation-delay:1.5s;
}

.decorations span:nth-child(5){
    bottom:12%;
    left:12%;
    font-size:12px;
    animation-delay:.5s;
}

.decorations span:nth-child(6){
    bottom:20%;
    right:13%;
    font-size:16px;
    animation-delay:2.5s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0) rotate(0);
    }

    50%{
        transform:translateY(-7px) rotate(7deg);
    }
}

.ornament{
    width:min(420px,85vw);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:var(--ornament-color);
    margin-top:4px;
    margin-bottom:8px;
}

.ornament i{
    display:block;
    height:1px;
    flex:1;
    background:var(--accent-border);
    opacity:.7;
}

.ornament span{
    font-size:15px;
}

h1{
    margin:0;
    color:var(--text-heading);
    font-size:34px;
    font-weight:normal;
    letter-spacing:.5px;
    text-align:center;
}

.subtitle{
    margin:7px 0 15px;
    color:var(--text-main);
    opacity:.78;
    font-size:15px;
    text-align:center;
}

.game-info{
    margin-bottom:14px;
}

.info-pill{
    background:var(--card-bg);
    border:1px solid var(--accent-border);
    color:var(--text-heading);
    padding:7px 14px;
    border-radius:100px;
    font-size:13px;
    box-shadow:0 4px 16px rgba(50,70,80,.06);
}

.game-shell{
    width:min(960px,calc(100vw - 20px));
    position:relative;
    border-radius:18px;
    overflow:hidden;
    border:1px solid var(--accent-border);
    box-shadow:0 12px 35px rgba(50,70,80,.14);
    background:#b8cbd1;
    touch-action:none;
}

canvas{
    display:block;
    width:100%;
    height:auto;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

.fullscreen-exit{
    display:none;
    position:absolute;
    top:14px;
    left:14px;
    z-index:20;
    border:1px solid rgba(255,255,255,.65);
    background:rgba(255,255,255,.82);
    color:#46637a;
    border-radius:100px;
    padding:7px 11px;
    font-family:Georgia,serif;
    font-size:12px;
    cursor:pointer;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.fullscreen-high-score{
    display:none;
    position:absolute;
    top:14px;
    right:16px;
    z-index:20;
    color:#f1eee2;
    font:bold 16px Georgia,serif;
    text-shadow:0 2px 4px rgba(0,0,0,.28);
    pointer-events:none;
}

.bottom-ornament{
    margin-top:16px;
    margin-bottom:0;
}

body.game-fullscreen{
    background:#b8cbd1;
}

body.game-fullscreen header,
body.game-fullscreen main>.ornament,
body.game-fullscreen main>h1,
body.game-fullscreen main>.subtitle,
body.game-fullscreen main>.game-info,
body.game-fullscreen .bottom-ornament{
    display:none;
}

body.game-fullscreen main{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    min-height:100vh;
    padding:0;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#b8cbd1;
    z-index:9999;
}

body.game-fullscreen .game-shell{
    width:100vw;
    height:100vh;
    max-width:none;
    border:0;
    border-radius:0;
    box-shadow:none;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#b8cbd1;
}

body.game-fullscreen canvas{
    width:100vw;
    height:100vh;
    object-fit:contain;
}

body.game-fullscreen .fullscreen-exit{
    display:block;
}

body.game-fullscreen .fullscreen-high-score{
    display:block;
}

@media(max-width:600px){
    header{
        padding:12px 14px;
        min-height:62px;
    }

    .nav-link{
        font-size:13px;
    }

    .fullscreen-button{
        padding:8px 10px;
        font-size:12px;
    }

    main{
        padding-top:22px;
    }

    h1{
        font-size:29px;
    }

    .subtitle{
        font-size:14px;
    }
}
</style>

</main>

let topScore=

function updateTopScoreDisplay(){

    const element=document.getElementById("top-score");
    const fullscreenElement=document.getElementById("fullscreenHighScore");

    const value=
        Math.floor(topScore)
        .toString()
        .padStart(5,"0");

    if(element){
        element.textContent=value;
    }

    if(fullscreenElement){
        fullscreenElement.textContent=
            "High Score: "+value;
    }

function checkTopScore(){

    const current=Math.floor(score);

    if(current>topScore){

        topScore=current;

        localStorage.setItem(
            TOP_SCORE_KEY,
            String(topScore)
        );

        updateTopScoreDisplay();

function applyTheme(){

    const theme=
        localStorage.getItem("arcade_theme")||"blue";

    const t=
        themes[theme]||themes.blue;

    const root=
        document.documentElement;

    root.style.setProperty(
        "--bg-base",
        t.base
    );

    root.style.setProperty(
        "--bg-grad-1",
        t.grad1
    );

    root.style.setProperty(
        "--bg-grad-2",
        t.grad2
    );

    root.style.setProperty(
        "--text-main",
        t.text
    );

    root.style.setProperty(
        "--text-heading",
        t.heading
    );

    root.style.setProperty(
        "--accent-border",
        t.border
    );

    root.style.setProperty(
        "--accent-soft",
        t.soft
    );

    root.style.setProperty(
        "--ornament-color",
        t.ornament
    );

    root.style.setProperty(
        "--card-bg",
        t.card
    );

    root.style.setProperty(
        "--header-bg",
        t.header
    );
}

function getThemeSky(){

    const theme=
        localStorage.getItem("arcade_theme")||"blue";

    return themes[theme]||themes.blue;
}

function drawSky(){

    const sky=getThemeSky();

    const gradient=
        ctx.createLinearGradient(
            0,0,0,GROUND
        );

    gradient.addColorStop(
        0,
        sky.skyTop
    );

    gradient.addColorStop(
        1,
        sky.skyBottom
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        GROUND
    );
}

const clouds=[
    {
        x:80,
        y:85,
        scale:1
    },
    {
        x:360,
        y:125,
        scale:.72
    },
    {
        x:650,
        y:75,
        scale:1.15
    },
    {
        x:850,
        y:155,
        scale:.65
    }
];

function drawCloud(x,y,scale){

    ctx.save();

    ctx.fillStyle="rgba(255,255,255,.52)";

    ctx.beginPath();

    ctx.arc(
        x,
        y+9*scale,
        18*scale,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+22*scale,
        y,
        24*scale,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+50*scale,
        y+10*scale,
        18*scale,
        0,
        Math.PI*2
    );

    ctx.fillRect(
        x-3*scale,
        y+9*scale,
        57*scale,
        18*scale
    );

    ctx.fill();

    ctx.restore();
}

function drawClouds(){

    for(const cloud of clouds){

        drawCloud(
            cloud.x,
            cloud.y,
            cloud.scale
        );
    }
}

function drawGround(){

    const sky=getThemeSky();

    ctx.fillStyle=GROUND_TOP;

    ctx.fillRect(
        0,
        GROUND,
        W,
        8
    );

    ctx.fillStyle=GROUND_BASE;

    ctx.fillRect(
        0,
        GROUND+8,
        W,
        H-GROUND-8
    );

    const tileSize=34;

    ctx.save();

    ctx.translate(
        -groundOffset,
        0
    );

    for(
        let x=-tileSize;
        x<W+tileSize;
        x+=tileSize
    ){

        ctx.fillStyle=GROUND_LIGHT;

        ctx.fillRect(
            x,
            GROUND+15,
            18,
            4
        );

        ctx.fillStyle=GROUND_DARK;

        ctx.fillRect(
            x+19,
            GROUND+29,
            10,
            4
        );

        ctx.fillStyle=GROUND_LIGHT;

        ctx.fillRect(
            x+5,
            GROUND+44,
            9,
            3
        );
    }

    ctx.restore();
}

function drawBackground(){

    drawSky();
    drawClouds();
    drawGround();
}

const cactusImages={};

function loadCactusImage(
    image,
    rootPath,
    fallbackPath
){

    const filename=
        rootPath.split("/").pop();

    const paths=[
        rootPath,
        fallbackPath,
        filename
    ];

    let index=0;

    function tryNext(){

        if(index>=paths.length){
            return;
        }

        const source=paths[index++];

        image.onload=null;
        image.onerror=null;

        image.onload=function(){};

        image.onerror=function(){
            tryNext();
        };

        image.src=source;
    }

    tryNext();
}

    "games/1000082076-removebg-preview.png",

const cactusTypes=[
    {
        image:cactusImages.small,
        width:55,
        height:55,
        hitboxWidth:20,
        hitboxHeight:20
    },

    {
        image:cactusImages.tall,

        hitboxHeight:65
    },

    {
        image:cactusImages.medium,
        width:68,
        height:68,
        hitboxWidth:32,
        hitboxHeight:32
    },

    {
        image:cactusImages.wide,
        width:82,
        height:65,
        hitboxWidth:44,
        hitboxHeight:32
    }
];

const obstacles=[];

let spawnTimer=0;
let nextSpawn=1400;

function spawnObstacle(){

    const type=
        cactusTypes[
            Math.floor(
                Math.random()*
                cactusTypes.length
            )
        ];

    obstacles.push({
        x:W+30,
        y:GROUND-type.height,
        width:type.width,
        height:type.height,
        image:type.image,
        hitboxWidth:type.hitboxWidth,
        hitboxHeight:type.hitboxHeight,
        passed:false
    });

    /*
       Cacti gradually get farther apart.

       Starts close to the original spacing,
       then increases slowly with score,
       and stops increasing after the cap.
    */

    const spacingLevel=
        Math.min(
            score/1000,
            4
        );

    const minimum=
        1350+
        spacingLevel*90;

    const maximum=
        1800+
        spacingLevel*110;

    nextSpawn=
        minimum+
        Math.random()*
        (maximum-minimum);
}

function drawObstacles(){

    for(const obstacle of obstacles){

        if(
            obstacle.image &&
            obstacle.image.complete &&
            obstacle.image.naturalWidth
        ){

            ctx.drawImage(
                obstacle.image,
                obstacle.x,
                obstacle.y,
                obstacle.width,
                obstacle.height
            );
        }
    }
}

function getBunnyHitbox(){

    return{
        x:bunny.x+13,
        y:bunny.y+12,
        width:52,
        height:60
    };
}

function checkCollision(){

    const b=getBunnyHitbox();

    for(const o of obstacles){

        const hitWidth=o.hitboxWidth;
        const hitHeight=o.hitboxHeight;

        const cactusHit={
            x:
                o.x+
                (o.width-hitWidth)/2,

            y:
                GROUND-
                hitHeight,

            width:hitWidth,
            height:hitHeight
        };

        if(
            b.x<
                cactusHit.x+
                cactusHit.width &&

            b.x+b.width>
                cactusHit.x &&

            b.y<
                cactusHit.y+
                cactusHit.height &&

            b.y+b.height>
                cactusHit.y
        ){

            return true;
        }
    }

    return false;
    }function drawBunny(){

    let image;

    let frameWidth=28;
    let frameHeight=28;

    let frameIndex=0;

    if(
        !started &&
        !dead
    ){

        image=idleImage;
        frameIndex=0;

    }else if(
        !bunny.grounded
    ){

        image=jumpImage;

        frameWidth=28;
        frameHeight=36;

        const jumpAnimationDuration=560;

        frameIndex=
            Math.min(
                7,
                Math.floor(
                    (jumpTime/
                    jumpAnimationDuration)*8
                )
            );

    }else{

        image=runImage;

        frameWidth=28;
        frameHeight=28;

        frameIndex=
            Math.floor(
                runAnimTime/45
            )%8;
    }

    if(
        !image.complete ||
        !image.naturalWidth
    ){

        return;
    }

    const drawW=frameWidth*3;
    const drawH=frameHeight*3;

    const feetY=
        bunny.y+bunny.height;

    const drawX=bunny.x;
    const drawY=feetY-drawH;

    ctx.save();

    ctx.translate(
        drawX+drawW,
        drawY
    );

    ctx.scale(-1,1);

    ctx.drawImage(
        image,
        frameIndex*frameWidth,
        0,
        frameWidth,
        frameHeight,
        0,
        0,
        drawW,
        drawH
    );

    ctx.restore();
}

function drawScore(){

    const displayScore=
        Math.floor(score)
        .toString()
        .padStart(5,"0");

    ctx.save();

    ctx.font="bold 23px Georgia,serif";
    ctx.textAlign="right";
    ctx.textBaseline="top";

    ctx.fillStyle="rgba(41,51,47,0.28)";

    ctx.fillText(
        displayScore,
        W-18,
        20
    );

    ctx.fillStyle="#f1eee2";

    ctx.fillText(
        displayScore,
        W-20,
        18
    );

    ctx.restore();
}

function initAudio(){

    if(audioContext){
        return;
    }

    try{

        audioContext=
            new(
                window.AudioContext||
                window.webkitAudioContext
            )();

    }catch(e){}
}

function resumeAudio(){

    initAudio();

    if(
        audioContext &&
        audioContext.state==="suspended"
    ){

        audioContext.resume();
    }
}

function playJumpSound(){

    if(!audioContext){
        return;
    }

    try{

        const oscillator=
            audioContext.createOscillator();

        const gain=
            audioContext.createGain();

        oscillator.type="square";

        oscillator.frequency.setValueAtTime(
            330,
            audioContext.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            620,
            audioContext.currentTime+.11
        );

        gain.gain.setValueAtTime(
            .055,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime+.13
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime+.13
        );

    }catch(e){}
}

function playMilestoneSound(){

    if(!audioContext){
        return;
    }

    try{

        const now=
            audioContext.currentTime;

        const oscillator=
            audioContext.createOscillator();

        const gain=
            audioContext.createGain();

        oscillator.type="square";

        oscillator.frequency.setValueAtTime(
            520,
            now
        );

        oscillator.frequency.setValueAtTime(
            660,
            now+.09
        );

        oscillator.frequency.setValueAtTime(
            880,
            now+.18
        );

        gain.gain.setValueAtTime(
            .055,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            now+.28
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(now);

        oscillator.stop(now+.28);

    }catch(e){}
}

function updateGame(delta){

    if(
        !started||
        dead
    ){

        return;
    }

    const dt=
        Math.min(
            delta,
            32
        );

    const seconds=
        dt/16.6667;

    score+=.55*seconds;

    /*
       Speed starts at 6 and gradually rises.
       Maximum speed is 9.
    */

    speed=
        6+
        Math.min(
            score/1000,
            3
        );

    bunny.velocityY+=
        bunny.gravity*
        seconds;

    bunny.y+=
        bunny.velocityY*
        seconds;

    if(
        bunny.y>=
        GROUND-bunny.height
    ){

        bunny.y=
            GROUND-bunny.height;

        bunny.velocityY=0;

        bunny.grounded=true;
    }

    if(!bunny.grounded){

        jumpTime+=dt;

    }else{

        jumpTime=0;
    }

    runAnimTime+=dt;

    groundOffset+=
        speed*seconds;

    if(
        groundOffset>=34
    ){

        groundOffset%=34;
    }

    spawnTimer+=dt;

    if(
        spawnTimer>=nextSpawn
    ){

        spawnTimer=0;

        spawnObstacle();
    }

    for(
        let i=obstacles.length-1;
        i>=0;
        i--
    ){

        const obstacle=
            obstacles[i];

        obstacle.x-=
            speed*seconds;

        if(
            !obstacle.passed &&
            obstacle.x+
            obstacle.width<
            bunny.x
        ){

            obstacle.passed=true;

            score+=10;
        }

        if(
            obstacle.x+
            obstacle.width<
            -100
        ){

            obstacles.splice(
                i,
                1
            );
        }
    }

    const currentThousand=
        Math.floor(score/1000);

    if(
        currentThousand>
        lastThousandMilestone
    ){

        for(
            let n=
                lastThousandMilestone;
            n<
                currentThousand;
            n++
        ){

            playMilestoneSound();
        }

        lastThousandMilestone=
            currentThousand;
    }

    if(
        checkCollision()
    ){

        gameOver();
    }

    checkTopScore();
}

function drawGameOver(){

    ctx.save();

    ctx.fillStyle=
        "rgba(41,51,47,.42)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    ctx.textAlign="center";

    ctx.fillStyle="#f1eee2";

    ctx.font=
        "bold 31px Georgia,serif";

    ctx.fillText(
        "Game Over",
        W/2,
        210
    );

    ctx.font=
        "20px Georgia,serif";

    ctx.fillText(
        "Score: "+
        Math.floor(score),
        W/2,
        250
    );

    ctx.font=
        "15px Georgia,serif";

    ctx.globalAlpha=.9;

    ctx.fillText(
        "tap anywhere to start again",
        W/2,
        290
    );

    ctx.restore();
}

function drawStartScreen(){

    ctx.save();

    ctx.textAlign="center";

    ctx.fillStyle=
        "rgba(41,51,47,.55)";

    ctx.font=
        "31px Georgia,serif";

    ctx.fillText(
        "Tap to start",
        W/2,
        220
    );

    ctx.font=
        "15px Georgia,serif";

    ctx.fillStyle="#f1eee2";

    ctx.fillText(
        "jump with a tap",
        W/2,
        250
    );

    ctx.restore();
}

function draw(){

    drawBackground();

    drawObstacles();

    drawBunny();

    drawScore();

    if(
        !started &&
        !dead
    ){

        drawStartScreen();
    }

    if(dead){

        drawGameOver();
    }
}

function gameOver(){

    if(dead){
        return;
    }

    dead=true;

    bunny.velocityY=0;

    checkTopScore();

    draw();
}

function restart(){

    score=0;

    speed=6;

    lastThousandMilestone=0;

    obstacles.length=0;

    spawnTimer=0;

    nextSpawn=1400;

    bunny.y=
        GROUND-bunny.height;

    bunny.velocityY=0;

    bunny.grounded=true;

    runAnimTime=0;

    jumpTime=0;

    groundOffset=0;

    dead=false;

    started=true;

    lastTime=
        performance.now();

    requestAnimationFrame(loop);
}

function jump(){

    resumeAudio();

    if(!started){

        started=true;

        bunny.grounded=true;

        runAnimTime=0;

        jumpTime=0;

        lastTime=
            performance.now();

        requestAnimationFrame(loop);

        return;
    }

    if(dead){

        restart();

        return;
    }

    if(bunny.grounded){

        bunny.velocityY=
            bunny.jumpPower;

        bunny.grounded=false;

        jumpTime=0;

        playJumpSound();
    }
}

function loop(time){

    if(
        !started||
        dead
    ){

        draw();

        return;
    }

    if(!lastTime){

        lastTime=time;
    }

    const delta=
        time-lastTime;

    lastTime=time;

    updateGame(delta);

    draw();

    if(!dead){

        requestAnimationFrame(loop);
    }
    }document.addEventListener(
    "keydown",
    function(event){

        if(
            event.code==="Space"||
            event.code==="ArrowUp"
        ){

            event.preventDefault();

            jump();
        }

        if(
            event.key.toLowerCase()==="f"
        ){

            event.preventDefault();

            toggleFullscreen();
        }

        if(
            event.key==="Escape" &&
            document.fullscreenElement
        ){

            document.exitFullscreen();
        }
    }
);

canvas.addEventListener(
    "pointerdown",
    function(event){

        event.preventDefault();

        jump();

    },
    {
        passive:false
    }
);

document.addEventListener(
    "pointerdown",
    function(event){

        const fullscreenActive=
            !!document.fullscreenElement||
            document.body.classList.contains(
                "game-fullscreen"
            );

        if(!fullscreenActive){
            return;
        }

        if(
            event.target.closest &&
            event.target.closest(
                "button,a"
            )
        ){

            return;
        }

        event.preventDefault();

        jump();

    },
    {
        passive:false
    }
);

const gameShell=
    document.getElementById("gameShell");

const fullscreenButton=
    document.getElementById("fullscreenButton");

const fullscreenExit=
    document.getElementById("fullscreenExit");

async function toggleFullscreen(){

    resumeAudio();

    try{

        if(document.fullscreenElement){

            await document.exitFullscreen();

        }else if(gameShell.requestFullscreen){

            await gameShell.requestFullscreen();

        }else{

            document.body.classList.toggle(
                "game-fullscreen"
            );
        }

    }catch(error){

        document.body.classList.toggle(
            "game-fullscreen"
        );
    }
}

fullscreenButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        toggleFullscreen();
    }
);

fullscreenExit.addEventListener(
    "click",
    function(event){

        event.preventDefault();
        event.stopPropagation();

        if(document.fullscreenElement){

            document.exitFullscreen();

        }else{

            document.body.classList.remove(
                "game-fullscreen"
            );
        }
    }
);

document.addEventListener(
    "fullscreenchange",
    function(){

        if(document.fullscreenElement){

            document.body.classList.add(
                "game-fullscreen"
            );

        }else{

            document.body.classList.remove(
                "game-fullscreen"
            );
        }

        updateTopScoreDisplay();
    }
);

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key==="arcade_theme"
        ){

            applyTheme();
            draw();
        }
    }
);

applyTheme();
updateTopScoreDisplay();
draw();

</script>
