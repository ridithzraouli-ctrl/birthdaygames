body[data-theme="pink"]{

    --text-heading:#7a4659;
    --accent-border:#bd8297;
    --accent-soft:#f9e9f0;
    --accent-badge:#f8dfe8;

    --header-bg:rgba(255,255,255,.88);
}

body[data-theme="green"]{
    --bg-base:#f3f7f2;
    --bg-grad-1:#dce8dc;
    --bg-grad-2:#d3ead3;
    --text-main:#3f6043;
    --text-heading:#467a4c;
    --accent-border:#82bd8b;
    --accent-soft:#e9f9eb;
    --accent-badge:#dff8e2;
    --ornament-color:#79b882;
    --card-bg:rgba(255,255,255,.88);
    --header-bg:rgba(255,255,255,.88);
}

body[data-theme="lavender"]{
    --bg-base:#f5f2fa;
    --bg-grad-1:#e3dcf3;
    --bg-grad-2:#dad3ea;
    --text-main:#4a3f60;
    --text-heading:#59467a;
    --accent-border:#9882bd;
    --accent-soft:#f0e9f9;
    --accent-badge:#e9dff8;

    --header-bg:rgba(255,255,255,.88);
}

body[data-theme="yellow"]{
    --bg-base:#faf8f2;
    --bg-grad-1:#f3edd2;
    --bg-grad-2:#eae3c5;
    --text-main:#60573f;
    --text-heading:#7a6e46;
    --accent-border:#bdb182;
    --accent-soft:#f9f5e9;
    --accent-badge:#f8f3df;

}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    margin:0;
    overflow:hidden;
}

body{
    background:
        radial-gradient(circle at 10% 12%,var(--bg-grad-1) 0,transparent 28%),
        radial-gradient(circle at 90% 85%,var(--bg-grad-2) 0,transparent 30%),
        var(--bg-base);
    color:var(--text-main);
    font-family:Georgia,"Times New Roman",serif;
}

.decorations{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.decorations span{
    position:absolute;
    color:var(--ornament-color);
    opacity:.35;
    animation:float 5s ease-in-out infinite;
}

.decorations span:nth-child(1){top:13%;left:7%;font-size:20px}
.decorations span:nth-child(2){top:28%;right:8%;font-size:13px;animation-delay:1s}
.decorations span:nth-child(3){top:55%;left:5%;font-size:14px;animation-delay:2s}
.decorations span:nth-child(4){top:68%;right:6%;font-size:21px;animation-delay:1.5s}
.decorations span:nth-child(5){bottom:12%;left:12%;font-size:12px;animation-delay:.5s}
.decorations span:nth-child(6){bottom:20%;right:13%;font-size:16px;animation-delay:2.5s}

@keyframes float{
    0%,100%{transform:translateY(0) rotate(0)}
    50%{transform:translateY(-7px) rotate(7deg)}
}

header{
    position:relative;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    min-height:66px;
    padding:12px 16px;
    background:var(--header-bg);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--bg-grad-2);
}

.header-left,
.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.nav-link{
    color:var(--text-heading);
    text-decoration:none;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
}

.coin-display{
    background:var(--accent-soft);
    border:1px solid var(--accent-border);
    padding:6px 10px;
    border-radius:100px;
    font-size:12px;
    font-weight:bold;
    color:var(--text-heading);
    white-space:nowrap;
}

main{
    position:relative;
    z-index:2;
    width:100%;
    height:calc(100vh - 66px);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 12px 12px;
}

.ornament{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    height:22px;
    color:var(--ornament-color);
    margin-bottom:6px;
}

.ornament span{font-size:15px}

.ornament i{
    width:32px;
    height:1px;
    background:var(--ornament-color);
    opacity:.45;
}

h1{
    color:var(--text-heading);
    font-weight:normal;
    font-size:27px;
    margin:0 0 3px;
}

.subtitle{
    margin:0 0 10px;
    font-size:13px;
    opacity:.75;
}

.game-wrap{
    width:min(960px,100%);
    aspect-ratio:960/540;
    position:relative;
    overflow:hidden;
    border:1px solid var(--accent-border);
    border-radius:16px;
    background:#b8cbd1;
    box-shadow:0 8px 28px rgba(0,0,0,.08);
}

#game{
    display:block;
    width:100%;
    height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
}

.bottom-ornament{
    margin-top:8px;
}

.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    padding:20px;
    background:rgba(30,25,25,.3);
    backdrop-filter:blur(5px);
    z-index:500;
    align-items:center;
    justify-content:center;
}

.modal-card{
    position:relative;
    background:var(--card-bg);
    border:1px solid var(--accent-border);
    border-radius:18px;
    padding:32px 26px 26px;
    max-width:360px;
    width:100%;
    text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.16);
    animation:victoryPop .35s ease;
    overflow:hidden;
}

.modal-card::before,
.modal-card::after{
    content:"✦";
    position:absolute;
    color:var(--ornament-color);
    opacity:.5;
    font-size:20px;
}

.modal-card::before{top:13px;left:18px}
.modal-card::after{top:13px;right:18px}

.victory-decoration{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    color:var(--ornament-color);
    margin-bottom:13px;
}

.victory-decoration i{
    width:30px;
    height:1px;
    background:var(--ornament-color);
    opacity:.5;
}

.victory-symbol{
    width:66px;
    height:66px;
    margin:2px auto 14px;
    border-radius:50%;
    background:var(--accent-soft);
    border:1px solid var(--accent-border);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ornament-color);
    animation:victoryFloat 2s ease-in-out infinite;
}

.modal-card h2{
    color:var(--text-heading);
    font-size:25px;
    font-weight:normal;
    margin:0 0 9px;
}

.modal-card p{
    color:var(--text-main);
    opacity:.82;
    font-size:14px;
    line-height:1.6;
    margin:0 0 21px;
}

.reward-amount{
    display:inline-block;
    margin:-5px 0 20px;
    padding:7px 13px;
    border-radius:100px;
    background:var(--accent-badge);
    border:1px solid var(--accent-border);
    color:var(--text-heading);
    font-size:13px;
    font-weight:bold;
}

.btn{
    padding:11px 20px;
    border:1px solid var(--accent-border);
    border-radius:100px;
    background:var(--card-bg);
    color:var(--text-heading);
    font-family:Georgia,"Times New Roman",serif;
    font-size:13px;
    cursor:pointer;
}

.confetti{
    position:absolute;
    pointer-events:none;
    color:var(--ornament-color);
    font-size:14px;
    animation:confettiFall 1.8s ease-out forwards;
}

.confetti:nth-child(1){left:18%;top:5%}
.confetti:nth-child(2){left:32%;top:2%;animation-delay:.12s}
.confetti:nth-child(3){left:50%;top:4%;animation-delay:.2s}
.confetti:nth-child(4){right:32%;top:2%;animation-delay:.08s}
.confetti:nth-child(5){right:17%;top:6%;animation-delay:.18s}

@keyframes victoryPop{
    0%{transform:scale(.88);opacity:0}
    100%{transform:scale(1);opacity:1}
}

@keyframes victoryFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-5px)}
}

@keyframes confettiFall{
    0%{transform:translateY(0) rotate(0);opacity:0}
    15%{opacity:.8}
    100%{transform:translateY(115px) rotate(120deg);opacity:0}
}

@media(max-width:600px){
    header{padding:11px}
    .game-wrap{
        border-radius:12px;
    }
    h1{font-size:24px}
    .subtitle{font-size:12px}
    .modal-card{
        max-width:340px;
        padding:30px 21px 23px;
    }
}
</style>

function loadSavedTheme(){
    const savedTheme=localStorage.getItem("arcade_theme");

    if(
        ["pink","green","lavender","yellow"].includes(savedTheme)
    ){
        document.body.setAttribute(
            "data-theme",
            savedTheme
        );
    }else{
        document.body.removeAttribute("data-theme");
    }
}

loadSavedTheme();

function goBack(){
    if(window.history.length>1){
        window.history.back();
    }else{
        window.location.href="../index.html";
    }
}


/* =========================
   AUDIO
========================= */

const AudioFX={

    ctx:null,

    init(){

        if(!this.ctx){

            const AudioCtx=
                window.AudioContext ||
                window.webkitAudioContext;

            if(AudioCtx){
                this.ctx=new AudioCtx();
            }
        }
    },

    play(type){

        this.init();

        if(!this.ctx)return;

        if(this.ctx.state==="suspended"){
            this.ctx.resume();
        }

        const now=this.ctx.currentTime;

        const osc=this.ctx.createOscillator();
        const gain=this.ctx.createGain();

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if(type==="jump"){

            osc.type="sine";

            osc.frequency.setValueAtTime(
                420,
                now
            );

            osc.frequency.exponentialRampToValueAtTime(
                680,
                now+.12
            );

            gain.gain.setValueAtTime(
                .12,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                .001,
                now+.16
            );

            osc.start(now);
            osc.stop(now+.16);
        }

        if(type==="coin"){

            osc.type="sine";

            osc.frequency.setValueAtTime(
                660,
                now
            );

            osc.frequency.setValueAtTime(
                880,
                now+.07
            );

            gain.gain.setValueAtTime(
                .12,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                .001,
                now+.18
            );

            osc.start(now);
            osc.stop(now+.18);
        }

        if(type==="lose"){

            osc.type="triangle";

            osc.frequency.setValueAtTime(
                300,
                now
            );

            osc.frequency.exponentialRampToValueAtTime(
                120,
                now+.4
            );

            gain.gain.setValueAtTime(
                .2,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                .001,
                now+.4
            );

            osc.start(now);
            osc.stop(now+.4);
        }
    }
};

cactusImages.small.src=

/* =========================
   CACTUS TYPES
=========================

   These are deliberately based
   on the proportions you liked:

   small   = 1 bunny unit tall
   big     = 3 bunny units tall
   two     = 2 bunny units tall
   cluster = 2 bunny units tall

   Widths:

   small   = 1 unit
   big     = 1 unit
   two     = 1.5 units
   cluster = 3.5 units
*/

const CACTUS_TYPES={

    small:{
        key:"small",
        widthUnits:1,
        heightUnits:1
    },

    big:{
        key:"big",
        widthUnits:1,
        heightUnits:3
    },

    two:{
        key:"two",
        widthUnits:1.5,
        heightUnits:2
    },

    cluster:{
        key:"cluster",
        widthUnits:3.5,
        heightUnits:2
    }

};


/* =========================
   OBSTACLES
========================= */

const obstacles=[];


/*
    This is the IMPORTANT part:

    The cactus texture itself is resized
    to exactly match these dimensions.

    So the visual cactus and its collision
    box stay synchronized.
*/

const CACTUS_UNIT=28;

function getCactusSize(type){

    return {

        width:
            type.widthUnits*
            CACTUS_UNIT,

        height:
            type.heightUnits*
            CACTUS_UNIT

    };
}


function createCactus(type,x){

    const size=getCactusSize(type);

    return {

        x:x,

        y:
            GROUND-
            size.height,

        width:size.width,

        height:size.height,

        type:type,

        counted:false

    };
}


/* =========================
   SPAWN CACTUS
========================= */

function spawnCactus(){

    /*
        Only the FOUR cactus forms
        you specified are used.
    */

    const names=[
        "small",
        "big",
        "two",
        "cluster"
    ];

    /*
        Start simple and gradually
        make the game harder.
    */

    const difficulty=
        Math.min(
            score/100,
            30
        );

    let count=1;

    if(
        difficulty>12 &&
        Math.random()<.18
    ){
        count=2;
    }

    const firstName=
        names[
            Math.floor(
                Math.random()*names.length
            )
        ];

    let x=W+70;

    for(let i=0;i<count;i++){

        let name;

        if(i===0){

            name=firstName;

        }else{

            name=
                Math.random()<.5
                ?"small"
                :"big";
        }

        const type=
            CACTUS_TYPES[name];

        const cactus=
            createCactus(
                type,
                x
            );

        obstacles.push(cactus);

        /*
            Gap is measured from the
            ACTUAL rendered width.
        */

        x+=
            cactus.width+
            70+
            Math.random()*60;
    }


    /*
        Keep cactus spacing comfortable.
    */

    const minimum=
        1050-
        Math.min(
            difficulty*10,
            300
        );

    const maximum=
        1500-
        Math.min(
            difficulty*8,
            250
        );

    nextSpawn=
        minimum+
        Math.random()*
        (maximum-minimum);

    spawnTimer=0;
}

/* =========================
   DRAW TEXTURED CACTUS
========================= */

function drawCactus(o){

    const image=
        cactusImages[o.type.key];

    /*
        If the image has not loaded yet,
        draw a temporary silhouette.

        Once loaded, this disappears
        automatically.
    */

    if(
        image.complete &&
        image.naturalWidth>0
    ){

        ctx.imageSmoothingEnabled=false;

        ctx.drawImage(
            image,
            Math.round(o.x),
            Math.round(o.y),
            Math.round(o.width),
            Math.round(o.height)
        );

    }else{

        /*
            Temporary placeholder only while
            the real texture loads.
        */

        ctx.fillStyle="#63745f";

        ctx.fillRect(
            Math.round(o.x),
            Math.round(o.y),
            Math.round(o.width),
            Math.round(o.height)
        );
    }
}


/* =========================
   BUNNY DRAWING
========================= */

function drawBunny(){

    let image;

    let frameWidth=28;
    let frameHeight=28;

    let frameIndex=0;


    if(!started && !dead){

        image=idleImage;

        frameIndex=0;

    }

    else if(!bunny.grounded){

        image=jumpImage;

        frameWidth=28;
        frameHeight=36;

        const duration=560;

        frameIndex=
            Math.min(
                7,
                Math.floor(
                    (jumpTime/duration)*8
                )
            );

    }

    else{

        image=runImage;

        frameWidth=28;
        frameHeight=28;

        frameIndex=
            Math.floor(
                runAnimTime/45
            )%8;
    }


    if(
        !image.complete ||
        !image.naturalWidth
    ){
        return;
    }


    /*
        Bunny is intentionally 3x its
        collision unit, like the old
        version you liked.

        This restores the larger bunny.
    */

    const drawW=
        frameWidth*3;

    const drawH=
        frameHeight*3;


    const feetY=
        bunny.y+bunny.height;

    const drawX=
        bunny.x;

    const drawY=
        feetY-drawH;


    ctx.save();

    /*
        Flip bunny so it faces right.
    */

    ctx.translate(
        drawX+drawW,
        drawY
    );

    ctx.scale(-1,1);


    ctx.drawImage(
        image,

        frameIndex*frameWidth,
        0,

        frameWidth,
        frameHeight,

        0,
        0,

        drawW,
        drawH
    );

    ctx.restore();
}


/* =========================
   BUNNY HITBOX
========================= */

function getBunnyHitbox(){

    /*
        The bunny's collision box is kept
        slightly inside the visible sprite.

        This makes the game feel fair.
    */

    return {

        x:bunny.x+13,

        y:bunny.y+12,

        width:52,

        height:60

    };
}


/* =========================
   CACTUS COLLISION
========================= */

function checkCollision(){

    const b=
        getBunnyHitbox();


    for(const o of obstacles){

        /*
            Because the cactus image is
            drawn using o.width/o.height,
            this box is EXACTLY the size
            of the visible cactus texture.
        */

        const cactusHit={

            x:o.x+2,

            y:o.y+2,

            width:
                Math.max(
                    1,
                    o.width-4
                ),

            height:
                Math.max(
                    1,
                    o.height-4
                )

        };


        if(

            b.x <
                cactusHit.x+
                cactusHit.width

            &&

            b.x+b.width >
                cactusHit.x

            &&

            b.y <
                cactusHit.y+
                cactusHit.height

            &&

            b.y+b.height >
                cactusHit.y

        ){

            return true;
        }
    }


    return false;
}


/* =========================
   JUMP
========================= */

function jump(){

    AudioFX.play("jump");


    if(!started){

        started=true;

        bunny.grounded=true;

        runAnimTime=0;
        jumpTime=0;

        lastTime=
            performance.now();

        requestAnimationFrame(loop);

        return;
    }


    if(dead){

        restart();

        return;
    }


    if(bunny.grounded){

        bunny.velocityY=
            bunny.jumpPower;

        bunny.grounded=false;

        jumpTime=0;
    }
}


/* =========================
   RESTART
========================= */

function restart(){

    score=0;

    speed=6;

    obstacles.length=0;

    spawnTimer=0;

    nextSpawn=1200;

    bunny.y=
        GROUND-
        bunny.height;

    bunny.velocityY=0;

    bunny.grounded=true;

    runAnimTime=0;
    jumpTime=0;

    groundOffset=0;

    dead=false;

    started=true;

    lastTime=
        performance.now();

    document.getElementById(
        "reward-modal"
    ).style.display="none";

    requestAnimationFrame(loop);
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    if(dead)return;

    dead=true;

    bunny.velocityY=0;

    AudioFX.play("lose");

    showGameOverModal();
}


/* =========================
   UPDATE
========================= */

function update(dt){

    if(!started || dead){
        return;
    }


    /* RUN ANIMATION */

    if(bunny.grounded){

        runAnimTime+=dt;
    }


    /* BUNNY PHYSICS */

    if(!bunny.grounded){

        jumpTime+=dt;

        bunny.velocityY+=
            bunny.gravity*
            (dt/16.6667);

        bunny.y+=
            bunny.velocityY*
            (dt/16.6667);


        const groundY=
            GROUND-
            bunny.height;


        if(bunny.y>=groundY){

            bunny.y=groundY;

            bunny.velocityY=0;

            bunny.grounded=true;

            runAnimTime=0;

            jumpTime=0;
        }
    }


    /*
        Gradually accelerate.
    */

    speed+=
        .00035*
        dt;


    const movement=
        speed*
        (dt/16.6667);


    /*
        SCORE FIX

        Score is now based on actual
        elapsed movement instead of
        being tied to obstacle spawning.

        It cannot randomly stop.
    */

    score+=
        movement*
        .055;


    /*
        Ground and cactus movement
        use the EXACT same movement.
    */

    groundOffset-=movement;

    if(groundOffset<=-80){

        groundOffset+=80;
    }


    /* MOVE CACTUSES */

    for(
        let i=obstacles.length-1;
        i>=0;
        i--
    ){

        const o=
            obstacles[i];

        o.x-=movement;


        /*
            +100 when the cactus has
            completely passed the bunny.
        */

        if(
            !o.counted &&
            o.x+o.width<bunny.x
        ){

            o.counted=true;

            score+=100;

            AudioFX.play("coin");
        }


        if(
            o.x+o.width<-50
        ){

            obstacles.splice(
                i,
                1
            );
        }
    }


    /* SPAWN */

    spawnTimer+=dt;

    if(
        spawnTimer>=nextSpawn
    ){

        spawnCactus();
    }


    /* COLLISION */

    if(checkCollision()){

        gameOver();
    }
}


/* =========================
   PIXEL SCORE
========================= */

function drawScore(){

    /*
        This keeps the score looking like
        the old pixel/Dino counter.

        No rounded pill.
        No normal UI font.
        Just the raw padded number.
    */

    ctx.save();

    ctx.fillStyle=DARK;

    ctx.font=
        "bold 24px monospace";

    ctx.textAlign="right";

    ctx.textBaseline="alphabetic";

    ctx.imageSmoothingEnabled=false;

    ctx.fillText(

        String(
            Math.floor(score)
        ).padStart(5,"0"),

        W-28,

        42
    );

    ctx.restore();
}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawSky();

    drawGround();


    for(const o of obstacles){

        drawCactus(o);
    }


    drawBunny();

    drawScore();


    /* START */

    if(!started){

        ctx.save();

        ctx.textAlign="center";

        ctx.fillStyle=DARK;

        ctx.font=
            "26px Georgia";

        ctx.fillText(
            "PRESS SPACE OR TAP",
            W/2,
            90
        );

        ctx.restore();
    }


    /* GAME OVER */

    if(dead){

        ctx.save();

        ctx.textAlign="center";

        ctx.fillStyle=DARK;

        ctx.font=
            "30px Georgia";

        ctx.fillText(
            "PRESS SPACE OR TAP TO RESTART",
            W/2,
            105
        );

        ctx.restore();
    }
}


/* =========================
   GAME LOOP
========================= */

function loop(time){

    if(!lastTime){
        lastTime=time;
    }

    const dt=
        Math.min(
            time-lastTime,
            32
        );

    lastTime=time;

    update(dt);

    draw();


    if(!dead){

        requestAnimationFrame(loop);
    }
}


/* =========================
   INPUT
========================= */

function handleInput(){

    if(dead){

        restart();

        return;
    }

    jump();
}


window.addEventListener(

        if(
            e.code==="Space" ||
            e.code==="ArrowUp" ||
            e.code==="KeyW"
        ){

            e.preventDefault();

            handleInput();
        }
    }
);

    if(typeof addCoins==="function"){

        addCoins(amount);

        updateCoinDisplays();
    }
}
