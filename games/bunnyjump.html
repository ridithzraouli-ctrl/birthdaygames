<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bunny Run ♡</title>

<style>
:root {
    --bg-base: #f2f7fa;
    --bg-grad-1: #dce8f3;
    --bg-grad-2: #d3e2ea;
    --text-main: #3f5260;
    --text-heading: #46637a;
    --accent-border: #82a8bd;
    --accent-soft: #e9f3f9;
    --accent-badge: #dfe8f8;
    --ornament-color: #799eb8;
    --card-bg: rgba(255,255,255,0.88);
    --header-bg: rgba(255,255,255,0.88);
}

body[data-theme="pink"] {
    --bg-base: #faf2f5;
    --bg-grad-1: #f3dce5;
    --bg-grad-2: #ead3dc;
    --text-main: #603f4c;
    --text-heading: #7a4659;
    --accent-border: #bd8297;
    --accent-soft: #f9e9f0;
    --accent-badge: #f8dfe8;
    --ornament-color: #b87992;
    --card-bg: rgba(255,255,255,0.88);
    --header-bg: rgba(255,255,255,0.88);
}

body[data-theme="green"] {
    --bg-base: #f3f7f2;
    --bg-grad-1: #dce8dc;
    --bg-grad-2: #d3ead3;
    --text-main: #3f6043;
    --text-heading: #467a4c;
    --accent-border: #82bd8b;
    --accent-soft: #e9f9eb;
    --accent-badge: #dff8e2;
    --ornament-color: #79b882;
    --card-bg: rgba(255,255,255,0.88);
    --header-bg: rgba(255,255,255,0.88);
}

body[data-theme="lavender"] {
    --bg-base: #f5f2fa;
    --bg-grad-1: #e3dcf3;
    --bg-grad-2: #dad3ea;
    --text-main: #4a3f60;
    --text-heading: #59467a;
    --accent-border: #9882bd;
    --accent-soft: #f0e9f9;
    --accent-badge: #e9dff8;
    --ornament-color: #9379b8;
    --card-bg: rgba(255,255,255,0.88);
    --header-bg: rgba(255,255,255,0.88);
}

body[data-theme="yellow"] {
    --bg-base: #faf8f2;
    --bg-grad-1: #f3edd2;
    --bg-grad-2: #eae3c5;
    --text-main: #60573f;
    --text-heading: #7a6e46;
    --accent-border: #bdb182;
    --accent-soft: #f9f5e9;
    --accent-badge: #f8f3df;
    --ornament-color: #b8aa79;
    --card-bg: rgba(255,255,255,0.88);
    --header-bg: rgba(255,255,255,0.88);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
}

body {
    overflow-x: hidden;
    background:
        radial-gradient(circle at 10% 12%, var(--bg-grad-1) 0, transparent 28%),
        radial-gradient(circle at 90% 85%, var(--bg-grad-2) 0, transparent 30%),
        var(--bg-base);
    color: var(--text-main);
    font-family: Georgia, "Times New Roman", serif;
}

.decorations {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: -1;
}

.decorations span {
    position: absolute;
    color: var(--ornament-color);
    opacity: 0.35;
    animation: float 5s ease-in-out infinite;
}

.decorations span:nth-child(1) {
    top: 13%;
    left: 7%;
    font-size: 20px;
}

.decorations span:nth-child(2) {
    top: 28%;
    right: 8%;
    font-size: 13px;
    animation-delay: 1s;
}

.decorations span:nth-child(3) {
    top: 55%;
    left: 5%;
    font-size: 14px;
    animation-delay: 2s;
}

.decorations span:nth-child(4) {
    top: 68%;
    right: 6%;
    font-size: 21px;
    animation-delay: 1.5s;
}

.decorations span:nth-child(5) {
    bottom: 12%;
    left: 12%;
    font-size: 12px;
    animation-delay: 0.5s;
}

.decorations span:nth-child(6) {
    bottom: 20%;
    right: 13%;
    font-size: 16px;
    animation-delay: 2.5s;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0) rotate(0);
    }
    50% {
        transform: translateY(-7px) rotate(7deg);
    }
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: 70px;
    padding: 12px 16px;
    background: var(--header-bg);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--bg-grad-2);
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 10px;
}

.header-left,
.header-right {
    display: flex;
    align-items: center;
    min-width: 0;
}

.header-left {
    gap: 8px;
    flex-shrink: 1;
}

.header-right {
    justify-content: flex-end;
    gap: 7px;
    flex-shrink: 0;
}

.nav-link {
    color: var(--text-heading);
    text-decoration: none;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
}

.coin-display,
.high-score-display {
    background: var(--accent-soft);
    border: 1px solid var(--accent-border);
    padding: 6px 10px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: bold;
    color: var(--text-heading);
    white-space: nowrap;
}

.fullscreen-btn {
    padding: 6px 10px;
    border: 1px solid var(--accent-border);
    border-radius: 100px;
    background: var(--card-bg);
    color: var(--text-heading);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
}

.fullscreen-btn:hover {
    background: var(--accent-soft);
}

main {
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 22px;
    margin-bottom: 12px;
    color: var(--ornament-color);
}

.ornament span {
    font-size: 16px;
}

.ornament i {
    width: 38px;
    height: 1px;
    background: var(--ornament-color);
    opacity: 0.45;
}

h1 {
    color: var(--text-heading);
    font-weight: normal;
    font-size: 28px;
    margin: 0 0 6px;
    text-align: center;
}

.subtitle {
    color: var(--text-main);
    opacity: 0.78;
    margin: 0 0 18px;
    font-size: 14px;
    text-align: center;
}

.game-wrapper {
    position: relative;
    width: min(960px, 100%);
}

.canvas-shell {
    position: relative;
    width: 100%;
    border: 1px solid var(--accent-border);
    border-radius: 14px;
    overflow: hidden;
    background: #8a9ca5;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

#gameCanvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    touch-action: none;
    cursor: pointer;
}

.game-ui {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-top: 12px;
    gap: 10px;
}

.score-box,
.high-score-box {
    padding: 7px 12px;
    border: 1px solid var(--accent-border);
    border-radius: 100px;
    background: var(--card-bg);
    color: var(--text-heading);
    font-size: 13px;
    font-weight: bold;
}

.start-hint {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 10px 18px;
    border: 1px solid var(--accent-border);
    border-radius: 100px;
    background: rgba(255,255,255,0.86);
    color: var(--text-heading);
    font-size: 13px;
    pointer-events: none;
    transition: opacity 0.2s ease;
    white-space: nowrap;
}

.fullscreen-mode .game-wrapper {
    width: 100vw;
    max-width: none;
}

.fullscreen-mode .canvas-shell {
    border-radius: 0;
    border: 0;
}

:fullscreen {
    background: var(--bg-base);
}

:fullscreen .game-wrapper {
    width: 100vw;
    height: 100vh;
    max-width: none;
    display: flex;
    align-items: center;
    justify-content: center;
}

:fullscreen .canvas-shell {
    width: min(100vw, 177.777vh);
    border-radius: 0;
    border: 0;
}

:fullscreen #gameCanvas {
    width: 100%;
    height: auto;
}

:fullscreen .game-ui {
    position: fixed;
    left: 20px;
    right: 20px;
    bottom: 18px;
    z-index: 20;
    margin: 0;
}

:fullscreen .score-box,
:fullscreen .high-score-box {
    background: rgba(255,255,255,0.88);
}

.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    padding: 20px;
    background: rgba(30,25,25,0.3);
    backdrop-filter: blur(5px);
    z-index: 500;
    align-items: center;
    justify-content: center;
}

.modal-card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--accent-border);
    border-radius: 18px;
    padding: 32px 26px 26px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 18px 50px rgba(0,0,0,0.16);
    animation: victoryPop 0.35s ease;
    overflow: hidden;
}

.modal-card::before,
.modal-card::after {
    content: "✦";
    position: absolute;
    color: var(--ornament-color);
    opacity: 0.5;
    font-size: 20px;
}

.modal-card::before {
    top: 13px;
    left: 18px;
}

.modal-card::after {
    top: 13px;
    right: 18px;
}

.victory-decoration {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    color: var(--ornament-color);
    margin-bottom: 13px;
}

.victory-decoration span {
    font-size: 15px;
}

.victory-decoration i {
    width: 30px;
    height: 1px;
    background: var(--ornament-color);
    opacity: 0.5;
}

.victory-symbol {
    width: 66px;
    height: 66px;
    margin: 2px auto 14px;
    border-radius: 50%;
    background: var(--accent-soft);
    border: 1px solid var(--accent-border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ornament-color);
    animation: victoryFloat 2s ease-in-out infinite;
}

.modal-card h2 {
    color: var(--text-heading);
    font-size: 25px;
    font-weight: normal;
    margin: 0 0 9px;
}

.modal-card p {
    color: var(--text-main);
    opacity: 0.82;
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 21px;
}

.reward-amount {
    display: inline-block;
    margin: -5px 0 20px;
    padding: 7px 13px;
    border-radius: 100px;
    background: var(--accent-badge);
    border: 1px solid var(--accent-border);
    color: var(--text-heading);
    font-size: 13px;
    font-weight: bold;
}

.btn {
    padding: 11px 20px;
    border: 1px solid var(--accent-border);
    border-radius: 100px;
    background: var(--card-bg);
    color: var(--text-heading);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s ease;
}

.btn:hover {
    background: var(--accent-soft);
    transform: translateY(-1px);
}

.confetti {
    position: absolute;
    pointer-events: none;
    color: var(--ornament-color);
    font-size: 14px;
    animation: confettiFall 1.8s ease-out forwards;
}

.confetti:nth-child(1) {
    left: 18%;
    top: 5%;
}

.confetti:nth-child(2) {
    left: 32%;
    top: 2%;
    animation-delay: 0.12s;
}

.confetti:nth-child(3) {
    left: 50%;
    top: 4%;
    animation-delay: 0.2s;
}

.confetti:nth-child(4) {
    right: 32%;
    top: 2%;
    animation-delay: 0.08s;
}

.confetti:nth-child(5) {
    right: 17%;
    top: 6%;
    animation-delay: 0.18s;
}

@keyframes victoryPop {
    0% {
        transform: scale(0.88);
        opacity: 0;
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

@keyframes victoryFloat {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-5px);
    }
}

@keyframes confettiFall {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    15% {
        opacity: 0.8;
    }
    100% {
        transform: translateY(115px) rotate(120deg);
        opacity: 0;
    }
}

@media (max-width: 700px) {
    header {
        padding: 11px 10px;
    }

    .nav-link {
        font-size: 12px;
    }

    .coin-display,
    .high-score-display,
    .fullscreen-btn {
        padding: 6px 8px;
        font-size: 11px;
    }

    main {
        padding: 20px 10px 30px;
    }

    .game-ui {
        margin-top: 9px;
    }

    .score-box,
    .high-score-box {
        font-size: 11px;
        padding: 6px 9px;
    }

    .modal-card {
        max-width: 340px;
        padding: 30px 21px 23px;
    }
}
</style>
</head>

function loadSavedTheme() {
    const savedTheme = localStorage.getItem("arcade_theme");

    if (["pink", "green", "lavender", "yellow"].includes(savedTheme)) {
        document.body.setAttribute("data-theme", savedTheme);
    } else {
        document.body.removeAttribute("data-theme");
    }
}

loadSavedTheme();

function goBack() {
    if (window.history.length > 1) {
        window.history.back();
    } else {
        window.location.href = "../index.html";
    }
}

function updateCoinUI() {
    if (typeof updateCoinDisplays === "function") {
        updateCoinDisplays();
    }
}

const AudioFX = {
    ctx: null,

    init() {
        if (!this.ctx) {
            const AudioCtx =
                window.AudioContext ||
                window.webkitAudioContext;

            if (AudioCtx) {
                this.ctx = new AudioCtx();
            }
        }
    },

    play(type) {
        this.init();

        if (!this.ctx) return;

        if (this.ctx.state === "suspended") {
            this.ctx.resume();
        }

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === "jump") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(420, now);
            osc.frequency.exponentialRampToValueAtTime(
                700,
                now + 0.12
            );

            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + 0.16
            );

            osc.start(now);
            osc.stop(now + 0.16);

        } else if (type === "score") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(660, now);
            osc.frequency.setValueAtTime(880, now + 0.07);

            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + 0.15
            );

            osc.start(now);
            osc.stop(now + 0.15);

        } else if (type === "lose") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(
                120,
                now + 0.4
            );

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + 0.4
            );

            osc.start(now);
            osc.stop(now + 0.4);
        }
    }
};

const CACTUS_TYPES = [
    {
        type: "small",
        width: 42,
        height: 42
    },
    {
        type: "big",
        width: 42,
        height: 126
    },
    {
        type: "two",
        width: 63,
        height: 84
    },
    {
        type: "wide",
        width: 84,
        height: 63
    }
];


let cacti = [];

let gameRunning = false;
let gameOver = false;

let score = 0;
let highScore =
    Number(localStorage.getItem("bunnyRunHighScore")) || 0;

let speed = 7;

let lastTime = 0;
let animationFrame = null;

let cactusTimer = 0;
let nextCactusDistance = 420;

let groundOffset = 0;

const scoreEl = document.getElementById("score");
const highScoreEl =
    document.getElementById("game-high-score");
const headerHighScoreEl =
    document.getElementById("header-high-score");

const startHint =
    document.getElementById("start-hint");


function updateHighScoreDisplay() {
    scoreEl.innerText = Math.floor(score);

    highScoreEl.innerText = highScore;

    headerHighScoreEl.innerText = highScore;
}

updateHighScoreDisplay();


function random(min, max) {
    return Math.random() * (max - min) + min;
}


function chooseCactus() {
    const index =
        Math.floor(Math.random() * CACTUS_TYPES.length);

    return CACTUS_TYPES[index];
}


function createCactus(x) {
    const data = chooseCactus();

    return {
        type: data.type,

        x: x,

        width: data.width,
        height: data.height,

        passed: false
    };
}


function spawnCactus() {
    const last =
        cacti.length
            ? cacti[cacti.length - 1]
            : null;

    let x = GAME_WIDTH + 40;

    if (last) {
        x =
            Math.max(
                x,
                last.x +
                last.width +
                nextCactusDistance
            );
    }

    cacti.push(createCactus(x));

    nextCactusDistance =
        random(360, 560);
}


function resetBunny() {
    bunny.y = GROUND - bunny.height;
    bunny.velocityY = 0;
    bunny.grounded = true;
    bunny.frame = 0;
    bunny.frameTimer = 0;
}


function resetGame() {
    score = 0;

    speed = 7;

    cacti = [];

    cactusTimer = 0;

    nextCactusDistance = 420;

    groundOffset = 0;

    scoreCoinMilestone = 0;

    gameRunning = false;
    gameOver = false;

    resetBunny();

    updateHighScoreDisplay();

    startHint.style.opacity = "1";

    closeModalOnly();

    requestAnimationFrame(render);
}


function startGame() {
    if (gameOver) {
        resetGame();
    }

    if (gameRunning) return;

    gameRunning = true;
    gameOver = false;

    startHint.style.opacity = "0";

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);
}


function jump() {
    if (gameOver) {
        resetGame();
        startGame();
        return;
    }

    if (!gameRunning) {
        startGame();
        return;
    }

    if (!bunny.grounded) return;

    bunny.velocityY =
        bunny.jumpPower;

    bunny.grounded = false;

    AudioFX.play("jump");
}<script>
function updateBunny(delta) {
    if (!gameRunning) return;

    bunny.velocityY +=
        bunny.gravity * delta;

    bunny.y +=
        bunny.velocityY * delta;

    if (bunny.y + bunny.height >= GROUND) {
        bunny.y =
            GROUND - bunny.height;

        bunny.velocityY = 0;

        bunny.grounded = true;
    } else {
        bunny.grounded = false;
    }

    bunny.frameTimer +=
        delta * 16.6667;

    if (bunny.frameTimer >= bunny.frameDelay) {
        bunny.frameTimer = 0;

        bunny.frame++;

        if (bunny.frame >= 8) {
            bunny.frame = 0;
        }
    }
}


function updateCacti(delta) {
    if (!gameRunning) return;

    for (const cactus of cacti) {
        cactus.x -=
            speed * delta;
    }

    cacti =
        cacti.filter(
            cactus =>
                cactus.x + cactus.width > -50
        );

    const last =
        cacti.length
            ? cacti[cacti.length - 1]
            : null;

    if (!last ||
        last.x + last.width <
        GAME_WIDTH - nextCactusDistance) {

        spawnCactus();
    }

    for (const cactus of cacti) {
        if (!cactus.passed &&
            cactus.x + cactus.width < bunny.x) {

            cactus.passed = true;

            score += 100;

            AudioFX.play("score");

            const newMilestone =
                Math.floor(score / 1000);

            if (newMilestone > scoreCoinMilestone) {
                const difference =
                    newMilestone -
                    scoreCoinMilestone;

                scoreCoinMilestone =
                    newMilestone;

                if (typeof addCoins === "function") {
                    addCoins(difference * 10);
                }

                updateCoinUI();
            }
        }
    }
}


function getBunnyHitbox() {
    return {
        x: bunny.x + 7,
        y: bunny.y + 5,
        width: bunny.width - 12,
        height: bunny.height - 8
    };
}


function getCactusHitbox(cactus) {
    /*
     * Collision is deliberately smaller than
     * the transparent image area.
     */
    const paddingX =
        Math.max(3, cactus.width * 0.12);

    const paddingTop =
        Math.max(2, cactus.height * 0.04);

    return {
        x: cactus.x + paddingX,
        y: GROUND - cactus.height + paddingTop,
        width:
            cactus.width -
            paddingX * 2,
        height:
            cactus.height -
            paddingTop
    };
}


function rectanglesOverlap(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}


function checkCollision() {
    if (!gameRunning) return;

    const bunnyBox =
        getBunnyHitbox();

    for (const cactus of cacti) {
        const cactusBox =
            getCactusHitbox(cactus);

        if (rectanglesOverlap(
            bunnyBox,
            cactusBox
        )) {
            loseGame();
            return;
        }
    }
}


function loseGame() {
    if (gameOver) return;

    gameRunning = false;
    gameOver = true;

    AudioFX.play("lose");

    const roundedScore =
        Math.floor(score);

    if (roundedScore > highScore) {
        highScore = roundedScore;

        localStorage.setItem(
            "bunnyRunHighScore",
            String(highScore)
        );
    }

    updateHighScoreDisplay();

    showGameOverModal();
}


function drawBackground() {
    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            GAME_HEIGHT
        );

    const theme =
        document.body.getAttribute("data-theme");

    if (theme === "pink") {
        gradient.addColorStop(0, "#f3dce5");
        gradient.addColorStop(1, "#faf2f5");
    } else if (theme === "green") {
        gradient.addColorStop(0, "#dce8dc");
        gradient.addColorStop(1, "#f3f7f2");
    } else if (theme === "lavender") {
        gradient.addColorStop(0, "#e3dcf3");
        gradient.addColorStop(1, "#f5f2fa");
    } else if (theme === "yellow") {
        gradient.addColorStop(0, "#f3edd2");
        gradient.addColorStop(1, "#faf8f2");
    } else {
        gradient.addColorStop(0, "#dce8f3");
        gradient.addColorStop(1, "#f2f7fa");
    }

    ctx.fillStyle = gradient;
    ctx.fillRect(
        0,
        0,
        GAME_WIDTH,
        GAME_HEIGHT
    );
}


function drawCloud(x, y, scale) {
    ctx.save();

    ctx.globalAlpha = 0.28;

    ctx.fillStyle = "#ffffff";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        18 * scale,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 20 * scale,
        y - 8 * scale,
        23 * scale,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 45 * scale,
        y,
        17 * scale,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
}


function drawClouds() {
    drawCloud(
        145 - groundOffset * 0.05,
        100,
        1
    );

    drawCloud(
        570 - groundOffset * 0.025,
        150,
        0.72
    );

    drawCloud(
        820 - groundOffset * 0.04,
        82,
        0.6
    );
}


function drawGround() {
    const theme =
        document.body.getAttribute("data-theme");

    let groundColor = "#8a9ca5";

    if (theme === "pink") {
        groundColor = "#a58d97";
    } else if (theme === "green") {
        groundColor = "#8b9f8c";
    } else if (theme === "lavender") {
        groundColor = "#9790a5";
    } else if (theme === "yellow") {
        groundColor = "#a59c80";
    }

    ctx.fillStyle = groundColor;

    ctx.fillRect(
        0,
        GROUND,
        GAME_WIDTH,
        GAME_HEIGHT - GROUND
    );

    ctx.fillStyle =
        "rgba(255,255,255,0.16)";

    for (
        let x = -groundOffset;
        x < GAME_WIDTH;
        x += 28
    ) {
        ctx.fillRect(
            x,
            GROUND + 13,
            13,
            2
        );
    }
}


function drawCactus(cactus) {
    const image =
        cactusImages[cactus.type];

    if (!image.complete) return;

    const y =
        GROUND - cactus.height;

    ctx.drawImage(
        image,
        cactus.x,
        y,
        cactus.width,
        cactus.height
    );
}


function drawBunny() {
    let image;
    let frameWidth = 28;
    let frameHeight = 28;

    if (!bunny.grounded) {
        image = jumpImage;
        frameWidth = 28;
        frameHeight = 36;
    } else if (gameRunning) {
        image = runImage;
        frameWidth = 28;
        frameHeight = 28;
    } else {
        image = idleImage;
        frameWidth = 28;
        frameHeight = 28;
    }

    if (!image.complete) return;

    /*
     * The sprite sheet is flipped horizontally
     * so the bunny faces the opposite direction.
     */
    ctx.save();

    ctx.translate(
        bunny.x + bunny.width,
        bunny.y
    );

    ctx.scale(-1, 1);

    if (image === jumpImage) {
        ctx.drawImage(
            image,
            bunny.frame * frameWidth,
            0,
            frameWidth,
            frameHeight,
            0,
            0,
            bunny.width,
            bunny.height
        );
    } else {
        ctx.drawImage(
            image,
            bunny.frame * frameWidth,
            0,
            frameWidth,
            frameHeight,
            0,
            0,
            bunny.width,
            bunny.height
        );
    }

    ctx.restore();
}


function render() {
    ctx.clearRect(
        0,
        0,
        GAME_WIDTH,
        GAME_HEIGHT
    );

    drawBackground();

    drawClouds();

    drawGround();

    for (const cactus of cacti) {
        drawCactus(cactus);
    }

    drawBunny();

    updateHighScoreDisplay();
}


function gameLoop(timestamp) {
    if (!gameRunning) {
        render();
        return;
    }

    const delta =
        Math.min(
            (timestamp - lastTime) / 16.6667,
            2
        );

    lastTime = timestamp;

    groundOffset +=
        speed * delta;

    if (groundOffset > 28) {
        groundOffset -= 28;
    }

    updateBunny(delta);

    updateCacti(delta);

    checkCollision();

    score +=
        0.15 * delta;

    render();

    animationFrame =
        requestAnimationFrame(gameLoop);
}


function showGameOverModal() {
    const modal =
        document.getElementById(
            "reward-modal"
        );

    const title =
        document.getElementById(

    desc.innerText =

    amount.style.display =

        `High Score: ${highScore}`;

function closeModalOnly() {
    document.getElementById(
        "reward-modal"
    ).style.display = "none";
}


function closeGameOver() {
    closeModalOnly();

    resetGame();

    startGame();
}


function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement
            .requestFullscreen()
            .catch(() => {});
    } else {
        document.exitFullscreen()
            .catch(() => {});
    }
}


document.addEventListener(
    "fullscreenchange",
    function() {
        document.body.classList.toggle(
            "fullscreen-mode",
            !!document.fullscreenElement
        );
    }
);


function handleInput(e) {
    if (
        e.code === "Space" ||
        e.code === "ArrowUp" ||
        e.code === "KeyW"
    ) {
        e.preventDefault();
        jump();
    }
}


document.addEventListener(
    "keydown",
    handleInput
);


canvas.addEventListener(
    "pointerdown",
    function(e) {
        e.preventDefault();
        jump();
    }
);


document.addEventListener(
    "visibilitychange",
    function() {
        if (document.hidden &&
            gameRunning) {
            gameRunning = false;
            startHint.style.opacity = "1";
            startHint.innerText =
                "Press Space, ↑ or tap to continue";
        }
    }
);


window.addEventListener(
    "load",
    function() {
        loadSavedTheme();

        if (typeof updateCoinDisplays === "function") {
            updateCoinDisplays();
        }

        resetGame();
    }
);


window.addEventListener(
    "resize",
    function() {
        render();
    }
);
</script><script>
/*
 * Keep the first cactus ready outside the
 * visible play area so the opening remains
 * clean and gives the bunny time to start.
 */
cacti = [
    createCactus(
        GAME_WIDTH + 430
    )
];

nextCactusDistance = 420;

resetBunny();

render();


/*
 * Keep the high score synchronized if the
 * page is restored from another tab.
 */
window.addEventListener(
    "storage",
    function(e) {
        if (e.key === "bunnyRunHighScore") {
            highScore =
                Number(e.newValue) || 0;

            updateHighScoreDisplay();
        }

        if (e.key === "arcade_theme") {
            loadSavedTheme();
            render();
        }
    }
);


/*
 * Make sure the bunny's sprite is drawn
 * correctly as soon as the images finish
 * loading.
 */
[
    idleImage,
    runImage,
    jumpImage,
    cactusImages.small,
    cactusImages.big,
    cactusImages.two,
    cactusImages.wide
].forEach(function(image) {
    image.addEventListener(
        "load",
        function() {
            render();
        }
    );
});


/*
 * Prevent accidental page scrolling while
 * playing with touch controls.
 */
canvas.addEventListener(
    "touchstart",
    function(e) {
        e.preventDefault();
    },
    { passive: false }
);

canvas.addEventListener(
    "touchmove",
    function(e) {
        e.preventDefault();
    },
    { passive: false }
);


/*
 * Fullscreen keyboard escape is handled by
 * the browser itself. The game keeps running
 * when fullscreen is exited.
 */
document.addEventListener(
    "fullscreenchange",
    function() {
        setTimeout(function() {
            render();
        }, 50);
    }
);


/*
 * Start the first frame without starting
 * the actual run until the player presses
 * Space / ↑ / W / taps.
 */
requestAnimationFrame(
    function() {
        render();
    }
);
</script>
