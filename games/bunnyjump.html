<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunny Hop: Ultimate Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            color: #fff;
        }

        .arcade-cabinet {
            background: #2b2b2b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.1);
            border: 3px solid #444;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 5px;
            font-size: 14px;
            color: #aaa;
            letter-spacing: 1px;
        }

        .game-window {
            width: 800px;
            height: 350px;
            position: relative;
            overflow: hidden;
            border-radius: 6px;
            border: 3px solid #111;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
        }

        .controls-hint {
            margin-top: 12px;
            font-size: 12px;
            color: #777;
            text-align: center;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="arcade-cabinet">
    <div class="game-header">
        <span>🐰 BUNNY HOP ARCADE</span>
        <span>CONTROLS: SPACE / UP / CLICK TO JUMP & DUCK</span>
    </div>
    <div class="game-window">
        <canvas id="gameCanvas" width="800" height="350"></canvas>
    </div>
    <div class="controls-hint">
        [ SPACEBAR or UP ARROW ] Jump &nbsp;|&nbsp; [ DOWN ARROW ] Duck / Fast Fall
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Game States
    const STATE = { START: 0, PLAYING: 1, GAMEOVER: 2 };
    let gameState = STATE.START;

    let score = 0;
    let highScore = 0;
    let gameSpeed = 5;
    let frameCount = 0;
    let particles = [];
    let clouds = [
        { x: 100, y: 60, speed: 0.8 },
        { x: 400, y: 90, speed: 1.2 },
        { x: 700, y: 50, speed: 1.0 }
    ];
    let obstacles = [];

    // Bunny Character (Sandy Lop-eared Design)
    let bunny = {
        x: 80,
        y: 242,
        width: 52,
        height: 44,
        normalHeight: 44,
        duckHeight: 26,
        vy: 0,
        gravity: 0.7,
        jumpForce: -12.5,
        isGrounded: true,
        isDuck: false
    };

    // Input Trackers
    const keys = {};

    window.addEventListener("keydown", (e) => {
        if (["Space", "ArrowUp", "ArrowDown", "KeyW", "KeyS"].includes(e.code)) {
            e.preventDefault(); // Stop page scrolling
        }
        keys[e.code] = true;

        if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
            triggerJump();
        }
    });

    window.addEventListener("keyup", (e) => {
        keys[e.code] = false;
    });

    canvas.addEventListener("click", () => {
        triggerJump();
    });

    function triggerJump() {
        if (gameState === STATE.START || gameState === STATE.GAMEOVER) {
            startGame();
        } else if (gameState === STATE.PLAYING && bunny.isGrounded && !bunny.isDuck) {
            bunny.vy = bunny.jumpForce;
            bunny.isGrounded = false;
            createJumpDust();
        }
    }

    function startGame() {
        gameState = STATE.PLAYING;
        score = 0;
        gameSpeed = 5;
        obstacles = [];
        particles = [];
        bunny.y = 242;
        bunny.vy = 0;
        bunny.isGrounded = true;
        frameCount = 0;
    }

    function createJumpDust() {
        for (let i = 0; i < 6; i++) {
            particles.push({
                x: bunny.x + 20 + (Math.random() * 20 - 10),
                y: 286,
                vx: Math.random() * 2 - 1,
                vy: -Math.random() * 2 - 0.5,
                radius: Math.random() * 3 + 1,
                alpha: 0.8
            });
        }
    }

    function spawnObstacle() {
        const types = [
            // Single Regular Cactus
            { type: 'cactus', width: 26, height: 48, y: 240, subtype: 'single' },
            // Wide Multi-arm Cactus
            { type: 'cactus', width: 44, height: 56, y: 232, subtype: 'triple' },
            // Small Cluster
            { type: 'cactus', width: 34, height: 36, y: 252, subtype: 'cluster' },
            // High Flying Bird / Pterodactyl style obstacle (requires ducking!)
            { type: 'bird', width: 40, height: 26, y: 195, anim: 0 }
        ];

        // Favor cacti early on, introduce birds after score reaches 100
        let availableTypes = types;
        if (score < 100) {
            availableTypes = types.filter(t => t.type === 'cactus');
        }

        const chosen = availableTypes[Math.floor(Math.random() * availableTypes.length)];
        
        obstacles.push({
            x: canvas.width + 50,
            y: chosen.y,
            width: chosen.width,
            height: chosen.height,
            type: chosen.type,
            subtype: chosen.subtype || 'none',
            animFrame: 0
        });
    }

    function update() {
        if (gameState !== STATE.PLAYING) return;

        frameCount++;
        score += 0.12;

        // Dynamic Difficulty Scaling (Gradually increases speed)
        gameSpeed = 5 + Math.floor(score / 120) * 0.6;
        if (gameSpeed > 11) gameSpeed = 11; // Speed cap for playability

        // Ducking mechanics check
        if (keys["ArrowDown"] || keys["KeyS"]) {
            if (bunny.isGrounded) {
                bunny.isDuck = true;
                bunny.height = bunny.duckHeight;
            } else {
                // Fast fall if holding down in mid-air
                bunny.vy += 1.2;
            }
        } else {
            bunny.isDuck = false;
            bunny.height = bunny.normalHeight;
        }

        // Apply Gravity & Physics
        bunny.vy += bunny.gravity;
        bunny.y += bunny.vy;

        const groundLevel = 286 - bunny.height;
        if (bunny.y >= groundLevel) {
            bunny.y = groundLevel;
            bunny.vy = 0;
            bunny.isGrounded = true;
        }

        // Background Clouds Update
        clouds.forEach(cloud => {
            cloud.x -= cloud.speed;
            if (cloud.x < -80) {
                cloud.x = canvas.width + 60;
                cloud.y = 30 + Math.random() * 90;
            }
        });

        // Obstacle Spawning Logic
        let minSpawnGap = 260 - (gameSpeed * 10);
        if (minSpawnGap < 140) minSpawnGap = 140;

        if (obstacles.length === 0 || canvas.width - obstacles[obstacles.length - 1].x > minSpawnGap + Math.random() * 120) {
            if (Math.random() < 0.85) {
                spawnObstacle();
            }
        }

        // Update Obstacles & Check Collisions
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= gameSpeed;

            if (obs.type === 'bird') {
                obs.animFrame += 0.15; // Wing flap animation cycle
            }

            // Precise Bounding Box Collision with hitbox buffer
            const hitBufferX = 8;
            const hitBufferY = 6;
            
            if (
                bunny.x + hitBufferX < obs.x + obs.width - hitBufferX &&
                bunny.x + bunny.width - hitBufferX > obs.x + hitBufferX &&
                bunny.y + hitBufferY < obs.y + obs.height &&
                bunny.y + bunny.height > obs.y + hitBufferY
            ) {
                gameState = STATE.GAMEOVER;
                if (Math.floor(score) > highScore) {
                    highScore = Math.floor(score);
                }
            }

            // Remove off-screen items
            if (obs.x + obs.width < -50) {
                obstacles.splice(i, 1);
            }
        }

        // Update Ground Dust Particles
        particles.forEach((p, index) => {
            p.x += p.vx - (gameSpeed * 0.4);
            p.y += p.vy;
            p.alpha -= 0.03;
            if (p.alpha <= 0) particles.splice(index, 1);
        });
    }

    // --- DRAWING FUNCTIONS ---

    function drawSkyAndBackground() {
        // Dynamic day/night subtle hue shift based on score milestones
        let phase = Math.floor(score / 300) % 2;
        let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        
        if (phase === 0) {
            // Day Theme (Blue sky, fluffy pixel clouds)
            skyGradient.addColorStop(0, "#5b8c9d");
            skyGradient.addColorStop(1, "#86a9b5");
        } else {
            // Sunset / Dusk Theme (Purple-orange arcade atmosphere)
            skyGradient.addColorStop(0, "#4a3554");
            skyGradient.addColorStop(1, "#7d5a64");
        }
        
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Clouds
        clouds.forEach(c => {
            ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
            ctx.fillRect(c.x, c.y, 54, 16);
            ctx.fillRect(c.x + 10, c.y - 8, 34, 10);
            ctx.fillRect(c.x + 8, c.y + 14, 40, 8);
        });
    }

    function drawGround() {
        // Arid Desert Terrain
        ctx.fillStyle = "#b58c63";
        ctx.fillRect(0, 286, canvas.width, 64);

        // Top soil highlight line
        ctx.fillStyle = "#8a6542";
        ctx.fillRect(0, 286, canvas.width, 5);

        // Scrolling pixel pebbles & ground cracks
        ctx.fillStyle = "#63472d";
        let patternOffset = Math.floor((frameCount * gameSpeed) % 50);
        for (let i = -50; i < canvas.width + 50; i += 50) {
            let px = i - patternOffset;
            ctx.fillRect(px + 12, 302, 5, 3);
            ctx.fillRect(px + 30, 318, 8, 2);
            ctx.fillRect(px + 42, 298, 4, 4);
        }

        // Draw Dust Particles
        particles.forEach(p => {
            ctx.fillStyle = `rgba(215, 195, 175, ${p.alpha})`;
            ctx.fillRect(p.x, p.y, p.radius * 2, p.radius * 2);
        });
    }

    function drawBunny(x, y) {
        // Sandy Cream / Golden-Brown Lop Bunny Styling
        if (bunny.isDuck) {
            // Ducking Posture (Sleek low profile)
            ctx.fillStyle = "#f3e1c6";
            ctx.fillRect(x + 6, y + 8, 40, 18); // Flattened body

            ctx.fillStyle = "#f9eedc";
            ctx.fillRect(x + 28, y + 2, 20, 16); // Head tucked forward

            // Floppy ears sweeping back
            ctx.fillStyle = "#e2caaa";
            ctx.fillRect(x + 10, y + 4, 20, 7);

            // Eye & nose
            ctx.fillStyle = "#3c2817";
            ctx.fillRect(x + 42, y + 6, 3, 3);
            ctx.fillRect(x + 46, y + 10, 2, 2);
        } else {
            // Standard / Jumping Posture
            // Main Torso
            ctx.fillStyle = "#f3e1c6";
            ctx.fillRect(x + 10, y + 12, 32, 24);

            // Head Structure
            ctx.fillStyle = "#f9eedc";
            ctx.fillRect(x + 24, y + 2, 22, 20);

            // Characteristic Long Floppy Lop Ears
            ctx.fillStyle = "#e2caaa";
            ctx.fillRect(x + 16, y + 6, 8, 24); // Left floppy ear
            ctx.fillRect(x + 38, y + 8, 9, 22); // Right floppy ear

            // Face Details (Dark brown eyes & tiny twitchy nose)
            ctx.fillStyle = "#3c2817";
            ctx.fillRect(x + 37, y + 8, 3, 4);
            ctx.fillRect(x + 43, y + 13, 2, 2);

            // Soft White Belly Patch & Paws
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(x + 28, y + 22, 12, 14); // Chest tuft
            ctx.fillRect(x + 12, y + 32, 8, 8);   // Back paw
            ctx.fillRect(x + 32, y + 34, 8, 6);   // Front paw
            
            // Fluffy Cottontail
            ctx.fillRect(x + 5, y + 18, 6, 6);
        }
    }

    function drawObstacle(obs) {
        if (obs.type === 'cactus') {
            ctx.fillStyle = "#4c7c50"; // Vibrant desert cactus green

            if (obs.subtype === 'triple') {
                // Tall multi-arm cactus matching reference assets
                ctx.fillRect(obs.x + 16, obs.y, 14, 56);
                // Left arm
                ctx.fillRect(obs.x, obs.y + 16, 11, 24);
                ctx.fillRect(obs.x + 6, obs.y + 16, 5, 8);
                // Right arm
                ctx.fillRect(obs.x + 33, obs.y + 22, 11, 24);
                obs.x + 33 && ctx.fillRect(obs.x + 33, obs.y + 22, 5, 8);

                // Spiny highlight details
                ctx.fillStyle = "#2c462e";
                ctx.fillRect(obs.x + 21, obs.y + 8, 2, 5);
                ctx.fillRect(obs.x + 21, obs.y + 30, 2, 5);
                ctx.fillRect(obs.x + 4, obs.y + 22, 2, 3);
            } else if (obs.subtype === 'cluster') {
                // Short multi-cluster cactus
                ctx.fillRect(obs.x + 4, obs.y + 6, 10, 30);
                ctx.fillRect(obs.x + 18, obs.y, 12, 36);
                ctx.fillRect(obs.x + 26, obs.y + 12, 8, 24);
            } else {
                // Standard single cactus stalk
                ctx.fillRect(obs.x + 8, obs.y, 12, 48);
                ctx.fillRect(obs.x, obs.y + 14, 28, 7); // side branches
                
                ctx.fillStyle = "#2c462e";
                ctx.fillRect(obs.x + 13, obs.y + 6, 2, 5);
            }
        } else if (obs.type === 'bird') {
            // Flying Desert Hawk / Pterodactyl equivalent obstacle
            ctx.fillStyle = "#705663";
            ctx.fillRect(obs.x + 10, obs.y + 8, 20, 10); // Body
            ctx.fillRect(obs.x + 28, obs.y + 10, 8, 6);   // Head/Beak

            // Flapping Wings depending on animation cycle frame
            ctx.fillStyle = "#8a6d7d";
            let flapState = Math.floor(obs.animFrame) % 2;
            if (flapState === 0) {
                // Wings Up
                ctx.fillRect(obs.x + 12, obs.y, 14, 8);
            } else {
                // Wings Down
                ctx.fillRect(obs.x + 12, obs.y + 16, 14, 8);
            }
        }
    }

    function drawUI() {
        // High Score & Current Scoreboard Display
        ctx.fillStyle = "#666";
        ctx.font = "bold 16px 'Courier New', monospace";
        
        let scoreStr = Math.floor(score).toString().padStart(5, '0');
        let hiStr = highScore.toString().padStart(5, '0');
        
        ctx.fillText(`HI: ${hiStr}  ${scoreStr}`, canvas.width - 215, 30);

        if (gameState === STATE.START) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 28px 'Courier New', monospace";
            ctx.textAlign = "center";
            ctx.fillText("BUNNY HOP ARCADE", canvas.width / 2, 125);

            ctx.font = "15px 'Courier New', monospace";
            ctx.fillText("Press SPACEBAR, UP ARROW, or CLICK to Begin", canvas.width / 2, 170);
            ctx.fillText("Jump over cacti & duck under flying desert hazards!", canvas.width / 2, 200);

            // Preview Bunny Badge
            ctx.fillStyle = "#f3e1c6";
            ctx.fillRect(canvas.width / 2 - 26, 225, 52, 44);
            
            ctx.textAlign = "left"; // reset
        } else if (gameState === STATE.GAMEOVER) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ff6b6b";
            ctx.font = "bold 26px 'Courier New', monospace";
            ctx.textAlign = "center";
            ctx.fillText("G A M E   O V E R", canvas.width / 2, 130);

            ctx.fillStyle = "#ffffff";
            ctx.font = "15px 'Courier New', monospace";
            ctx.fillText(`Final Score: ${Math.floor(score)}`, canvas.width / 2, 170);
            ctx.fillText("Click or Press Space to Restart", canvas.width / 2, 205);

            ctx.textAlign = "left"; // reset
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Environment Layers
        drawSkyAndBackground();
        drawGround();

        // Draw Obstacles (Cacti and Birds)
        obstacles.forEach(obs => drawObstacle(obs));

        // Draw Main Player Character (Bunny)
        drawBunny(bunny.x, bunny.y);

        // Draw UI & Overlays
        drawUI();
    }

    function mainLoop() {
        update();
        draw();
        requestAnimationFrame(mainLoop);
    }

    // Start Execution Loop
    mainLoop();
</script>

</body>
    </html>
