<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Bunny Run ♡</title>

<style>
:root{
    --bg-base:#f2f7fa;
    --bg-grad-1:#dce8f3;
    --bg-grad-2:#d3e2ea;
    --sky:#8a9ca5;
    --ground:#66777f;
    --ground-dark:#53636a;
    --text:#3a4650;
    --panel:#f7fbfd;
    --panel-border:#b9cbd4;
    --accent:#8da9b8;
}

body[data-theme="pink"]{
    --bg-base:#faf2f5;
    --bg-grad-1:#f1dce4;
    --bg-grad-2:#ead3dc;
    --sky:#b99aa5;
    --ground:#876b76;
    --ground-dark:#715761;
    --text:#58424b;
    --panel:#fff8fa;
    --panel-border:#d7b8c4;
    --accent:#c29aaa;
}

body[data-theme="green"]{
    --bg-base:#f2f8f3;
    --bg-grad-1:#dcebdd;
    --bg-grad-2:#d1e3d4;
    --sky:#8fa99a;
    --ground:#657c6d;
    --ground-dark:#53675a;
    --text:#405047;
    --panel:#f8fcf8;
    --panel-border:#b9ceb9;
    --accent:#91ad98;
}

body[data-theme="lavender"]{
    --bg-base:#f5f2fa;
    --bg-grad-1:#e4dff1;
    --bg-grad-2:#d9d2e8;
    --sky:#a39bb5;
    --ground:#756c84;
    --ground-dark:#625a6f;
    --text:#4e475a;
    --panel:#fbf9ff;
    --panel-border:#c9bfd9;
    --accent:#a99abd;
}

body[data-theme="yellow"]{
    --bg-base:#fbf8ed;
    --bg-grad-1:#f1e9c9;
    --bg-grad-2:#e9dfb9;
    --sky:#b5aa80;
    --ground:#887e58;
    --ground-dark:#716944;
    --text:#5a543e;
    --panel:#fffdf5;
    --panel-border:#d6cb9e;
    --accent:#b7a764;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:Georgia,"Times New Roman",serif;
    background:
        radial-gradient(circle at 20% 15%,rgba(255,255,255,.65),transparent 30%),
        linear-gradient(135deg,var(--bg-grad-1),var(--bg-grad-2));
    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:18px;
    overflow-x:hidden;
}

.page{
    width:min(1100px,100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
}

.topbar{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:8px 4px;
}

.back-link,
.fullscreen-btn{
    border:1px solid var(--panel-border);
    background:rgba(255,255,255,.65);
    color:var(--text);
    text-decoration:none;
    border-radius:14px;
    padding:9px 14px;
    font-family:inherit;
    font-size:15px;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(60,70,80,.08);
    transition:.2s ease;
}

.back-link:hover,
.fullscreen-btn:hover{
    transform:translateY(-1px);
    background:rgba(255,255,255,.85);
}

.game-title{
    font-size:26px;
    font-weight:bold;
    letter-spacing:.3px;
    text-align:center;
}

.coin-display{
    min-width:110px;
    text-align:center;
    border:1px solid var(--panel-border);
    background:rgba(255,255,255,.7);
    border-radius:14px;
    padding:9px 13px;
    font-size:15px;
    box-shadow:0 3px 10px rgba(60,70,80,.08);
}

.game-shell{
    position:relative;
    width:min(960px,100%);
    aspect-ratio:16/9;
    border-radius:22px;
    overflow:hidden;
    border:2px solid var(--panel-border);
    background:var(--sky);
    box-shadow:
        0 12px 30px rgba(60,70,80,.14),
        0 2px 8px rgba(60,70,80,.08);
}

canvas{
    display:block;
    width:100%;
    height:100%;
    image-rendering:auto;
    touch-action:none;
}

.game-fullscreen{
    background:var(--sky);
    border:none;
    border-radius:0;
    width:100vw;
    height:100vh;
    max-width:none;
    aspect-ratio:auto;
}

body.game-fullscreen{
    padding:0;
    background:var(--sky);
    align-items:center;
}

body.game-fullscreen .page{
    width:100vw;
    height:100vh;
    max-width:none;
    gap:0;
}

body.game-fullscreen .topbar{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    z-index:20;
    pointer-events:none;
}

body.game-fullscreen .topbar > *{
    pointer-events:auto;
}

body.game-fullscreen .game-shell{
    width:100vw;
    height:100vh;
    border-radius:0;
    border:none;
}

.toast{
    position:fixed;
    left:50%;
    top:82px;
    transform:translateX(-50%) translateY(-10px);
    opacity:0;
    pointer-events:none;
    z-index:50;
    background:rgba(255,255,255,.94);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:10px 18px;
    font-size:16px;
    font-weight:bold;
    box-shadow:0 8px 22px rgba(50,60,70,.14);
    transition:.25s ease;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(max-width:600px){
    body{
        padding:10px;
    }

    .topbar{
        gap:7px;
    }

    .back-link,
    .fullscreen-btn,
    .coin-display{
        font-size:13px;
        padding:8px 9px;
    }

    .game-title{
        font-size:21px;
    }

    .coin-display{
        min-width:90px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="topbar">
        <a class="back-link" href="../index.html">← Arcade</a>

        <div class="game-title">Bunny Run ♡</div>

        <div class="coin-display">
            <span class="coin-count" id="coin-count">0</span> Coins
        </div>

        <button class="fullscreen-btn" id="fullscreen-btn">Fullscreen</button>
    </div>

    <div class="game-shell" id="game-shell">
        <canvas id="game" width="960" height="540"></canvas>
    </div>

</div>

<div class="toast" id="coin-toast"></div>

<!-- Shared Arcade coin/theme system -->
<script src="../script.js"></script>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const gameShell=document.getElementById("game-shell");
const fullscreenBtn=document.getElementById("fullscreen-btn");
const coinCountEl=document.getElementById("coin-count");
const coinToast=document.getElementById("coin-toast");

const W=960;
const H=540;
const GROUND=425;

let running=true;
let gameStarted=true;
let gameEnded=false;

let score=0;
let lastTime=performance.now();

let speed=6;
let spawnTimer=0;
let nextSpawn=1650;

let obstacles=[];

let lastCoinMilestone=0;
let runCoinsEarned=0;

const bunny={
    x:110,
    y:GROUND-28,
    width:28,
    height:28,
    velocityY:0,
    grounded:true,
    gravity:0.72,
    jumpPower:-16.2
};

let topScore=Number(localStorage.getItem("bunnyRun_topScore")||0);

const cactusSources=[
    "games/1000082076-removebg-preview.png",
    "games/1000082078-removebg-preview.png",
    "games/1000082080-removebg-preview.png",
    "games/1000082081-removebg-preview.png"
];

const cactusImages=[];

for(const src of cactusSources){
    const img=new Image();

    img.src=src;

    img.onerror=()=>{
        if(!img.dataset.fallback){
            img.dataset.fallback="1";

            const filename=src.split("/").pop();
            img.src="../games/"+filename;
        }
    };

    cactusImages.push(img);
}

const bunnyRunFrames=[];
const bunnyJumpFrames=[];

function createBunnyFrame(index,jumping=false){
    const c=document.createElement("canvas");

    c.width=jumping?28:28;
    c.height=jumping?36:28;

    const x=c.getContext("2d");

    x.imageSmoothingEnabled=false;

    x.fillStyle="#b8905b";
    x.fillRect(5,7,16,15);

    x.fillRect(4,10,18,11);

    x.fillStyle="#3a2518";

    x.fillRect(6,3,5,9);
    x.fillRect(14,2,5,10);

    x.fillRect(3,12,4,4);
    x.fillRect(19,13,4,3);

    x.fillRect(7,8,2,2);

    x.fillStyle="#e6d5b8";
    x.fillRect(6,15,5,5);

    x.fillStyle="#3a2518";
    x.fillRect(4,14,3,3);

    x.fillStyle="#b8905b";
    x.fillRect(20,18,5,5);

    if(index%2===0 && !jumping){
        x.fillRect(8,21,4,5);
        x.fillRect(16,21,4,5);
    }else if(!jumping){
        x.fillRect(9,21,4,5);
        x.fillRect(17,20,4,6);
    }

    return c;
}

for(let i=0;i<8;i++){
    bunnyRunFrames.push(createBunnyFrame(i,false));
}

for(let i=0;i<8;i++){
    bunnyJumpFrames.push(createBunnyFrame(i,true));
}

let runFrame=0;
let runFrameTimer=0;
const RUN_FRAME_TIME=45;

let jumpFrame=0;
let jumpFrameTimer=0;
const JUMP_FRAME_TIME=55;

function getTheme(){
    return localStorage.getItem("arcade_theme")||"blue";
}

function applyTheme(){
    const theme=getTheme();

    if(theme==="pink"){
        document.body.dataset.theme="pink";
    }else if(theme==="green"){
        document.body.dataset.theme="green";
    }else if(theme==="lavender"){
        document.body.dataset.theme="lavender";
    }else if(theme==="yellow"){
        document.body.dataset.theme="yellow";
    }else{
        document.body.dataset.theme="blue";
    }
}

applyTheme();

window.addEventListener("storage",e=>{
    if(e.key==="arcade_theme"){
        applyTheme();
        draw();
    }
});

function updateCoinDisplay(){
    if(typeof updateCoinDisplays==="function"){
        updateCoinDisplays();
    }

    const storedCoins=Number(localStorage.getItem("arcade_coins")||0);

    if(coinCountEl){
        coinCountEl.textContent=storedCoins;
    }
}

updateCoinDisplay();

function showCoinToast(amount){
    if(!coinToast) return;

    coinToast.textContent="+"+amount+" Coins";
    coinToast.classList.add("show");

    clearTimeout(showCoinToast.timer);

    showCoinToast.timer=setTimeout(()=>{
        coinToast.classList.remove("show");
    },1200);
}<script>
function awardCoinsForScore(){
    const currentCoinMilestone=Math.floor(score/1000);

    if(currentCoinMilestone<=lastCoinMilestone){
        return;
    }

    const earned=currentCoinMilestone-lastCoinMilestone;
    const coinsEarned=earned*10;

    /*
        The shared Arcade system lives in ../script.js.
        Bunny Run only awards coins through that system.
    */
    if(typeof addCoins==="function"){
        addCoins(coinsEarned);
    }

    runCoinsEarned+=coinsEarned;
    lastCoinMilestone=currentCoinMilestone;

    updateCoinDisplay();
    showCoinToast(coinsEarned);
}

function jump(){
    if(!gameStarted){
        restartGame();
        return;
    }

    if(gameEnded){
        restartGame();
        return;
    }

    if(bunny.grounded){
        bunny.velocityY=bunny.jumpPower;
        bunny.grounded=false;
        jumpFrame=0;
        jumpFrameTimer=0;
    }
}

function restartGame(){
    score=0;
    speed=6;

    spawnTimer=0;
    nextSpawn=1650;

    obstacles=[];

    bunny.y=GROUND-bunny.height;
    bunny.velocityY=0;
    bunny.grounded=true;

    running=true;
    gameStarted=true;
    gameEnded=false;

    lastCoinMilestone=0;
    runCoinsEarned=0;

    lastTime=performance.now();

    requestAnimationFrame(gameLoop);
}

function spawnObstacle(){
    const availableImages=cactusImages.filter(img=>img.complete&&img.naturalWidth>0);

    let image=null;

    if(availableImages.length){
        image=availableImages[
            Math.floor(Math.random()*availableImages.length)
        ];
    }

    const textureIndex=image
        ? cactusImages.indexOf(image)
        : Math.floor(Math.random()*cactusSources.length);

    const sizes=[
        {w:34,h:52},
        {w:42,h:60},
        {w:48,h:70},
        {w:38,h:64}
    ];

    const size=sizes[textureIndex]||sizes[0];

    obstacles.push({
        x:W+30,
        y:GROUND-size.h,
        width:size.w,
        height:size.h,
        image:image,
        textureIndex:textureIndex,
        passed:false
    });

    const difficulty=Math.min(score/100,30);

    const minimum=1500-Math.min(difficulty*8,240);
    const maximum=2050-Math.min(difficulty*8,240);

    nextSpawn=minimum+Math.random()*(maximum-minimum);
}

function update(dt){
    if(gameEnded) return;

    const seconds=dt/1000;

    score+=0.55*seconds;

    speed=6+Math.min(score/1000,3);

    awardCoinsForScore();

    bunny.velocityY+=bunny.gravity*(dt/16.6667);
    bunny.y+=bunny.velocityY*(dt/16.6667);

    if(bunny.y>=GROUND-bunny.height){
        bunny.y=GROUND-bunny.height;
        bunny.velocityY=0;
        bunny.grounded=true;
    }else{
        bunny.grounded=false;
    }

    runFrameTimer+=dt;

    if(runFrameTimer>=RUN_FRAME_TIME){
        runFrameTimer=0;
        runFrame=(runFrame+1)%bunnyRunFrames.length;
    }

    if(!bunny.grounded){
        jumpFrameTimer+=dt;

        if(jumpFrameTimer>=JUMP_FRAME_TIME){
            jumpFrameTimer=0;
            jumpFrame=(jumpFrame+1)%bunnyJumpFrames.length;
        }
    }

    spawnTimer+=dt;

    if(spawnTimer>=nextSpawn){
        spawnTimer=0;
        spawnObstacle();
    }

    for(const obstacle of obstacles){
        obstacle.x-=speed*(dt/16.6667);

        if(!obstacle.passed && obstacle.x+obstacle.width<bunny.x){
            obstacle.passed=true;
            score+=10;
        }
    }

    obstacles=obstacles.filter(obstacle=>obstacle.x+obstacle.width>-50);

    checkCollisions();

    if(Math.floor(score)>topScore){
        topScore=Math.floor(score);
        localStorage.setItem("bunnyRun_topScore",topScore);
    }
}

function getBunnyHitbox(){
    return {
        x:bunny.x+6,
        y:bunny.y+5,
        width:bunny.width-10,
        height:bunny.height-7
    };
}

function getObstacleHitbox(obstacle){
    const paddingX=Math.max(4,obstacle.width*0.18);
    const paddingTop=Math.max(3,obstacle.height*0.05);
    const paddingBottom=Math.max(3,obstacle.height*0.04);

    return {
        x:obstacle.x+paddingX,
        y:obstacle.y+paddingTop,
        width:Math.max(1,obstacle.width-paddingX*2),
        height:Math.max(1,obstacle.height-paddingTop-paddingBottom)
    };
}

function rectanglesOverlap(a,b){
    return (
        a.x<b.x+b.width &&
        a.x+a.width>b.x &&
        a.y<b.y+b.height &&
        a.y+a.height>b.y
    );
}

function checkCollisions(){
    const bunnyBox=getBunnyHitbox();

    for(const obstacle of obstacles){
        const obstacleBox=getObstacleHitbox(obstacle);

        if(rectanglesOverlap(bunnyBox,obstacleBox)){
            gameOver();
            return;
        }
    }
}

function gameOver(){
    if(gameEnded) return;

    gameEnded=true;
    running=false;

    if(typeof updateCoinDisplays==="function"){
        updateCoinDisplays();
    }

    updateCoinDisplay();

    draw();
    drawGameOver();
}

function drawBackground(){
    const theme=getTheme();

    const skyColors={
        blue:["#8a9ca5","#aebbc1"],
        pink:["#b99aa5","#d4bbc4"],
        green:["#8fa99a","#b3c5b8"],
        lavender:["#a39bb5","#c3bdd0"],
        yellow:["#b5aa80","#d2c89e"]
    };

    const colors=skyColors[theme]||skyColors.blue;

    const gradient=ctx.createLinearGradient(0,0,0,H);

    gradient.addColorStop(0,colors[0]);
    gradient.addColorStop(1,colors[1]);

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    /*
        Soft background details.
    */
    ctx.fillStyle="rgba(255,255,255,.14)";

    for(let i=0;i<7;i++){
        const cloudX=((i*185)-(score*0.15))%(W+180)-90;
        const cloudY=80+(i%3)*55;

        ctx.beginPath();
        ctx.arc(cloudX,cloudY,24,0,Math.PI*2);
        ctx.arc(cloudX+25,cloudY-8,30,0,Math.PI*2);
        ctx.arc(cloudX+55,cloudY,23,0,Math.PI*2);
        ctx.fill();
    }
}

function drawGround(){
    const theme=getTheme();

    const groundColors={
        blue:["#66777f","#53636a"],
        pink:["#876b76","#715761"],
        green:["#657c6d","#53675a"],
        lavender:["#756c84","#625a6f"],
        yellow:["#887e58","#716944"]
    };

    const colors=groundColors[theme]||groundColors.blue;

    ctx.fillStyle=colors[0];
    ctx.fillRect(0,GROUND,W,H-GROUND);

    ctx.fillStyle=colors[1];
    ctx.fillRect(0,GROUND,W,7);

    const lineOffset=(score*speed)%38;

    ctx.fillStyle="rgba(255,255,255,.10)";

    for(let x=-38+lineOffset;x<W+38;x+=38){
        ctx.fillRect(x,GROUND+22,18,3);
        ctx.fillRect(x+7,GROUND+44,11,3);
    }
}

function drawBunny(){
    let image;

    if(!bunny.grounded){
        image=bunnyJumpFrames[jumpFrame];
    }else{
        image=bunnyRunFrames[runFrame];
    }

    if(!image) return;

    ctx.save();

    /*
        The original bunny faces left, so flip it to face right.
    */
    ctx.translate(
        bunny.x+bunny.width,
        bunny.y
    );

    ctx.scale(-1,1);

    ctx.drawImage(
        image,
        0,
        0,
        bunny.width,
        bunny.grounded?bunny.height:36
    );

    ctx.restore();
}

function drawObstacles(){
    for(const obstacle of obstacles){
        if(obstacle.image&&obstacle.image.complete&&obstacle.image.naturalWidth>0){
            ctx.drawImage(
                obstacle.image,
                obstacle.x,
                obstacle.y,
                obstacle.width,
                obstacle.height
            );
        }else{
            drawFallbackCactus(obstacle);
        }
    }
}

function drawFallbackCactus(obstacle){
    ctx.fillStyle="#4c7654";

    const x=obstacle.x;
    const y=obstacle.y;
    const w=obstacle.width;
    const h=obstacle.height;

    ctx.fillRect(
        x+w*.35,
        y,
        w*.3,
        h
    );

    ctx.fillRect(
        x,
        y+h*.38,
        w*.35,
        h*.14
    );

    ctx.fillRect(
        x+w*.65,
        y+h*.52,
        w*.35,
        h*.14
    );

    ctx.fillRect(
        x+w*.12,
        y+h*.24,
        w*.14,
        h*.3
    );

    ctx.fillRect(
        x+w*.74,
        y+h*.38,
        w*.14,
        h*.3
    );
}

function drawScore(){
    ctx.save();

    ctx.textAlign="left";
    ctx.textBaseline="top";

    ctx.font="bold 22px Georgia, serif";
    ctx.fillStyle="rgba(255,255,255,.9)";

    ctx.fillText(
        "Score: "+Math.floor(score),
        25,
        22
    );

    ctx.font="16px Georgia, serif";
    ctx.fillStyle="rgba(255,255,255,.78)";

    ctx.fillText(
        "Best: "+topScore,
        26,
        50
    );

    ctx.restore();
    }<script>
function drawGameOver(){
    /*
        Larger, easier-to-read Game Over panel.
    */
    const panelWidth=470;
    const panelHeight=295;

    const panelX=(W-panelWidth)/2;
    const panelY=(H-panelHeight)/2;

    ctx.save();

    ctx.fillStyle="rgba(35,43,48,.30)";
    ctx.fillRect(0,0,W,H);

    ctx.shadowColor="rgba(0,0,0,.18)";
    ctx.shadowBlur=24;
    ctx.shadowOffsetY=8;

    ctx.fillStyle="rgba(248,252,253,.97)";
    ctx.strokeStyle="rgba(185,203,212,.95)";
    ctx.lineWidth=3;

    roundRect(
        panelX,
        panelY,
        panelWidth,
        panelHeight,
        26
    );

    ctx.fill();
    ctx.stroke();

    ctx.shadowColor="transparent";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.font="54px Georgia, serif";
    ctx.fillStyle="#4a5660";
    ctx.fillText(
        "☠",
        W/2,
        panelY+57
    );

    ctx.font="bold 34px Georgia, serif";
    ctx.fillStyle="#3d4850";

    ctx.fillText(
        "Game Over",
        W/2,
        panelY+108
    );

    ctx.font="bold 21px Georgia, serif";
    ctx.fillStyle="#64737c";

    ctx.fillText(
        "Score: "+Math.floor(score),
        W/2,
        panelY+153
    );

    ctx.font="bold 21px Georgia, serif";
    ctx.fillStyle="#64737c";

    ctx.fillText(
        "Coins earned: "+runCoinsEarned,
        W/2,
        panelY+187
    );

    ctx.font="17px Georgia, serif";
    ctx.fillStyle="#7b8991";

    ctx.fillText(
        "Tap anywhere to play again",
        W/2,
        panelY+238
    );

    ctx.restore();
}

function roundRect(x,y,w,h,r){
    ctx.beginPath();

    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);

    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);

    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);

    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);

    ctx.closePath();
}

function draw(){
    drawBackground();
    drawGround();
    drawObstacles();
    drawBunny();
    drawScore();

    if(gameEnded){
        drawGameOver();
    }
}

function gameLoop(now){
    if(gameEnded){
        draw();
        return;
    }

    const dt=Math.min(now-lastTime,40);
    lastTime=now;

    update(dt);
    draw();

    if(!gameEnded){
        requestAnimationFrame(gameLoop);
    }
}

function handleInput(){
    if(gameEnded){
        restartGame();
        return;
    }

    jump();
}

document.addEventListener("keydown",e=>{
    if(
        e.code==="Space"||
        e.code==="ArrowUp"
    ){
        e.preventDefault();
        handleInput();
    }

    if(
        e.key==="f"||
        e.key==="F"
    ){
        toggleFullscreen();
    }
});

canvas.addEventListener("pointerdown",e=>{
    e.preventDefault();
    handleInput();
});

function toggleFullscreen(){
    if(!document.fullscreenElement){
        if(gameShell.requestFullscreen){
            gameShell.requestFullscreen();
        }
    }else{
        if(document.exitFullscreen){
            document.exitFullscreen();
        }
    }
}

fullscreenBtn.addEventListener("click",e=>{
    e.preventDefault();
    toggleFullscreen();
});

document.addEventListener("fullscreenchange",()=>{
    const fullscreen=!!document.fullscreenElement;

    document.body.classList.toggle(
        "game-fullscreen",
        fullscreen
    );

    gameShell.classList.toggle(
        "game-fullscreen",
        fullscreen
    );

    fullscreenBtn.textContent=
        fullscreen
            ? "Exit Fullscreen"
            : "Fullscreen";
});

document.addEventListener("visibilitychange",()=>{
    if(!document.hidden){
        lastTime=performance.now();
    }
});

window.addEventListener("resize",()=>{
    draw();
});

updateCoinDisplay();
draw();
requestAnimationFrame(gameLoop);
</script>

</body>
</html>
