<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Bunny Run ♡</title>

<style>
:root{
    --bg-base:#f2f7fa;
    --bg-grad-1:#dce8f3;
    --bg-grad-2:#d3e2ea;
    --text-main:#3f5260;
    --text-heading:#46637a;
    --accent-border:#82a8bd;
    --accent-soft:#e9f3f9;
    --accent-badge:#dfe8f8;
    --ornament-color:#799eb8;
    --card-bg:rgba(255,255,255,.88);
    --header-bg:rgba(255,255,255,.88);
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    overflow-x:hidden;
    background:
        radial-gradient(circle at top left,var(--bg-grad-1),transparent 45%),
        radial-gradient(circle at bottom right,var(--bg-grad-2),transparent 50%),
        var(--bg-base);
    color:var(--text-main);
    font-family:Georgia,serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
}

header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    min-height:70px;
    padding:15px 22px;
    background:var(--header-bg);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--bg-grad-2);
    position:sticky;
    top:0;
    z-index:100;
    gap:16px;
}

.header-left,
.header-right{
    display:flex;
    align-items:center;
    min-width:0;
}

.header-left{
    gap:12px;
}

.header-right{
    justify-content:flex-end;
    gap:10px;
}

.nav-link{
    color:var(--text-heading);
    text-decoration:none;
    font-size:15px;
    cursor:pointer;
    white-space:nowrap;
    transition:opacity .2s ease;
}

.nav-link:hover{
    opacity:.7;
}

.coin-display{
    background:var(--accent-soft);
    border:1px solid var(--accent-border);
    padding:9px 15px;
    border-radius:100px;
    font-size:13px;
    font-weight:bold;
    color:var(--text-heading);
    white-space:nowrap;
}

.fullscreen-button{
    border:1px solid var(--accent-border);
    background:var(--accent-soft);
    color:var(--text-heading);
    border-radius:100px;
    padding:9px 13px;
    font-family:Georgia,serif;
    font-size:13px;
    cursor:pointer;
    transition:all .2s ease;
}

.fullscreen-button:hover{
    opacity:.75;
}

main{
    width:100%;
    min-height:calc(100vh - 70px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:30px 15px 40px;
    position:relative;
    z-index:1;
}

.decorations{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.decorations span{
    position:absolute;
    color:var(--ornament-color);
    opacity:.35;
    animation:float 5s ease-in-out infinite;
}

.decorations span:nth-child(1){
    top:13%;
    left:7%;
    font-size:20px;
}

.decorations span:nth-child(2){
    top:28%;
    right:8%;
    font-size:13px;
    animation-delay:1s;
}

.decorations span:nth-child(3){
    top:55%;
    left:5%;
    font-size:14px;
    animation-delay:2s;
}

.decorations span:nth-child(4){
    top:68%;
    right:6%;
    font-size:21px;
    animation-delay:1.5s;
}

.decorations span:nth-child(5){
    bottom:12%;
    left:12%;
    font-size:12px;
    animation-delay:.5s;
}

.decorations span:nth-child(6){
    bottom:20%;
    right:13%;
    font-size:16px;
    animation-delay:2.5s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0) rotate(0);
    }
    50%{
        transform:translateY(-7px) rotate(7deg);
    }
}

.ornament{
    width:min(420px,85vw);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:var(--ornament-color);
    margin-top:4px;
    margin-bottom:8px;
}

.ornament i{
    display:block;
    height:1px;
    flex:1;
    background:var(--accent-border);
    opacity:.7;
}

.ornament span{
    font-size:15px;
}

h1{
    margin:0;
    color:var(--text-heading);
    font-size:34px;
    font-weight:normal;
    letter-spacing:.5px;
    text-align:center;
}

.subtitle{
    margin:7px 0 15px;
    color:var(--text-main);
    opacity:.78;
    font-size:15px;
    text-align:center;
}

.game-info{
    margin-bottom:14px;
}

.info-pill{
    background:var(--card-bg);
    border:1px solid var(--accent-border);
    color:var(--text-heading);
    padding:7px 14px;
    border-radius:100px;
    font-size:13px;
    box-shadow:0 4px 16px rgba(50,70,80,.06);
}

.game-shell{
    width:min(960px,calc(100vw - 20px));
    position:relative;
    border-radius:18px;
    overflow:hidden;
    border:1px solid var(--accent-border);
    box-shadow:0 12px 35px rgba(50,70,80,.14);
    background:#b8cbd1;
    touch-action:none;
}

canvas{
    display:block;
    width:100%;
    height:auto;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

.bottom-ornament{
    margin-top:16px;
    margin-bottom:0;
}

body.game-fullscreen{
    background:#000;
}

body.game-fullscreen header,
body.game-fullscreen main > .ornament,
body.game-fullscreen main > h1,
body.game-fullscreen main > .subtitle,
body.game-fullscreen main > .game-info,
body.game-fullscreen .bottom-ornament{
    display:none;
}

body.game-fullscreen main{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    min-height:100vh;
    padding:0;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    z-index:9999;
}

body.game-fullscreen .game-shell{
    width:100vw;
    height:100vh;
    max-width:none;
    border:0;
    border-radius:0;
    box-shadow:none;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
}

body.game-fullscreen canvas{
    width:100vw;
    height:100vh;
    object-fit:contain;
}

@media(max-width:600px){
    header{
        padding:12px 14px;
        min-height:62px;
    }

    .nav-link{
        font-size:13px;
    }

    .coin-display{
        padding:8px 11px;
        font-size:12px;
    }

    .fullscreen-button{
        padding:8px 10px;
        font-size:12px;
    }

    main{
        padding-top:22px;
    }

    h1{
        font-size:29px;
    }

    .subtitle{
        font-size:14px;
    }
}
</style>

function applyArcadeTheme(){
    const theme=localStorage.getItem("arcade_theme")||"blue";

    const themes={
        blue:{
            base:"#b8cbd1",
            top:"#a8c7d0",
            bottom:"#d5e1d9"
        },

        pink:{
            base:"#d8c2cb",
            top:"#e9c8d4",
            bottom:"#f2dfe4"
        },

        green:{
            base:"#c1d0c0",
            top:"#b4cfb7",
            bottom:"#dce9d8"
        },

        lavender:{
            base:"#c9c1d4",
            top:"#c2b6d6",
            bottom:"#e2dceb"
        },

        yellow:{
            base:"#d6ceb0",
            top:"#d9d0a9",
            bottom:"#eee7cc"
        }
    };

    const selected=themes[theme]||themes.blue;

    return selected;
}

function getSkyColors(){
    return applyArcadeTheme();
}

function drawSky(){
    const colors=getSkyColors();

    const gradient=ctx.createLinearGradient(
        0,
        0,
        0,
        GROUND
    );

    gradient.addColorStop(0,colors.top);
    gradient.addColorStop(1,colors.bottom);

    ctx.fillStyle=gradient;
    ctx.fillRect(
        0,
        0,
        W,
        GROUND
    );
}

const clouds=[
    {
        x:80,
        y:85,
        scale:1
    },
    {
        x:360,
        y:125,
        scale:.72
    },
    {
        x:650,
        y:75,
        scale:1.15
    },
    {
        x:850,
        y:155,
        scale:.65
    }
];

function drawCloud(x,y,scale){
    ctx.save();

    ctx.fillStyle="rgba(255,255,255,.52)";

    ctx.beginPath();

    ctx.arc(
        x,
        y+9*scale,
        18*scale,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+22*scale,
        y,
        24*scale,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+50*scale,
        y+10*scale,
        18*scale,
        0,
        Math.PI*2
    );

    ctx.fillRect(
        x-3*scale,
        y+9*scale,
        57*scale,
        18*scale
    );

    ctx.restore();
}

function drawClouds(){
    for(const cloud of clouds){
        drawCloud(
            cloud.x,
            cloud.y,
            cloud.scale
        );
    }
}

function drawGround(){
    ctx.fillStyle=GROUND_TOP;

    ctx.fillRect(
        0,
        GROUND,
        W,
        8
    );

    ctx.fillStyle=GROUND_BASE;

    ctx.fillRect(
        0,
        GROUND+8,
        W,
        H-GROUND-8
    );

    const tileSize=34;

    ctx.save();

    ctx.translate(
        -groundOffset,
        0
    );

    for(
        let x=-tileSize;
        x<W+tileSize;
        x+=tileSize
    ){
        ctx.fillStyle=GROUND_LIGHT;

        ctx.fillRect(
            x,
            GROUND+15,
            18,
            4
        );

        ctx.fillStyle=GROUND_DARK;

        ctx.fillRect(
            x+19,
            GROUND+29,
            10,
            4
        );

        ctx.fillStyle=GROUND_LIGHT;

        ctx.fillRect(
            x+5,
            GROUND+44,
            9,
            3
        );
    }

    ctx.restore();
}

function drawBackground(){
    drawSky();
    drawClouds();
    drawGround();
}

const cactusImages={};

function loadCactusImage(
    image,
    rootPath,
    fallbackPath
){
    const filename=rootPath
        .split("/")
        .pop();

    const candidates=[
        rootPath,
        fallbackPath,
        filename
    ];

    let index=0;

    function tryNext(){
        if(index>=candidates.length){
            return;
        }

        const source=candidates[index++];

        image.src=source;

        image.onerror=function(){
            tryNext();
        };

        image.onload=function(){
            image.onerror=null;
        };
    }

    tryNext();
}

        minimum+
        Math.random()*
        (maximum-minimum);
}

function drawObstacles(){
    for(const obstacle of obstacles){

        if(
            obstacle.image &&
            obstacle.image.complete &&
            obstacle.image.naturalWidth
        ){
            ctx.drawImage(
                obstacle.image,
                obstacle.x,
                obstacle.y,
                obstacle.width,
                obstacle.height
            );
        }
    }
}

function getBunnyHitbox(){
    return{
        x:bunny.x+13,
        y:bunny.y+12,
        width:52,
        height:60
    };
}

function checkCollision(){
    const b=getBunnyHitbox();

    for(const o of obstacles){

        const hitWidth=o.hitboxWidth;
        const hitHeight=o.hitboxHeight;

        const cactusHit={
            x:o.x+
                (o.width-hitWidth)/2,

            y:GROUND-hitHeight,

            width:hitWidth,
            height:hitHeight
        };

        if(
            b.x<
                cactusHit.x+
                cactusHit.width &&

            b.x+b.width>
                cactusHit.x &&

            b.y<
                cactusHit.y+
                cactusHit.height &&

            b.y+b.height>
                cactusHit.y
        ){
            return true;
        }
    }

    return false;
}

function drawBunny(){
    let image;
    let frameWidth=28;
    let frameHeight=28;
    let frameIndex=0;

    if(!started && !dead){

        image=idleImage;
        frameIndex=0;

    }else if(!bunny.grounded){

        image=jumpImage;
        frameWidth=28;
        frameHeight=36;

        const jumpAnimationDuration=560;

        frameIndex=Math.min(
            7,
            Math.floor(
                (jumpTime/jumpAnimationDuration)*8
            )
        );

    }else{

        image=runImage;
        frameWidth=28;
        frameHeight=28;

        frameIndex=
            Math.floor(
                runAnimTime/45
            )%8;
    }

    if(
        !image.complete ||
        !image.naturalWidth
    ){
        return;
    }

    const drawW=frameWidth*3;
    const drawH=frameHeight*3;

    const feetY=
        bunny.y+bunny.height;

    const drawX=bunny.x;

    const drawY=
        feetY-drawH;

    ctx.save();

    ctx.translate(
        drawX+drawW,
        drawY
    );

    ctx.scale(-1,1);

    ctx.drawImage(
        image,
        frameIndex*frameWidth,
        0,
        frameWidth,
        frameHeight,
        0,
        0,
        drawW,
        drawH
    );

    ctx.restore();
}

function drawScore(){
    const displayScore=
        Math.floor(score)
        .toString()
        .padStart(5,"0");

    ctx.save();

    ctx.font=
        "bold 23px Georgia,serif";

    ctx.textAlign="right";
    ctx.textBaseline="top";

    ctx.fillStyle=
        "rgba(41,51,47,0.28)";

    ctx.fillText(
        displayScore,
        W-18,
        20
    );

    ctx.fillStyle="#f1eee2";

    ctx.fillText(
        displayScore,
        W-20,
        18
    );

    ctx.restore();
        }<script>
function initAudio(){
    if(audioContext)return;

    try{
        audioContext=
            new (
                window.AudioContext||
                window.webkitAudioContext
            )();
    }catch(e){}
}

function playScoreSound(){
    if(!audioContext)return;

    try{
        const oscillator=
            audioContext.createOscillator();

        const gain=
            audioContext.createGain();

        oscillator.type="square";

        oscillator.frequency.setValueAtTime(
            620,
            audioContext.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            880,
            audioContext.currentTime+.08
        );

        gain.gain.setValueAtTime(
            .045,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime+.1
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime+.1
        );
    }catch(e){}
}

function showCoinToast(amount){
    const toast=document.createElement("div");

    toast.textContent=
        "+"+amount+" Coins";

    toast.style.position="fixed";
    toast.style.left="50%";
    toast.style.top="82px";
    toast.style.transform=
        "translateX(-50%) translateY(-8px)";

    toast.style.padding=
        "9px 16px";

    toast.style.borderRadius=
        "100px";

    toast.style.background=
        "rgba(255,255,255,.94)";

    toast.style.border=
        "1px solid var(--accent-border)";

    toast.style.color=
        "var(--text-heading)";

    toast.style.font=
        "bold 13px Georgia,serif";

    toast.style.zIndex="10000";

    toast.style.pointerEvents="none";

    toast.style.opacity="0";

    toast.style.transition=
        "opacity .2s ease, transform .3s ease";

    document.body.appendChild(toast);

    requestAnimationFrame(()=>{
        toast.style.opacity="1";
        toast.style.transform=
            "translateX(-50%) translateY(0)";
    });

    setTimeout(()=>{
        toast.style.opacity="0";
        toast.style.transform=
            "translateX(-50%) translateY(-8px)";

        setTimeout(()=>{
            toast.remove();
        },300);
    },900);
}

function awardCoinsForScore(){
    const currentCoinMilestone=
        Math.floor(score/1000);

    if(
        currentCoinMilestone>
        lastCoinMilestone
    ){

        const earned=
            currentCoinMilestone-
            lastCoinMilestone;

        const coinsEarned=
            earned*10;

        if(
            typeof addCoins==="function"
        ){
            addCoins(coinsEarned);
        }

        if(
            typeof updateCoinDisplays==="function"
        ){
            updateCoinDisplays();
        }

        runCoinsEarned+=coinsEarned;

        lastCoinMilestone=
            currentCoinMilestone;

        showCoinToast(
            coinsEarned
        );
    }
}

function updateCoinDisplay(){
    if(
        typeof updateCoinDisplays==="function"
    ){
        updateCoinDisplays();
    }
}

function updateGame(delta){
    if(!started || dead)return;

    const dt=Math.min(
        delta,
        32
    );

    const seconds=
        dt/16.6667;

    score+=
        0.55*
        seconds;

    speed=
        6+
        Math.min(
            score/1000,
            3
        );

    bunny.velocityY+=
        bunny.gravity*
        seconds;

    bunny.y+=
        bunny.velocityY*
        seconds;

    if(
        bunny.y>=GROUND-bunny.height
    ){
        bunny.y=
            GROUND-bunny.height;

        bunny.velocityY=0;
        bunny.grounded=true;
    }

    if(!bunny.grounded){
        jumpTime+=dt;
    }else{
        jumpTime=0;
    }

    runAnimTime+=dt;

    groundOffset+=
        speed*
        seconds;

    if(
        groundOffset>=34
    ){
        groundOffset%=34;
    }

    spawnTimer+=dt;

    if(
        spawnTimer>=nextSpawn
    ){
        spawnTimer=0;
        spawnObstacle();
    }

    for(let i=obstacles.length-1;i>=0;i--){

        const obstacle=
            obstacles[i];

        obstacle.x-=
            speed*
            seconds;

        if(
            !obstacle.passed &&
            obstacle.x+
            obstacle.width<
            bunny.x
        ){

            obstacle.passed=true;

            score+=10;

            const currentMilestone=
                Math.floor(score/100);

            if(
                currentMilestone>
                lastScoreMilestone
            ){

                for(
                    let i=lastScoreMilestone;
                    i<currentMilestone;
                    i++
                ){
                    playScoreSound();
                }

                lastScoreMilestone=
                    currentMilestone;
            }

            awardCoinsForScore();
        }

        if(
            obstacle.x+
            obstacle.width<
            -100
        ){
            obstacles.splice(i,1);
        }
    }

    const currentMilestone=
        Math.floor(score/100);

    if(
        currentMilestone>
        lastScoreMilestone
    ){

        for(
            let i=lastScoreMilestone;
            i<currentMilestone;
            i++
        ){
            playScoreSound();
        }

        lastScoreMilestone=
            currentMilestone;
    }

    awardCoinsForScore();

    if(checkCollision()){
        gameOver();
    }

    checkTopScore();
}

function drawGameOver(){
    ctx.save();

    ctx.fillStyle=
        "rgba(41,51,47,.42)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    ctx.textAlign="center";

    ctx.fillStyle="#f1eee2";

    ctx.font=
        "38px Georgia,serif";

    ctx.fillText(
        "♡",
        W/2,
        171
    );

    ctx.font=
        "bold 31px Georgia,serif";

    ctx.fillText(
        "Game Over",
        W/2,
        220
    );

    ctx.font=
        "20px Georgia,serif";

    ctx.fillText(
        "Score: "+
        Math.floor(score),
        W/2,
        258
    );

    ctx.fillText(
        "You earned "+
        runCoinsEarned+
        " Coins",
        W/2,
        287
    );

    ctx.font=
        "15px Georgia,serif";

    ctx.globalAlpha=.9;

    ctx.fillText(
        "tap anywhere to start again",
        W/2,
        321
    );

    ctx.restore();
}

function drawStartScreen(){
    ctx.save();

    ctx.textAlign="center";

    ctx.fillStyle=
        "rgba(41,51,47,.55)";

    ctx.font=
        "31px Georgia,serif";

    ctx.fillText(
        "Tap to start",
        W/2,
        220
    );

    ctx.font=
        "15px Georgia,serif";

    ctx.fillStyle="#f1eee2";

    ctx.fillText(
        "jump with a tap",
        W/2,
        250
    );

    ctx.restore();
}

function draw(){
    drawBackground();

    drawObstacles();

    drawBunny();

    drawScore();

    if(!started && !dead){
        drawStartScreen();
    }

    if(dead){
        drawGameOver();
    }
}

function gameOver(){
    if(dead)return;

    dead=true;

    bunny.velocityY=0;

    checkTopScore();

    draw();
}

function restart(){
    score=0;
    speed=6;

    lastScoreMilestone=0;
    lastCoinMilestone=0;

    runCoinsEarned=0;

    obstacles.length=0;

    spawnTimer=0;
    nextSpawn=1400;

    bunny.y=
        GROUND-bunny.height;

    bunny.velocityY=0;
    bunny.grounded=true;

    runAnimTime=0;
    jumpTime=0;
    groundOffset=0;

    dead=false;
    started=true;

    lastTime=
        performance.now();

    requestAnimationFrame(loop);
}

function jump(){
    initAudio();

    if(
        audioContext &&
        audioContext.state==="suspended"
    ){
        audioContext.resume();
    }

    if(!started){

        started=true;

        bunny.grounded=true;

        runAnimTime=0;
        jumpTime=0;

        lastTime=
            performance.now();

        requestAnimationFrame(loop);

        return;
    }

    if(dead){
        restart();
        return;
    }

    if(bunny.grounded){

        bunny.velocityY=
            bunny.jumpPower;

        bunny.grounded=false;

        jumpTime=0;
    }
}

function loop(time){
    if(!started || dead){
        draw();
        return;
    }

    if(!lastTime){
        lastTime=time;
    }

    const delta=
        time-lastTime;

    lastTime=time;

    updateGame(delta);

    draw();

    if(!dead){
        requestAnimationFrame(loop);
    }
}

/*
    Normal controls:
    tap/click = jump
    Space / ArrowUp = jump

    Fullscreen controls:
    ANYWHERE you tap/click on the screen = jump
*/

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.code==="Space" ||
            event.code==="ArrowUp"
        ){
            event.preventDefault();
            jump();
        }

        if(
            event.key.toLowerCase()==="f"
        ){
            event.preventDefault();
            toggleFullscreen();
        }
    }
);

canvas.addEventListener(
    "pointerdown",
    function(event){
        event.preventDefault();
        jump();
    },
    {passive:false}
);

/*
    This is the important fullscreen mobile control.
    When fullscreen is active, tapping anywhere outside
    buttons/header controls will make Bunny Run jump.
*/
document.addEventListener(
    "pointerdown",
    function(event){

        const fullscreenActive=
            document.fullscreenElement ||
            document.body.classList.contains(
                "game-fullscreen"
            );

        if(!fullscreenActive){
            return;
        }

        if(
            event.target.closest &&
            event.target.closest("button,a")
        ){
            return;
        }

        event.preventDefault();

        jump();

    },
    {passive:false}
);

const gameShell=
    document.getElementById("gameShell");

const fullscreenButton=
    document.getElementById(
        "fullscreenButton"
    );

async function toggleFullscreen(){

    initAudio();

    try{

        if(
            document.fullscreenElement
        ){

            await document.exitFullscreen();

            document.body.classList.remove(
                "game-fullscreen"
            );

        }else if(
            gameShell.requestFullscreen
        ){

            await gameShell.requestFullscreen();

            document.body.classList.add(
                "game-fullscreen"
            );

        }else{

            document.body.classList.toggle(
                "game-fullscreen"
            );
        }

    }catch(error){

        document.body.classList.toggle(
            "game-fullscreen"
        );
    }
}

fullscreenButton.addEventListener(
    "click",
    function(event){
        event.stopPropagation();
        toggleFullscreen();
    }
);

document.addEventListener(
    "fullscreenchange",
    function(){

        if(
            document.fullscreenElement
        ){

            document.body.classList.add(
                "game-fullscreen"
            );

        }else{

            document.body.classList.remove(
                "game-fullscreen"
            );
        }
    }
);

function syncTheme(){
    applyArcadeTheme();
}

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key==="arcade_theme"
        ){
            draw();
        }
    }
);

updateCoinDisplay();

draw();
