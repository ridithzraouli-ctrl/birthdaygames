<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bunny Run ♡</title>

<style>
:root {
    --bg-base:#f2f7fa;
    --bg-grad-1:#dce8f3;
    --bg-grad-2:#d3e2ea;
    --text-main:#3f5260;
    --text-heading:#46637a;
    --accent-border:#82a8bd;
    --accent-soft:#e9f3f9;
    --accent-badge:#dfe8f8;
    --ornament-color:#799eb8;
    --card-bg:rgba(255,255,255,.88);
    --header-bg:rgba(255,255,255,.88);
}

body[data-theme="pink"] {
    --bg-base:#faf2f5;
    --bg-grad-1:#f3dce5;
    --bg-grad-2:#ead3dc;
    --text-main:#603f4c;
    --text-heading:#7a4659;
    --accent-border:#bd8297;
    --accent-soft:#f9e9f0;
    --accent-badge:#f8dfe8;
    --ornament-color:#b87992;
    --card-bg:rgba(255,255,255,.88);
    --header-bg:rgba(255,255,255,.88);
}

body[data-theme="green"] {
    --bg-base:#f3f7f2;
    --bg-grad-1:#dce8dc;
    --bg-grad-2:#d3ead3;
    --text-main:#3f6043;
    --text-heading:#467a4c;
    --accent-border:#82bd8b;
    --accent-soft:#e9f9eb;
    --accent-badge:#dff8e2;
    --ornament-color:#79b882;
    --card-bg:rgba(255,255,255,.88);
    --header-bg:rgba(255,255,255,.88);
}

body[data-theme="lavender"] {
    --bg-base:#f5f2fa;
    --bg-grad-1:#e3dcf3;
    --bg-grad-2:#dad3ea;
    --text-main:#4a3f60;
    --text-heading:#59467a;
    --accent-border:#9882bd;
    --accent-soft:#f0e9f9;
    --accent-badge:#e9dff8;
    --ornament-color:#9379b8;
    --card-bg:rgba(255,255,255,.88);
    --header-bg:rgba(255,255,255,.88);
}

body[data-theme="yellow"] {
    --bg-base:#faf8f2;
    --bg-grad-1:#f3edd2;
    --bg-grad-2:#eae3c5;
    --text-main:#60573f;
    --text-heading:#7a6e46;
    --accent-border:#bdb182;
    --accent-soft:#f9f5e9;
    --accent-badge:#f8f3df;
    --ornament-color:#b8aa79;
    --card-bg:rgba(255,255,255,.88);
    --header-bg:rgba(255,255,255,.88);
}

* {
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body {
    width:100%;
    min-height:100%;
    margin:0;
    overflow-x:hidden;
}

body {
    min-height:100vh;
    background:
        radial-gradient(
            circle at 10% 12%,
            var(--bg-grad-1) 0,
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 85%,
            var(--bg-grad-2) 0,
            transparent 30%
        ),
        var(--bg-base);
    color:var(--text-main);
    font-family:Georgia,"Times New Roman",serif;
}

.decorations {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
    z-index:-1;
}

.decorations span {
    position:absolute;
    color:var(--ornament-color);
    opacity:.35;
    animation:float 5s ease-in-out infinite;
}

.decorations span:nth-child(1) {
    top:13%;
    left:7%;
    font-size:20px;
}

.decorations span:nth-child(2) {
    top:28%;
    right:8%;
    font-size:13px;
    animation-delay:1s;
}

.decorations span:nth-child(3) {
    top:55%;
    left:5%;
    font-size:14px;
    animation-delay:2s;
}

.decorations span:nth-child(4) {
    top:68%;
    right:6%;
    font-size:21px;
    animation-delay:1.5s;
}

.decorations span:nth-child(5) {
    bottom:12%;
    left:12%;
    font-size:12px;
    animation-delay:.5s;
}

.decorations span:nth-child(6) {
    bottom:20%;
    right:13%;
    font-size:16px;
    animation-delay:2.5s;
}

@keyframes float {
    0%,100% {
        transform:translateY(0) rotate(0);
    }

    50% {
        transform:translateY(-7px) rotate(7deg);
    }
}

header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    min-height:70px;
    padding:12px 16px;
    background:var(--header-bg);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--bg-grad-2);
    position:sticky;
    top:0;
    z-index:100;
    gap:8px;
}

.header-left,
.header-right {
    display:flex;
    align-items:center;
    min-width:0;
}

.header-left {
    gap:8px;
}

.header-right {
    justify-content:flex-end;
    gap:6px;
}

.nav-link {
    color:var(--text-heading);
    text-decoration:none;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
}

.coin-display {
    background:var(--accent-soft);
    border:1px solid var(--accent-border);
    padding:6px 10px;
    border-radius:100px;
    font-size:12px;
    font-weight:bold;
    color:var(--text-heading);
    white-space:nowrap;
}

main {
    width:100%;
    max-width:1050px;
    margin:0 auto;
    padding:25px 12px 35px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.ornament {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    height:22px;
    margin-bottom:10px;
    color:var(--ornament-color);
}

.ornament span {
    font-size:16px;
}

.ornament i {
    width:38px;
    height:1px;
    background:var(--ornament-color);
    opacity:.45;
}

h1 {
    color:var(--text-heading);
    font-weight:normal;
    font-size:28px;
    margin:0 0 5px;
    text-align:center;
}

.subtitle {
    color:var(--text-main);
    opacity:.78;
    margin:0 0 16px;
    font-size:14px;
    text-align:center;
}

.game-card {
    width:min(960px,100%);
    background:var(--card-bg);
    border:1px solid var(--bg-grad-2);
    border-radius:18px;
    padding:10px;
    box-shadow:0 8px 28px rgba(0,0,0,.06);
}

#game {
    display:block;
    width:100%;
    height:auto;
    border-radius:12px;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    touch-action:none;
}

.game-hint {
    margin-top:12px;
    color:var(--text-main);
    opacity:.68;
    font-size:12px;
    text-align:center;
}

.modal-overlay {
    display:none;
    position:fixed;
    inset:0;
    padding:20px;
    background:rgba(30,25,25,.3);
    backdrop-filter:blur(5px);
    z-index:500;
    align-items:center;
    justify-content:center;
}

.modal-card {
    position:relative;
    background:var(--card-bg);
    border:1px solid var(--accent-border);
    border-radius:18px;
    padding:32px 26px 26px;
    max-width:360px;
    width:100%;
    text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.16);
    animation:victoryPop .35s ease;
    overflow:hidden;
}

.modal-card::before,
.modal-card::after {
    content:"✦";
    position:absolute;
    color:var(--ornament-color);
    opacity:.5;
    font-size:20px;
}

.modal-card::before {
    top:13px;
    left:18px;
}

.modal-card::after {
    top:13px;
    right:18px;
}

.victory-decoration {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    color:var(--ornament-color);
    margin-bottom:13px;
}

.victory-decoration i {
    width:30px;
    height:1px;
    background:var(--ornament-color);
    opacity:.5;
}

.victory-symbol {
    width:66px;
    height:66px;
    margin:2px auto 14px;
    border-radius:50%;
    background:var(--accent-soft);
    border:1px solid var(--accent-border);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ornament-color);
    animation:victoryFloat 2s ease-in-out infinite;
}

.modal-card.game-over .victory-symbol {
    animation:none;
}

.modal-card h2 {
    color:var(--text-heading);
    font-size:25px;
    font-weight:normal;
    margin:0 0 9px;
}

.modal-card p {
    color:var(--text-main);
    opacity:.82;
    font-size:14px;
    line-height:1.6;
    margin:0 0 21px;
}

.reward-amount {
    display:inline-block;
    margin:-5px 0 20px;
    padding:7px 13px;
    border-radius:100px;
    background:var(--accent-badge);
    border:1px solid var(--accent-border);
    color:var(--text-heading);
    font-size:13px;
    font-weight:bold;
}

.btn {
    padding:11px 20px;
    border:1px solid var(--accent-border);
    border-radius:100px;
    background:var(--card-bg);
    color:var(--text-heading);
    font-family:Georgia,"Times New Roman",serif;
    font-size:13px;
    cursor:pointer;
    transition:.2s ease;
}

.btn:hover {
    background:var(--accent-soft);
    transform:translateY(-1px);
}

.confetti {
    position:absolute;
    pointer-events:none;
    color:var(--ornament-color);
    font-size:14px;
    animation:confettiFall 1.8s ease-out forwards;
}

.confetti:nth-child(1) {
    left:18%;
    top:5%;
}

.confetti:nth-child(2) {
    left:32%;
    top:2%;
    animation-delay:.12s;
}

.confetti:nth-child(3) {
    left:50%;
    top:4%;
    animation-delay:.2s;
}

.confetti:nth-child(4) {
    right:32%;
    top:2%;
    animation-delay:.08s;
}

.confetti:nth-child(5) {
    right:17%;
    top:6%;
    animation-delay:.18s;
}

@keyframes victoryPop {
    0% {
        transform:scale(.88);
        opacity:0;
    }

    100% {
        transform:scale(1);
        opacity:1;
    }
}

@keyframes victoryFloat {
    0%,100% {
        transform:translateY(0);
    }

    50% {
        transform:translateY(-5px);
    }
}

@keyframes confettiFall {
    0% {
        transform:translateY(0) rotate(0);
        opacity:0;
    }

    15% {
        opacity:.8;
    }

    100% {
        transform:translateY(115px) rotate(120deg);
        opacity:0;
    }
}

@media(max-width:600px) {
    header {
        min-height:66px;
        padding:12px 11px;
    }

    main {
        padding:20px 7px 30px;
    }

    .game-card {
        padding:5px;
        border-radius:14px;
    }

    .modal-card {
        max-width:340px;
        padding:30px 21px 23px;
    }
}
</style>
</head>

<script src="../script.js"></script><script>

function loadSavedTheme() {
    const savedTheme = localStorage.getItem("arcade_theme");

    if (
        ["pink","green","lavender","yellow"].includes(savedTheme)
    ) {
        document.body.setAttribute(
            "data-theme",
            savedTheme
        );
    } else {
        document.body.removeAttribute(
            "data-theme"
        );
    }
}

loadSavedTheme();

if (
    typeof updateCoinDisplays === "function"
) {
    updateCoinDisplays();
}


function goBack() {

    if(window.history.length > 1) {
        window.history.back();
    } else {
        window.location.href="../index.html";
    }
}


/* =========================
   CANVAS
========================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

ctx.imageSmoothingEnabled=false;

const W=960;
const H=540;
const GROUND=425;


/* =========================
   COLORS
========================= */

const SKY_TOP="#a8c7d0";
const SKY_BOTTOM="#d5e1d9";

const GROUND_TOP="#756d59";
const GROUND_BASE="#625b4b";
const GROUND_LIGHT="#887f68";
const GROUND_DARK="#48453b";

const DARK="#29332f";


/* =========================
   GAME STATE
========================= */

let started=false;
let dead=false;

let lastTime=0;

let score=0;

let speed=6;

let groundOffset=0;

let spawnTimer=0;

let nextSpawn=1200;

let runAnimTime=0;
let jumpTime=0;

let rewardGiven=false;


/* =========================
   BUNNY
========================= */

const bunny={
    x:110,

    y:GROUND-28,

    width:28,
    height:28,

    velocityY:0,

    grounded:true,

    gravity:.72,

    jumpPower:-15.5
};


/*
    Bunny sprite size on screen.

    The actual gameplay bunny is 28px high.
    The sprite is drawn at 84px high,
    while its feet remain aligned with
    the 28px gameplay body.
*/

const BUNNY_DRAW_SCALE=3;


/* =========================
   BUNNY IMAGES
========================= */

const idleImage=new Image();
const runImage=new Image();
const jumpImage=new Image();


/*
    PASTE YOUR ORIGINAL THREE
    BASE64 image.src LINES HERE.

    Example:

    idleImage.src="data:image/png;base64,...";
    runImage.src="data:image/png;base64,...";
    jumpImage.src="data:image/png;base64,...";
*/


/* =========================
   CACTUS IMAGES
========================= */

const cactusImages={

    small:new Image(),

    big:new Image(),

    two:new Image(),

    cluster:new Image()
};


/*
    YOUR ACTUAL CACTUS FILES
*/

cactusImages.small.src =
    "games/1000082076-removebg-preview.png";

cactusImages.big.src =
    "games/1000082078-removebg-preview.png";

cactusImages.two.src =
    "games/1000082080-removebg-preview.png";

cactusImages.cluster.src =
    "games/1000082081-removebg-preview.png";


/* =========================
   CACTUS DEFINITIONS
========================= */

/*
    Bunny gameplay height = 28px.

    Small:
        height = 28
        width  = 28

    Big:
        height = 84
        width  = 28

    Two:
        height = 56
        width  = 42

    Cluster:
        height = 56
        width  = 98

    The IMAGE itself is stretched to
    exactly these dimensions.

    Therefore:
        visual size == collision size
*/


const CACTUS_DEFINITIONS={

    small:{
        key:"small",
        width:28,
        height:28
    },

    big:{
        key:"big",
        width:28,
        height:84
    },

    two:{
        key:"two",
        width:42,
        height:56
    },

    cluster:{
        key:"cluster",
        width:98,
        height:56
    }

};


const cactusTypes=[
    CACTUS_DEFINITIONS.small,
    CACTUS_DEFINITIONS.big,
    CACTUS_DEFINITIONS.two,
    CACTUS_DEFINITIONS.cluster
];


/* =========================
   OBSTACLES
========================= */

const obstacles=[];


/* =========================
   CREATE CACTUS
========================= */

function createCactus(type,x){

    return {

        x:x,

        y:
            GROUND-
            type.height,

        width:
            type.width,

        height:
            type.height,

        key:
            type.key,

        counted:false
    };
}


/* =========================
   SPAWN
========================= */

function spawnCactus(){

    /*
        Keep the original game simple:
        one cactus at a time.

        This avoids impossible combinations
        and keeps the game fair.
    */

    const type =
        cactusTypes[
            Math.floor(
                Math.random()*
                cactusTypes.length
            )
        ];

    const cactus =
        createCactus(
            type,
            W+50
        );

    obstacles.push(cactus);


    /*
        Distance between obstacles.

        Gets slightly shorter as the game
        becomes faster, but never becomes
        ridiculous.
    */

    const difficulty =
        Math.min(
            score/500,
            20
        );

    const minimum =
        900-
        Math.min(
            difficulty*15,
            250
        );

    const maximum =
        1350-
        Math.min(
            difficulty*15,
            250
        );

    nextSpawn =
        minimum+
        Math.random()*
        (maximum-minimum);

    spawnTimer=0;
}


/* =========================
   IMAGE DRAWING
========================= */

function drawCactus(o){

    const image =
        cactusImages[o.key];

    /*
        Do NOT draw a fallback square.

        If the image has not loaded yet,
        simply don't draw it.
    */

    if(
        !image.complete ||
        !image.naturalWidth
    ){
        return;
    }

    /*
        The source image is drawn to EXACTLY
        the collision dimensions.
    */

    ctx.drawImage(
        image,

        0,
        0,
        image.naturalWidth,
        image.naturalHeight,

        Math.round(o.x),
        Math.round(o.y),
        Math.round(o.width),
        Math.round(o.height)
    );
}


/* =========================
   SKY
========================= */

function drawSky(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            GROUND
        );

    gradient.addColorStop(
        0,
        SKY_TOP
    );

    gradient.addColorStop(
        1,
        SKY_BOTTOM
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        GROUND
    );


    ctx.fillStyle="#dfe8e4";

    const cloudY=92;

    ctx.fillRect(
        130,
        cloudY,
        70,
        8
    );

    ctx.fillRect(
        146,
        cloudY-7,
        38,
        7
    );

    ctx.fillRect(
        158,
        cloudY-12,
        20,
        5
    );


    ctx.fillRect(
        620,
        145,
        86,
        8
    );

    ctx.fillRect(
        640,
        138,
        42,
        7
    );

    ctx.fillRect(
        655,
        132,
        22,
        6
    );


    ctx.fillStyle="#cbdcda";

    ctx.fillRect(
        335,
        72,
        45,
        6
    );

    ctx.fillRect(
        347,
        66,
        25,
        6
    );


    ctx.fillRect(
        790,
        78,
        58,
        7
    );

    ctx.fillRect(
        805,
        71,
        27,
        7
    );
}


/* =========================
   GROUND
========================= */

function drawGround(){

    ctx.fillStyle=
        GROUND_BASE;

    ctx.fillRect(
        0,
        GROUND,
        W,
        H-GROUND
    );


    ctx.fillStyle=
        GROUND_TOP;

    ctx.fillRect(
        0,
        GROUND,
        W,
        9
    );


    ctx.fillStyle=
        GROUND_LIGHT;

    ctx.fillRect(
        0,
        GROUND,
        W,
        3
    );


    const tile=80;

    for(
        let x=
            groundOffset-tile;

        x<W+tile;

        x+=tile
    ){

        ctx.fillStyle=
            GROUND_DARK;

        ctx.fillRect(
            x+7,
            GROUND+22,
            22,
            4
        );

        ctx.fillRect(
            x+49,
            GROUND+39,
            15,
            4
        );

        ctx.fillRect(
            x+19,
            GROUND+57,
            30,
            4
        );


        ctx.fillStyle=
            GROUND_LIGHT;

        ctx.fillRect(
            x+32,
            GROUND+15,
            8,
            3
        );

        ctx.fillRect(
            x+63,
            GROUND+28,
            7,
            3
        );

        ctx.fillRect(
            x+3,
            GROUND+48,
            10,
            3
        );

        ctx.fillRect(
            x+56,
            GROUND+65,
            16,
            3
        );
    }


    for(
        let x=
            groundOffset-40;

        x<W+80;

        x+=120
    ){

        ctx.fillStyle=
            GROUND_LIGHT;

        ctx.fillRect(
            x,
            GROUND+12,
            3,
            7
        );

        ctx.fillRect(
            x+4,
            GROUND+15,
            3,
            4
        );
    }

/* =========================
   BUNNY DRAWING
========================= */

function drawBunny(){

    let image;

    let frameWidth=28;

    let frameHeight=28;

    let frameIndex=0;


    if(
        !started &&
        !dead
    ){

        image=idleImage;

        frameIndex=0;

    }

    else if(
        !bunny.grounded
    ){

        image=jumpImage;

        frameWidth=28;

        frameHeight=36;


        const jumpAnimationDuration=560;

        frameIndex=
            Math.min(
                7,
                Math.floor(
                    (
                        jumpTime/
                        jumpAnimationDuration
                    )*8
                )
            );

    }

    else{

        image=runImage;

        frameWidth=28;

        frameHeight=28;

        frameIndex=
            Math.floor(
                runAnimTime/45
            )%8;
    }


    if(
        !image ||
        !image.complete ||
        !image.naturalWidth
    ){
        return;
    }


    const drawW =
        frameWidth*
        BUNNY_DRAW_SCALE;

    const drawH =
        frameHeight*
        BUNNY_DRAW_SCALE;


    const feetY =
        bunny.y+
        bunny.height;


    const drawX =
        bunny.x;


    const drawY =
        feetY-
        drawH;


    ctx.save();


    /*
        Face right.
    */

    ctx.translate(
        drawX+drawW,
        drawY
    );

    ctx.scale(
        -1,
        1
    );


    ctx.drawImage(

        image,

        frameIndex*
        frameWidth,

        0,

        frameWidth,

        frameHeight,

        0,

        0,

        drawW,

        drawH
    );


    ctx.restore();
}


/* =========================
   BUNNY HITBOX
========================= */

function getBunnyHitbox(){

    /*
        This is intentionally smaller
        than the visual bunny so the game
        doesn't feel unfair.
    */

    return {

        x:
            bunny.x+8,

        y:
            bunny.y+7,

        width:
            48,

        height:
            58
    };
}


/* =========================
   COLLISION
========================= */

function checkCollision(){

    const b =
        getBunnyHitbox();


    for(
        const o of obstacles
    ){

        /*
            The cactus collision box is
            EXACTLY its drawn dimensions.
        */

        const c={

            x:o.x+2,

            y:o.y+2,

            width:
                Math.max(
                    1,
                    o.width-4
                ),

            height:
                Math.max(
                    1,
                    o.height-4
                )
        };


        if(

            b.x <
                c.x+c.width &&

            b.x+b.width >
                c.x &&

            b.y <
                c.y+c.height &&

            b.y+b.height >
                c.y

        ){

            return true;
        }
    }


    return false;
}


/* =========================
   JUMP
========================= */

function jump(){

    if(!started){

        started=true;

        dead=false;

        lastTime=
            performance.now();

        requestAnimationFrame(
            loop
        );

        return;
    }


    if(dead){

        restart();

        return;
    }


    if(
        bunny.grounded
    ){

        bunny.velocityY=
            bunny.jumpPower;

        bunny.grounded=false;

        jumpTime=0;
    }
}


/* =========================
   RESTART
========================= */

function restart(){

    score=0;

    speed=6;

    obstacles.length=0;

    spawnTimer=0;

    nextSpawn=1200;

    groundOffset=0;

    bunny.y=
        GROUND-
        bunny.height;

    bunny.velocityY=0;

    bunny.grounded=true;

    runAnimTime=0;

    jumpTime=0;

    dead=false;

    started=true;

    rewardGiven=false;

    document.getElementById(
        "status"
    ).innerText=
        "Run as far as you can ♡";


    document.getElementById(
        "reward-modal"
    ).style.display="none";


    lastTime=
        performance.now();


    requestAnimationFrame(
        loop
    );
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    if(dead){
        return;
    }


    dead=true;

    bunny.velocityY=0;


    /*
        Do NOT award coins every frame.
    */

    if(!rewardGiven){

        rewardGiven=true;

        /*
            Bunny Run reward.

            Change 20 here if you want
            another amount.
        */

        if(
            typeof addCoins ===
            "function"
        ){

            addCoins(20);
        }


        if(
            typeof updateCoinDisplays ===
            "function"
        ){

            updateCoinDisplays();
        }
    }


    showGameOverModal();
}


/* =========================
   UPDATE
========================= */

function update(dt){

    if(
        !started ||
        dead
    ){
        return;
    }


    /*
        RUN ANIMATION
    */

    if(
        bunny.grounded
    ){

        runAnimTime+=dt;
    }


    /*
        JUMP PHYSICS
    */

    if(
        !bunny.grounded
    ){

        jumpTime+=dt;


        bunny.velocityY+=
            bunny.gravity*
            (dt/16.6667);


        bunny.y+=
            bunny.velocityY*
            (dt/16.6667);


        const groundY=
            GROUND-
            bunny.height;


        if(
            bunny.y>=groundY
        ){

            bunny.y=groundY;

            bunny.velocityY=0;

            bunny.grounded=true;

            runAnimTime=0;

            jumpTime=0;
        }
    }


    /*
        SPEED.

        This stays smooth and gradually
        gets faster.
    */

    speed+=
        .00035*
        dt;


    const movement=
        speed*
        (dt/16.6667);


    /*
        SCORE.

        This is the IMPORTANT fix.

        score is a real number internally,
        then displayed with Math.floor().
    */

    score+=
        movement*
        .055;


    /*
        GROUND
    */

    groundOffset-=movement;


    if(
        groundOffset<=-80
    ){

        groundOffset+=80;
    }


    /*
        CACTUSES
    */

    for(
        let i=
            obstacles.length-1;

        i>=0;

        i--
    ){

        const o=
            obstacles[i];


        o.x-=movement;


        /*
            +100 for every cactus passed.
        */

        if(
            !o.counted &&
            o.x+o.width<
                bunny.x
        ){

            o.counted=true;

            score+=100;
        }


        if(
            o.x+o.width<
            -100
        ){

            obstacles.splice(
                i,
                1
            );
        }
    }


    /*
        SPAWN
    */

    spawnTimer+=dt;


    if(
        spawnTimer>=nextSpawn
    ){

        spawnCactus();
    }


    /*
        COLLISION
    */

    if(
        checkCollision()
    ){

        gameOver();
    }
}


/* =========================
   PIXEL SCORE
========================= */

function drawScore(){

    /*
        Pixel-style font.

        Using a monospace font plus
        pixelated rendering keeps the
        Dino-like appearance without
        needing another font file.
    */

    ctx.save();

    ctx.textAlign="right";

    ctx.textBaseline="top";

    ctx.font=
        "bold 22px monospace";

    ctx.fillStyle=
        DARK;

    ctx.shadowColor=
        "rgba(255,255,255,.35)";

    ctx.shadowBlur=0;

    const scoreText=
        String(
            Math.floor(score)
        ).padStart(
            5,
            "0"
        );


    ctx.fillText(
        scoreText,
        W-25,
        20
    );


    ctx.restore();
}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawSky();

    drawGround();


    /*
        Cactus images are drawn
        directly from your four files.
    */

    for(
        const o of obstacles
    ){

        drawCactus(o);
    }


    drawBunny();

    drawScore();


    /*
        START MESSAGE
    */

    if(
        !started
    ){

        ctx.save();

        ctx.textAlign="center";

        ctx.fillStyle=DARK;

        ctx.font=
            "24px monospace";

        ctx.fillText(
            "PRESS SPACE OR TAP",
            W/2,
            70
        );

        ctx.restore();
    }


    /*
        Game-over message is handled
        by the pretty HTML modal.
    */
    }<script>

/* =========================
   GAME LOOP
========================= */

function loop(time){

    if(
        !lastTime
    ){

        lastTime=time;
    }


    const dt=
        Math.min(
            time-lastTime,
            32
        );


    lastTime=time;


    update(dt);

    draw();


    if(
        !dead
    ){

        requestAnimationFrame(
            loop
        );
    }
}


/* =========================
   INPUT
========================= */

function handleInput(e){

    if(e){
        e.preventDefault();
    }


    /*
        If dead, jump() calls restart().
    */

    jump();
}


window.addEventListener(
    "keydown",
    function(e){

        if(
            e.code==="Space" ||
            e.code==="ArrowUp" ||
            e.code==="KeyW"
        ){

            e.preventDefault();

            handleInput(e);
        }
    }
);


canvas.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        handleInput(e);
    }
);
