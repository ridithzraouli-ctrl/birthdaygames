<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Bunny Run ♡</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg-base:#f2f7fa;
    --bg-grad-1:#dce8f3;
    --bg-grad-2:#edf4f6;

    --card:#ffffffcc;
    --card-solid:#ffffff;

    --text:#39434a;
    --soft:#71808a;

    --accent:#9bbdd1;
    --accent-dark:#7199b2;

    --button:#dbeaf2;
    --button-hover:#cbdfea;

    --shadow:0 10px 30px rgba(74,92,105,.12);
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Georgia,serif;
    color:var(--text);
    background:
        radial-gradient(circle at 15% 15%,rgba(255,255,255,.85),transparent 30%),
        linear-gradient(
            135deg,
            var(--bg-grad-1),
            var(--bg-grad-2)
        );
}

#page{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.decor{
    position:absolute;
    pointer-events:none;
    user-select:none;
    color:var(--accent-dark);
    opacity:.55;
    font-size:22px;
    z-index:1;
}

.decor.one{
    top:7%;
    left:7%;
}

.decor.two{
    top:15%;
    right:9%;
    font-size:16px;
}

.decor.three{
    bottom:8%;
    left:10%;
    font-size:18px;
}

.decor.four{
    bottom:13%;
    right:8%;
}

#gameCard{
    position:relative;
    width:min(1000px,96vw);
    padding:14px;
    border-radius:28px;
    background:var(--card);
    box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.8);
    backdrop-filter:blur(8px);
    z-index:2;
}

#gameWrap{
    position:relative;
    width:100%;
    border-radius:20px;
    overflow:hidden;
}

#game{
    width:100%;
    height:auto;
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    border-radius:20px;
}

#topControls{
    position:absolute;
    top:18px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
    z-index:5;
}

.arcadeButton{
    pointer-events:auto;
    border:1px solid rgba(255,255,255,.8);
    background:rgba(255,255,255,.72);
    color:var(--text);
    font-family:Georgia,serif;
    border-radius:999px;
    min-width:44px;
    height:38px;
    padding:0 15px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(60,75,85,.10);
    transition:
        transform .15s ease,
        background .15s ease;
}

.arcadeButton:hover{
    background:rgba(255,255,255,.9);
    transform:translateY(-1px);
}

.arcadeButton:active{
    transform:translateY(1px);
}

#fullscreenButton{
    font-size:17px;
    line-height:1;
}

#coinDisplay{
    position:absolute;
    top:18px;
    right:72px;
    z-index:5;
    pointer-events:none;

    padding:7px 13px;
    border-radius:999px;
    background:rgba(255,255,255,.72);
    border:1px solid rgba(255,255,255,.8);
    box-shadow:0 4px 14px rgba(60,75,85,.10);

    font-size:15px;
    color:var(--text);
}

#gameOverlay{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(44,52,57,.20);
    backdrop-filter:blur(3px);
    z-index:10;
}

#gameOverlay.show{
    display:flex;
}

#gameOverModal{
    width:min(390px,84%);
    padding:28px 24px 24px;
    border-radius:25px;
    background:var(--card-solid);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 18px 50px rgba(45,58,65,.20);
    text-align:center;
    animation:modalIn .25s ease-out;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(8px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

#brokenHeart{
    font-size:39px;
    line-height:1;
    margin-bottom:8px;
}

#gameOverTitle{
    margin:0;
    font-size:27px;
    font-weight:normal;
}

#gameOverScore{
    margin-top:16px;
    font-size:18px;
    line-height:1.7;
}

#earnedCoins{
    margin-top:7px;
    font-size:17px;
}

#restartButton{
    margin-top:19px;
    border:0;
    padding:11px 22px;
    border-radius:999px;
    background:var(--button);
    color:var(--text);
    font-family:Georgia,serif;
    font-size:16px;
    cursor:pointer;
    transition:.15s ease;
}

#restartButton:hover{
    background:var(--button-hover);
    transform:translateY(-1px);
}

#fullscreenExitHint{
    position:fixed;
    top:14px;
    right:14px;
    z-index:100;
    display:none;
}

:fullscreen #gameCard{
    width:100vw;
    height:100vh;
    padding:0;
    border-radius:0;
    background:#000;
    box-shadow:none;
}

:fullscreen #gameWrap{
    width:100vw;
    height:100vh;
    border-radius:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

:fullscreen #game{
    width:100vw;
    height:auto;
    max-height:100vh;
    border-radius:0;
}

:fullscreen #topControls{
    top:18px;
    left:18px;
    right:18px;
}

@media(max-width:700px){
    #gameCard{
        width:100vw;
        padding:7px;
        border-radius:18px;
    }

    #gameWrap,
    #game{
        border-radius:14px;
    }

    #topControls{
        top:10px;
        left:10px;
        right:10px;
    }

    #coinDisplay{
        top:10px;
        right:58px;
        font-size:13px;
        padding:6px 10px;
    }

    .arcadeButton{
        height:34px;
        min-width:38px;
        padding:0 11px;
    }
}
</style>
</head>

<body>

<script>

/* =========================
   COLORS
========================= */

const BG="#b8cbd1";

const SKY_TOP=

const SKY_BOTTOM=

const DARK="#29332f";

const GROUND_TOP="#756d59";
const GROUND_BASE="#625b4b";
const GROUND_LIGHT="#887f68";
const GROUND_DARK="#48453b";


/* =========================
   BUNNY IMAGES
========================= */

const idleImage=new Image();
const runImage=new Image();
const jumpImage=new Image();


/*

   BUNNY BASE64 LINES HERE.

   Do not change the sprites.
*/


/* =========================
   CACTUS IMAGES
========================= */

const cactusSmallImage=
    new Image();

const cactusTallImage=
    new Image();

const cactusMediumImage=
    new Image();

const cactusWideImage=

cactusSmallImage.src=

cactusTallImage.src=

/* =========================
   CACTUS TYPES
========================= */

const CACTUS_TYPES={

    small:{
        image:cactusSmallImage,

        hitboxWidth:24,
        hitboxHeight:24,

        imageWidth:65,
        imageHeight:65
    },

    tall:{
        image:cactusTallImage,

    },

    medium:{
        image:cactusMediumImage,

    },

        image:cactusWideImage,

        hitboxWidth:70,
        hitboxHeight:38,

        imageWidth:120,
        imageHeight:75
    }

};


/* =========================
   GAME STATE
========================= */

let started=false;
let dead=false;
let lastTime=0;

let score=0;
let speed=6;

let groundOffset=0;

let runAnimTime=0;
let jumpTime=0;

let lastScoreMilestone=0;

let runStartCoins=0;
let runCoinsEarned=0;


/* =========================
   HIGH SCORE
========================= */

let highScore=
    Number(
        localStorage.getItem(
            "bunnyRunHighScore"
        ) || 0
    );


/* =========================
   SHARED ARCADE COINS
========================= */

function getArcadeCoins(){

    return Number(
        localStorage.getItem(
            "arcade_coins"
        ) || 0
    );
}


function updateCoinDisplays(){

    const amount=
        getArcadeCoins();

    const element=
        document.getElementById(
            "coinAmount"
        );

    if(element){

        element.textContent=
            amount;
    }
}


function addCoins(amount){

    const current=
        getArcadeCoins();

    const next=
        current+
        Number(amount);

    localStorage.setItem(
        "arcade_coins",
        String(next)
    );

    updateCoinDisplays();
}


updateCoinDisplays();


/* =========================
   AUDIO
========================= */

let audioContext=null;


function initAudio(){

    if(!audioContext){

        audioContext=
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if(
        audioContext &&
        audioContext.state==="suspended"
    ){

        audioContext.resume();
    }
}


function playScoreSound(){

    initAudio();

    if(!audioContext){
        return;
    }

    const now=
        audioContext.currentTime;


    const osc1=
        audioContext.createOscillator();

    const gain1=
        audioContext.createGain();

    osc1.type="square";

    osc1.frequency.setValueAtTime(
        880,
        now
    );

    gain1.gain.setValueAtTime(
        0.0001,
        now
    );

    gain1.gain.exponentialRampToValueAtTime(
        0.055,
        now+0.005
    );

    gain1.gain.exponentialRampToValueAtTime(
        0.0001,
        now+0.055
    );

    osc1.connect(gain1);
    gain1.connect(
        audioContext.destination
    );

    osc1.start(now);
    osc1.stop(now+0.06);


    const osc2=
        audioContext.createOscillator();

    const gain2=
        audioContext.createGain();

    osc2.type="square";

    osc2.frequency.setValueAtTime(
        1175,
        now+0.065
    );

    gain2.gain.setValueAtTime(
        0.0001,
        now+0.065
    );

    gain2.gain.exponentialRampToValueAtTime(
        0.055,
        now+0.07
    );

    gain2.gain.exponentialRampToValueAtTime(
        0.0001,
        now+0.12
    );

    osc2.connect(gain2);
    gain2.connect(
        audioContext.destination
    );

    osc2.start(now+0.065);
    osc2.stop(now+0.125);
}


/* =========================
   BUNNY
========================= */

const bunny={

    x:110,

    y:
        GROUND-28,

    width:28,
    height:28,

    velocityY:0,

    grounded:true,

    gravity:0.72,

    jumpPower:-15.5
};


/* =========================
   CACTUSES
========================= */

const obstacles=[];


/* =========================
   CREATE CACTUS
========================= */

function createCactus(
    typeName,
    x
){

    const type=
        CACTUS_TYPES[typeName];

    return{

        x:x,

        y:
            GROUND-
            type.imageHeight,

        width:
            type.imageWidth,

        height:
            type.imageHeight,

        typeName:typeName,

        image:type.image,

        hitboxWidth:
            type.hitboxWidth,

        hitboxHeight:
            type.hitboxHeight,

        counted:false
    };
}


/* =========================
   SPAWN CACTUS
========================= */

let spawnTimer=0;
let nextSpawn=1200;


function spawnCactus(){

    const difficulty=
        Math.min(
            score/100,
            30
        );


    const names=[
        "small",
        "tall",
        "medium",
        "wide"
    ];


    const typeName=
        names[
            Math.floor(
                Math.random()*
                names.length
            )
        ];


    const x=
        W+50;


    const cactus=
        createCactus(
            typeName,
            x
        );


    obstacles.push(
        cactus
    );


    const minimum=
        1050-
        Math.min(
            difficulty*10,
            350
        );


    const maximum=
        1500-
        Math.min(
            difficulty*8,
            300
        );


    nextSpawn=
        minimum+
        Math.random()*
        (
            maximum-
            minimum
        );


    spawnTimer=0;
}


/* =========================
   WHITE BACKGROUND REMOVAL
========================= */

const processedCactusImages=
    new Map();


function getTransparentCactusImage(
    image
){

    if(
        !image.complete ||
        !image.naturalWidth
    ){

        return image;
    }


    if(
        processedCactusImages.has(
            image
        )
    ){

        return processedCactusImages.get(
            image
        );
    }


    const offscreen=
        document.createElement(
            "canvas"
        );


    offscreen.width=
        image.naturalWidth;

    offscreen.height=
        image.naturalHeight;


    const offctx=
        offscreen.getContext(
            "2d"
        );


    offctx.drawImage(
        image,
        0,
        0
    );


    let data;

    try{

        data=
            offctx.getImageData(
                0,
                0,
                offscreen.width,
                offscreen.height
            );

    }catch(e){

        return image;
    }


    const pixels=
        data.data;


    for(
        let i=0;
        i<pixels.length;
        i+=4
    ){

        const r=pixels[i];
        const g=pixels[i+1];
        const b=pixels[i+2];


        if(
            r>235 &&
            g>235 &&
            b>235
        ){

            pixels[i+3]=0;
        }
    }


    offctx.putImageData(
        data,
        0,
        0
    );


    processedCactusImages.set(
        image,
        offscreen
    );


    return offscreen;
}/* =========================
   SKY
========================= */

function drawSky(){

    const gradient=
        ctx.createLinearGradient(
            0,
            0,
            0,
            GROUND
        );


    gradient.addColorStop(
        0,
        SKY_TOP
    );


    gradient.addColorStop(
        1,
        SKY_BOTTOM
    );


    ctx.fillStyle=gradient;


    ctx.fillRect(
        0,
        0,
        W,
        GROUND
    );


    /*
        Small pixel clouds
    */

    ctx.fillStyle="#dfe8e4";


    const cloudY=92;


    ctx.fillRect(
        130,
        cloudY,
        70,
        8
    );


    ctx.fillRect(
        146,
        cloudY-7,
        38,
        7
    );


    ctx.fillRect(
        158,
        cloudY-12,
        20,
        5
    );


    ctx.fillRect(
        620,
        145,
        86,
        8
    );


    ctx.fillRect(
        640,
        138,
        42,
        7
    );


    ctx.fillRect(
        655,
        132,
        22,
        6
    );


    ctx.fillStyle="#cbdcda";


    ctx.fillRect(
        335,
        72,
        45,
        6
    );


    ctx.fillRect(
        347,
        66,
        25,
        6
    );


    ctx.fillRect(
        790,
        78,
        58,
        7
    );


    ctx.fillRect(
        805,
        71,
        27,
        7
    );
}


/* =========================
   GROUND
========================= */

function drawGround(){

    ctx.fillStyle=
        GROUND_BASE;


    ctx.fillRect(
        0,
        GROUND,
        W,
        H-GROUND
    );


    ctx.fillStyle=
        GROUND_TOP;


    ctx.fillRect(
        0,
        GROUND,
        W,
        9
    );


    ctx.fillStyle=
        GROUND_LIGHT;


    ctx.fillRect(
        0,
        GROUND,
        W,
        3
    );


    const tile=80;


    for(
        let x=
            groundOffset-tile;

        x<
            W+tile;

        x+=tile
    ){

        ctx.fillStyle=
            GROUND_DARK;


        ctx.fillRect(
            x+7,
            GROUND+22,
            22,
            4
        );


        ctx.fillRect(
            x+49,
            GROUND+39,
            15,
            4
        );


        ctx.fillRect(
            x+19,
            GROUND+57,
            30,
            4
        );


        ctx.fillStyle=
            GROUND_LIGHT;


        ctx.fillRect(
            x+32,
            GROUND+15,
            8,
            3
        );


        ctx.fillRect(
            x+63,
            GROUND+28,
            7,
            3
        );


        ctx.fillRect(
            x+3,
            GROUND+48,
            10,
            3
        );


        ctx.fillRect(
            x+56,
            GROUND+65,
            16,
            3
        );
    }


    for(
        let x=
            groundOffset-40;

        x<
            W+80;

        x+=120
    ){

        ctx.fillStyle=
            GROUND_LIGHT;


        ctx.fillRect(
            x,
            GROUND+12,
            3,
            7
        );


        ctx.fillRect(
            x+4,
            GROUND+15,
            3,
            4
        );
    }
}


/* =========================
   CACTUS DRAWING
========================= */

function drawCactus(o){

    if(
        !o.image.complete ||
        !o.image.naturalWidth
    ){

        ctx.fillStyle="#63745f";


        ctx.fillRect(
            o.x,
            GROUND-o.height,
            o.width,
            o.height
        );


        return;
    }


    const texture=
        getTransparentCactusImage(
            o.image
        );


    const drawX=
        o.x;


    const drawY=
        GROUND-o.height;


    ctx.drawImage(
        texture,
        drawX,
        drawY,
        o.width,
        o.height
    );
}


/* =========================
   BUNNY ANIMATION
========================= */

function drawBunny(){

    let image;

    let frameWidth=28;

    let frameHeight=28;

    let frameIndex=0;


    if(
        !started &&

/* =========================
   BUNNY COLLISION
========================= */

function getBunnyHitbox(){

    return{

        x:
            bunny.x+13,

        y:
            bunny.y+12,

        width:52,

        height:60
    };
}


/* =========================
   CACTUS COLLISION
========================= */

function checkCollision(){

    const b=
        getBunnyHitbox();


    for(
        const o of obstacles
    ){

        const hitWidth=
            o.hitboxWidth;


        const hitHeight=
            o.hitboxHeight;


        const cactusHit={

            x:
                o.x+
                (
                    o.width-
                    hitWidth
                )/2,

            y:
                GROUND-
                hitHeight,

            width:
                hitWidth,

            height:
                hitHeight
        };


        if(

            b.x<
                cactusHit.x+
                cactusHit.width

            &&

            b.x+b.width>
                cactusHit.x

            &&

            b.y<
                cactusHit.y+
                cactusHit.height

            &&

            b.y+b.height>
                cactusHit.y

        ){

            return true;
        }
    }


    return false;
}


/* =========================
   JUMP
========================= */

function jump(){

    initAudio();


    if(!started){

        started=true;

        bunny.grounded=true;

        runAnimTime=0;

        jumpTime=0;

        lastTime=
            performance.now();


        runStartCoins=
            getArcadeCoins();


        runCoinsEarned=0;


        requestAnimationFrame(
            loop
        );

        return;
    }


    if(dead){

        restart();

        return;
    }


    if(bunny.grounded){

        bunny.velocityY=
            bunny.jumpPower;

        bunny.grounded=false;

        jumpTime=0;
    }
}


/* =========================
   RESTART
========================= */

function restart(){

    score=0;

    speed=6;

    lastScoreMilestone=0;

    obstacles.length=0;

    spawnTimer=0;

    nextSpawn=1200;


    bunny.y=
        GROUND-28;

    bunny.velocityY=0;

    bunny.grounded=true;


    runAnimTime=0;

    jumpTime=0;

    groundOffset=0;


    dead=false;

    started=true;


    runStartCoins=
        getArcadeCoins();

    runCoinsEarned=0;


    lastTime=
        performance.now();


    document
        .getElementById(
            "gameOverlay"
        )
        .classList.remove(
            "show"
        );


    requestAnimationFrame(
        loop
    );
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    if(dead){
        return;
    }


    dead=true;


    bunny.velocityY=0;


    const finalScore=
        Math.floor(score);


    if(
        finalScore>
        highScore
    ){

        highScore=
            finalScore;


        localStorage.setItem(
            "bunnyRunHighScore",
            String(highScore)
        );
    }


    /*
        Keep the run's earned
        coins based on the shared
        Arcade balance difference.
    */

    runCoinsEarned=
        getArcadeCoins()-
        runStartCoins;


    if(runCoinsEarned<0){
        runCoinsEarned=0;
    }


    document.getElementById(
        "finalScore"
    ).textContent=
        finalScore;


    document.getElementById(
        "highScoreModal"
    ).textContent=
        highScore;


    document.getElementById(
        "runCoins"
    ).textContent=
        runCoinsEarned;


    document
        .getElementById(
            "gameOverlay"
        )
        .classList.add(
            "show"
        );
}


/* =========================
   UPDATE
========================= */

function update(dt){

    if(
        !started ||
        dead
    ){

        return;
    }


    /*
        BUNNY ANIMATION
    */

    if(
        bunny.grounded
    ){

        runAnimTime+=dt;
    }


    /*
        BUNNY PHYSICS
    */

    if(
        !bunny.grounded
    ){

        jumpTime+=dt;


        bunny.velocityY+=
            bunny.gravity*
            (dt/16.6667);


        bunny.y+=
            bunny.velocityY*
            (dt/16.6667);


        const groundY=
            GROUND-28;


        if(
            bunny.y>=groundY
        ){

            bunny.y=groundY;

            bunny.velocityY=0;

            bunny.grounded=true;

            runAnimTime=0;

            jumpTime=0;
        }
    }


    /*
        GAME SPEED
    */

    speed+=
        0.00035*dt;


    const movement=
        speed*
        (dt/16.6667);


    /*
        CONTINUOUS SCORE
    */

    score+=
        movement*0.055;


    /*
        SCORE SOUND
        Every 100 points.
    */

    const currentMilestone=
        Math.floor(
            score/100
        );


    if(
        currentMilestone>
        lastScoreMilestone
    ){

        for(
            let i=
                lastScoreMilestone;

            i<
                currentMilestone;

            i++
        ){

            playScoreSound();
        }


        lastScoreMilestone=
            currentMilestone;
    }


    /*
        GROUND
    */

    groundOffset-=movement;


    if(
        groundOffset<=-80
    ){

        groundOffset+=80;
    }


    /*
        CACTUSES
    */

    for(
        let i=
            obstacles.length-1;

        i>=0;

        i--
    ){

        const o=
            obstacles[i];


        o.x-=movement;


        /*
            +10 for every cactus
            successfully passed.
        */

        if(
            !o.counted &&
            o.x+o.width<
            bunny.x
        ){

            o.counted=true;

            score+=10;
        }


        if(
            o.x+o.width<
            -40
        ){

            obstacles.splice(
                i,
                1
            );
        }
    }


    /*
        SPAWN
    */

    spawnTimer+=dt;


    if(
        spawnTimer>=nextSpawn
    ){

        spawnCactus();
    }


    /*
        COLLISION
    */

    if(
        checkCollision()
    ){

        gameOver();
    }


    /*
        HIGH SCORE DISPLAY
        is drawn every frame.
    */
}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawSky();

    drawGround();


    for(
        const o of obstacles
    ){

        drawCactus(o);
    }


    drawBunny();


    /*
        SCORE
    */

    ctx.fillStyle=DARK;

    ctx.font="24px Georgia";

    ctx.textAlign="right";


    ctx.fillText(
        String(
            Math.floor(score)
        ).padStart(
            5,
            "0"
        ),
        W-28,
        42
    );


    /*
        HIGH SCORE
    */

    ctx.font="17px Georgia";

    ctx.fillStyle=
        "rgba(41,51,47,.72)";


    ctx.fillText(
        "HI "+
        String(
            highScore
        ).padStart(
            5,
            "0"
        ),
        W-28,
        65
    );


    /*
        START SCREEN
    */

    if(
        !started
    ){

        ctx.textAlign="center";

        ctx.font="26px Georgia";

        ctx.fillStyle=DARK;


        ctx.fillText(
            "PRESS SPACE OR TAP",
            W/2,
            90
        );
    }
    }/* =========================
   GAME LOOP
========================= */

function loop(time){

    const dt=
        Math.min(
            time-lastTime,
            32
        );


    lastTime=time;


    update(dt);

    draw();


    if(!dead){

        requestAnimationFrame(
            loop
        );
    }
}


/* =========================
   INPUT
========================= */

function handleInput(){

    initAudio();


    if(dead){

        restart();

        return;
    }


    jump();
}


window.addEventListener(
    "keydown",
    e=>{

        if(
            e.code==="Space" ||
            e.code==="ArrowUp" ||
            e.code==="KeyW"
        ){

            e.preventDefault();

            handleInput();
        }
    }
);


canvas.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        handleInput();
    }
);


/* =========================
   RESTART BUTTON
========================= */

document
    .getElementById(
        "restartButton"
    )
    .addEventListener(
        "click",
        e=>{

            e.stopPropagation();

            initAudio();

            restart();
        }
    );


/* =========================
   FULLSCREEN
========================= */

const fullscreenButton=
    document.getElementById(
        "fullscreenButton"
    );


function isFullscreen(){

    return Boolean(
        document.fullscreenElement
    );
}


async function toggleFullscreen(){

    try{

        if(!isFullscreen()){

            await document
                .documentElement
                .requestFullscreen();

        }else{

            await document
                .exitFullscreen();
        }

    }catch(error){

        /*
            Some mobile browsers do not
            expose fullscreen. The game
            itself continues normally.
        */
    }
}


fullscreenButton.addEventListener(
    "click",
    e=>{

        e.stopPropagation();

        toggleFullscreen();
    }
);


document.addEventListener(
    "fullscreenchange",
    ()=>{

        if(isFullscreen()){

            fullscreenButton.textContent="×";

            fullscreenButton.setAttribute(
                "aria-label",
                "Exit fullscreen"
            );

        }else{

            fullscreenButton.textContent="⛶";

            fullscreenButton.setAttribute(
                "aria-label",
                "Fullscreen"
            );
        }
    }
);


/*
    Escape is automatically handled
    by the browser while fullscreen.
*/
