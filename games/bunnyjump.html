<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>Bunny Run ♡</title>

<style>

:root{

    --bg-base:#f2f7fa;
    --bg-grad-1:#dce8f3;
    --bg-grad-2:#d3e2ea;

    --text-main:#3f5260;
    --text-heading:#46637a;

    --accent-border:#82a8bd;
    --accent-soft:#e9f3f9;
    --accent-badge:#dfe8f8;
    --ornament-color:#799eb8;

    --card-bg:rgba(255,255,255,.90);

    --shadow:
        0 18px 45px rgba(74,94,108,.13),
        0 3px 10px rgba(74,94,108,.08);

}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    margin:0;
    width:100%;
    min-height:100%;

}

body{

    min-height:100vh;
    min-height:100dvh;

    background:
        radial-gradient(
            circle at 12% 15%,
            rgba(255,255,255,.65) 0 2px,
            transparent 3px
        ),
        radial-gradient(
            circle at 88% 28%,
            rgba(255,255,255,.55) 0 2px,
            transparent 3px
        ),
        linear-gradient(
            145deg,
            var(--bg-grad-1),
            var(--bg-base) 48%,
            var(--bg-grad-2)
        );

    color:var(--text-main);

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    overflow-x:hidden;

}

body::before{

    content:"✦";

    position:fixed;

    top:105px;
    left:5%;

    color:var(--ornament-color);

    opacity:.20;

    font-size:20px;

    pointer-events:none;

}

body::after{

    content:"✧";

    position:fixed;

    right:6%;
    bottom:90px;

    color:var(--ornament-color);

    opacity:.20;

    font-size:24px;

    pointer-events:none;

}

button,
a{

    font-family:inherit;

}

button{

    cursor:pointer;

}

header{

    width:100%;
    max-width:1180px;

    margin:0 auto;

    padding:
        21px
        24px
        12px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:16px;

}

.header-left,
.header-right{

    display:flex;

    align-items:center;

    gap:10px;

}

.nav-link,
.fullscreen-button{

    min-height:42px;

    border:
        1px solid
        rgba(130,168,189,.55);

    border-radius:13px;

    background:
        rgba(255,255,255,.78);

    color:var(--text-heading);

    box-shadow:
        0 5px 15px
        rgba(74,94,108,.07);

    transition:
        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease;

}

.nav-link{

    display:flex;

    align-items:center;

    padding:
        0
        15px;

    text-decoration:none;

    font-size:14px;

}

.fullscreen-button{

    padding:
        0
        15px;

    font-size:14px;

}

.nav-link:hover,
.fullscreen-button:hover{

    transform:translateY(-1px);

    background:
        rgba(255,255,255,.95);

    box-shadow:
        0 8px 20px
        rgba(74,94,108,.11);

}

.nav-link:active,
.fullscreen-button:active{

    transform:none;

}

.coin-display{

    min-height:42px;

    display:flex;

    align-items:center;

    gap:7px;

    padding:
        0
        15px;

    border:
        1px solid
        rgba(130,168,189,.48);

    border-radius:13px;

    background:
        rgba(255,255,255,.82);

    color:var(--text-heading);

    font-size:14px;

    box-shadow:
        0 5px 15px
        rgba(74,94,108,.06);

}

.coin-display .coin-count{

    font-weight:bold;

}

.page{

    width:100%;
    max-width:1180px;

    margin:0 auto;

    padding:
        5px
        24px
        35px;

}

.game-heading{

    text-align:center;

    margin:
        4px
        0
        17px;

}

.game-heading .ornament{

    display:block;

    margin-bottom:4px;

    color:var(--ornament-color);

    opacity:.70;

    font-size:13px;

    letter-spacing:7px;

}

.game-heading h1{

    margin:0;

    color:var(--text-heading);

    font-size:32px;

    font-weight:normal;

    letter-spacing:.2px;

}

.game-heading p{

    margin:
        6px
        0
        0;

    color:#70818b;

    font-size:14px;

}

.game-card{

    position:relative;

    width:100%;

    padding:12px;

    border:
        1px solid
        rgba(130,168,189,.45);

    border-radius:23px;

    background:
        rgba(255,255,255,.88);

    box-shadow:var(--shadow);

    overflow:hidden;

}

.game-card::before{

    content:"✦";

    position:absolute;

    top:9px;
    left:18px;

    color:var(--ornament-color);

    opacity:.30;

    font-size:12px;

    pointer-events:none;

}

.game-card::after{

    content:"♡";

    position:absolute;

    right:19px;
    bottom:9px;

    color:var(--ornament-color);

    opacity:.25;

    font-size:17px;

    pointer-events:none;

}

.game-shell{

    position:relative;

    width:100%;

    overflow:hidden;

    border-radius:16px;

    background:#b8cbd1;

    box-shadow:
        inset 0 0 0 1px
        rgba(255,255,255,.25),
        0 4px 13px
        rgba(61,76,85,.10);

}

#game{

    display:block;

    width:100%;
    height:auto;

    max-width:100%;

    background:#b8cbd1;

    touch-action:none;

    user-select:none;
    -webkit-user-select:none;

}

.game-controls{

    display:flex;

    align-items:center;
    justify-content:center;

    flex-wrap:wrap;

    gap:9px;

    margin-top:12px;

    color:#71818b;

    font-size:12px;

}

.control-divider{

    opacity:.42;

}

.fullscreen-exit{

    position:absolute;

    z-index:30;

    top:16px;
    right:16px;

    display:none;

    align-items:center;
    justify-content:center;

    min-height:39px;

    padding:
        0
        13px;

    border:
        1px solid
        rgba(255,255,255,.72);

    border-radius:12px;

    background:
        rgba(255,255,255,.88);

    color:#4b6070;

    font-size:13px;

    box-shadow:
        0 7px 20px
        rgba(40,55,63,.15);

}

.fullscreen-score{

    position:absolute;

    z-index:30;

    top:16px;
    left:16px;

    display:none;

    min-height:39px;

    align-items:center;

    padding:
        0
        13px;

    border:
        1px solid
        rgba(255,255,255,.68);

    border-radius:12px;

    background:
        rgba(255,255,255,.84);

    color:#4b6070;

    font-size:13px;

    box-shadow:
        0 7px 20px
        rgba(40,55,63,.12);

}

.fullscreen-score strong{

    margin-left:5px;

    font-weight:normal;

}

/* ================================
   FULLSCREEN
================================ */

body.game-fullscreen{

    width:100%;
    height:100%;

    min-height:100vh;
    min-height:100dvh;

    margin:0;

    padding:0;

    overflow:hidden;

    background:#b8cbd1;

}

body.game-fullscreen header,
body.game-fullscreen .game-heading,
body.game-fullscreen .game-controls{

    display:none;

}

body.game-fullscreen .page{

    width:100%;
    height:100%;

    max-width:none;

    margin:0;
    padding:0;

}

body.game-fullscreen .game-card{

    width:100%;
    height:100%;

    padding:0;

    border:0;
    border-radius:0;

    background:transparent;

    box-shadow:none;

}

body.game-fullscreen .game-card::before,
body.game-fullscreen .game-card::after{

    display:none;

}

body.game-fullscreen .game-shell{

    width:100%;
    height:100%;

    min-height:100vh;
    min-height:100dvh;

    border-radius:0;

    box-shadow:none;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#b8cbd1;

}

body.game-fullscreen #game{

    width:100%;
    height:100%;

    max-width:100vw;
    max-height:100vh;
    max-height:100dvh;

    object-fit:contain;

}

body.game-fullscreen .fullscreen-exit,
body.game-fullscreen .fullscreen-score{

    display:flex;

}

/* ================================
   MOBILE
================================ */

@media(max-width:700px){

    header{

        padding:
            13px
            11px
            8px;

        gap:7px;

    }

    .header-left,
    .header-right{

        gap:6px;

    }

    .nav-link,
    .fullscreen-button,
    .coin-display{

        min-height:38px;

        padding:
            0
            10px;

        border-radius:11px;

        font-size:12px;

    }

    .fullscreen-button{

        font-size:0;

    }

    .fullscreen-button::before{

        content:"⛶";

        font-size:17px;

    }

    .coin-display{

        gap:5px;

    }

    .page{

        padding:
            4px
            9px
            24px;

    }

    .game-heading{

        margin:
            2px
            0
            11px;

    }

    .game-heading .ornament{

        font-size:10px;

    }

    .game-heading h1{

        font-size:27px;

    }

    .game-heading p{

        margin-top:4px;

        font-size:12px;

    }

    .game-card{

        padding:7px;

        border-radius:19px;

    }

    .game-shell{

        border-radius:13px;

    }

    .game-controls{

        margin-top:8px;

        font-size:10px;

    }

    .fullscreen-exit{

        top:9px;
        right:9px;

        min-height:35px;

        padding:
            0
            10px;

        font-size:11px;

    }

    .fullscreen-score{

        top:9px;
        left:9px;

        min-height:35px;

        padding:
            0
            10px;

        font-size:11px;

    }

}

@media(max-width:430px){

    .nav-link{

        width:38px;

        padding:0;

        justify-content:center;

        font-size:0;

    }

    .nav-link::before{

        content:"←";

        font-size:18px;

    }

    .coin-display{

        padding:
            0
            9px;

    }

    .game-heading h1{

        font-size:25px;

    }

}

</style>

</head>

<body>

<header>

    <div class="header-left">

        <a
            class="nav-link"
            href="../index.html"
        >
            ← Back to Games
        </a>

    </div>

    <div class="header-right">

        <button

            id="fullscreenButton"

            ⛶ Fullscreen

        <div class="coin-display">

            ♡

                id="coin-count"
            >0</span>

            Coins

        </div>

    </div>

</header>

<main class="page">

    <div class="game-heading">

        <span class="ornament">
            ✦ ✧ ✦
        </span>

        <h1>
            Bunny Run ♡
        </h1>

        <p>
            A little run through the garden
        </p>

    </div>

    <section class="game-card">

        <div
            class="game-shell"
            id="gameShell"
        >

            <button
                class="fullscreen-exit"
                id="fullscreenExitButton"
                type="button"
            >
                × Exit Fullscreen
            </button>

            <div
                class="fullscreen-score"
                id="fullscreenScore"
            >
                Top Score:
                <strong id="fullscreen-top-score">
                    0
                </strong>
            </div>

            <canvas
                id="game"
                width="960"
                height="540"
            ></canvas>

        </div>

        <div class="game-controls">

            <span>
                Tap to jump
            </span>

            <span class="control-divider">
                ✦
            </span>

            <span>
                Space / ↑
            </span>

            <span class="control-divider">
                ✦
            </span>

            <span>
                F for fullscreen
            </span>

        </div>

    </section>

</main>

<script src="../script.js"></script>

/* =========================================
   BUNNY
========================================= */

    x:110,
    y:GROUND-28,

    width:28,
    height:28,

    velocityY:0,

    grounded:true,

    gravity:0.72,

    jumpPower:-15.5

};


/* =========================================
   GAME STATE
========================================= */

/* =========================================
   COINS
========================================= */

let runCoinsEarned=0;
let lastCoinMilestone=0;

let coinToastText="";
let coinToastTimer=0;

function updateCoinDisplay(){

    if(
        typeof updateCoinDisplays==="function"
    ){

        updateCoinDisplays();

        return;

    }

    const coins=
        Number(
            localStorage.getItem(
                "arcade_coins"
            ) || 0
        );

    const counter=
        document.getElementById(
            "coin-count"
        );

    if(counter){

        counter.textContent=coins;

    }

}

function awardCoinsForScore(){

    const currentCoinMilestone=
        Math.floor(score/1000);

    if(
        currentCoinMilestone>
        lastCoinMilestone
    ){

        const earned=
            currentCoinMilestone-
            lastCoinMilestone;

        const coinsEarned=
            earned*10;

        if(
            typeof addCoins==="function"
        ){

            addCoins(
                coinsEarned
            );

        }else{

            const currentCoins=
                Number(
                    localStorage.getItem(
                        "arcade_coins"
                    ) || 0
                );

            localStorage.setItem(
                "arcade_coins",
                currentCoins+
                coinsEarned
            );

        }

        runCoinsEarned+=
            coinsEarned;

        lastCoinMilestone=
            currentCoinMilestone;

        coinToastText=
            "+"+
            coinsEarned+
            " Coins ♡";

        coinToastTimer=1.7;

        updateCoinDisplay();

    }

}


/* =========================================
   TOP SCORE
========================================= */

let topScore=
    Number(
        localStorage.getItem(
            "bunnyRun_topScore"
        ) || 0
    );

function updateTopScoreDisplay(){

    const normal=
        document.getElementById(
            "top-score"
        );

    if(normal){

        normal.textContent=
            topScore;

    }

    const fullscreen=
        document.getElementById(
            "fullscreen-top-score"
        );

    if(fullscreen){

        fullscreen.textContent=
            topScore;

    }

}

function saveTopScore(){

    if(score>topScore){

        topScore=
            Math.floor(score);

        localStorage.setItem(
            "bunnyRun_topScore",
            topScore
        );

    }

    updateTopScoreDisplay();

}

   THEME
========================================= */

    },

        ground:"#d9c1ca"
    },

    green:{

        ground:"#c1d0c0"
    },

    lavender:{
        top:"#c4b9d7",
        bottom:"#e4ddef",
        ground:"#c9c1d4"
    },

    yellow:{
        top:"#d8ceaa",
        bottom:"#eee7cc",
        ground:"#d6ceb0"
    }

};

function getCurrentTheme(){

    return themes[
        localStorage.getItem(
            "arcade_theme"
        ) || "blue"
    ] || themes.blue;

}

const cactusImages={};

function loadCactusImage(
    image,
    rootPath,
    fallbackPath
){

    const filename=
        rootPath.split("/").pop();

    const paths=[
        rootPath,
        fallbackPath,
        filename
    ];

    let index=0;

    function tryNext(){

        if(index>=paths.length){

            return;

        }

        const source=
            paths[index++];

        image.onload=null;
        image.onerror=null;

        image.onload=function(){};

        image.onerror=function(){

            tryNext();

        };

        image.src=source;

    }

    tryNext();

}

let audioContext=null;

function initAudio(){

    if(!audioContext){

        try{

            audioContext=
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }catch(error){

            return;

        }

    }

    if(
        audioContext.state==="suspended"
    ){

        audioContext.resume().catch(
            function(){}
        );

    }

}

function playTone(
    frequency,
    duration,
    volume=.045,
    type="sine"
){

    if(!audioContext){

        return;

    }

    try{

        const oscillator=
            audioContext.createOscillator();

        const gain=
            audioContext.createGain();

        oscillator.type=type;

        oscillator.frequency.value=
            frequency;

        gain.gain.setValueAtTime(
            volume,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime+
            duration
        );

        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime+
            duration
        );

    }catch(error){}

}

const gameShell=

        "gameShell"
    );

const fullscreenButton=
    document.getElementById(
        "fullscreenButton"

const fullscreenExitButton=
    document.getElementById(
        "fullscreenExitButton"
    );

async function toggleFullscreen(){

    initAudio();

    try{

        if(document.fullscreenElement){

            await document.exitFullscreen();

            return;

        }

        if(
            document.body.classList.contains(
                "game-fullscreen"
            )
        ){

            document.body.classList.remove(
                "game-fullscreen"
            );

            return;

        }

        if(
            gameShell.requestFullscreen &&
            document.fullscreenEnabled
        ){

            await gameShell.requestFullscreen();

        }else{

            document.body.classList.add(
                "game-fullscreen"
            );

        }

    }catch(error){

        document.body.classList.add(
            "game-fullscreen"
        );

    }

}

function updateFullscreenState(){

    if(
        document.fullscreenElement===
        gameShell
    ){

        document.body.classList.add(
            "game-fullscreen"
        );

    }else{

        document.body.classList.remove(
            "game-fullscreen"
        );

    }

}

fullscreenButton.addEventListener(
    "click",
    function(event){

        event.preventDefault();
        event.stopPropagation();

        toggleFullscreen();

    }
);

fullscreenExitButton.addEventListener(
    "click",
    function(event){

        event.preventDefault();
        event.stopPropagation();

        if(document.fullscreenElement){

            document.exitFullscreen().catch(
                function(){}
            );

        }else{

            document.body.classList.remove(
                "game-fullscreen"
            );

        }

    }
);

);

function drawCloud(
    x,
    y,
    scale,
    alpha
){

    ctx.save();

    ctx.globalAlpha=alpha;

    ctx.fillStyle="#ffffff";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        17*scale,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+22*scale,
        y-7*scale,
        23*scale,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+47*scale,
        y,
        16*scale,
        0,
        Math.PI*2
    );

    ctx.fillRect(
        x-3*scale,
        y,
        52*scale,
        17*scale
    );

    ctx.fill();

    ctx.restore();

}

/* =========================================
   BUNNY DRAWING
========================================= */

function drawBunny(){

    let image;

    if(!bunny.grounded){

        image=jumpImage;

    }else if(
        started &&
        !dead
    ){

        image=runImage;

    }else{

        image=idleImage;

    }

    if(!image.complete){

        return;

    }


    let frame=0;

    if(!bunny.grounded){

        frame=
            Math.min(
                7,
                Math.floor(
                    (
                        jumpTime/
                        jumpAnimationDuration
                    )*8
                )
            );

    }else if(
        started &&
        !dead
    ){

        frame=
            Math.floor(
                runAnimTime/45
            )%8;

    }


    const sourceHeight=
        bunny.grounded
            ? 28
            : 36;

    const drawWidth=84;

    const drawHeight=
        bunny.grounded
            ? 84
            : 108;


    ctx.save();

    ctx.imageSmoothingEnabled=false;

    /*
       The sprite faces left naturally.
       Flip it so Bunny Run faces right.
    */

    ctx.translate(
        bunny.x+drawWidth,
        bunny.y
    );

    ctx.scale(
        -1,
        1
    );

    ctx.drawImage(
        image,

        frame*28,
        0,

        28,
        sourceHeight,

        0,
        0,

        drawWidth,
        drawHeight
    );

    ctx.restore();

}

function drawObstacles(){

    for(
        const obstacle of obstacles
    ){

        if(
            obstacle.image &&
            obstacle.image.complete
        ){

            ctx.drawImage(
                obstacle.image,

                obstacle.x,
                obstacle.y,

                obstacle.width,
                obstacle.height
            );

        }

    }

}


/* =========================================
   COLLISION
========================================= */

function checkCollision(
    obstacle
){

    const bunnyLeft=
        bunny.x+5;

    const bunnyRight=
        bunny.x+
        bunny.width-
        5;

    const bunnyTop=
        bunny.y+5;

    const bunnyBottom=
        bunny.y+
        bunny.height-
        2;


    const obstacleLeft=
        obstacle.x+
        (
            obstacle.width-
            obstacle.hitboxWidth
        )/2;

    const obstacleRight=
        obstacleLeft+
        obstacle.hitboxWidth;

    const obstacleTop=
        obstacle.y+
        (
            obstacle.height-
            obstacle.hitboxHeight
        );

    const obstacleBottom=
        obstacle.y+
        obstacle.height;


    return(
        bunnyRight>obstacleLeft &&
        bunnyLeft<obstacleRight &&
        bunnyBottom>obstacleTop &&
        bunnyTop<obstacleBottom
    );

}

/* =========================================
   UPDATE
========================================= */

function update(delta){

    if(
        !started ||
        dead
    ){

        if(
            coinToastTimer>0
        ){

            coinToastTimer-=
                delta;

        }

        return;

    }


    const seconds=
        delta/1000;


    /* SCORE */

    score+=.55*seconds;


    /* SPEED */

    speed=
        6+
        Math.min(
            score/1000,
            3
        );


    /* COINS */

    awardCoinsForScore();


    /* BUNNY PHYSICS */

    bunny.velocityY+=
        bunny.gravity;

    bunny.y+=
        bunny.velocityY;


    if(
        bunny.y+
        bunny.height>=
        GROUND
    ){

        bunny.y=
            GROUND-
            bunny.height;

        bunny.velocityY=0;

        bunny.grounded=true;

    }else{

        bunny.grounded=false;

    }


    /* ANIMATION */

    runAnimTime+=delta;

    if(!bunny.grounded){

        jumpTime+=delta;

        if(
            jumpTime>
            jumpAnimationDuration
        ){

            jumpTime=
                jumpAnimationDuration;

        }

    }


    /* GROUND */

    groundOffset=
        (
            groundOffset+
            speed*seconds
        )%48;


    /* SPAWN */

    nextSpawn-=delta;

    if(nextSpawn<=0){

        spawnObstacle();

        const difficulty=
            Math.min(
                score/100,
                30
            );

        const minimum=
            1250-
            Math.min(
                difficulty*8,
                240
            );

        const maximum=
            1700-
            Math.min(
                difficulty*8,
                240
            );

        nextSpawn=
            minimum+
            Math.random()*
            (
                maximum-
                minimum
            );

    }


    /* OBSTACLES */

    for(
        let i=
            obstacles.length-1;

        i>=0;

        i--
    ){

        const obstacle=
            obstacles[i];

        obstacle.x-=
            speed*
            seconds;


        if(
            checkCollision(
                obstacle
            )
        ){

            gameOver();

            return;

        }


        if(
            obstacle.x+
            obstacle.width<
            0
        ){

            obstacles.splice(
                i,
                1
            );

            score+=10;

            if(
                Math.floor(score)%100===0
            ){

                playScoreSound();

            }

        }

    }


    if(
        coinToastTimer>0
    ){

        coinToastTimer-=
            delta;

    }

}


/* =========================================
   GAME LOOP
========================================= */

function gameLoop(timestamp){

    if(!lastTime){

        lastTime=timestamp;

    }

    let delta=
        timestamp-
        lastTime;

    lastTime=timestamp;

    delta=
        Math.min(
            delta,
            50
        );

    update(delta);

    draw();

    requestAnimationFrame(
        gameLoop
    );

}

requestAnimationFrame(
    gameLoop
);

document.addEventListener(
    "pointerdown",
    function(event){

        if(
            !document.body.classList.contains(
                "game-fullscreen"
            )
        ){

            return;

        }

        if(
            event.target.closest &&
            (
                event.target.closest(
                    "button"
                ) ||
                event.target.closest(
                    "a"
                )
            )
        ){

            return;

        }

        jump();

    },
    {
        passive:false
    }
);

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.code==="Space" ||
            event.code==="ArrowUp"
        ){

            event.preventDefault();

            jump();

        }

        if(
            event.key.toLowerCase()==="f"
        ){

            event.preventDefault();

            toggleFullscreen();

        }

    }
);


/* =========================================
   INITIAL STATE
========================================= */

updateCoinDisplay();

updateTopScoreDisplay();

draw();


/* =========================================
   THEME / COIN SYNC
========================================= */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key==="arcade_theme"
        ){

            draw();

        }

        if(
            event.key==="arcade_coins"
        ){

            updateCoinDisplay();

        }

    }
);

</script>

</body>
</html>
