/* =========================
   CACTUS
========================= */

function createCactus(type,x){

    const scale=4;

    const rows=type.length;
    const cols=type[0].length;

    return{
        x,
        y:GROUND-rows*scale,
        width:cols*scale,
        height:rows*scale,
        type,
        scale,
        counted:false
    };
}


function spawnCactus(){

    const difficulty=Math.min(score,30);

    let count=1;

    if(difficulty>8 && Math.random()<0.32){
        count=2;
    }

    if(difficulty>18 && Math.random()<0.16){
        count=3;
    }

    const firstType=
        cactusTypes[
            Math.floor(
                Math.random()*cactusTypes.length
            )
        ];

    let x=W+30;

    for(let i=0;i<count;i++){

        let type;

        if(i===0){
            type=firstType;
        }else{
            type=
                Math.random()<0.5
                ?CACTUS_SMALL
                :CACTUS_TALL;
        }

        obstacles.push(
            createCactus(type,x)
        );

        x+=type[0].length*4+22;
    }

    const minimum=
        1050-
        Math.min(score*10,350);

    const maximum=
        1500-
        Math.min(score*8,300);

    nextSpawn=
        minimum+
        Math.random()*(maximum-minimum);

    spawnTimer=0;
}


/* =========================
   GROUND
========================= */

function drawGround(){

    ctx.fillStyle=GROUND_COLOR;

    ctx.fillRect(
        0,
        GROUND,
        W,
        H-GROUND
    );

    ctx.fillStyle=DARK;

    ctx.fillRect(
        0,
        GROUND,
        W,
        6
    );

    const movement=speed;

    groundOffset-=movement;

    if(groundOffset<=-80){
        groundOffset+=80;
    }

    ctx.fillStyle=DARK;

    for(
        let x=groundOffset-80;
        x<W+80;
        x+=80
    ){

        ctx.fillRect(
            x,
            GROUND+20,
            34,
            4
        );

        ctx.fillRect(
            x+47,
            GROUND+36,
            18,
            4
        );

        ctx.fillRect(
            x+15,
            GROUND+54,
            42,
            4
        );
    }
}


/* =========================
   CACTUS DRAWING
========================= */

function drawCactus(o){

    const type=o.type;
    const s=o.scale;

    for(
        let row=0;
        row<type.length;
        row++
    ){

        for(
            let col=0;
            col<type[row].length;
            col++
        ){

            if(type[row][col]==="O"){
                continue;
            }

            const px=o.x+col*s;
            const py=o.y+row*s;

            ctx.fillStyle=DARK;

            ctx.fillRect(
                px-1,
                py-1,
                s+2,
                s+2
            );

            ctx.fillStyle="#59634d";

            ctx.fillRect(
                px,
                py,
                s,
                s
            );
        }
    }
}


/* =========================
   REMOVE RUNNING BACKGROUND
========================= */

function processRunningSprite(){

    if(
        !runImage.complete ||
        !runImage.naturalWidth
    ){
        return;
    }

    const width=runImage.naturalWidth;
    const height=runImage.naturalHeight;

    const offscreen=document.createElement("canvas");

    offscreen.width=width;
    offscreen.height=height;

    const offctx=offscreen.getContext("2d");

    offctx.imageSmoothingEnabled=false;

    offctx.drawImage(
        runImage,
        0,
        0
    );

    const imageData=
        offctx.getImageData(
            0,
            0,
            width,
            height
        );

    const pixels=imageData.data;

    const bgR=0x86;
    const bgG=0x9d;
    const bgB=0xa9;

    for(
        let i=0;
        i<pixels.length;
        i+=4
    ){

        const r=pixels[i];
        const g=pixels[i+1];
        const b=pixels[i+2];

        const distance=Math.sqrt(
            Math.pow(r-bgR,2)+
            Math.pow(g-bgG,2)+
            Math.pow(b-bgB,2)
        );

        if(distance<45){

            pixels[i+3]=0;

        }else if(distance<75){

            const alpha=Math.floor(
                255*((distance-45)/30)
            );

            pixels[i+3]=Math.min(
                pixels[i+3],
                alpha
            );
        }
    }

    offctx.putImageData(
        imageData,
        0,
        0
    );

    processedRunImage=offscreen;
}


/* =========================
   BUNNY
========================= */

function drawBunny(){

    let image;
    let frameWidth;
    let frameHeight;
    let frameIndex;

    if(!started && !dead){

        image=idleImage;

        frameWidth=28;
        frameHeight=28;

        frameIndex=0;

    }else if(!bunny.grounded){

        image=jumpImage;

        frameWidth=28;
        frameHeight=36;

        const jumpAnimationDuration=560;

        frameIndex=Math.min(
            7,
            Math.floor(
                (jumpTime/jumpAnimationDuration)*8
            )
        );

    }else{

        image=processedRunImage;

        frameWidth=42;
        frameHeight=42;

        frameIndex=
            Math.floor(
                runAnimTime/75
            )%11;
    }

    if(!image){
        return;
    }

    const drawW=84;
    const drawH=84;

    ctx.save();

    ctx.translate(
        bunny.x+drawW,
        bunny.y+bunny.height-drawH
    );

    ctx.scale(-1,1);

    ctx.drawImage(
        image,
        frameIndex*frameWidth,
        0,
        frameWidth,
        frameHeight,
        0,
        0,
        drawW,
        drawH
    );

    ctx.restore();
}


/* =========================
   COLLISION
========================= */

function getBunnyHitbox(){

    return{
        x:bunny.x+13,
        y:bunny.y+12,
        width:52,
        height:60
    };
}


function checkCollision(){

    const b=getBunnyHitbox();

    for(const o of obstacles){

        const cactusHit={
            x:o.x+4,
            y:o.y+3,
            width:o.width-8,
            height:o.height-5
        };

        if(
            b.x<cactusHit.x+cactusHit.width &&
            b.x+b.width>cactusHit.x &&
            b.y<cactusHit.y+cactusHit.height &&
            b.y+b.height>cactusHit.y
        ){
            return true;
        }
    }

    return false;
}


/* =========================
   JUMP
========================= */

function jump(){

    if(!started){

        started=true;

        bunny.grounded=true;

        runAnimTime=0;

        lastTime=performance.now();

        requestAnimationFrame(loop);

        return;
    }

    if(dead){

        restart();

        return;
    }

    if(bunny.grounded){

        bunny.velocityY=bunny.jumpPower;

        bunny.grounded=false;

        jumpTime=0;
    }
}


/* =========================
   RESTART
========================= */

function restart(){

    score=0;
    speed=6;

    obstacles.length=0;

    spawnTimer=0;
    nextSpawn=1200;

    bunny.y=GROUND-28;
    bunny.velocityY=0;
    bunny.grounded=true;

    runAnimTime=0;
    jumpTime=0;

    groundOffset=0;

    dead=false;
    started=true;

    lastTime=performance.now();

    requestAnimationFrame(loop);
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    dead=true;

    bunny.velocityY=0;
}


/* =========================
   UPDATE
========================= */

function update(dt){

    if(!started || dead){
        return;
    }

    runAnimTime+=dt;

    if(!bunny.grounded){

        jumpTime+=dt;

        bunny.velocityY+=
            bunny.gravity*
            (dt/16.6667);

        bunny.y+=
            bunny.velocityY*
            (dt/16.6667);

        const groundY=GROUND-28;

        if(bunny.y>=groundY){

            bunny.y=groundY;

            bunny.velocityY=0;

            bunny.grounded=true;
        }
    }

    speed+=0.00035*dt;

    const movement=
        speed*(dt/16.6667);

    for(
        let i=obstacles.length-1;
        i>=0;
        i--
    ){

        const o=obstacles[i];

        o.x-=movement;

        if(
            !o.counted &&
            o.x+o.width<bunny.x
        ){

            o.counted=true;

            score++;

            if(score%5===0){
                speed+=0.25;
            }
        }

        if(o.x+o.width<-30){
            obstacles.splice(i,1);
        }
    }

    spawnTimer+=dt;

    if(spawnTimer>=nextSpawn){
        spawnCactus();
    }

    if(checkCollision()){
        gameOver();
    }
}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    ctx.fillStyle=BG;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    drawGround();

    for(const o of obstacles){
        drawCactus(o);
    }

    drawBunny();

    ctx.fillStyle=DARK;

    ctx.font="24px Georgia";

    ctx.textAlign="right";

    ctx.fillText(
        String(score).padStart(5,"0"),
        W-28,
        42
    );

    if(!started){

        ctx.textAlign="center";

        ctx.font="26px Georgia";

        ctx.fillText(
            "PRESS SPACE OR TAP",
            W/2,
            90
        );
    }

    if(dead){

        ctx.textAlign="center";

        ctx.font="30px Georgia";

        ctx.fillText(
            "PRESS SPACE OR TAP TO RESTART",
            W/2,
            105
        );
    }
}


/* =========================
   GAME LOOP
========================= */

function loop(time){

    const dt=Math.min(
        time-lastTime,
        32
    );

    lastTime=time;

    update(dt);

    draw();

    if(!dead){
        requestAnimationFrame(loop);
    }
}


/* =========================
   INPUT
========================= */

function handleInput(){

    if(dead){

        restart();

        return;
    }

    jump();
}


window.addEventListener(
    "keydown",
    e=>{

        if(
            e.code==="Space" ||
            e.code==="ArrowUp" ||
            e.code==="KeyW"
        ){

            e.preventDefault();

            handleInput();
        }
    }
);


canvas.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        handleInput();
    }
);


/* =========================
   LOADING
========================= */

let loaded=0;

function imageLoaded(){

    loaded++;

    if(loaded===3){

        processRunningSprite();

        draw();
    }
}

idleImage.onload=imageLoaded;

runImage.onload=imageLoaded;

jumpImage.onload=imageLoaded;

draw();
