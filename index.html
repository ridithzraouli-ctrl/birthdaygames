<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday World ♡</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 12% 12%, #f3dce3 0, transparent 25%),
                        radial-gradient(circle at 88% 82%, #ead3dc 0, transparent 27%), #faf5f2;
            color: #60434c;
            font-family: Georgia, "Times New Roman", serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #ead3dc;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .coin-display {
            background: #fff0f3;
            border: 1px solid #d7b4be;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            color: #91596c;
        }

        main {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
        }

        .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            height: 22px;
            margin-bottom: 25px;
            color: #b8798b;
        }

        .ornament i { width: 40px; height: 1px; background: #d4adb8; }

        h1 { color: #985f72; font-size: 28px; font-weight: normal; margin-bottom: 8px; }
        p { line-height: 1.6; color: #7a5863; font-size: 16px; }

        .nav-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border: 1px solid #bd8294;
            border-radius: 100px;
            background: #fffaf9;
            color: #91596c;
            text-decoration: none;
            font-size: 16px;
            box-shadow: 0 6px 17px rgba(91, 52, 65, .11);
            transition: .2s ease;
        }

        .btn:hover { background: #f9e9ed; transform: translateY(-2px); }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: bold; color: #985f72;">Birthday World ♡</div>
        <div class="coin-display">🪙 <span class="coin-count">0</span> Coins</div>
    </header>

    <main>
        <div class="ornament">
            <span>✦</span><i></i><span>♡</span><i></i><span>✦</span>
        </div>

        <h1>Happy Birthday! 🎉</h1>
        <p>Welcome to your personal birthday Arcade & Gift Shop! Play minigames in the Game Arcade to earn coins, then spend those coins in the Birthday Shop to unlock drawings, letters, and surprises!</p>

        <div class="nav-buttons">
            <a href="games.html" class="btn">🎮 Game Arcade</a>
            <a href="shop.html" class="btn">🎁 Birthday Shop</a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
  </html>
