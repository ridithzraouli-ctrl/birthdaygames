<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #faf7f5;
            color: #4a3e3d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            background: #ffffff;
            border-bottom: 1px solid #eee8e5;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 18px; font-weight: 600; color: #4a3e3d; text-decoration: none; }
        .coin-display { background: #f4ece9; border: 1px solid #e2d7d3; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #635052; }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 { color: #4a3e3d; font-weight: 500; font-size: 28px; margin: 0 0 8px; }
        p.subtitle { color: #8c7b7d; margin: 0 0 32px; font-size: 15px; }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: #ffffff;
            border: 1px solid #eee8e5;
            border-radius: 12px;
            padding: 24px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .game-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
            border-color: #e2d7d3;
        }

        .game-title { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
        .game-desc { font-size: 13px; color: #8c7b7d; margin: 0 0 20px; line-height: 1.4; }
        .play-btn {
            display: inline-block;
            padding: 8px 14px;
            background: #f4ece9;
            color: #635052;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">🎮 Arcade Hub</a>
        <div class="coin-display"><span class="coin-count">0</span> Coins</div>
    </header>

    <main>
        <h1>Games Library</h1>
        <p class="subtitle">Select a game to play and earn coins.</p>

        <div class="game-grid">
            <!-- Chess Card -->
            <a href="games/chess.html" class="game-card">
                <div>
                    <h2 class="game-title">Chess</h2>
                    <p class="game-desc">Play against the AI and earn 50 coins for every checkmate victory.</p>
                </div>
                <span class="play-btn">Play Now →</span>
            </a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
